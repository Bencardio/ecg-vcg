esult] | None = None,\n                   include_identity: bool = True) -> bytes:\n    \"\"\"Classeur Excel : (résumé affiché), originales, déjà dans BRAVEHEART,\n    correspondance des noms de colonnes, et, si `results` est fourni, les\n    mesures par dérivation et les avertissements de tout le lot.\"\"\"\n    import io\n    orig, bh = split_columns(df)\n    buf = io.BytesIO()\n    with pd.ExcelWriter(buf) as xw:\n        if summary is not None:\n            summary.to_excel(xw, sheet_name=SHEET_SUMMARY, index=False)\n        orig.to_excel(xw, sheet_name=SHEET_ORIGINAL, index=False)\n        bh.to_excel(xw, sheet_name=SHEET_BRAVEHEART, index=False)\n        mapping_table(df).to_excel(xw, sheet_name=SHEET_MAPPING, index=False)\n        if results is not None:\n            per_lead_table(results, include_identity).to_excel(\n                xw, sheet_name=SHEET_PER_LEAD, index=False)\n            warnings_table(results).to_excel(xw, sheet_name=SHEET_WARNINGS, index=False)\n    return buf.getvalue()\n\n\ndef to_csv_zip_bytes(df: pd.DataFrame, stem: str = \"ecg_hcm_resultats\") -> bytes:\n    \"\"\"Un CSV ne peut contenir qu'une feuille : renvoie un zip contenant\n    `<stem>_originales.csv` et `<stem>_deja_dans_braveheart.csv`.\"\"\"\n    import io\n    import zipfile\n    orig, bh = split_columns(df)\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as zf:\n        zf.writestr(stem + \"_originales.csv\", orig.to_csv(index=False))\n        zf.writestr(stem + \"_deja_dans_braveheart.csv\", bh.to_csv(index=False))\n    return buf.getvalue()\n\n\ndef export(df: pd.DataFrame, out_path: str) -> None:\n    \"\"\".xlsx -> un classeur à feuilles séparées ; .csv -> deux fichiers\n    `<nom>_originales.csv` et `<nom>_deja_dans_braveheart.csv`.\"\"\"\n    if out_path.lower().endswith(\".xlsx\"):\n        with open(out_path, \"wb\") as fh:\n            fh.write(to_excel_bytes(df))\n    else:\n        stem = out_path[:-4] if out_path.lower().endswith(\".csv\") else out_path\n        orig, bh = split_columns(df)\n        orig.to_csv(stem + \"_originales.csv\", index=False)\n        bh.to_csv(stem + \"_deja_dans_braveheart.csv\", index=False)\n", "ecg_hcm/beat_detection.py": "\"\"\"\nbeat_detection.py\n==================\n\nDétection des battements (pic R sur la bande rythme), extraction d'un\nbattement représentatif (médiane) par dérivation, et repérage des points\nfiduciaires globaux du complexe QRS (onset/offset) par une méthode de\n\"vitesse spatiale\" (dérivée combinée de plusieurs dérivations), inspirée\ndes algorithmes classiques de délinéation ECG.\n\nLimites assumées (à documenter pour l'utilisateur) : ceci est une\nimplémentation simple et transparente, pas un algorithme cliniquement\nvalidé. Elle est appropriée pour un signal propre reconstruit depuis un\ntracé vectoriel PDF (peu de bruit), mais n'a pas été comparée à une\ndélinéation experte sur une large cohorte.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nfrom scipy.signal import butter, filtfilt, find_peaks\n\nfrom .signal_builder import ECGRecording, SignalTrace\n\nQRS_BAND_HZ = (5, 20)\nMIN_RR_S = 0.30  # 200 bpm max\nBEAT_WINDOW_PRE_S = 0.28\nBEAT_WINDOW_POST_S = 0.48\nN_BEAT_SAMPLES = 400  # grille commune pour le battement moyen/médian\n\n\n@dataclass\nclass MedianBeat:\n    lead: str\n    t_rel: np.ndarray  # secondes, 0 = pic R\n    mv: np.ndarray\n    n_beats: int\n\n\n@dataclass\nclass BeatAnalysis:\n    r_peak_times_s: np.ndarray\n    heart_rate_bpm: float\n    median_beats: dict[str, MedianBeat] = field(default_factory=dict)\n    qrs_onset_s: float = 0.0  # relatif au pic R (négatif = avant R)\n    qrs_offset_s: float = 0.0\n    qrs_duration_ms: float = 0.0\n    t_peak_s: float = 0.0  # relatif au pic R, instant du pic T \"global\"\n    warnings: list[str] = field(default_factory=list)\n\n\ndef detect_r_peaks(sig: SignalTrace) -> np.ndarray:\n    fs = sig.fs_hz\n    nyq = fs / 2\n    b, a = butter(2, [QRS_BAND_HZ[0] / nyq, QRS_BAND_HZ[1] / nyq], btype=\"band\")\n    filt = filtfilt(b, a, sig.mv)\n    energy = filt ** 2\n    thresh = 1.2 * np.std(energy) + np.mean(energy)\n    peaks, _ = find_peaks(energy, distance=int(MIN_RR_S * fs), height=thresh)\n\n    # Recaler chaque pic sur l'extremum du signal BRUT (non filtré) dans une\n    # fenêtre de +/-40 ms, le filtrage pouvant introduire un léger décalage.\n    refined = []\n    win = int(0.04 * fs)\n    for p in peaks:\n        lo, hi = max(0, p - win), min(len(sig.mv), p + win)\n        seg = sig.mv[lo:hi]\n        if len(seg) == 0:\n            continue\n        local = lo + int(np.argmax(np.abs(seg - np.median(sig.mv))))\n        refined.append(local)\n    refined = sorted(set(refined))\n    return sig.t[np.array(refined, dtype=int)] if refined else np.array([])\n\n\ndef _extract_beat(sig: SignalTrace, r_time: float) -> np.ndarray | None:\n    t0, t1 = r_time - BEAT_WINDOW_PRE_S, r_time + BEAT_WINDOW_POST_S\n    if t0 < sig.t[0] or t1 > sig.t[-1]:\n        return None\n    common_t = np.linspace(-BEAT_WINDOW_PRE_S, BEAT_WINDOW_POST_S, N_BEAT_SAMPLES)\n    return np.interp(common_t + r_time, sig.t, sig.mv)\n\n\ndef build_median_beats(rec: ECGRecording, r_peak_times: np.ndarray) -> dict[str, MedianBeat]:\n    common_t = np.linspace(-BEAT_WINDOW_PRE_S, BEAT_WINDOW_POST_S, N_BEAT_SAMPLES)\n    result = {}\n    for lead, sig in rec.leads.items():\n        beats = []\n        for rt in r_peak_times:\n            b = _extract_beat(sig, rt)\n            if b is not None:\n                beats.append(b)\n        if not beats:\n            continue\n        arr = np.stack(beats, axis=0)\n        med = np.median(arr, axis=0)\n        result[lead] = MedianBeat(lead=lead, t_rel=common_t, mv=med, n_beats=len(beats))\n    return result\n\n\nQRS_VEL_THRESHOLD = 0.05\n\n\ndef _spatial_velocity(median_beats: dict[str, MedianBeat]) -> np.ndarray | None:\n    \"\"\"Dérivée quadratique moyenne combinée sur les dérivations disponibles :\n    pic marqué pendant le QRS (dépolarisation rapide), utilisé pour situer\n    onset/offset de façon robuste sans dépendre d'une seule dérivation.\"\"\"\n    leads_present = [ld for ld in (\"I\", \"II\", \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\")\n                      if ld in median_beats]\n    if not leads_present:\n        return None\n    stacked = np.stack([median_beats[ld].mv for ld in leads_present], axis=0)\n    deriv = np.diff(stacked, axis=1)\n    vel = np.sqrt(np.mean(deriv ** 2, axis=0))\n    # léger lissage\n    kernel = np.ones(5) / 5\n    vel = np.convolve(vel, kernel, mode=\"same\")\n    return vel\n\n\ndef _find_qrs_onset_offset(vel: np.ndarray, t_rel: np.ndarray, header_qrs_ms: float | None,\n                            warnings: list[str]) -> tuple[float, float]:\n    # Fréquence d'échantillonnage effective de la grille de battement commune\n    fs_beat = 1.0 / np.median(np.diff(t_rel))\n    r_idx = int(np.argmin(np.abs(t_rel)))  # t_rel=0 correspond au pic R\n\n    search_lo = max(0, r_idx - int(0.15 * fs_beat))\n    search_hi = min(len(vel), r_idx + int(0.15 * fs_beat))\n    peak_region = search_lo + int(np.argmax(vel[search_lo:search_hi]))\n    peak_val = vel[peak_region]\n    # 5 % du pic : calé sur 10 ECG GE 12SL (durée QRS de l'appareil), erreur\n    # moyenne absolue ~7 ms ; 8 % raccourcissait le QRS de ~12 ms en moyenne.\n    # Plancher de bruit (2 x la médiane de la vitesse sur tout le battement,\n    # surtout ligne de base) : évite d'étirer le QRS dans le bruit sur les\n    # tracés de faible amplitude ou peu échantillonnés (Cardionics).\n    thresh = max(QRS_VEL_THRESHOLD * peak_val, 2.0 * float(np.median(vel)))\n\n    # Un simple seuil peut être interrompu par un creux bref au sommet même\n    # du pic R (pente quasi nulle à l'apex d'un complexe pointu), qui\n    # scinderait à tort la branche montante (Q->R) de la branche descendante\n    # (R->S) en deux segments distincts. On identifie donc tous les segments\n    # \"au-dessus du seuil\" puis on fusionne ceux séparés par un creux court\n    # (< 20 ms), avant de retenir le segment fusionné contenant le pic.\n    above = vel > thresh\n    runs = []\n    i = 0\n    while i < len(above):\n        if above[i]:\n            j = i\n            while j < len(above) and above[j]:\n                j += 1\n            runs.append([i, j - 1])\n            i = j\n        else:\n            i += 1\n    max_gap = max(1, int(0.02 * fs_beat))\n    merged = []\n    for run in runs:\n        if merged and run[0] - merged[-1][1] <= max_gap:\n            merged[-1][1] = run[1]\n        else:\n            merged.append(run)\n\n    onset_idx, offset_idx = peak_region, peak_region\n    for run in merged:\n        if run[0] <= peak_region <= run[1]:\n            onset_idx, offset_idx = run\n            break\n\n    onset_s, offset_s = t_rel[onset_idx], t_rel[offset_idx]\n    duration_ms = (offset_s - onset_s) * 1000\n\n    if header_qrs_ms and not (0.4 * header_qrs_ms <= duration_ms <= 1.8 * header_qrs_ms):\n        warnings.append(\n            \"Durée QRS estimée par l'algorithme (%.0f ms) très différente de \"\n            \"celle de l'en-tête (%.0f ms) — repli sur une fenêtre centrée \"\n            \"utilisant la valeur de l'en-tête.\" % (duration_ms, header_qrs_ms)\n        )\n        half = header_qrs_ms / 2000.0\n        onset_s, offset_s = -half, half\n\n    return float(onset_s), float(offset_s)\n\n\ndef analyze(rec: ECGRecording) -> BeatAnalysis:\n    warnings: list[str] = []\n    if rec.rhythm is None:\n        raise ValueError(\"Aucune bande rythme disponible pour la détection des battements.\")\n\n    r_times = detect_r_peaks(rec.rhythm)\n    if len(r_times) < 2:\n        warnings.append(\"Moins de 2 battements détectés sur la bande rythme — \"\n                         \"résultats de morphologie non fiables.\")\n        hr = rec.metadata.get(\"heart_rate_bpm\") or 0.0\n    else:\n        rr = np.diff(r_times)\n        hr = 60.0 / np.median(rr)\n\n    median_beats = build_median_beats(rec, r_times)\n    vel = _spatial_velocity(median_beats)\n\n    if vel is not None:\n        t_rel = next(iter(median_beats.values())).t_rel\n        onset_s, offset_s = _find_qrs_onset_offset(\n            vel, t_rel, rec.metadata.get(\"qrs_duration_ms\"), warnings)\n    else:\n        header_qrs = rec.metadata.get(\"qrs_duration_ms\") or 100.0\n        half = header_qrs / 2000.0\n        onset_s, offset_s = -half, half\n        warnings.append(\"Vitesse spatiale non calculable (dérivations manquantes) — \"\n                         \"fenêtre QRS estimée depuis l'en-tête uniquement.\")\n\n    return BeatAnalysis(\n        r_peak_times_s=r_times,\n        heart_rate_bpm=float(hr),\n        median_beats=median_beats,\n        qrs_onset_s=onset_s,\n        qrs_offset_s=offset_s,\n        qrs_duration_ms=(offset_s - onset_s) * 1000,\n        warnings=warnings,\n    )\n\n\n# Fin de la recherche de l'onde T dans le battement médian. Deux bornes :\n# 1) le début du QRS suivant (RR + début du QRS − marge) : à FC rapide, la\n#    fenêtre fixe (jusqu'à +480 ms) contient le complexe suivant, dont le Q,\n#    le S ou la pente pouvaient être pris pour l'onde T ou sa fin ;\n# 2) dans CETTE dérivation, la première pente aussi raide qu'un QRS après la\n#    fin du QRS (complexe parasite : extrasystole ou décalage temporel des\n#    battements dans la dérivation) — cas réel 2026-10-21 : un complexe à\n#    +400 ms en DI-DIII donnait une « onde T » égale au R ou au S, et deux\n#    fausses T négatives géantes.\nNEXT_QRS_MARGIN_S = 0.02\nPARASITIC_SLOPE_RATIO = 0.45\n\n\ndef rr_interval_s(beat: BeatAnalysis) -> float | None:\n    hr = beat.heart_rate_bpm\n    if hr and np.isfinite(hr) and 20.0 <= hr <= 300.0:\n        return 60.0 / float(hr)\n    return None\n\n\ndef t_search_end_s(t_rel: np.ndarray, mv: np.ndarray, qrs_onset_s: float,\n                   qrs_offset_s: float, rr_s: float | None) -> float:\n    end = float(t_rel[-1])\n    if rr_s:\n        end = min(end, rr_s + min(qrs_onset_s, 0.0) - NEXT_QRS_MARGIN_S)\n    if len(t_rel) > 3:\n        slope = np.abs(np.diff(mv)) / np.diff(t_rel)\n        tm = t_rel[:-1]\n        qrs = (tm >= qrs_onset_s) & (tm <= qrs_offset_s)\n        if qrs.any():\n            ref = float(slope[qrs].max())\n            late = np.where((tm > qrs_offset_s + 0.06) & (tm < end)\n                            & (slope > PARASITIC_SLOPE_RATIO * ref))[0]\n            if ref > 0 and len(late):\n                end = min(end, float(tm[late[0]]) - NEXT_QRS_MARGIN_S)\n    return end\n", "ecg_hcm/braveheart_derived.py": "\"\"\"\nbraveheart_derived.py\n=====================\n\nCritères d'HVG, scores et autres paramètres recalculés à partir des\namplitudes et intervalles que BRAVEHEART rapporte pour chaque ECG\n(colonnes `<dérivation>_r_wave`, `_s_wave`, `_t_max`, `_jpt60`,\n`_r_wave_loc`, `_qrs_area`, `qrs_int`, `qt_int`, `qrst_angle_peak`).\n\nConventions BRAVEHEART (lues dans son code source, v1.8.2) :\n- amplitudes en mV ; `_s_wave` est NÉGATIF et correspond au point le plus\n  négatif du QRS (onde S, ou onde Q/QS s'il n'y a pas de S) ;\n- `_r_wave_loc` en ms après le début du QRS ;\n- noms des dérivations : L1, L2, L3, avR, avL, avF, V1..V6.\n\nBRAVEHEART ne connaît ni le sexe ni la fréquence cardiaque réelle (le\nbattement médian répété fixe son `hr`). Le sexe et la FC peuvent venir de\nl'Excel de l'application (appariement par nom de fichier). Sans sexe, un\ncritère à seuil sexué n'est tranché que si les deux seuils donnent la même\nréponse ; sinon il reste vide.\n\nLes seuils reprennent ceux de `conventional_features.py` et\n`romhilt_estes.py`, pour que les deux outils soient comparables.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\n\nimport pandas as pd\n\nLIMB = (\"L1\", \"L2\", \"L3\", \"avR\", \"avL\", \"avF\")\nPRECORDIAL = (\"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\")\nLEAD_FR = {\"L1\": \"I\", \"L2\": \"II\", \"L3\": \"III\", \"avR\": \"aVR\", \"avL\": \"aVL\", \"avF\": \"aVF\"}\n\n# (en-tête Excel, explication) — dans l'ordre des colonnes produites.\nLEGEND: tuple[tuple[str, str], ...] = (\n    (\"Sexe (source application)\", \"Repris de l'Excel de l'application, apparié par nom de fichier. \"\n     \"Vide si non fourni : les critères à seuil sexué ne sont alors tranchés que si les deux seuils concordent.\"),\n    (\"Alerte battement parasite BRAVEHEART\", \"oui si un RR lu par BRAVEHEART est nettement plus court que les autres : il a compté \"\n     \"un battement de trop dans l'export (QRS suivant inclus quand la fréquence est rapide, exports antérieurs à \"\n     \"la v0.16.6). Les critères fondés sur l'onde T (T inversées, T négatives géantes, strain) sont alors laissés vides ; \"\n     \"réexporter l'ECG et le repasser dans BRAVEHEART.\"),\n    (\"Sokolow-Lyon (mV)\", \"|S V1| + max(R V5, R V6).\"),\n    (\"Sokolow-Lyon positif\", \">= 3,5 mV.\"),\n    (\"Sokolow-Lyon bas (<= 1,5 mV)\", \"Bas voltage précordial, évocateur d'amylose dans un contexte d'HVG échographique.\"),\n    (\"R aVL (mV)\", \"Amplitude de R en aVL.\"),\n    (\"R aVL >= 1,1 mV\", \"Critère de Sokolow en aVL.\"),\n    (\"Cornell voltage (mV)\", \"R aVL + |S V3|.\"),\n    (\"Cornell voltage positif\", \"> 2,8 mV chez l'homme, > 2,0 mV chez la femme.\"),\n    (\"Cornell produit (mm.ms)\", \"(Cornell + 0,8 mV chez la femme) x 10 x durée QRS BRAVEHEART si le sexe est connu ; \"\n     \"sinon la valeur de l'application si elle existe.\"),\n    (\"Cornell produit positif\", \"> 2440 mm.ms. Sexe inconnu et pas de valeur de l'application : tranché seulement si \"\n     \"le calcul homme et le calcul femme concordent.\"),\n    (\"Source Cornell produit\", \"BRAVEHEART, application, ou BRAVEHEART (sexe inconnu, seuils concordants).\"),\n    (\"Peguero-Lo Presti (mV)\", \"S le plus profond (toutes dérivations sauf aVR) + |S V4| ; 2 x |S V4| si le plus profond est en V4.\"),\n    (\"Peguero-Lo Presti : dérivation du S le plus profond\", \"\"),\n    (\"Peguero-Lo Presti positif\", \">= 2,8 mV chez l'homme, >= 2,3 mV chez la femme.\"),\n    (\"Gubner-Ungerleider (mV)\", \"R I + |S III|.\"),\n    (\"Gubner-Ungerleider positif\", \">= 2,5 mV.\"),\n    (\"Lewis (mV)\", \"(R I + |S III|) - (R III + |S I|).\"),\n    (\"Lewis positif\", \">= 1,7 mV.\"),\n    (\"Strain V5-V6 (approximation)\", \"T < -0,1 mV ET niveau à J+60 ms <= -0,05 mV en V5 ou V6 (même approximation que l'application ; \"\n     \"la morphologie asymétrique n'est pas vérifiée). Vide si BRAVEHEART ne fournit pas _jpt60.\"),\n    (\"Axe QRS frontal (°)\", \"atan2(aire QRS aVF, aire QRS I), à partir des aires QRS de BRAVEHEART.\"),\n    (\"Romhilt-Estes partiel (points)\", \"Voltage 3 + strain 3 + axe <= -30° 2 + QRS >= 90 ms 1 + déflexion intrinsécoïde V5/V6 >= 50 ms 1. \"\n     \"Critère onde P (3 points) NON évalué : BRAVEHEART ne mesure pas la composante terminale de P en V1. Total maximum 10 au lieu de 13.\"),\n    (\"Romhilt-Estes >= 5 (sans onde P)\", \"Peut manquer des HVG que l'onde P aurait fait passer à 5.\"),\n    (\"Perugia (composante voltage, mV)\", \"|S V3| + R aVL.\"),\n    (\"Perugia positif\", \"Au moins un critère : SV3+RaVL > 2,4 mV (H) / > 2,0 mV (F), strain, ou Romhilt-Estes partiel >= 5.\"),\n    (\"Perugia : critères remplis\", \"\"),\n    (\"Bas voltage périphérique\", \"R + |S| < 0,5 mV dans les 6 dérivations frontales.\"),\n    (\"Bas voltage précordial\", \"R + |S| < 1,0 mV dans les 6 précordiales.\"),\n    (\"Somme des voltages QRS 12 dérivations (mV)\", \"Somme de R + |S| sur les 12 dérivations (indice de Cornell 12 dérivations).\"),\n    (\"Mauvaise progression de R (R V3 <= 0,3 mV)\", \"\"),\n    (\"Dérivations à T inversée (< -0,1 mV, hors aVR)\", \"\"),\n    (\"Nombre de dérivations à T inversée\", \"Hors aVR.\"),\n    (\"T négatives géantes (oui/non)\", \"Au moins une dérivation (hors aVR) avec T <= -1,0 mV. Évocateur de CMH apicale.\"),\n    (\"Nombre de dérivations à T négatives géantes\", \"Hors aVR.\"),\n    (\"Dérivations à T négatives géantes (<= -1,0 mV)\", \"Hors aVR.\"),\n    (\"QRS BRAVEHEART (ms)\", \"qrs_int, sur le battement médian.\"),\n    (\"QRS >= 120 ms\", \"\"),\n    (\"Angle QRS-T spatial (pics, °)\", \"qrst_angle_peak.\"),\n    (\"Angle QRS-T spatial > 100°\", \"\"),\n    (\"FC (source application, bpm)\", \"FC mesurée par l'application, sinon FC imprimée sur l'ECG. Le « hr » de BRAVEHEART \"\n     \"n'est pas utilisé : sur un battement médian répété, il ne reflète que la longueur de la fenêtre, pas la FC réelle.\"),\n    (\"QTc Bazett (ms)\", \"qt_int de BRAVEHEART / racine(RR) avec la FC ci-dessus ; sans FC, QTc Bazett de l'application.\"),\n    (\"QTc Fridericia (ms)\", \"qt_int de BRAVEHEART / racine cubique(RR) avec la FC ci-dessus ; sans FC, QTc Fridericia de l'application.\"),\n    (\"Source QTc\", \"QT BRAVEHEART + FC application, ou QTc de l'application.\"),\n)\n\n\ndef _num(row, col):\n    v = pd.to_numeric(row.get(col), errors=\"coerce\") if col in row.index else float(\"nan\")\n    return None if pd.isna(v) else float(v)\n\n\ndef _female(sex) -> bool | None:\n    if sex is None or (isinstance(sex, float) and math.isnan(sex)):\n        return None\n    s = str(sex).strip().lower()\n    if s.startswith(\"f\"):\n        return True\n    if s.startswith((\"m\", \"h\")):\n        return False\n    return None\n\n\ndef _sexed(value, male_rule, female_rule, female):\n    \"\"\"Applique un seuil sexué ; sexe inconnu -> tranché seulement si les\n    deux seuils donnent la même réponse.\"\"\"\n    if value is None:\n        return None\n    if female is True:\n        return female_rule(value)\n    if female is False:\n        return male_rule(value)\n    m, f = male_rule(value), female_rule(value)\n    return m if m == f else None\n\n\ndef _yn(b):\n    return None if b is None else (\"oui\" if b else \"non\")\n\n\ndef _val(x):\n    try:\n        x = float(x)\n    except (TypeError, ValueError):\n        return None\n    return None if math.isnan(x) else x\n\n\ndef derive_row(row: pd.Series, sex=None, hr_bpm=None, app: dict | None = None) -> dict:\n    \"\"\"`app` : valeurs de repli de l'application (hr_header, qtc_bazett,\n    qtc_fridericia, cornell_product, cornell_product_lvh).\"\"\"\n    app = app or {}\n    female = _female(sex)\n    r = {ld: _num(row, ld + \"_r_wave\") for ld in LIMB + PRECORDIAL}\n    s = {ld: _num(row, ld + \"_s_wave\") for ld in LIMB + PRECORDIAL}\n    t = {ld: _num(row, ld + \"_t_max\") for ld in LIMB + PRECORDIAL}\n    # Le battement exporté étant répété à l'identique, les RR de\n    # BRAVEHEART doivent être égaux. Un RR nettement court signale un battement\n    # parasite (QRS suivant inclus dans l'export) : la ligne de base et\n    # l'onde T de BRAVEHEART sont alors fausses.\n    rr = [_val(v) for v in str(row.get(\"RR\", \"\") or \"\").split()]\n    rr = [v for v in rr if v is not None]\n    spurious = len(rr) >= 2 and min(rr) < 0.75 * sorted(rr)[len(rr) // 2]\n    if spurious:\n        t = {ld: None for ld in t}\n    S = {ld: (abs(v) if v is not None else None) for ld, v in s.items()}\n    qrs = _num(row, \"qrs_int\")\n    out: dict = {\"Sexe (source application)\": None if female is None else (\"F\" if female else \"M\")}\n    out[\"Alerte battement parasite BRAVEHEART\"] = _yn(spurious) if rr else None\n\n    def add(a, b):\n        return None if a is None or b is None else a + b\n\n    # Sokolow-Lyon\n    rv56 = [v for v in (r[\"V5\"], r[\"V6\"]) if v is not None]\n    sok = S[\"V1\"] + max(rv56) if S[\"V1\"] is not None and rv56 else None\n    out[\"Sokolow-Lyon (mV)\"] = sok\n    out[\"Sokolow-Lyon positif\"] = _yn(None if sok is None else sok >= 3.5)\n    out[\"Sokolow-Lyon bas (<= 1,5 mV)\"] = _yn(None if sok is None else sok <= 1.5)\n    out[\"R aVL (mV)\"] = r[\"avL\"]\n    out[\"R aVL >= 1,1 mV\"] = _yn(None if r[\"avL\"] is None else r[\"avL\"] >= 1.1)\n\n    # Cornell\n    cor = add(r[\"avL\"], S[\"V3\"])\n    out[\"Cornell voltage (mV)\"] = cor\n    out[\"Cornell voltage positif\"] = _yn(_sexed(cor, lambda v: v > 2.8, lambda v: v > 2.0, female))\n    prod, prod_pos, prod_src = None, None, None\n    if cor is not None and qrs is not None and female is not None:\n        prod = (cor + (0.8 if female else 0.0)) * 10 * qrs\n        prod_pos, prod_src = prod > 2440, \"BRAVEHEART\"\n    elif _val(app.get(\"cornell_product\")) is not None:\n        prod = _val(app.get(\"cornell_product\"))\n        lvh = app.get(\"cornell_product_lvh\")\n        prod_pos = bool(lvh) if lvh is not None and not pd.isna(lvh) else prod > 2440\n        prod_src = \"application\"\n    elif cor is not None and qrs is not None:\n        prod_pos = _sexed(cor * 10 * qrs, lambda v: v > 2440, lambda v: v + 8 * qrs > 2440, None)\n        if prod_pos is not None:\n            prod_src = \"BRAVEHEART (sexe inconnu, seuils concordants)\"\n    out[\"Cornell produit (mm.ms)\"] = prod\n    out[\"Cornell produit positif\"] = _yn(prod_pos)\n    out[\"Source Cornell produit\"] = prod_src\n\n    # Peguero-Lo Presti (aVR exclue : son S BRAVEHEART est le plus souvent un QS)\n    deep = {ld: v for ld, v in S.items() if v is not None and v > 0 and ld != \"avR\"}\n    peg, peg_lead = None, None\n    if deep and S[\"V4\"] is not None:\n        peg_lead = max(deep, key=deep.get)\n        peg = 2 * S[\"V4\"] if peg_lead == \"V4\" else deep[peg_lead] + S[\"V4\"]\n    out[\"Peguero-Lo Presti (mV)\"] = peg\n    out[\"Peguero-Lo Presti : dérivation du S le plus profond\"] = LEAD_FR.get(peg_lead, peg_lead)\n    out[\"Peguero-Lo Presti positif\"] = _yn(_sexed(peg, lambda v: v >= 2.8, lambda v: v >= 2.3, female))\n\n    # Gubner-Ungerleider, Lewis\n    gub = add(r[\"L1\"], S[\"L3\"])\n    out[\"Gubner-Ungerleider (mV)\"] = gub\n    out[\"Gubner-Ungerleider positif\"] = _yn(None if gub is None else gub >= 2.5)\n    lew = None\n    if gub is not None and r[\"L3\"] is not None and S[\"L1\"] is not None:\n        lew = gub - (r[\"L3\"] + S[\"L1\"])\n    out[\"Lewis (mV)\"] = lew\n    out[\"Lewis positif\"] = _yn(None if lew is None else lew >= 1.7)\n\n    # Strain (approximation)\n    strain = None\n    j60 = {ld: _num(row, ld + \"_jpt60\") for ld in (\"V5\", \"V6\")}\n    if any(v is not None for v in j60.values()):\n        strain = any(t[ld] is not None and j60[ld] is not None and t[ld] < -0.1 and j60[ld] <= -0.05\n                     for ld in (\"V5\", \"V6\"))\n    out[\"Strain V5-V6 (approximation)\"] = _yn(strain)\n\n    # Axe QRS frontal à partir des aires\n    a1, af = _num(row, \"L1_qrs_area\"), _num(row, \"avF_qrs_area\")\n    axis = math.degrees(math.atan2(af, a1)) if a1 is not None and af is not None and (a1 or af) else None\n    out[\"Axe QRS frontal (°)\"] = axis\n\n    # Romhilt-Estes partiel\n    pts = 0\n    volt = (any(v is not None and v >= 2.0 for ld in LIMB for v in (r[ld], S[ld]))\n            or any(S[ld] is not None and S[ld] >= 3.0 for ld in (\"V1\", \"V2\"))\n            or any(r[ld] is not None and r[ld] >= 3.0 for ld in (\"V5\", \"V6\")))\n    pts += 3 if volt else 0\n    pts += 3 if strain else 0\n    pts += 2 if axis is not None and axis <= -30 else 0\n    pts += 1 if qrs is not None and qrs >= 90 else 0\n    rloc = [_num(row, ld + \"_r_wave_loc\") for ld in (\"V5\", \"V6\")]\n    pts += 1 if any(v is not None and v >= 50 for v in rloc) else 0\n    has_amp = any(v is not None for v in r.values())\n    out[\"Romhilt-Estes partiel (points)\"] = pts if has_amp else None\n    out[\"Romhilt-Estes >= 5 (sans onde P)\"] = _yn(pts >= 5 if has_amp else None)\n\n    # Perugia\n    out[\"Perugia (composante voltage, mV)\"] = cor\n    per_v = _sexed(cor, lambda v: v > 2.4, lambda v: v > 2.0, female)\n    crit = []\n    if per_v:\n        crit.append(\"SV3+RaVL\")\n    if strain:\n        crit.append(\"strain\")\n    if has_amp and pts >= 5:\n        crit.append(\"Romhilt-Estes>=5\")\n    per = True if crit else (None if per_v is None else False)\n    out[\"Perugia positif\"] = _yn(per)\n    out[\"Perugia : critères remplis\"] = \", \".join(crit) if crit else None\n\n    # Voltages globaux\n    amp = {ld: (r[ld] + S[ld]) if r[ld] is not None and S[ld] is not None else None for ld in r}\n    lv = [amp[ld] for ld in LIMB]\n    pv = [amp[ld] for ld in PRECORDIAL]\n    out[\"Bas voltage périphérique\"] = _yn(all(v < 0.5 for v in lv) if all(v is not None for v in lv) else None)\n    out[\"Bas voltage précordial\"] = _yn(all(v < 1.0 for v in pv) if all(v is not None for v in pv) else None)\n    allv = [v for v in amp.values() if v is not None]\n    out[\"Somme des voltages QRS 12 dérivations (mV)\"] = sum(allv) if len(allv) == 12 else None\n\n    out[\"Mauvaise progression de R (R V3 <= 0,3 mV)\"] = _yn(None if r[\"V3\"] is None else r[\"V3\"] <= 0.3)\n    inv = [LEAD_FR.get(ld, ld) for ld in LIMB + PRECORDIAL if ld != \"avR\" and t[ld] is not None and t[ld] < -0.1]\n    has_t = any(v is not None for v in t.values())\n    out[\"Dérivations à T inversée (< -0,1 mV, hors aVR)\"] = \", \".join(inv) if has_t else None\n    out[\"Nombre de dérivations à T inversée\"] = len(inv) if has_t else None\n    giant = [LEAD_FR.get(ld, ld) for ld in LIMB + PRECORDIAL if ld != \"avR\" and t[ld] is not None and t[ld] <= -1.0]\n    out[\"T négatives géantes (oui/non)\"] = _yn(bool(giant)) if has_t else None\n    out[\"Nombre de dérivations à T négatives géantes\"] = len(giant) if has_t else None\n    out[\"Dérivations à T négatives géantes (<= -1,0 mV)\"] = \", \".join(giant) if has_t else None\n\n    out[\"QRS BRAVEHEART (ms)\"] = qrs\n    out[\"QRS >= 120 ms\"] = _yn(None if qrs is None else qrs >= 120)\n    ang = _num(row, \"qrst_angle_peak\")\n    out[\"Angle QRS-T spatial (pics, °)\"] = ang\n    out[\"Angle QRS-T spatial > 100°\"] = _yn(None if ang is None else ang > 100)\n\n    hr = next((v for v in (_val(hr_bpm), _val(app.get(\"hr_header\"))) if v and 20 <= v <= 300), None)\n    qt = _num(row, \"qt_int\")\n    out[\"FC (source application, bpm)\"] = hr\n    rr = 60.0 / hr if hr else None\n    if qt is not None and rr:\n        out[\"QTc Bazett (ms)\"] = qt / math.sqrt(rr)\n        out[\"QTc Fridericia (ms)\"] = qt / rr ** (1 / 3)\n        out[\"Source QTc\"] = \"QT BRAVEHEART + FC application\"\n    else:\n        out[\"QTc Bazett (ms)\"] = _val(app.get(\"qtc_bazett\"))\n        out[\"QTc Fridericia (ms)\"] = _val(app.get(\"qtc_fridericia\"))\n        out[\"Source QTc\"] = (\"application\" if out[\"QTc Bazett (ms)\"] is not None\n                             or out[\"QTc Fridericia (ms)\"] is not None else None)\n    return out\n\n\ndef app_lookup(app_df: pd.DataFrame | None) -> dict:\n    \"\"\"{clé de fichier: (sexe, FC, valeurs de repli)} depuis un tableau de l'application.\"\"\"\n    if app_df is None or \"source_file\" not in app_df.columns:\n        return {}\n    from .validation import match_key\n\n    out = {}\n    for _, row in app_df.iterrows():\n        out[match_key(row[\"source_file\"])] = (row.get(\"sex\"), row.get(\"heart_rate_bpm_measured\"), {\n            \"hr_header\": row.get(\"heart_rate_bpm\"),\n            \"qtc_bazett\": row.get(\"qtc_bazett_ms_measured\"),\n            \"qtc_fridericia\": row.get(\"qtc_fridericia_ms_measured\"),\n            \"cornell_product\": row.get(\"cornell_product_mm_ms\"),\n            \"cornell_product_lvh\": row.get(\"cornell_product_lvh\"),\n        })\n    return out\n\n\ndef derive(bh_df: pd.DataFrame, app_df: pd.DataFrame | None = None) -> pd.DataFrame:\n    \"\"\"Un DataFrame (même index que `bh_df`) avec les colonnes de LEGEND.\"\"\"\n    from .validation import match_key\n\n    lookup = app_lookup(app_df)\n    rows = []\n    for _, row in bh_df.iterrows():\n        sex, hr, app = lookup.get(match_key(row.get(\"filename\", \"\")), (None, None, None))\n        rows.append(derive_row(row, sex, hr, app))\n    out = pd.DataFrame(rows, index=bh_df.index, columns=[h for h, _ in LEGEND])\n    for c in out.columns:\n        if out[c].dtype == object:\n            continue\n        out[c] = out[c].round(1 if \"°\" in c or \"ms\" in c or \"bpm\" in c else 2)\n    return out\n", "ecg_hcm/braveheart_export.py": "\"\"\"\nbraveheart_export.py\n=====================\n\nExport du battement médian (12 dérivations) au format \"Generic .csv\" lu par\n**BRAVEHEART** :\n\n> Stabenau HF, Waks JW. \"BRAVEHEART: Open-source software for automated\n> electrocardiographic and vectorcardiographic analysis.\" Comput Methods\n> Programs Biomed. 2023;242:107798. github.com/BIVectors/BRAVEHEART\n> (MATLAB, GPL-3.0).\n\nBRAVEHEART n'accepte pas nativement les fichiers PDF — voir son propre\nguide utilisateur (FAQ) : *\"Can BRAVEHEART use scanned ECGs in .jpg or .pdf\nformat? No – BRAVEHEART requires ECG data to be in some raw, digitized\nformat.\"* Cet export permet de contourner cette limite en réutilisant le\nbattement médian déjà extrait/calibré par `ecg_vcg_hcm` à partir du PDF.\n\n**Limite fondamentale, à comprendre avant utilisation** : un PDF ECG au\nformat grille standard (12 dérivations imprimées par groupes successifs,\nchacune sur ~2.5 s — PAS enregistrées simultanément sur toute la durée)\nne contient pas un enregistrement continu et synchronisé des 12\ndérivations comme le ferait un vrai enregistrement numérique. Cet export\nutilise donc le **battement médian** déjà calculé par `beat_detection.py`\npour chaque dérivation (aligné sur le pic R) — un seul battement\n\"représentatif\", pas un enregistrement multi-battements continu.\n\n**Pourquoi le battement est-il répété plusieurs fois dans le fichier ?**\nLe bouton \"Calculate\" de BRAVEHEART lance son propre algorithme de\ndétection automatique des complexes QRS sur l'ensemble du signal fourni,\nafin de calculer une fréquence cardiaque à partir de l'intervalle entre\ndetections successives (RR), puis de reconstruire son propre battement\nmoyen. Avec un fichier ne contenant qu'un seul battement isolé, cette\ndétection échoue silencieusement (aucun intervalle RR calculable) et\n\"Calculate\" ne produit rien (constaté empiriquement : bip sonore, aucun\ntracé, \"Fiducial Point Statistics\" à 0). Pour contourner cela, le\nbattement médian est donc dupliqué `n_repeats` fois bout à bout, ce qui\ndonne à BRAVEHEART plusieurs complexes QRS à détecter et un intervalle RR\n(fictif, mais physiologiquement plausible) à partir duquel calculer une\nfréquence cardiaque.\n\nPour éviter un \"saut\" de tension à la jonction entre deux répétitions\n(que BRAVEHEART pourrait prendre pour un artefact/spike), chaque\ndérivation est légèrement corrigée (soustraction d'une rampe linéaire)\npour que sa valeur de fin coïncide avec sa valeur de départ avant d'être\nrépétée — une dérive de ligne de base négligeable sur la fenêtre du\nbattement, mais qui rend la jonction continue.\n\n**Conséquence pratique, à ne jamais perdre de vue** : les mesures VCG/GEH\nde BRAVEHEART calculées à partir de ce fichier (SVG, angles QRS-T, TCRT,\nmorphologie des boucles, TMD/TWR, etc.) restent pertinentes, puisqu'elles\nportent de toute façon normalement sur un battement représentatif unique.\nEn revanche, TOUTES les statistiques battement-à-battement de BRAVEHEART\n(variabilité RR/HRV, médiane/min/max/IQR du QRS/JT/QT sur plusieurs\nbattements, détection d'outliers/PVC, indices de qualité \"Prob (%)\") sont\n**artificielles et ne doivent pas être interprétées** — un battement\nrépété à l'identique ne produit aucune vraie variabilité physiologique.\n\nFormat produit — correspond exactement aux réglages PAR DÉFAUT de\nBRAVEHEART (`generic_csv_params.csv` tel que fourni avec le logiciel :\nfreq=500, unitspermv=1, orientation=cols, row_start=1, col_start=1,\nlead_order=\"I II III AVR AVL AVF V1 V2 V3 V4 V5 V6\") — **aucune\nmodification de configuration n'est nécessaire côté BRAVEHEART** :\n- Pas d'en-tête, valeurs en mV, une dérivation par colonne.\n- Ordre des colonnes : I, II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6.\n- Fréquence d'échantillonnage : 500 Hz (valeur par défaut attendue par\n  BRAVEHEART) ; le battement médian, calculé sur sa propre grille de 400\n  points pour 0,76 s, est ré-échantillonné à 500 Hz avant l'écriture.\n- Si la fréquence est rapide, le battement est coupé avant le QRS suivant\n  (sinon BRAVEHEART le compte comme un battement supplémentaire).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\n\nimport numpy as np\n\nfrom .beat_detection import BeatAnalysis\n\n# Ordre exact attendu par generic_csv_params.csv par défaut (BRAVEHEART) —\n# NE PAS modifier sans modifier ce fichier de configuration en parallèle.\nBRAVEHEART_LEAD_ORDER = [\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\",\n                          \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\"]\n\n# Nombre de répétitions du battement médian dans le fichier exporté.\n# BRAVEHEART a besoin de détecter au moins 2 complexes QRS pour calculer un\n# intervalle RR (donc une fréquence cardiaque) et faire tourner son\n# algorithme d'annotation ; avec un seul battement isolé, la détection\n# échoue silencieusement (voir docstring du module et README section 9).\n# 10 répétitions donnent une marge confortable.\nBRAVEHEART_EXPORT_N_REPEATS = 10\n\n# Fréquence déclarée dans generic_csv_params.csv (défaut BRAVEHEART).\nBRAVEHEART_EXPORT_FS_HZ = 500.0\n\n# Marge (s) laissée avant le début du QRS suivant quand la fréquence est\n# rapide et que la fenêtre du battement médian déborde sur lui.\nBRAVEHEART_NEXT_QRS_MARGIN_S = 0.02\n\n\ndef export_generic_csv(beat: BeatAnalysis, out_path: str,\n                        n_repeats: int = BRAVEHEART_EXPORT_N_REPEATS) -> list[str]:\n    \"\"\"Écrit `out_path` au format Generic .csv de BRAVEHEART à partir du\n    battement médian de `beat`, répété `n_repeats` fois bout à bout (voir\n    docstring du module pour la justification). Retourne la liste des\n    avertissements — non vide et fichier NON écrit si l'export est\n    impossible (dérivation manquante ou incohérence interne).\"\"\"\n    warnings: list[str] = []\n    missing = [ld for ld in BRAVEHEART_LEAD_ORDER if ld not in beat.median_beats]\n    if missing:\n        warnings.append(\n            \"Export BRAVEHEART impossible : dérivation(s) manquante(s) dans \"\n            \"le battement médian : %s.\" % \", \".join(missing)\n        )\n        return warnings\n\n    lengths = {len(beat.median_beats[ld].mv) for ld in BRAVEHEART_LEAD_ORDER}\n    if len(lengths) != 1:\n        warnings.append(\n            \"Export BRAVEHEART impossible : les dérivations n'ont pas toutes \"\n            \"le même nombre d'échantillons (incohérence interne — signalez \"\n            \"ce cas).\"\n        )\n        return warnings\n\n    n = lengths.pop()\n    if n < 10:\n        warnings.append(\n            \"Export BRAVEHEART impossible : battement médian trop court \"\n            \"(%d échantillons).\" % n\n        )\n        return warnings\n\n    if n_repeats < 1:\n        warnings.append(\"Export BRAVEHEART impossible : n_repeats doit être >= 1.\")\n        return warnings\n\n    # Grille d'export à 500 Hz. Le battement médian est échantillonné sur\n    # sa propre grille (N_BEAT_SAMPLES points sur BEAT_WINDOW_PRE_S +\n    # BEAT_WINDOW_POST_S = 0,76 s, soit un pas de 1,905 ms) : l'écrire tel\n    # quel en déclarant 500 Hz étirait le temps de 5 % dans BRAVEHEART\n    # (QRS, QT, etc. allongés d'autant). On le ré-échantillonne donc.\n    t_rel = np.asarray(beat.median_beats[BRAVEHEART_LEAD_ORDER[0]].t_rel, dtype=float)\n    t_start, t_end = float(t_rel[0]), float(t_rel[-1])\n    # En cas de fréquence rapide, la fin de la fenêtre contient le début du\n    # complexe QRS SUIVANT. BRAVEHEART le détectait comme un battement de\n    # plus, ce qui faussait sa ligne de base et ses mesures d'onde T\n    # (fausses T négatives géantes de 2 à 3 mV en V1-V3 sur un ECG à\n    # ~130/min avec QS en V1-V3, 2026-10-21). On coupe donc la fenêtre\n    # avant le début du QRS suivant.\n    hr = getattr(beat, \"heart_rate_bpm\", None)\n    if hr and np.isfinite(hr) and hr > 0:\n        rr = 60.0 / float(hr)\n        onset = float(getattr(beat, \"qrs_onset_s\", 0.0) or 0.0)\n        next_onset = rr + min(onset, 0.0) - BRAVEHEART_NEXT_QRS_MARGIN_S\n        if next_onset < t_end:\n            # On exporte alors exactement un cycle (un RR) : le début de la\n            # fenêtre (-280 ms) tomberait sinon dans l'onde T précédente, et\n            # chaque répétition contiendrait deux ondes T.\n            t_end = next_onset\n            t_start = max(t_start, next_onset - rr)\n            warnings.append(\n                \"Export BRAVEHEART : fréquence rapide (%.0f/min), un seul cycle \"\n                \"exporté (de %.0f à %.0f ms autour du pic R) pour ne pas \"\n                \"inclure le QRS suivant ni l'onde T précédente.\"\n                % (hr, t_start * 1000, t_end * 1000)\n            )\n    t_out = np.arange(t_start, t_end + 1e-9, 1.0 / BRAVEHEART_EXPORT_FS_HZ)\n    n = len(t_out)\n    if n < 10:\n        warnings.append(\n            \"Export BRAVEHEART impossible : battement médian trop court \"\n            \"(%d échantillons).\" % n\n        )\n        return warnings\n\n    columns_rep = []\n    for ld in BRAVEHEART_LEAD_ORDER:\n        mb = beat.median_beats[ld]\n        mv = np.interp(t_out, np.asarray(mb.t_rel, dtype=float),\n                       np.asarray(mb.mv, dtype=float))\n        if n_repeats > 1:\n            # Corrige un éventuel décalage début/fin (dérive de ligne de\n            # base) pour que la jonction entre deux répétitions consécutives\n            # soit continue, sans créer de \"saut\" que BRAVEHEART pourrait\n            # interpréter comme un artefact.\n            ramp = np.linspace(0.0, mv[-1] - mv[0], n)\n            mv_adj = mv - ramp\n        else:\n            mv_adj = mv\n        columns_rep.append(np.tile(mv_adj, n_repeats))\n\n    n_total = n * n_repeats\n    with open(out_path, \"w\", newline=\"\") as f:\n        writer = csv.writer(f)\n        for i in range(n_total):\n            writer.writerow(\n                [\"%.6f\" % columns_rep[j][i] for j in range(len(BRAVEHEART_LEAD_ORDER))]\n            )\n\n    if n_repeats > 1:\n        warnings.append(\n            \"Export BRAVEHEART : fichier généré en répétant %d fois le même \"\n            \"battement médian bout à bout (contournement nécessaire, sinon \"\n            \"BRAVEHEART ne détecte aucun intervalle RR et son bouton \"\n            \"\\\"Calculate\\\" échoue silencieusement). CONSÉQUENCE : toutes les \"\n            \"statistiques battement-à-battement de BRAVEHEART (variabilité \"\n            \"RR/HRV, médiane/min/max/IQR du QRS/JT/QT, détection \"\n            \"d'outliers/PVC, indices de qualité \\\"Prob (%%)\\\") sont \"\n            \"ARTIFICIELLES et ne doivent PAS être interprétées. Seule la \"\n            \"morphologie du battement moyen (SVG, angles QRS-T, TCRT, \"\n            \"boucles, TMD/TWR, etc.) reste interprétable. Voir \"\n            \"braveheart_export.py.\" % n_repeats\n        )\n    else:\n        warnings.append(\n            \"Export BRAVEHEART : fichier généré à partir d'un SEUL battement \"\n            \"médian (pas de répétition) — les statistiques battement-à-\"\n            \"battement/HRV de BRAVEHEART ne sont pas valides sur ce fichier, \"\n            \"et son bouton \\\"Calculate\\\" échouera probablement (aucun \"\n            \"intervalle RR détectable).\"\n        )\n    return warnings\n", "ecg_hcm/braveheart_groups.py": "\"\"\"\nbraveheart_groups.py\n====================\n\nFeuille « Résultats par groupe » du classeur tiré du fichier de résultats\nBRAVEHEART : une ligne par ECG, les variables rangées par familles\nphysiologiques (plan proposé par Benjamin, corrigé et complété d'après le\ncode source de BRAVEHEART v1.8.2 : `VCG_Calc.m`, `VCG_Morphology.m`,\n`GEH_calculations.m`, `tcrt.m`, `tpeak_loc.m`).\n\nUnités BRAVEHEART : amplitudes en mV, aires (intégrales) en mV.ms, vitesses\nen mV/ms, angles en degrés, intervalles en ms.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Callable\n\nimport pandas as pd\n\n\n@dataclass(frozen=True)\nclass Var:\n    source: str | Callable[[pd.DataFrame], pd.Series]  # colonne BRAVEHEART, ou calcul\n    label: str\n    unit: str\n    definition: str\n    bh_name: str = \"\"  # pour la légende quand `source` est un calcul\n\n\ndef _ratio(a, b):\n    def f(df):\n        return pd.to_numeric(df[a], errors=\"coerce\") / pd.to_numeric(df[b], errors=\"coerce\")\n    f.needs = (a, b)\n    return f\n\n\ndef _diff(a, b):\n    def f(df):\n        return pd.to_numeric(df[a], errors=\"coerce\") - pd.to_numeric(df[b], errors=\"coerce\")\n    f.needs = (a, b)\n    return f\n\n\nG0 = \"0. Variables propres à l'application (absentes de BRAVEHEART)\"\nG1 = \"1. Concordance spatiale et angles QRS-T\"\nG2 = \"2. Gradient ventriculaire et grandeurs intégrales\"\nG3 = \"3. Morphologie et géométrie des boucles QRS et T\"\nG4 = \"4. Vitesse de parcours vectoriel\"\nG5 = \"5. Intervalles\"\nG6 = \"6. Amplitudes X, Y, Z et vecteur magnitude\"\nG7 = \"7. Critères ECG 12 dérivations (recalculés)\"\n\nGROUPS: tuple[tuple[str, tuple[Var, ...]], ...] = (\n    (G1, (\n        Var(\"TCRT\", \"TCRT\", \"cosinus\", \"Total Cosine R-to-T (Acar 1999) : moyenne des cosinus entre chaque vecteur QRS de la partie de haute énergie de la boucle (au-delà de 70 % du maximum, dans la base SVD) et le vecteur principal de la boucle T. -1 = discordance complète, +1 = concordance.\"),\n        Var(\"TCRT_angle\", \"Angle TCRT\", \"°\", \"acos(TCRT).\"),\n        Var(\"qrst_angle_peak\", \"Angle QRS-T spatial (pics)\", \"°\", \"Angle 3D entre le vecteur QRS maximal et le vecteur T maximal.\"),\n        Var(\"qrst_angle_area\", \"Angle QRS-T spatial moyen (aires)\", \"°\", \"Angle 3D entre les vecteurs moyens (intégrales) du QRS et de T, c'est-à-dire entre l'axe moyen de dépolarisation et celui de repolarisation.\"),\n        Var(\"qrst_angle_peak_frontal\", \"Angle QRS-T frontal (pics)\", \"°\", \"Même angle projeté dans le plan frontal.\"),\n        Var(\"qrst_angle_area_frontal\", \"Angle QRS-T frontal (aires)\", \"°\", \"Même angle projeté dans le plan frontal.\"),\n        Var(\"qrst_distance_peak\", \"Distance QRS-T (pics)\", \"mV\", \"Norme de la différence entre vecteurs QRS et T maximaux.\"),\n        Var(\"qrst_distance_area\", \"Distance QRS-T (aires)\", \"mV.ms\", \"Norme de la différence entre vecteurs QRS et T moyens.\"),\n    )),\n    (G2, (\n        Var(\"svg_area_mag\", \"SVG, magnitude (aires)\", \"mV.ms\", \"Norme du gradient ventriculaire spatial : SVG = intégrale de v(t) sur le QRST = vecteur aire QRS + vecteur aire T.\"),\n        Var(\"svg_area_az\", \"SVG, azimut\", \"°\", \"Orientation horizontale du SVG.\"),\n        Var(\"svg_area_el\", \"SVG, élévation\", \"°\", \"Orientation verticale du SVG.\"),\n        Var(\"svg_peak_mag\", \"SVG, magnitude (pics)\", \"mV\", \"Somme des vecteurs QRS et T maximaux.\"),\n        Var(\"svg_svg_angle\", \"Angle SVG pics / SVG aires\", \"°\", \"\"),\n        Var(\"q_area_mag\", \"|sQRS|, vecteur aire QRS\", \"mV.ms\", \"Norme du vecteur obtenu en intégrant X, Y et Z sur le QRS (ce n'est pas l'aire géométrique de la boucle).\"),\n        Var(\"q_area_az\", \"Vecteur aire QRS, azimut\", \"°\", \"\"),\n        Var(\"q_area_el\", \"Vecteur aire QRS, élévation\", \"°\", \"\"),\n        Var(\"t_area_mag\", \"|sT|, vecteur aire T\", \"mV.ms\", \"Norme du vecteur obtenu en intégrant X, Y et Z sur l'onde T.\"),\n        Var(\"t_area_az\", \"Vecteur aire T, azimut\", \"°\", \"\"),\n        Var(\"t_area_el\", \"Vecteur aire T, élévation\", \"°\", \"\"),\n        Var(\"area_qrst_ratio\", \"Rapport aires QRS / T\", \"\", \"\"),\n        Var(\"q_peak_mag\", \"Vecteur QRS maximal\", \"mV\", \"\"),\n        Var(\"t_peak_mag\", \"Vecteur T maximal\", \"mV\", \"\"),\n        Var(\"peak_qrst_ratio\", \"Rapport pics QRS / T\", \"\", \"\"),\n        Var(\"sai_qrst\", \"SAI QRST\", \"mV.ms\", \"Sum Absolute QRST Integral : somme des aires absolues de X, Y et Z sur le QRST.\"),\n        Var(\"sai_vm\", \"SAI du vecteur magnitude\", \"mV.ms\", \"\"),\n        Var(\"VMQ_area\", \"Aire du VM sur le QRS\", \"mV.ms\", \"\"),\n        Var(\"VMT_area\", \"Aire du VM sur l'onde T\", \"mV.ms\", \"\"),\n    )),\n    (G3, (\n        Var(\"qrsloop_roundness\", \"Boucle QRS, rondeur\", \"\", \"S1/S2 de la décomposition en valeurs singulières : 1 = cercle, plus grand = boucle elliptique.\"),\n        Var(\"qrsloop_residual\", \"Boucle QRS, résidu au plan (planarité)\", \"\", \"S3² : 0 = boucle parfaitement plane.\"),\n        Var(\"qrs_var_s1_total\", \"Boucle QRS, variance sur S1\", \"%\", \"\"),\n        Var(\"qrs_var_s2_total\", \"Boucle QRS, variance sur S2\", \"%\", \"\"),\n        Var(\"qrs_var_s3_total\", \"Boucle QRS, variance sur S3\", \"%\", \"Part non plane de la boucle.\"),\n        Var(\"qrsloop_area\", \"Boucle QRS, aire\", \"mV²\", \"Aire de la boucle dans son plan principal.\"),\n        Var(\"qrsloop_perimeter\", \"Boucle QRS, périmètre\", \"mV\", \"\"),\n        Var(\"tloop_roundness\", \"Boucle T, rondeur\", \"\", \"S1/S2.\"),\n        Var(\"tloop_residual\", \"Boucle T, résidu au plan (planarité)\", \"\", \"S3².\"),\n        Var(\"t_var_s1_total\", \"Boucle T, variance sur S1\", \"%\", \"\"),\n        Var(\"t_var_s2_total\", \"Boucle T, variance sur S2\", \"%\", \"\"),\n        Var(\"t_var_s3_total\", \"Boucle T, variance sur S3\", \"%\", \"\"),\n        Var(\"tloop_area\", \"Boucle T, aire\", \"mV²\", \"Surface couverte par la boucle de repolarisation dans son plan principal.\"),\n        Var(\"tloop_perimeter\", \"Boucle T, périmètre\", \"mV\", \"\"),\n        Var(\"qrst_dihedral_ang\", \"Angle dièdre entre plans QRS et T\", \"°\", \"\"),\n        Var(\"best_qrs_loop_dir\", \"Sens de rotation de la boucle QRS\", \"\", \"CW / CCW dans son plan principal.\"),\n        Var(\"TMD\", \"TMD, dispersion morphologique de T\", \"°\", \"T-wave Morphology Dispersion : dispersion des angles entre les vecteurs propres de T des différentes dérivations.\"),\n        Var(\"TWR_abs\", \"TWR absolu\", \"mV²\", \"T-wave residuum : énergie de T hors des 3 premières composantes.\"),\n        Var(\"TWR_rel\", \"TWR relatif\", \"%\", \"\"),\n        Var(\"vcg_length_qrs\", \"Longueur du trajet de la boucle QRS\", \"mV\", \"\"),\n        Var(\"vcg_length_t\", \"Longueur du trajet de la boucle T\", \"mV\", \"\"),\n    )),\n    (G4, (\n        Var(\"speed_qrs_max\", \"Vitesse maximale sur le QRS\", \"mV/ms\", \"Norme de la dérivée du vecteur |dV/dt| (et non dérivée de la norme).\"),\n        Var(\"speed_qrs_med\", \"Vitesse médiane sur le QRS\", \"mV/ms\", \"Une vitesse basse traduit un ralentissement de la conduction.\"),\n        Var(\"speed_t_max\", \"Vitesse maximale sur l'onde T\", \"mV/ms\", \"\"),\n        Var(\"speed_t_med\", \"Vitesse médiane sur l'onde T\", \"mV/ms\", \"\"),\n        Var(\"sti_qrs\", \"Intégrale vitesse-temps du QRS\", \"mV\", \"\"),\n        Var(\"sti_t\", \"Intégrale vitesse-temps de T\", \"mV\", \"\"),\n    )),\n    (G5, (\n        Var(\"qrs_int\", \"Durée du QRS\", \"ms\", \"Battement médian, repères détectés sur le vecteur magnitude.\"),\n        Var(\"qt_int\", \"QT\", \"ms\", \"\"),\n        Var(_diff(\"qt_int\", \"qrs_int\"), \"JT\", \"ms\", \"QT - QRS.\", \"qt_int - qrs_int\"),\n        Var(\"vm_tpeak_time\", \"Q - pic de T (QTpeak)\", \"ms\", \"Sur le vecteur magnitude.\"),\n        Var(\"vm_tpeak_tend_abs_diff\", \"Tpeak-Tend (TpTe)\", \"ms\", \"Sur le vecteur magnitude ; marqueur de dispersion transmurale de la repolarisation.\"),\n        Var(_ratio(\"vm_tpeak_tend_abs_diff\", \"qt_int\"), \"TpTe / QT\", \"\", \"Calculé ici. Attention : la colonne BRAVEHEART vm_tpeak_tend_ratio est QTpeak/QT, pas TpTe/QT.\", \"vm_tpeak_tend_abs_diff / qt_int\"),\n    )),\n    (G6, tuple(\n        Var(\"%s_%s\" % (ax, k), \"%s, %s\" % (\"VM\" if ax == \"VM\" else ax, lab), \"mV\", \"\")\n        for ax in (\"X\", \"Y\", \"Z\", \"VM\")\n        for k, lab in ((\"r_wave\", \"onde R\"), (\"s_wave\", \"onde S\"), (\"t_max\", \"onde T (max)\"))\n        if not (ax == \"VM\" and k == \"s_wave\")\n    )),\n)\n\n# Colonnes de `braveheart_derived` reprises dans le groupe 7 et le groupe 5.\nDERIVED_G5 = (\"FC (source application, bpm)\", \"QTc Bazett (ms)\", \"QTc Fridericia (ms)\",\n              \"Source QTc\")\nDERIVED_SKIP = DERIVED_G5 + (\"Sexe (source application)\", \"QRS BRAVEHEART (ms)\",\n                             \"Angle QRS-T spatial (pics, °)\")\n\n\n# Colonnes de l'Excel de l'application sans intérêt dans ce tableau\n# (identification, technique) ; l'identification a son propre groupe.\nAPP_SKIP = (\"source_file\", \"status\", \"error_message\", \"paper_speed_mm_s\",\n            \"gain_limb_mm_mV\", \"gain_chest_mm_mV\", \"exam_datetime_raw\")\n\n\n# Identification et données de base, reprises de l'Excel de l'application\n# (comme dans son tableau de synthèse) et placées juste après la colonne ECG.\n# Les colonnes nominatives n'existent que si l'Excel a été exporté avec\n# l'identité : le classeur produit reste alors sur le poste (RGPD).\nGID = \"Identification (application)\"\nID_COLUMNS = ((\"nom\", \"Nom\"), (\"prenom\", \"Prénom\"), (\"ipp\", \"IPP\"),\n              (\"date_naissance\", \"Naissance\"), (\"date_ecg\", \"Date ECG\"), (\"sex\", \"Sexe\"),\n              (\"heure_ecg\", \"Heure ECG\"), (\"status\", \"Statut\"), (\"age_years\", \"Âge (ans)\"),\n              (\"heart_rate_bpm_measured\", \"FC mesurée (bpm)\"))\n\n\ndef _align(app_df: pd.DataFrame, cols: list[str], ecg: pd.Series) -> pd.DataFrame:\n    from .validation import match_key\n\n    table = app_df[cols].copy()\n    table.index = [match_key(f) for f in app_df[\"source_file\"]]\n    table = table[~table.index.duplicated()]\n    out = table.reindex([match_key(e) for e in ecg])\n    out.index = ecg.index\n    return out\n\n\ndef app_identity_columns(app_df: pd.DataFrame | None, ecg: pd.Series) -> pd.DataFrame:\n    \"\"\"Colonnes d'identification de l'application, renommées en clair, dates\n    au format JJ/MM/AAAA.\"\"\"\n    if app_df is None or \"source_file\" not in app_df.columns:\n        return pd.DataFrame(index=ecg.index)\n    present = [(c, lab) for c, lab in ID_COLUMNS if c in app_df.columns]\n    out = _align(app_df, [c for c, _ in present], ecg).rename(columns=dict(present))\n    for lab in (\"Naissance\", \"Date ECG\"):\n        if lab in out.columns and pd.api.types.is_datetime64_any_dtype(out[lab]):\n            out[lab] = out[lab].dt.strftime(\"%d/%m/%Y\")\n    return out\n\n\ndef app_original_columns(app_df: pd.DataFrame | None, ecg: pd.Series) -> pd.DataFrame:\n    \"\"\"Variables originales de l'application (sans équivalent BRAVEHEART),\n    alignées sur les lignes du fichier BRAVEHEART par nom de fichier.\"\"\"\n    if app_df is None or \"source_file\" not in app_df.columns:\n        return pd.DataFrame(index=ecg.index)\n    from .batch import IDENTITY_COLUMNS, split_columns\n\n    orig, _ = split_columns(app_df)\n    in_id = {c for c, _ in ID_COLUMNS}\n    keep = [c for c in orig.columns\n            if c not in APP_SKIP and c not in IDENTITY_COLUMNS and c not in in_id]\n    return _align(orig.assign(source_file=app_df[\"source_file\"]), keep, ecg)\n\n\ndef build(df: pd.DataFrame, ecg: pd.Series, derived: pd.DataFrame,\n          app_df: pd.DataFrame | None = None):\n    \"\"\"Retourne (tableau, liste des groupes par colonne, légende).\"\"\"\n    cols, groups, legend = {\"ECG\": ecg}, [\"\", ], []\n    ident = app_identity_columns(app_df, ecg)\n    for c in ident.columns:\n        cols[c] = ident[c]\n        groups.append(GID)\n    if \"Sexe\" not in cols and \"Sexe (source application)\" in derived.columns:\n        cols[\"Sexe\"] = derived[\"Sexe (source application)\"]\n        groups.append(\"\")\n\n    def add(group, header, values, bh, definition):\n        while header in cols:\n            header += \" \"\n        cols[header] = values\n        groups.append(group)\n        legend.append({\"Groupe\": group, \"Variable\": header, \"Colonne BRAVEHEART\": bh,\n                       \"Définition\": definition})\n\n    from .results_reference import PRIORITY_COLUMNS as APP_INFO\n\n    info = {c.column: c for c in APP_INFO}\n    for c, values in app_original_columns(app_df, ecg).items():\n        i = info.get(c)\n        if i is not None:\n            header = \"%s (%s)\" % (i.label_fr, i.unit) if i.unit and i.unit != \"texte\" else i.label_fr\n            add(G0, header, values, \"(application : %s)\" % c, i.note)\n        else:\n            add(G0, c, values, \"(application)\", \"\")\n\n    for group, variables in GROUPS:\n        for v in variables:\n            header = \"%s (%s)\" % (v.label, v.unit) if v.unit else v.label\n            if callable(v.source):\n                if not all(c in df.columns for c in v.source.needs):\n                    continue\n                add(group, header, v.source(df), v.bh_name, v.definition)\n            elif v.source in df.columns:\n                add(group, header, df[v.source], v.source, v.definition)\n        if group == G5:\n            for c in DERIVED_G5:\n                add(G5, c, derived[c], \"calcul\", \"Voir la feuille « Légende critères ».\")\n    for c in derived.columns:\n        if c not in DERIVED_SKIP:\n            add(G7, c, derived[c], \"calcul\", \"Voir la feuille « Légende critères ».\")\n    table = pd.DataFrame(cols)\n    for c in table.columns:\n        if pd.api.types.is_float_dtype(table[c]):\n            table[c] = table[c].round(3)\n    return table, groups, pd.DataFrame(legend)\n\n\ndef write_sheet(writer, table: pd.DataFrame, groups: list[str], sheet=\"Résultats par groupe\"):\n    \"\"\"Écrit le tableau avec une ligne d'en-tête de groupes fusionnée.\"\"\"\n    from openpyxl.styles import Alignment, Font, PatternFill\n\n    table.to_excel(writer, sheet_name=sheet, index=False, startrow=1)\n    ws = writer.sheets[sheet]\n    fills = (\"DDEBF7\", \"E2EFDA\", \"FFF2CC\", \"FCE4D6\", \"EDE2F6\", \"D9E1F2\", \"F2F2F2\")\n    start, i, k = 1, 1, 0\n    while i <= len(groups):\n        if i == len(groups) or groups[i] != groups[start - 1]:\n            g = groups[start - 1]\n            if g:\n                ws.cell(row=1, column=start, value=g)\n                if i > start:\n                    ws.merge_cells(start_row=1, start_column=start, end_row=1, end_column=i)\n                fill = PatternFill(\"solid\", fgColor=fills[k % len(fills)])\n                k += 1\n                for c in range(start, i + 1):\n                    ws.cell(row=1, column=c).fill = fill\n                    ws.cell(row=2, column=c).fill = fill\n                ws.cell(row=1, column=start).font = Font(bold=True)\n                ws.cell(row=1, column=start).alignment = Alignment(horizontal=\"left\")\n            start = i + 1\n        i += 1\n    for c in range(1, len(groups) + 1):\n        ws.cell(row=2, column=c).alignment = Alignment(wrap_text=True, vertical=\"top\")\n        ws.column_dimensions[ws.cell(row=2, column=c).column_letter].width = 16 if c > 2 else 30\n    ws.row_dimensions[2].height = 60\n    ws.freeze_panes = \"B3\"\n", "ecg_hcm/braveheart_reference.py": "\"\"\"\nbraveheart_reference.py\n========================\n\nRéférentiel des colonnes du fichier exporté par **BRAVEHEART** lui-même\n(le fichier .csv/.xlsx que BRAVEHEART écrit après \"Calculate\" -> export,\nPAS le fichier que `braveheart_export.py` prépare pour BRAVEHEART — c'est\nl'inverse : celui-ci décrit ce que BRAVEHEART nous RENVOIE).\n\nCe module est la source unique (utilisée à la fois par `app.py` pour la\nfonctionnalité de filtrage, et par le document\nGUIDE_LECTURE_EXPORT_BRAVEHEART.md pour rester synchronisé avec le code)\npour :\n\n1. la liste des colonnes qu'on considère comme des ARTEFACTS sur un export\n   BRAVEHEART obtenu à partir d'un battement médian répété (voir\n   `braveheart_export.py` et README section 9) — à ignorer systématiquement ;\n2. une sélection resserrée de colonnes jugées PRIORITAIRES pour les études\n   CMH / amylose cardiaque du projet, avec libellé français, unité, et\n   justification.\n\nÉtabli en lisant directement le code source de BRAVEHEART v1.8.2\n(`VCG_Calc.m`, `VCG_Morphology.m`, `Lead_Morphology.m`, `Beat_Stats.m`,\n`GEH_calculations.m`, `rs_values.m`, `mean_vector_leadmorph.m`) — pas sa\ndocumentation. Stabenau HF, Waks JW. Comput Methods Programs Biomed.\n2023;242:107798.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass ColumnInfo:\n    column: str\n    label_fr: str\n    unit: str\n    category: str\n    note: str = \"\"\n\n\n# ---------------------------------------------------------------------------\n# Colonnes à ignorer sur un export obtenu via braveheart_export.py\n# (battement médian unique répété n_repeats fois) : tout ce qui repose sur\n# une variabilité RÉELLE entre plusieurs battements distincts.\n# ---------------------------------------------------------------------------\nARTIFACT_COLUMNS: tuple[str, ...] = (\n    \"hr\", \"cross_corr\", \"noise_hf\", \"noise_lf\", \"quality_prob\", \"sum_se\",\n    \"qrs_median\", \"qrs_min\", \"qrs_max\", \"qrs_iqr\",\n    \"jt_median\", \"jt_min\", \"jt_max\", \"jt_iqr\",\n    \"qt_median\", \"qt_min\", \"qt_max\", \"qt_iqr\",\n    \"RR_n\", \"RR_pct_n\", \"RR_sd_n\", \"RR\", \"RR_pct\", \"RR_sd\",\n    \"SDNN\", \"SDRR\", \"RMSSD_n\", \"RMSSD_all\",\n    \"Q\", \"QRS\", \"S\", \"Tend\",\n)\n\nARTIFACT_EXPLANATION = (\n    \"Ces colonnes reposent sur une comparaison entre plusieurs battements. \"\n    \"Sur un export ecg_vcg_hcm -> BRAVEHEART, tous les battements sont des \"\n    \"copies identiques d'un seul battement médian réel (voir README \"\n    \"section 9) : ces valeurs ne reflètent donc AUCUNE vraie variabilité \"\n    \"battement-à-battement ni fréquence cardiaque réelle, quelle que soit \"\n    \"la valeur affichée.\"\n)\n\n# ---------------------------------------------------------------------------\n# Sélection prioritaire pour les études CMH / amylose cardiaque, organisée\n# par axe de recherche. Les colonnes non listées ici restent disponibles et\n# documentées dans GUIDE_LECTURE_EXPORT_BRAVEHEART.md (notamment le détail\n# fin par dérivation de Lead_Morphology), simplement pas reprises dans le\n# filtre \"prioritaire\" pour ne pas reproduire la densité du fichier complet.\n# ---------------------------------------------------------------------------\n\nAXIS_VOLTAGE = \"1. Voltage / discordance voltage-masse (CMH vs amylose)\"\nAXIS_REPOL = \"2. Géométrie QRS-T et boucle de repolarisation (exploratoire)\"\nAXIS_MAGNITUDE = \"3. Amplitude électrique globale (hétérogénéité électrique)\"\nAXIS_CONDUCTION = \"4. Conduction / durées\"\nAXIS_CONTEXT = \"0. Contexte de l'examen\"\n\nPRIORITY_COLUMNS: tuple[ColumnInfo, ...] = (\n    # --- Contexte ---\n    ColumnInfo(\"filename\", \"Nom du fichier source\", \"texte\", AXIS_CONTEXT),\n    ColumnInfo(\"num_beats\", \"Nombre de battements dans le fichier fourni\", \"entier\", AXIS_CONTEXT,\n               \"Toujours 10 sur un export ecg_vcg_hcm (répétitions du même battement) — ne PAS lire comme un vrai nombre de battements enregistrés.\"),\n    ColumnInfo(\"missing_lead\", \"Nombre de dérivations manquantes détectées par BRAVEHEART\", \"entier\", AXIS_CONTEXT,\n               \"Contrôle qualité utile : doit valoir 0.\"),\n    ColumnInfo(\"pacing_detected\", \"Spike de stimulateur détecté\", \"0/1\", AXIS_CONTEXT),\n\n    # --- Axe 1 : voltage / discordance voltage-masse ---\n    ColumnInfo(\"cornell_lvh_mv\", \"Voltage de Cornell (S en V3 + R en aVL)\", \"mV\", AXIS_VOLTAGE,\n               \"Calculé aussi par ecg_vcg_hcm (cornell_voltage_mv) — comparer les deux (cf. COMPARAISON_BRAVEHEART.md, corrigé).\"),\n    ColumnInfo(\"sokolow_lvh_mv\", \"Voltage de Sokolow-Lyon (S en V1 + max(R en V5, R en V6))\", \"mV\", AXIS_VOLTAGE,\n               \"Calculé aussi par ecg_vcg_hcm (sokolow_lyon_mv) — comparer les deux.\"),\n    ColumnInfo(\"avR_r_wave\", \"Amplitude de l'onde R en aVR\", \"mV\", AXIS_VOLTAGE,\n               \"Discriminant CMH/amylose rapporté (voir GUIDE_LECTURE_EXPORT_BRAVEHEART.md, sources 2015 et 2024) : seuil ~0.45-0.5 mV.\"),\n    ColumnInfo(\"avR_rs_wave\", \"Amplitude crête-à-crête QRS en aVR\", \"mV\", AXIS_VOLTAGE),\n    ColumnInfo(\"L1_r_wave\", \"Amplitude de l'onde R en dérivation I\", \"mV\", AXIS_VOLTAGE,\n               \"Combiné à avR_r_wave (I + aVR) : discriminant CMH/amylose rapporté, seuil ~0.55-0.575 mV -- voir GUIDE_LECTURE_EXPORT_BRAVEHEART.md.\"),\n    ColumnInfo(\"qrs_frontal_axis\", \"Axe QRS frontal recalculé par BRAVEHEART\", \"degrés\", AXIS_VOLTAGE,\n               \"Recalculé géométriquement (triangle d'Einthoven) à partir du battement médian numérisé -- À comparer à axis_qrs_deg d'ecg_vcg_hcm, qui est l'axe imprimé par l'appareil (GE CardioSoft/MUSE), lu directement dans l'en-tête du PDF. Un grand écart entre les deux est un signal de qualité de numérisation à vérifier, pas nécessairement une vraie mesure discordante.\"),\n    ColumnInfo(\"V1_r_wave\", \"Amplitude onde R en V1\", \"mV\", AXIS_VOLTAGE),\n    ColumnInfo(\"V1_s_wave\", \"Amplitude onde S en V1\", \"mV\", AXIS_VOLTAGE),\n    ColumnInfo(\"V2_r_wave\", \"Amplitude onde R en V2\", \"mV\", AXIS_VOLTAGE, \"Progression de l'onde R en précordiales -- pseudo-infarctus.\"),\n    ColumnInfo(\"V3_r_wave\", \"Amplitude onde R en V3\", \"mV\", AXIS_VOLTAGE),\n    ColumnInfo(\"V4_r_wave\", \"Amplitude onde R en V4\", \"mV\", AXIS_VOLTAGE,\n               \"V1-V4 : dénominateur du ratio (I+aVR)/(V1-4) rapporté comme discriminant CMH/amylose.\"),\n\n    # --- Axe 4 : conduction / durées (avant repol. car intervalles simples) ---\n    ColumnInfo(\"qrs_int\", \"Durée du QRS\", \"ms\", AXIS_CONDUCTION,\n               \"Calculée directement sur le battement médian (Qon à Qoff) -- valide même sur l'export répété. Durée QRS légèrement plus longue rapportée en amylose.\"),\n    ColumnInfo(\"qt_int\", \"Durée du QT\", \"ms\", AXIS_CONDUCTION,\n               \"Calculée directement sur le battement médian -- valide même sur l'export répété. QTc à recalculer soi-même (BRAVEHEART n'applique pas de correction de fréquence sur cet export, la fréquence détectée étant artificielle).\"),\n\n    # --- Axe 2 : géométrie QRS-T / boucle (exploratoire, cf. document) ---\n    ColumnInfo(\"qrst_angle_area\", \"Angle QRS-T spatial, variante aire (3D)\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"qrst_angle_peak\", \"Angle QRS-T spatial, variante pic (3D)\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"qrst_angle_area_frontal\", \"Angle QRS-T frontal, variante aire\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"qrst_angle_peak_frontal\", \"Angle QRS-T frontal, variante pic\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"TCRT\", \"Total Cosine R-to-T\", \"sans unité (-1 à 1)\", AXIS_REPOL),\n    ColumnInfo(\"TCRT_angle\", \"Angle dérivé de TCRT (= acos(TCRT))\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"TMD\", \"T-wave Morphology Dispersion (dispersion de la boucle T)\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"TWR_abs\", \"T-wave Residuum absolu\", \"mV²\", AXIS_REPOL),\n    ColumnInfo(\"TWR_rel\", \"T-wave Residuum relatif\", \"fraction (0-1)\", AXIS_REPOL),\n    ColumnInfo(\"qrst_dihedral_ang\", \"Angle dièdre entre plans des boucles QRS et T\", \"degrés\", AXIS_REPOL),\n    ColumnInfo(\"tloop_roundness\", \"Rondeur de la boucle T (1 = cercle)\", \"sans unité\", AXIS_REPOL),\n    ColumnInfo(\"qrsloop_roundness\", \"Rondeur de la boucle QRS (1 = cercle)\", \"sans unité\", AXIS_REPOL),\n\n    # --- Axe 3 : amplitude électrique globale ---\n    ColumnInfo(\"svg_area_mag\", \"Magnitude du vecteur de gradient ventriculaire spatial (SVG), variante aire\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"svg_peak_mag\", \"Magnitude du SVG, variante pic\", \"mV\", AXIS_MAGNITUDE),\n    ColumnInfo(\"sai_qrst\", \"Sum Absolute QRST Integral (somme X+Y+Z)\", \"mV·ms\", AXIS_MAGNITUDE,\n               \"Indice global d'hétérogénéité électrique (GEH) le plus étudié dans la littérature cardiovasculaire.\"),\n    ColumnInfo(\"sai_vm\", \"SAI QRST sur la dérivation vectorielle magnitude (VM)\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"q_area_mag\", \"Magnitude du vecteur QRS moyen (aire)\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"t_area_mag\", \"Magnitude du vecteur T moyen (aire)\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"VMQ_area\", \"Aire sous le QRS, dérivation VM\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"VMT_area\", \"Aire sous l'onde T, dérivation VM\", \"mV·ms\", AXIS_MAGNITUDE),\n    ColumnInfo(\"vcg_length_qrs\", \"Longueur du trajet de la boucle QRS dans l'espace X-Y-Z\", \"mV\", AXIS_MAGNITUDE),\n    ColumnInfo(\"vcg_length_t\", \"Longueur du trajet de la boucle T dans l'espace X-Y-Z\", \"mV\", AXIS_MAGNITUDE),\n)\n\n\ndef priority_column_names() -> list[str]:\n    return [c.column for c in PRIORITY_COLUMNS]\n\n\ndef ecg_name(filename) -> str:\n    \"\"\"« C:\\\\...\\\\NOM_braveheart.csv » -> « NOM » (nom de l'ECG d'origine).\"\"\"\n    import os\n    import re\n\n    base = os.path.basename(str(filename).replace(\"\\\\\", \"/\"))\n    base = re.sub(r\"\\.(csv|xlsx|txt)$\", \"\", base, flags=re.IGNORECASE)\n    return re.sub(r\"_braveheart(_\\d+)?$\", \"\", base, flags=re.IGNORECASE)\n\n\ndef build_filtered_workbook(df, app_df=None):\n    \"\"\"Construit un classeur Excel (bytes) à partir d'un export BRAVEHEART.\n\n    `df` : DataFrame pandas tel que lu depuis le .csv/.xlsx exporté par\n    BRAVEHEART (une ligne par examen).\n\n    `app_df` (facultatif) : tableau de l'application, pour le sexe et la FC\n    nécessaires à certains critères (voir `braveheart_derived`).\n\n    Retourne (bytes du .xlsx, colonnes prioritaires absentes). Feuilles :\n    - \"Résultats par groupe\" : une ligne par ECG, variables rangées par\n      famille (`braveheart_groups`), et \"Légende résultats\" ;\n    - \"Critères et scores\" : critères d'HVG oui/non et scores recalculés à\n      partir des amplitudes BRAVEHEART (`braveheart_derived`) ;\n    - \"Légende critères\" : définition et seuil de chacun ;\n    - \"Colonnes prioritaires\" : la colonne ECG (nom du fichier d'origine)\n      puis les colonnes de PRIORITY_COLUMNS présentes, avec leur libellé\n      français et leur unité en en-tête ;\n    - \"Toutes les colonnes\" : l'export complet (noms BRAVEHEART d'origine),\n      sans les colonnes artefactuelles ;\n    - \"Légende\" : nom BRAVEHEART, libellé, unité, axe et note ;\n    - \"Colonnes ignorées\" : colonnes de ARTIFACT_COLUMNS retirées, avec\n      l'explication ;\n    - \"Prioritaires manquantes\" si certaines colonnes attendues manquent.\n    \"\"\"\n    import io as _io\n\n    import pandas as pd\n\n    df = df.copy()\n    ecg = (df[\"filename\"].map(ecg_name) if \"filename\" in df.columns\n           else pd.Series(range(1, len(df) + 1), index=df.index))\n\n    wanted = [c for c in PRIORITY_COLUMNS if c.column != \"filename\"]\n    present = [c for c in wanted if c.column in df.columns]\n    missing_priority = [c.column for c in wanted if c.column not in df.columns]\n\n    filtered_df = pd.DataFrame({\"ECG\": ecg})\n    for c in present:\n        header = \"%s (%s)\" % (c.label_fr, c.unit) if c.unit and c.unit != \"texte\" else c.label_fr\n        while header in filtered_df.columns:\n            header += \" [%s]\" % c.column\n        filtered_df[header] = df[c.column]\n\n    artifact_present = [c for c in ARTIFACT_COLUMNS if c in df.columns]\n    full_df = df.drop(columns=artifact_present)\n    full_df.insert(0, \"ECG\", ecg)\n\n    legend_df = pd.DataFrame([\n        {\"Colonne BRAVEHEART\": c.column, \"Signification\": c.label_fr, \"Unité\": c.unit,\n         \"Axe de recherche\": c.category, \"Note\": c.note}\n        for c in PRIORITY_COLUMNS if c.column in df.columns\n    ])\n    artifact_df = pd.DataFrame({\"Colonne retirée\": artifact_present})\n    artifact_df[\"Pourquoi\"] = ARTIFACT_EXPLANATION\n\n    from .braveheart_derived import LEGEND, derive\n\n    from . import braveheart_groups\n\n    derived_df = derive(df, app_df)\n    grouped, grouped_cols, grouped_legend = braveheart_groups.build(df, ecg, derived_df, app_df)\n    derived_df.insert(0, \"ECG\", ecg)\n    # Identité et sexe (Excel de l'application) juste après la colonne ECG,\n    # sur chaque feuille à une ligne par ECG (demande de Benjamin).\n    ident = braveheart_groups.app_identity_columns(app_df, ecg)\n    ident = ident[[c for c in (\"Nom\", \"Prénom\", \"IPP\", \"Naissance\", \"Date ECG\", \"Sexe\")\n                   if c in ident.columns]]\n    if \"Sexe\" not in ident.columns and \"Sexe (source application)\" in derived_df.columns:\n        ident[\"Sexe\"] = derived_df[\"Sexe (source application)\"]\n    for table in (derived_df, filtered_df, full_df):\n        for i, c in enumerate(ident.columns, start=1):\n            if c not in table.columns:\n                table.insert(i, c, ident[c])\n    derived_legend = pd.DataFrame(LEGEND, columns=[\"Colonne\", \"Définition\"])\n\n    buf = _io.BytesIO()\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as writer:\n        braveheart_groups.write_sheet(writer, grouped, grouped_cols)\n        grouped_legend.to_excel(writer, sheet_name=\"Légende résultats\", index=False)\n        derived_df.to_excel(writer, sheet_name=\"Critères et scores\", index=False)\n        derived_legend.to_excel(writer, sheet_name=\"Légende critères\", index=False)\n        filtered_df.to_excel(writer, sheet_name=\"Colonnes prioritaires\", index=False)\n        full_df.to_excel(writer, sheet_name=\"Toutes les colonnes\", index=False)\n        legend_df.to_excel(writer, sheet_name=\"Légende\", index=False)\n        artifact_df.to_excel(writer, sheet_name=\"Colonnes ignorées\", index=False)\n        if missing_priority:\n            pd.DataFrame({\"Colonne prioritaire absente du fichier fourni\": missing_priority}).to_excel(\n                writer, sheet_name=\"Prioritaires manquantes\", index=False\n            )\n        for ws in writer.book.worksheets:\n            if ws.title == \"Résultats par groupe\":\n                continue\n            ws.freeze_panes = \"B2\"\n            for col in ws.iter_cols(min_row=1, max_row=min(ws.max_row, 60)):\n                longest = max(len(str(c.value)) if c.value is not None else 0 for c in col)\n                width = max(10, min(90 if ws.title.startswith(\"Légende\") else 45, longest + 2))\n                ws.column_dimensions[col[0].column_letter].width = width\n    return buf.getvalue(), missing_priority\n", "ecg_hcm/conventional_features.py": "\"\"\"\nconventional_features.py\n=========================\n\nParamètres ECG conventionnels pertinents en cardiomyopathie hypertrophique\n(CMH), calculés à partir du battement médian par dérivation.\n\nRéférences (seuils vérifiés via la littérature, voir README) :\n- Sokolow-Lyon : SV1 + max(RV5,RV6) >= 35 mm (3.5 mV)\n- Cornell voltage : RaVL + SV3 > 28 mm (H) / > 20 mm (F)\n- Cornell product : (RaVL+SV3[+8mm si F]) x QRSd(ms) > 2440 mm.ms\n- Peguero-Lo Presti : S le plus profond (toutes dérivations) + SV4\n  >= 28 mm (H) / >= 23 mm (F) — validé spécifiquement en CMH (Haseeb et\n  al., voir README)\n- Ondes Q pathologiques : durée >= 40 ms OU (profondeur >= 25 % du R qui\n  suit ET profondeur >= 1 mm/0.1 mV), hors aVR/III/V1 — le plancher absolu\n  évite qu'un R quasi nul (quelques centièmes de mV) ne rende le critère\n  relatif trivialement vrai. Un complexe QS (aucune onde R visible, R <\n  0.05 mV) compte comme onde Q pathologique si sa profondeur atteint ce\n  même plancher de 0.1 mV (même exclusion aVR/III/V1)\n- QRS fragmenté (fQRS) : >= 2 déflexions supplémentaires (encoches) dans\n  le QRS, sur une dérivation contiguë, en l'absence de bloc de branche\n  complet\n- Progression de l'onde R (précordiales) : mauvaise progression si\n  R en V3 <= 3 mm (0.3 mV) — critère classique le plus simple (LITFL) ;\n  d'autres définitions plus strictes existent dans la littérature\n  (transition retardée au-delà de V4, ratio R/S < 1 en V3-V4...), non\n  appliquées ici, cf. README\n- Ondes T négatives géantes (CMH apicale) : amplitude <= -10 mm (-1.0 mV),\n  n'importe quelle dérivation (classiquement précordiales médio-latérales,\n  V3-V5) — seuil rapporté par Eriksson MJ et al. \"Long-term outcome in\n  patients with apical hypertrophic cardiomyopathy.\" J Am Coll Cardiol.\n  2002;39(4):638-645 (et repris ensuite, ex. Hanna EB, Glancy DL. Cleve\n  Clin J Med. 2011;78:404-414), pour le phénomène décrit initialement par\n  Sakamoto T et al. Jpn Heart J. 1976;17(5):611-629 et par Yamaguchi H et\n  al. Am J Cardiol. 1979;44(3):401-412 (\"syndrome de Yamaguchi\") — voir\n  README pour le détail et les incertitudes d'attribution bibliographique\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nfrom scipy.signal import find_peaks\n\nfrom .beat_detection import BeatAnalysis, MedianBeat, t_search_end_s\n\nEXCLUDED_FROM_PATHO_Q = {\"aVR\", \"III\", \"V1\"}\nMIN_PATHOLOGICAL_Q_DEPTH_MV = 0.1  # 1 mm à 10 mm/mV — plancher absolu, cf. _lead_morphology\nQS_MAX_R_MV = 0.05  # 0.5 mm à 10 mm/mV : en dessous, l'onde R n'est pas visible -> complexe QS\nPOOR_R_PROGRESSION_V3_THRESHOLD_MV = 0.3  # 3 mm à 10 mm/mV (LITFL)\nGIANT_NEGATIVE_T_THRESHOLD_MV = -1.0  # -10 mm à 10 mm/mV (Eriksson 2002 JACC ; cf. docstring)\n\n\n@dataclass\nclass LeadMorphology:\n    lead: str\n    r_amplitude_mv: float\n    s_amplitude_mv: float  # négatif ou 0\n    q_amplitude_mv: float  # négatif ou 0\n    q_duration_ms: float\n    t_amplitude_mv: float\n    st_level_j60_mv: float\n    fragmented: bool\n    n_notches: int\n    pathological_q: bool\n    r_peak_time_ms: float | None = None  # onset QRS -> pic R (déflexion intrinsécoïde) ; None si pas de R\n    qs_complex: bool = False  # aucune onde R visible (R < QS_MAX_R_MV) et QRS négatif\n\n\n@dataclass\nclass ConventionalFeatures:\n    per_lead: dict[str, LeadMorphology] = field(default_factory=dict)\n    sokolow_lyon_mv: float | None = None\n    sokolow_lyon_positive: bool | None = None\n    cornell_voltage_mv: float | None = None\n    cornell_voltage_positive: bool | None = None\n    cornell_product_mm_ms: float | None = None\n    cornell_product_positive: bool | None = None\n    peguero_lopresti_mv: float | None = None\n    peguero_lopresti_positive: bool | None = None\n    gubner_ungerleider_mv: float | None = None      # R(I) + S(III)\n    gubner_ungerleider_positive: bool | None = None  # >= 2.5 mV\n    perugia_cornell_mv: float | None = None          # S(V3) + R(aVL), seuils Perugia\n    perugia_cornell_positive: bool | None = None     # > 2.4 mV (H) / > 2.0 mV (F)\n    t_inversion_leads: list[str] = field(default_factory=list)\n    giant_negative_t_leads: list[str] = field(default_factory=list)\n    pathological_q_leads: list[str] = field(default_factory=list)\n    qs_leads: list[str] = field(default_factory=list)\n    fragmented_qrs_leads: list[str] = field(default_factory=list)\n    poor_r_wave_progression: bool | None = None\n    qtc_bazett_ms: float | None = None\n    warnings: list[str] = field(default_factory=list)\n\n\ndef _main_r_index(qrs_mv: np.ndarray) -> int | None:\n    \"\"\"Indice du plus grand sommet local positif strictement à l'intérieur\n    de la fenêtre QRS (ni le premier ni le dernier échantillon). None s'il\n    n'y en a pas (complexe QS, ou seule une remontée terminale positive).\"\"\"\n    v = qrs_mv\n    if len(v) < 3:\n        return None\n    inner = np.arange(1, len(v) - 1)\n    peaks = inner[(v[inner] >= v[inner - 1]) & (v[inner] >= v[inner + 1]) & (v[inner] > 0)]\n    if len(peaks) == 0:\n        return None\n    return int(peaks[np.argmax(v[peaks])])\n\n\ndef _lead_morphology(mb: MedianBeat, onset_s: float, offset_s: float, sex: str | None,\n                      rr_interval_s: float | None = None) -> LeadMorphology:\n    t = mb.t_rel\n    mv = mb.mv\n    in_qrs = (t >= onset_s) & (t <= offset_s)\n    idx_qrs = np.where(in_qrs)[0]\n    if len(idx_qrs) < 3:\n        return LeadMorphology(\n            lead=mb.lead, r_amplitude_mv=0, s_amplitude_mv=0, q_amplitude_mv=0,\n            q_duration_ms=0, t_amplitude_mv=0, st_level_j60_mv=0,\n            fragmented=False, n_notches=0, pathological_q=False, r_peak_time_ms=None,\n        )\n\n    qrs_t = t[idx_qrs]\n    qrs_mv = mv[idx_qrs]\n    # Onde R = plus grand SOMMET positif à l'intérieur du QRS. Le simple\n    # maximum de la fenêtre tombait souvent sur son dernier échantillon\n    # (remontée vers un ST sus-décalé en V1-V3, retour à la ligne de base\n    # en aVR) : tout le S profond passait alors « avant R » et était compté\n    # comme onde Q (S = 0). Mis en évidence par la validation contre\n    # BRAVEHEART (2026-10-20 : SV1 0,76 contre 1,31 mV).\n    r_local = _main_r_index(qrs_mv)\n    r_val = qrs_mv[r_local] if r_local is not None else 0.0\n    if r_local is None:\n        r_local = int(np.argmax(qrs_mv))\n    r_amp = float(max(r_val, 0.0))\n    # Déflexion intrinsécoïde (onset QRS -> pic R), utilisée par le score\n    # de Romhilt-Estes (romhilt_estes.py) — non définie s'il n'y a pas de\n    # déflexion positive (r_amp <= 0).\n    r_peak_time_ms = float((qrs_t[r_local] - qrs_t[0]) * 1000) if r_amp > 1e-9 else None\n\n    # Classification par POSITION relative au pic R (et non par magnitude\n    # relative) : onde Q = déflexion négative avant R, onde S = déflexion\n    # négative après R. Ainsi un complexe rS (petit r suivi d'un S profond,\n    # fréquent en V3/V4 en cas de mauvaise progression de l'onde R ou de\n    # LVH/CMH) garde bien son S, au lieu d'être classé comme \"dérivation à\n    # déflexion principale négative\" et de voir son S remis à 0 — ce qui\n    # faussait silencieusement Sokolow-Lyon (SV1), Cornell (SV3) et\n    # Peguero-Lo Pre
