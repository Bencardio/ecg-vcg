sti (SV4) sur exactement les morphologies où ces indices\n    # de voltage sont les plus utiles.\n    # Onde Q = déflexion négative avant la PREMIÈRE onde positive : dans un\n    # complexe rSR' (BBD, R' plus grand que r), le creux entre r et R' est\n    # un S, pas un Q.\n    first_r = None\n    if r_amp > 1e-9:\n        thr = max(0.03, 0.15 * r_amp)\n        inner = np.arange(1, r_local + 1)\n        if len(inner):\n            pk = inner[(qrs_mv[inner] >= qrs_mv[inner - 1])\n                       & (qrs_mv[inner] >= qrs_mv[np.minimum(inner + 1, len(qrs_mv) - 1)])\n                       & (qrs_mv[inner] >= thr)]\n            first_r = int(pk[0]) if len(pk) else None\n    if r_amp > 1e-9 and first_r is not None and first_r < r_local:\n        before = qrs_mv[:first_r + 1]\n        if len(before) > 1 and before.min() < 0:\n            q_idx = int(np.argmin(before))\n            q_amp = float(before[q_idx])\n            crossing = q_idx\n            while crossing < len(before) - 1 and before[crossing] < 0:\n                crossing += 1\n            q_dur_ms = (qrs_t[crossing] - qrs_t[0]) * 1000\n        else:\n            q_amp, q_dur_ms = 0.0, 0.0\n        after = qrs_mv[first_r:]\n        s_amp = float(after.min()) if after.min() < 0 else 0.0\n    elif r_amp > 1e-9:\n        before = qrs_mv[:r_local + 1]\n        if len(before) > 1 and before.min() < 0:\n            q_idx = int(np.argmin(before))\n            q_amp = float(before[q_idx])\n            # durée Q : de l'onset jusqu'au retour à 0 après le nadir Q\n            crossing = q_idx\n            while crossing < len(before) - 1 and before[crossing] < 0:\n                crossing += 1\n            q_dur_ms = (qrs_t[crossing] - qrs_t[0]) * 1000\n        else:\n            q_amp, q_dur_ms = 0.0, 0.0\n        after = qrs_mv[r_local:]\n        s_amp = float(after.min()) if len(after) > 1 and after.min() < 0 else 0.0\n    else:\n        # Pas de déflexion positive significative : complexe QS pur. Par\n        # convention (Sokolow-Lyon/Cornell/Peguero), la profondeur d'un QS\n        # est comptée comme \"S\" (il n'y a pas de R pour distinguer un Q\n        # isolé). La colonne Q reste à 0 pour ne pas compter deux fois la\n        # même déflexion ; le QS est signalé par qs_complex et compté comme\n        # onde Q pathologique plus bas s'il est assez profond.\n        q_amp = 0.0\n        q_dur_ms = 0.0\n        s_amp = float(qrs_mv.min()) if qrs_mv.min() < 0 else 0.0\n\n    # --- fragmentation : nombre d'extrema locaux significatifs dans le QRS.\n    # Seuil de proéminence volontairement conservateur (8 % de l'amplitude\n    # crête-à-crête du QRS, plancher 0.05 mV) + distance minimale ~12 ms\n    # entre deux extrema, pour ne pas confondre de petites ondulations\n    # d'interpolation avec de vraies encoches.\n    fs_beat_local = 1.0 / np.median(np.diff(t)) if len(t) > 1 else 500.0\n    min_dist = max(1, int(0.012 * fs_beat_local))\n    amp_range = max(qrs_mv.max() - qrs_mv.min(), 1e-6)\n    noise_floor = max(0.08 * amp_range, 0.05)\n    peaks_pos, _ = find_peaks(qrs_mv, prominence=noise_floor, distance=min_dist)\n    peaks_neg, _ = find_peaks(-qrs_mv, prominence=noise_floor, distance=min_dist)\n    n_notches = len(peaks_pos) + len(peaks_neg)\n    fragmented = n_notches >= 3  # R (ou QS) + S + au moins une encoche surnuméraire\n\n    # --- onde T : recherche dans une fenêtre standard après le QRS (60 à\n    # 400 ms après la fin du QRS). Cette fenêtre fixe est bornée pour ne\n    # JAMAIS empiéter sur le battement suivant : à fréquence cardiaque\n    # élevée (RR court), une fenêtre non bornée peut atteindre le début du\n    # complexe QRS suivant, et comme le point retenu est celui de plus\n    # grande déviation ABSOLUE (positif ou négatif), une onde S profonde du\n    # battement suivant peut alors être comptée à tort comme \"onde T\" (avec\n    # un signe négatif), même si la vraie onde T, elle, est positive.\n    # Marge de sécurité : 60 ms avant le prochain QRS estimé (RR mesuré).\n    # Borne : début du QRS suivant, ou complexe parasite dans la dérivation\n    # (cf. beat_detection.t_search_end_s).\n    t_win_end = min(offset_s + 0.40,\n                    t_search_end_s(t, mv, onset_s, offset_s, rr_interval_s))\n    t_win = (t >= offset_s + 0.06) & (t <= t_win_end)\n    if t_win.sum() > 2:\n        t_seg = mv[t_win]\n        t_amp = float(t_seg[np.argmax(np.abs(t_seg))])\n    else:\n        t_amp = 0.0\n\n    # --- niveau ST à J+60ms, mesuré par rapport à la ligne de base PR\n    # (médiane de -30 à -10 ms avant le début du QRS). Il était mesuré par\n    # rapport au 0 mV absolu, alors qu'un décalage de 0,05 mV de la ligne de\n    # base suffit à faire basculer le critère « strain » (seuil -0,05 mV).\n    j60_time = offset_s + 0.06\n    pr = (t >= onset_s - 0.03) & (t <= onset_s - 0.01)\n    pr_level = float(np.median(mv[pr])) if pr.sum() >= 2 else 0.0\n    st_level = float(np.interp(j60_time, t, mv)) - pr_level\n\n    q_duration_ms = float(q_dur_ms)\n    # Le critère relatif (profondeur >= 25% du R) devient quasi toujours vrai\n    # quand le R est minuscule (quelques centièmes de mV) : n'importe quelle\n    # Q non nulle le satisfait alors mathématiquement, sans être une vraie\n    # onde Q pathologique. On exige donc en plus une profondeur absolue\n    # minimale (1 mm / 0.1 mV, seuil usuel de significativité en ECG) pour\n    # cette branche — le critère de durée (>= 40 ms), qui est déjà un seuil\n    # absolu, n'est pas concerné.\n    pathological_q = (\n        mb.lead not in EXCLUDED_FROM_PATHO_Q\n        and q_amp < 0\n        and (\n            q_duration_ms >= 40\n            or (r_amp > 0 and abs(q_amp) >= 0.25 * r_amp\n                and abs(q_amp) >= MIN_PATHOLOGICAL_Q_DEPTH_MV)\n        )\n    )\n    # Complexe QS : pas d'onde R visible, toute la déflexion est négative.\n    # C'est une onde Q sans R qui suit : le critère relatif (>= 25 % du R)\n    # est donc rempli d'office, et seule la profondeur absolue (plancher\n    # 0.1 mV) est exigée, avec les mêmes dérivations exclues.\n    qrs_min = float(qrs_mv.min())\n    qs_complex = r_amp < QS_MAX_R_MV and qrs_min < 0\n    if (qs_complex and mb.lead not in EXCLUDED_FROM_PATHO_Q\n            and abs(qrs_min) >= MIN_PATHOLOGICAL_Q_DEPTH_MV):\n        pathological_q = True\n\n    return LeadMorphology(\n        lead=mb.lead, r_amplitude_mv=float(r_amp), s_amplitude_mv=float(s_amp),\n        q_amplitude_mv=float(q_amp), q_duration_ms=q_duration_ms,\n        t_amplitude_mv=t_amp, st_level_j60_mv=st_level,\n        fragmented=fragmented, n_notches=n_notches, pathological_q=pathological_q,\n        r_peak_time_ms=r_peak_time_ms, qs_complex=qs_complex,\n    )\n\n\ndef compute(beat: BeatAnalysis, sex: str | None, qrs_duration_ms_header: float | None) -> ConventionalFeatures:\n    feats = ConventionalFeatures()\n    # Intervalle RR mesuré (borne de sécurité pour la fenêtre de recherche\n    # de l'onde T, cf. _lead_morphology) -- None si la fréquence cardiaque\n    # n'a pas pu être mesurée/est hors plage physiologique plausible.\n    rr_interval_s = (\n        60.0 / beat.heart_rate_bpm\n        if beat.heart_rate_bpm and 20.0 <= beat.heart_rate_bpm <= 300.0\n        else None\n    )\n    for lead, mb in beat.median_beats.items():\n        feats.per_lead[lead] = _lead_morphology(\n            mb, beat.qrs_onset_s, beat.qrs_offset_s, sex, rr_interval_s\n        )\n\n    pl = feats.per_lead\n    is_female = bool(sex) and sex.strip().lower().startswith(\"f\")  # \"Féminin\"/\"Female\"/\"F\"\n\n    def amp(lead, kind):\n        m = pl.get(lead)\n        if m is None:\n            return None\n        return getattr(m, kind)\n\n    # Sokolow-Lyon\n    sv1 = amp(\"V1\", \"s_amplitude_mv\")\n    rv5 = amp(\"V5\", \"r_amplitude_mv\")\n    rv6 = amp(\"V6\", \"r_amplitude_mv\")\n    if sv1 is not None and (rv5 is not None or rv6 is not None):\n        feats.sokolow_lyon_mv = abs(sv1) + max(v for v in (rv5, rv6) if v is not None)\n        feats.sokolow_lyon_positive = feats.sokolow_lyon_mv >= 3.5\n\n    # Cornell voltage / product\n    ravl = amp(\"aVL\", \"r_amplitude_mv\")\n    sv3 = amp(\"V3\", \"s_amplitude_mv\")\n    if ravl is not None and sv3 is not None:\n        cornell = ravl + abs(sv3)\n        feats.cornell_voltage_mv = cornell\n        threshold = 2.0 if is_female else 2.8\n        feats.cornell_voltage_positive = cornell > threshold\n        qrsd = qrs_duration_ms_header or beat.qrs_duration_ms\n        cornell_for_product = cornell + (0.8 if is_female else 0.0)  # +8mm(0.8mV) chez la femme\n        feats.cornell_product_mm_ms = cornell_for_product * 10 * qrsd  # mV->mm (x10) puis x ms\n        feats.cornell_product_positive = feats.cornell_product_mm_ms > 2440\n\n    # Gubner-Ungerleider (Gubner & Ungerleider, Arch Intern Med 1943) :\n    # R(I) + S(III) >= 2.5 mV (25 mm).\n    ri = amp(\"I\", \"r_amplitude_mv\")\n    siii = amp(\"III\", \"s_amplitude_mv\")\n    if ri is not None and siii is not None:\n        feats.gubner_ungerleider_mv = ri + abs(siii)\n        feats.gubner_ungerleider_positive = feats.gubner_ungerleider_mv >= 2.5\n\n    # Composante voltage du score de Perugia (Verdecchia et al., JACC 1998) :\n    # S(V3) + R(aVL) > 2.4 mV chez l'homme, > 2.0 mV chez la femme. Le score\n    # complet (avec strain et Romhilt-Estes) est calculé dans pipeline.py.\n    if ravl is not None and sv3 is not None:\n        feats.perugia_cornell_mv = ravl + abs(sv3)\n        feats.perugia_cornell_positive = feats.perugia_cornell_mv > (2.0 if is_female else 2.4)\n\n    # Peguero-Lo Presti : S le plus profond toutes dérivations + SV4\n    s_values = {ld: m.s_amplitude_mv for ld, m in pl.items() if m.s_amplitude_mv < 0}\n    sv4 = amp(\"V4\", \"s_amplitude_mv\")\n    if s_values and sv4 is not None:\n        deepest_lead = min(s_values, key=lambda ld: s_values[ld])\n        deepest = s_values[deepest_lead]\n        total = abs(deepest) + abs(sv4) if deepest_lead != \"V4\" else 2 * abs(sv4)\n        feats.peguero_lopresti_mv = total\n        threshold = 2.3 if is_female else 2.8\n        feats.peguero_lopresti_positive = total >= threshold\n\n    feats.t_inversion_leads = sorted(\n        ld for ld, m in pl.items() if m.t_amplitude_mv < -0.1 and ld not in (\"aVR\",)\n    )\n    feats.giant_negative_t_leads = sorted(\n        ld for ld, m in pl.items()\n        if m.t_amplitude_mv <= GIANT_NEGATIVE_T_THRESHOLD_MV and ld not in (\"aVR\",)\n    )\n    feats.pathological_q_leads = sorted(ld for ld, m in pl.items() if m.pathological_q)\n    feats.qs_leads = sorted(ld for ld, m in pl.items() if m.qs_complex)\n    feats.fragmented_qrs_leads = sorted(ld for ld, m in pl.items() if m.fragmented)\n\n    # Progression de l'onde R : R en V3 <= 3 mm (0.3 mV)\n    rv3 = amp(\"V3\", \"r_amplitude_mv\")\n    if rv3 is not None:\n        feats.poor_r_wave_progression = rv3 <= POOR_R_PROGRESSION_V3_THRESHOLD_MV\n\n    return feats\n", "ecg_hcm/delineation.py": "\"\"\"\ndelineation.py\n===============\n\nDélinéation fine par dérivation (ondes P et T notamment) pour les features\nde repolarisation avancées (QT par dérivation, Tpeak-Tend, dispersion) et\npour affiner la fenêtre de l'onde T utilisée par la VCG (gradient\nventriculaire spatial).\n\nDeux méthodes, avec repli automatique :\n\n1. **NeuroKit2 (`method=\"dwt\"`)** — délinéateur par ondelettes, préféré\n   quand disponible. Implémente l'algorithme de :\n   Martinez JP, Almeida R, Olmos S, Rocha AP, Laguna P. \"A wavelet-based\n   ECG delineator: evaluation on standard databases.\" IEEE Trans Biomed\n   Eng. 2004;51(4):570-81.\n   Bibliothèque : Makowski D, et al. \"NeuroKit2: A Python toolbox for\n   neurophysiological signal processing.\" Behav Res Methods. 2021.\n   (https://github.com/neuropsychology/NeuroKit, licence MIT, gratuite)\n\n   NeuroKit2 est une DÉPENDANCE OPTIONNELLE (voir requirements.txt). Si\n   elle n'est pas installée, ou si la délinéation échoue sur une\n   dérivation donnée (signal trop court, onde non détectée...), on se\n   replie automatiquement sur la méthode 2 pour cette dérivation, avec\n   `method=\"tangent_fallback\"` indiqué dans le résultat.\n\n2. **Méthode tangente (repli, toujours disponible)** — mesure classique du\n   T-end : à partir du point de pente maximale sur la branche descendante\n   de l'onde T (après son pic), on trace la tangente et on prend son\n   intersection avec la ligne isoélectrique. Cf.\n   Postema PG, Wilde AA. \"The measurement of the QT interval.\" Curr\n   Cardiol Rev. 2014;10(3):287-94.\n\nToutes les bornes temporelles sont retournées en SECONDES, relatives au\npic R (même convention que `t_rel` dans `beat_detection.py`).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nfrom .beat_detection import MedianBeat, t_search_end_s\nfrom .signal_builder import SignalTrace\n\ntry:\n    import neurokit2 as nk\n    _HAS_NEUROKIT2 = True\nexcept ImportError:\n    _HAS_NEUROKIT2 = False\n\nT_SEARCH_START_S = 0.06   # après l'offset du QRS\nT_SEARCH_END_S = 0.44\nMIN_VALID_BEATS = 2\nR_REFINE_WINDOW_S = 0.06  # +/- 60 ms, cf. _refine_r_indices\n\n\n@dataclass\nclass LeadDelineation:\n    lead: str\n    method: str  # \"dwt\" | \"tangent_fallback\" | \"failed\"\n    p_onset_s: float | None = None\n    p_offset_s: float | None = None\n    p_peak_s: float | None = None\n    qrs_onset_s: float | None = None\n    qrs_offset_s: float | None = None\n    t_onset_s: float | None = None\n    t_peak_s: float | None = None\n    t_offset_s: float | None = None\n\n\ndef neurokit2_available() -> bool:\n    return _HAS_NEUROKIT2\n\n\ndef _smooth(mv: np.ndarray, window: int = 9) -> np.ndarray:\n    if len(mv) < window:\n        return mv\n    kernel = np.ones(window) / window\n    pad = window // 2\n    padded = np.pad(mv, pad, mode=\"edge\")\n    return np.convolve(padded, kernel, mode=\"valid\")[: len(mv)]\n\n\ndef _tangent_t_end(t_rel: np.ndarray, mv: np.ndarray, qrs_offset_s: float,\n                   hard_end_s: float | None = None) -> tuple[float | None, float | None]:\n    \"\"\"Repli sans dépendance externe : méthode de la tangente sur le\n    battement médian déjà calculé. Retourne (t_peak_s, t_offset_s).\n\n    Pour limiter la sensibilité au bruit (le point de pente maximale peut\n    sinon accrocher une micro-oscillation loin de la vraie fin de l'onde\n    T) : (1) légère moyenne glissante avant dérivation, (2) la recherche\n    de la pente la plus raide est restreinte à la portion de la branche\n    descendante où |amplitude| reste au-dessus de 15 % du pic (au-delà,\n    le signal est déjà proche de la ligne de base et la pente n'est plus\n    représentative de la \"vraie\" décroissance de l'onde T), (3) résultat\n    rejeté (repli -> échec) si hors bornes physiologiques plausibles.\n    \"\"\"\n    win_end = qrs_offset_s + T_SEARCH_END_S\n    if hard_end_s is not None:\n        # QRS suivant (FC rapide) ou complexe parasite : sinon le « pic T »\n        # pouvait être le R suivant.\n        win_end = min(win_end, hard_end_s)\n    win = (t_rel >= qrs_offset_s + T_SEARCH_START_S) & (t_rel <= win_end)\n    if win.sum() < 8:\n        return None, None\n    idx_win = np.where(win)[0]\n    t_seg = t_rel[idx_win]\n    mv_seg = _smooth(mv[idx_win])\n    peak_local = int(np.argmax(np.abs(mv_seg)))\n    t_peak_s = float(t_seg[peak_local])\n    peak_amp = mv_seg[peak_local]\n    if abs(peak_amp) < 1e-4:\n        return t_peak_s, None\n\n    after = np.arange(peak_local, len(mv_seg))\n    if len(after) < 5:\n        return t_peak_s, None\n    # ne garder que la portion où |amplitude| > 15% du pic (branche\n    # descendante \"active\"), en s'arrêtant au premier retour sous ce seuil\n    rel_amp = mv_seg[after] / peak_amp  # même signe que peak_amp par construction après le pic\n    below = np.where(rel_amp < 0.15)[0]\n    end_of_branch = after[below[0]] if len(below) else after[-1]\n    branch = np.arange(peak_local, end_of_branch + 1)\n    if len(branch) < 4:\n        return t_peak_s, None\n\n    deriv = np.gradient(mv_seg[branch], t_seg[branch])\n    steep_local = branch[int(np.argmax(np.abs(deriv)))]\n    slope = float(np.gradient(mv_seg, t_seg)[steep_local])\n    if abs(slope) < 1e-6:\n        return t_peak_s, None\n    t_s, v_s = t_seg[steep_local], mv_seg[steep_local]\n    t_end = float(t_s - v_s / slope)\n\n    if not (t_peak_s + 0.02 <= t_end <= t_peak_s + 0.28):\n        return t_peak_s, None\n    if hard_end_s is not None and t_end > hard_end_s:\n        return t_peak_s, None\n    return t_peak_s, t_end\n\n\ndef delineate_lead_fallback(mb: MedianBeat, qrs_onset_s: float, qrs_offset_s: float,\n                            rr_s: float | None = None) -> LeadDelineation:\n    hard_end = t_search_end_s(mb.t_rel, mb.mv, qrs_onset_s, qrs_offset_s, rr_s)\n    t_peak, t_end = _tangent_t_end(mb.t_rel, mb.mv, qrs_offset_s, hard_end)\n    method = \"tangent_fallback\" if t_end is not None else \"failed\"\n    return LeadDelineation(lead=mb.lead, method=method,\n                            qrs_onset_s=qrs_onset_s, qrs_offset_s=qrs_offset_s,\n                            t_peak_s=t_peak, t_offset_s=t_end)\n\n\ndef _refine_r_indices(sig: SignalTrace, r_idx: np.ndarray) -> np.ndarray:\n    \"\"\"Recale chaque index R \"hérité\" de la bande rythme sur l'extremum\n    local de CETTE dérivation, dans une fenêtre de +/- R_REFINE_WINDOW_S.\n\n    `r_peak_times_s` est calculé une seule fois sur la bande rythme (une\n    dérivation à part, pleine largeur), puis réutilisé tel quel pour\n    toutes les dérivations de la grille courte (6 lignes x 2 colonnes),\n    chacune ayant sa PROPRE origine temporelle locale (`sig.t` redémarre à\n    0 pour chaque tracé, cf. `signal_builder._build_one`). Un décalage\n    même faible entre ces origines (quelques dizaines de ms, lié à\n    l'extraction du tracé PDF) suffisait à transmettre à NeuroKit2 un\n    index qui ne correspond pas au vrai pic R de la dérivation en\n    question ; l'algorithme délinéait alors un point quelconque du signal\n    (parfois une onde T ou un intervalle isoélectrique) en le faisant\n    passer pour un complexe QRS, d'où des bornes T aberrantes. Même\n    principe de recalage que `beat_detection.detect_r_peaks`.\"\"\"\n    if len(r_idx) == 0:\n        return r_idx\n    win = max(1, int(R_REFINE_WINDOW_S * sig.fs_hz))\n    refined = []\n    for idx in r_idx:\n        lo, hi = max(0, idx - win), min(len(sig.mv), idx + win)\n        seg = sig.mv[lo:hi]\n        if len(seg) == 0:\n            continue\n        refined.append(lo + int(np.argmax(np.abs(seg))))\n    return np.array(sorted(set(refined)), dtype=int)\n\n\ndef delineate_lead_nk2(sig: SignalTrace, r_peak_times_s: np.ndarray,\n                        qrs_onset_s: float, qrs_offset_s: float) -> LeadDelineation | None:\n    \"\"\"Délinéation par ondelettes (NeuroKit2) sur le signal complet de la\n    dérivation (pas le battement médian : l'algorithme DWT a besoin du\n    signal continu). Agrège (médiane) les bornes relatives au pic R sur\n    tous les battements valides du segment. Retourne None si NeuroKit2\n    n'est pas installé ou si la délinéation échoue entièrement.\"\"\"\n    if not _HAS_NEUROKIT2:\n        return None\n\n    r_idx = np.searchsorted(sig.t, r_peak_times_s)\n    r_idx = r_idx[(r_idx > 0) & (r_idx < len(sig.t))]\n    r_idx = _refine_r_indices(sig, r_idx)\n    if len(r_idx) < MIN_VALID_BEATS:\n        return None\n\n    try:\n        _, waves = nk.ecg_delineate(\n            sig.mv, rpeaks={\"ECG_R_Peaks\": r_idx}, sampling_rate=sig.fs_hz, method=\"dwt\",\n        )\n    except Exception:\n        return None\n\n    def _relative_offsets(key: str) -> np.ndarray:\n        idx = waves.get(key)\n        if idx is None:\n            return np.array([])\n        idx = np.asarray(idx, dtype=float)\n        out = []\n        for wave_idx, r in zip(idx, r_idx):\n            if np.isnan(wave_idx):\n                continue\n            out.append((wave_idx - r) / sig.fs_hz)\n        return np.array(out)\n\n    def _median_or_none(key: str) -> float | None:\n        vals = _relative_offsets(key)\n        return float(np.median(vals)) if len(vals) >= MIN_VALID_BEATS else None\n\n    result = LeadDelineation(\n        lead=sig.lead, method=\"dwt\",\n        p_onset_s=_median_or_none(\"ECG_P_Onsets\"),\n        p_offset_s=_median_or_none(\"ECG_P_Offsets\"),\n        p_peak_s=_median_or_none(\"ECG_P_Peaks\"),\n        qrs_onset_s=_median_or_none(\"ECG_R_Onsets\") or qrs_onset_s,\n        qrs_offset_s=_median_or_none(\"ECG_R_Offsets\") or qrs_offset_s,\n        t_onset_s=_median_or_none(\"ECG_T_Onsets\"),\n        t_peak_s=_median_or_none(\"ECG_T_Peaks\"),\n        t_offset_s=_median_or_none(\"ECG_T_Offsets\"),\n    )\n    if result.t_offset_s is None:\n        return None  # l'info qu'on cherche vraiment n'a pas été obtenue\n\n    # Même garde-fou de plausibilité que la méthode tangente (T_SEARCH_END_S -\n    # 0.02s pour la borne haute, cf. `_tangent_t_end`) : contrairement au\n    # repli tangente, le résultat DWT n'était jusqu'ici jamais confronté à\n    # cette borne, alors qu'il peut lui aussi placer un T-end aberrant\n    # (parfois avant le pic T, ou très loin après) quand la délinéation par\n    # ondelettes est mal conditionnée sur un signal court. Rejeté ici -> le\n    # repli tangente prend le relais pour cette dérivation.\n    if result.t_peak_s is not None:\n        if not (result.t_peak_s + 0.02 <= result.t_offset_s <= result.t_peak_s + 0.28):\n            return None\n    return result\n\n\ndef delineate_lead(sig: SignalTrace, mb: MedianBeat, r_peak_times_s: np.ndarray,\n                    qrs_onset_s: float, qrs_offset_s: float) -> LeadDelineation:\n    nk_result = delineate_lead_nk2(sig, r_peak_times_s, qrs_onset_s, qrs_offset_s)\n    if nk_result is not None:\n        return nk_result\n    rr_s = (float(np.median(np.diff(r_peak_times_s)))\n            if r_peak_times_s is not None and len(r_peak_times_s) >= 2 else None)\n    return delineate_lead_fallback(mb, qrs_onset_s, qrs_offset_s, rr_s)\n\n\nMEDIAN_TILE_REPEATS = 10\n\n\ndef delineate_p_on_median(mb: MedianBeat) -> tuple[float | None, float | None, float | None]:\n    \"\"\"Délinéation de l'onde P (NeuroKit2/DWT) sur le BATTEMENT MÉDIAN répété\n    `MEDIAN_TILE_REPEATS` fois bout à bout, au lieu du signal brut de la\n    dérivation. Sert quand la délinéation sur le signal échoue — typiquement\n    les formats à segments courts et faible résolution (Cardionics : 2,5 s,\n    ~84 Hz, 1 à 3 battements par dérivation), où NeuroKit2 ne trouve pas\n    l'onde P. Même principe que l'export BRAVEHEART : une rampe linéaire\n    rend la jonction entre copies continue.\n\n    Limite : la fenêtre du battement médian commence 280 ms avant le pic R,\n    donc un PR au-delà d'environ 230 ms (BAV1 marqué) n'est pas mesurable\n    par cette voie. Retourne (p_onset_s, p_peak_s, p_offset_s) relatifs au\n    pic R, ou (None, None, None).\"\"\"\n    if not _HAS_NEUROKIT2:\n        return None, None, None\n    t = mb.t_rel\n    if len(t) < 10:\n        return None, None, None\n    fs = 1.0 / float(np.median(np.diff(t)))\n    mv = mb.mv - np.linspace(0.0, mb.mv[-1] - mb.mv[0], len(mb.mv))\n    n = len(mv)\n    sig = np.tile(mv, MEDIAN_TILE_REPEATS)\n    r0 = int(np.argmin(np.abs(t)))\n    rpeaks = np.array([r0 + k * n for k in range(MEDIAN_TILE_REPEATS)])\n    try:\n        _, waves = nk.ecg_delineate(sig, rpeaks={\"ECG_R_Peaks\": rpeaks},\n                                     sampling_rate=fs, method=\"dwt\")\n    except Exception:\n        return None, None, None\n\n    # Copies centrales uniquement (les bords du signal répété sont moins fiables).\n    core = range(2, MEDIAN_TILE_REPEATS - 2)\n\n    def _rel(key: str) -> float | None:\n        idx = waves.get(key)\n        if idx is None:\n            return None\n        vals = []\n        for k in core:\n            v = idx[k] if k < len(idx) else np.nan\n            if v is not None and not np.isnan(v):\n                vals.append((float(v) - rpeaks[k]) / fs)\n        return float(np.median(vals)) if vals else None\n\n    return _rel(\"ECG_P_Onsets\"), _rel(\"ECG_P_Peaks\"), _rel(\"ECG_P_Offsets\")\n", "ecg_hcm/identity.py": "\"\"\"Identité du patient imprimée sur l'ECG : nom, prénom, date de naissance,\ndate et heure de l'ECG, identifiant patient (IPP). Toutes les dates sont\nrendues au format JJ/MM/AAAA, quel que soit le format imprimé.\n\nDonnées nominatives : elles ne servent qu'à relier les résultats au dossier\ndu patient. Elles ne sont jamais utilisées dans les calculs, et l'export ne\nles contient que si on le demande (`include_identity`). Un fichier qui les\ncontient ne doit pas quitter le poste sans l'accord de l'hôpital (RGPD).\n\nFormats lus :\n- GE MUSE 12SL (français) : « NOM, PRÉNOM ID :XXXX 14-déc-2022 10:53:40 » puis\n  « 24-aoû-1976 (46 ans) » sur la ligne suivante.\n- GE CardioSoft (en-tête « Né(e) le: ») : date de naissance seulement.\n- Cardionics : IPP sur la 1re ligne, « NOM    PRÉNOM » sur la 2e (le prénom\n  est séparé par un grand blanc), « Date de naissance: jj/mm/aaaa »,\n  « ECG from jj/mm/aaaa at hh:mm:ss ».\n- Dräger : « ID Patient : », « Nom : NOM,PRÉNOM, », « Date de naissance : »,\n  « Date d'examen : ».\nUn champ absent de l'ECG reste vide (None).\n\"\"\"\nfrom __future__ import annotations\n\nimport re\n\nIDENTITY_COLUMNS: tuple[str, ...] = (\n    \"nom\", \"prenom\", \"prenom_source\", \"date_naissance\", \"date_ecg\", \"heure_ecg\", \"ipp\")\n\n# Abréviations de mois (GE), y compris accents mal encodés dans le PDF\n# (« dØc », « aoß », « fØv ») : on reconnaît le mois par son début.\n_MONTH_PREFIXES = (\n    (\"jan\", 1), (\"f\", 2), (\"mar\", 3), (\"avr\", 4), (\"apr\", 4), (\"mai\", 5),\n    (\"may\", 5), (\"juin\", 6), (\"jun\", 6), (\"juil\", 7), (\"jul\", 7), (\"ao\", 8),\n    (\"aug\", 8), (\"sep\", 9), (\"oct\", 10), (\"nov\", 11), (\"d\", 12),\n)\n\n\ndef _month(token: str) -> int | None:\n    tok = token.lower().strip(\".\")\n    for prefix, num in _MONTH_PREFIXES:\n        if tok.startswith(prefix):\n            return num\n    return None\n\n\ndef _iso_from_dmy(d: str, m: str, y: str) -> str | None:\n    try:\n        day, month, year = int(d), int(m), int(y)\n    except ValueError:\n        return None\n    if not (1 <= day <= 31 and 1 <= month <= 12):\n        return None\n    return \"%02d/%02d/%04d\" % (day, month, year)\n\n\ndef _iso_from_slash(s: str) -> str | None:\n    m = re.match(r\"(\\d{1,2})/(\\d{1,2})/(\\d{4})\", s)\n    return _iso_from_dmy(*m.groups()) if m else None\n\n\ndef _iso_from_ge(s: str) -> str | None:\n    m = re.match(r\"(\\d{1,2})-([^\\s\\-]+)-(\\d{4})\", s)\n    if not m:\n        return None\n    month = _month(m.group(2))\n    return _iso_from_dmy(m.group(1), str(month), m.group(3)) if month else None\n\n\ndef normalize_date(s: str | None) -> str | None:\n    \"\"\"« 14-déc-2022 », « 14-dØc-2022 », « 14/12/2022 » -> « 14/12/2022 ».\"\"\"\n    if not s:\n        return None\n    s = s.strip()\n    return _iso_from_slash(s) or _iso_from_ge(s)\n\n\ndef normalize_datetime(s: str | None) -> str | None:\n    \"\"\"Date (+ heure éventuelle) au format « JJ/MM/AAAA hh:mm:ss ».\"\"\"\n    if not s:\n        return None\n    m = re.match(r\"\\s*(\\S+)(?:\\s+(\\d{1,2}:\\d{2}(?::\\d{2})?))?\", s)\n    if not m:\n        return s\n    d = normalize_date(m.group(1))\n    if d is None:\n        return s\n    return d + (\" \" + m.group(2) if m.group(2) else \"\")\n\n\ndef _clean(s: str | None) -> str | None:\n    if s is None:\n        return None\n    s = s.strip(\" ,;\")\n    return s or None\n\n\ndef _text_lines_from_words(words) -> list[list[dict]]:\n    lines: list[list[dict]] = []\n    for w in sorted(words, key=lambda w: (round(w[\"top\"]), w[\"x0\"])):\n        if lines and abs(lines[-1][0][\"top\"] - w[\"top\"]) < 3:\n            lines[-1].append(w)\n        else:\n            lines.append([w])\n    return [sorted(ln, key=lambda w: w[\"x0\"]) for ln in lines]\n\n\ndef _split_by_gap(line: list[dict], min_gap: float = 15.0) -> list[str]:\n    \"\"\"Regroupe les mots d'une ligne en champs séparés par un grand blanc.\"\"\"\n    fields: list[list[str]] = []\n    prev_x1 = None\n    for w in line:\n        if prev_x1 is None or w[\"x0\"] - prev_x1 > min_gap:\n            fields.append([w[\"text\"]])\n        else:\n            fields[-1].append(w[\"text\"])\n        prev_x1 = w[\"x1\"]\n    return [\" \".join(f) for f in fields]\n\n\ndef _empty() -> dict:\n    return {k: None for k in IDENTITY_COLUMNS}\n\n\ndef _ge(text: str) -> dict:\n    out = _empty()\n    m = re.search(r\"^(.+?),\\s*(.*?)\\s+ID\\s*:\\s*(\\S+)\\s+(\\d{1,2}-\\S+-\\d{4})\"\n                  r\"(?:\\s+(\\d{2}:\\d{2}(?::\\d{2})?))?\", text, re.MULTILINE)\n    if m:\n        out[\"nom\"], out[\"prenom\"] = _clean(m.group(1)), _clean(m.group(2))\n        out[\"ipp\"] = _clean(m.group(3))\n        out[\"date_ecg\"] = _iso_from_ge(m.group(4))\n        out[\"heure_ecg\"] = m.group(5)\n    m = re.search(r\"^(\\d{1,2}-\\S+-\\d{4})\\s*\\(\\s*\\d+\\s*ans\\s*\\)\", text, re.MULTILINE)\n    if m:\n        out[\"date_naissance\"] = _iso_from_ge(m.group(1))\n    m = re.search(r\"N[ée]\\(e\\)\\s*le:\\s*(\\d{1,2}-\\S+-\\d{4})\", text)\n    if m and not out[\"date_naissance\"]:\n        out[\"date_naissance\"] = _iso_from_ge(m.group(1))\n    if not out[\"date_ecg\"]:\n        m = re.search(r\"(\\d{2}-\\S{3,4}-\\d{4})\\s+(\\d{2}:\\d{2}:\\d{2})\", text)\n        if m:\n            out[\"date_ecg\"], out[\"heure_ecg\"] = _iso_from_ge(m.group(1)), m.group(2)\n    if not out[\"ipp\"]:\n        m = re.search(r\"\\bID\\s*:\\s*(\\S+)\", text)\n        if m:\n            out[\"ipp\"] = m.group(1)\n    return out\n\n\ndef _cardionics(page, text: str) -> dict:\n    out = _empty()\n    lines = _text_lines_from_words(page.extract_words()) if page is not None else []\n    if lines and len(lines[0]) == 1 and re.fullmatch(r\"[A-Za-z0-9]+\", lines[0][0][\"text\"]):\n        out[\"ipp\"] = lines[0][0][\"text\"]\n    if len(lines) > 1 and not lines[1][0][\"text\"].startswith(\"Date\"):\n        fields = _split_by_gap(lines[1])\n        out[\"nom\"] = _clean(fields[0]) if fields else None\n        out[\"prenom\"] = _clean(\" \".join(fields[1:])) if len(fields) > 1 else None\n    m = re.search(r\"Date de naissance:\\s*(\\d{1,2}/\\d{1,2}/\\d{4})\", text)\n    if m:\n        out[\"date_naissance\"] = _iso_from_slash(m.group(1))\n    m = re.search(r\"ECG from (\\d{2}/\\d{2}/\\d{4}) at (\\d{2}:\\d{2}:\\d{2})\", text)\n    if m:\n        out[\"date_ecg\"], out[\"heure_ecg\"] = _iso_from_slash(m.group(1)), m.group(2)\n    return out\n\n\ndef _drager(text: str) -> dict:\n    out = _empty()\n    m = re.search(r\"ID Patient\\s*:\\s*(\\S+)\", text)\n    if m:\n        out[\"ipp\"] = m.group(1)\n    m = re.search(r\"Nom\\s*:\\s*([^\\n]*?)(?:\\s{2,}|\\s+Intervalles|\\n|$)\", text)\n    if m:\n        parts = [p.strip() for p in m.group(1).split(\",\") if p.strip()]\n        if parts:\n            out[\"nom\"] = parts[0]\n            out[\"prenom\"] = \" \".join(parts[1:]) or None\n    m = re.search(r\"Date de naissance\\s*:\\s*(\\d{1,2}/\\d{1,2}/\\d{4})\", text)\n    if m:\n        out[\"date_naissance\"] = _iso_from_slash(m.group(1))\n    m = re.search(r\"Date d'examen\\s*:\\s*(\\d{1,2}/\\d{1,2}/\\d{4})\\s+(\\d{2}:\\d{2}(?::\\d{2})?)\", text)\n    if m:\n        out[\"date_ecg\"], out[\"heure_ecg\"] = _iso_from_slash(m.group(1)), m.group(2)\n    return out\n\n\ndef _words(s: str) -> list[str]:\n    return [w for w in re.split(r\"[\\s_,]+\", s) if w]\n\n\ndef fill_from_filename(ident: dict, filename: str) -> dict:\n    \"\"\"Prénom introuvable sur l'ECG -> pris dans le nom du fichier\n    (« NOM PRÉNOM.pdf » ou « NOM_PRÉNOM.pdf »), demande de Benjamin.\n    Si le nom est connu, le prénom est ce qui suit le nom dans le fichier ;\n    sinon le 1er mot du fichier est pris comme nom et le reste comme prénom.\"\"\"\n    out = dict(ident or {})\n    for k in IDENTITY_COLUMNS:\n        out.setdefault(k, None)\n    if out.get(\"prenom\"):\n        out[\"prenom_source\"] = \"ECG\"\n        return out\n    stem = re.sub(r\"\\.pdf$\", \"\", filename, flags=re.IGNORECASE)\n    stem = re.sub(r\"^[0-9a-f]{8}-\", \"\", stem)  # préfixe ajouté par certains envois\n    words = _words(stem)\n    nom_words = _words(out[\"nom\"]) if out.get(\"nom\") else []\n    if nom_words:\n        n = len(nom_words)\n        if [w.lower() for w in words[:n]] == [w.lower() for w in nom_words] and len(words) > n:\n            out[\"prenom\"] = \" \".join(words[n:])\n    elif len(words) >= 2:\n        out[\"nom\"], out[\"prenom\"] = words[0], \" \".join(words[1:])\n    out[\"prenom_source\"] = \"nom du fichier\" if out.get(\"prenom\") else None\n    return out\n\n\ndef extract_identity(page, text: str, vendor: str | None) -> dict:\n    \"\"\"Renvoie {nom, prenom, date_naissance, date_ecg, heure_ecg, ipp} ;\n    dates au format JJ/MM/AAAA. Ne lève jamais d'exception.\"\"\"\n    try:\n        if vendor == \"cardionics\":\n            return _cardionics(page, text)\n        if vendor == \"drager\":\n            return _drager(text)\n        return _ge(text)\n    except Exception:  # noqa: BLE001 - l'identité ne doit jamais faire échouer l'analyse\n        return _empty()\n", "ecg_hcm/loop_morphology.py": "\"\"\"\nloop_morphology.py\n===================\n\nDescripteurs de forme des boucles QRS et T de la VCG dérivée (`vcg.py`),\nvia analyse en composantes principales (SVD) du nuage de points 3D de\nchaque boucle. Inspiré de BRAVEHEART :\n\n> Stabenau HF, Waks JW. \"BRAVEHEART: Open-source software for automated\n> electrocardiographic and vectorcardiographic analysis.\" Comput Methods\n> Programs Biomed. 2023;242:107798.\n> Logiciel MATLAB open-source (GPL-3.0), github.com/BIVectors/BRAVEHEART —\n> utilisé ici comme référence de formules (fichiers `plane_svd.m`,\n> `loop_rotation_dir.m`, `dihedral.m` lus directement), pas comme\n> dépendance ni comme donnée de validation numérique croisée.\n\nPour chaque boucle (nuage de points X,Y,Z centré sur sa moyenne) :\n- SVD du nuage centré -> 3 valeurs singulières S1 >= S2 >= S3, et les 3\n  directions principales associées (Vt).\n- **Rondeur** (`roundness`) = S1 / S2 (= S1 / médiane(S1,S2,S3), les deux\n  formulations étant équivalentes puisque S2 est la médiane) : 1 = boucle\n  circulaire, plus grand = boucle allongée/elliptique.\n- **Planéité** : la 3ᵉ direction principale (associée à S3, la plus petite\n  valeur singulière) est la normale au plan qui approxime le mieux la\n  boucle (\"meilleur plan\"). `planarity_residual` = S3² (variance hors du\n  plan) et `planarity_rmse` = S3/sqrt(N) (écart-type des distances des\n  points au plan, mV) — 0 dans les deux cas = boucle parfaitement plane.\n- **Aire et périmètre** de la boucle *projetée sur son propre meilleur\n  plan* (coordonnées 2D dans la base (V1,V2) du plan), via la formule du\n  lacet (aire) et la somme des distances euclidiennes consécutives\n  (périmètre, boucle fermée).\n- **Orientation du plan** (normale V3) exprimée en azimut/élévation (même\n  convention que `vcg._azimuth_elevation`).\n- **Sens de rotation** dans le plan propre de la boucle (aire signée du\n  lacet) — convention purement géométrique (mathématique, base (V1,V2)\n  arbitraire selon le signe retourné par `np.linalg.svd`) : ce champ\n  indique un sens *cohérent d'un examen à l'autre pour une même boucle*\n  (utile pour repérer un changement chez un même patient/dans une\n  cohorte), mais **ne doit pas être interprété comme \"horaire\" ou\n  \"antihoraire\" au sens anatomique/clinique** sans vérification\n  supplémentaire — la convention de signe de la SVD n'est pas garantie\n  stable indépendamment de l'implémentation.\n\n**Angle dièdre QRS-T** (`dihedral_angle_deg`) : angle entre le plan qui\napproxime le mieux la boucle QRS et celui qui approxime le mieux la boucle\nT (angle entre leurs normales V3, replié dans [0°, 90°] puisqu'un plan n'a\npas d'orientation intrinsèque) — distinct de l'angle QRS-T *vectoriel*\n(`vcg.spatial_qrst_angle_deg` / `qrst_angle_area_deg`), qui compare des\nvecteurs et non des plans.\n\n**Limite générale** : ces descripteurs sont exploratoires, non validés\nspécifiquement en cardiomyopathie hypertrophique (ni dans la littérature\nBRAVEHEART elle-même, qui porte sur des cohortes post-EP/générales — voir\nREADME). Comme pour le reste de la VCG dérivée, la fiabilité individuelle\npatient par patient de la matrice de Kors sous-jacente n'est pas garantie.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nMIN_POINTS_FOR_PLANE = 4  # SVD 3D nécessite au moins 3 points, +1 marge\n\n\n@dataclass\nclass LoopMorphology:\n    n_points: int | None = None\n    s1: float | None = None\n    s2: float | None = None\n    s3: float | None = None\n    roundness: float | None = None\n    planarity_residual_mv2: float | None = None\n    planarity_rmse_mv: float | None = None\n    loop_area_mv2: float | None = None\n    loop_perimeter_mv: float | None = None\n    plane_normal: tuple[float, float, float] | None = None\n    plane_azimuth_deg: float | None = None\n    plane_elevation_deg: float | None = None\n    rotation_signed_area_mv2: float | None = None\n    rotation_direction: str | None = None  # \"sens 1\" | \"sens 2\" | None — cf. docstring\n\n\ndef _azimuth_elevation(vec: tuple[float, float, float]) -> tuple[float, float]:\n    \"\"\"Même convention que vcg._azimuth_elevation (dupliquée ici pour\n    éviter une dépendance circulaire — les deux modules restent\n    indépendants).\"\"\"\n    mag = float(np.sqrt(sum(c ** 2 for c in vec)))\n    if mag <= 1e-9:\n        return 0.0, 0.0\n    az = float(np.degrees(np.arctan2(vec[0], -vec[2])))\n    horiz = float(np.sqrt(vec[0] ** 2 + vec[2] ** 2))\n    elev = float(np.degrees(np.arctan2(-vec[1], horiz)))\n    return az, elev\n\n\ndef compute_loop(x: np.ndarray, y: np.ndarray, z: np.ndarray,\n                  mask: np.ndarray) -> LoopMorphology:\n    \"\"\"Analyse SVD d'une boucle (QRS ou T) donnée par un masque temporel.\"\"\"\n    idx = np.where(mask)[0]\n    n = len(idx)\n    if n < MIN_POINTS_FOR_PLANE:\n        return LoopMorphology(n_points=n)\n\n    pts = np.stack([x[idx], y[idx], z[idx]], axis=1)  # (n, 3), ordre temporel préservé\n    centroid = pts.mean(axis=0)\n    centered = pts - centroid\n\n    try:\n        _, s, vt = np.linalg.svd(centered, full_matrices=False)\n    except np.linalg.LinAlgError:\n        return LoopMorphology(n_points=n)\n\n    s1, s2, s3 = float(s[0]), float(s[1]), float(s[2])\n    roundness = (s1 / s2) if s2 > 1e-9 else None\n    planarity_residual = s3 ** 2\n    planarity_rmse = s3 / np.sqrt(n)\n\n    # Coordonnées 2D dans le plan propre (base V1, V2 = 2 premières lignes de vt)\n    v1, v2, v3 = vt[0], vt[1], vt[2]\n    u = centered @ v1\n    v = centered @ v2\n\n    # Aire (lacet) et périmètre (boucle fermée, ordre temporel)\n    area_signed = 0.5 * float(np.sum(u * np.roll(v, -1) - np.roll(u, -1) * v))\n    loop_area = abs(area_signed)\n    du = np.roll(u, -1) - u\n    dv = np.roll(v, -1) - v\n    perimeter = float(np.sum(np.sqrt(du ** 2 + dv ** 2)))\n\n    normal = (float(v3[0]), float(v3[1]), float(v3[2]))\n    plane_az, plane_elev = _azimuth_elevation(normal)\n\n    rotation_dir = None\n    if abs(area_signed) > 1e-9:\n        rotation_dir = \"sens 1\" if area_signed > 0 else \"sens 2\"\n\n    return LoopMorphology(\n        n_points=n, s1=s1, s2=s2, s3=s3, roundness=roundness,\n        planarity_residual_mv2=planarity_residual, planarity_rmse_mv=planarity_rmse,\n        loop_area_mv2=loop_area, loop_perimeter_mv=perimeter,\n        plane_normal=normal, plane_azimuth_deg=plane_az, plane_elevation_deg=plane_elev,\n        rotation_signed_area_mv2=area_signed, rotation_direction=rotation_dir,\n    )\n\n\n@dataclass\nclass LoopMorphologyResult:\n    qrs: LoopMorphology\n    t: LoopMorphology\n    dihedral_angle_deg: float | None = None\n    warnings: list = None  # type: ignore[assignment]\n\n    def __post_init__(self):\n        if self.warnings is None:\n            self.warnings = []\n\n\ndef compute(x: np.ndarray, y: np.ndarray, z: np.ndarray,\n            in_qrs: np.ndarray, t_win: np.ndarray) -> LoopMorphologyResult:\n    warnings: list[str] = []\n    qrs_morph = compute_loop(x, y, z, in_qrs)\n    t_morph = compute_loop(x, y, z, t_win)\n\n    if qrs_morph.n_points is not None and qrs_morph.n_points < MIN_POINTS_FOR_PLANE:\n        warnings.append(\"Morphologie de la boucle QRS non calculable (fenêtre QRS trop étroite).\")\n    if t_morph.n_points is not None and t_morph.n_points < MIN_POINTS_FOR_PLANE:\n        warnings.append(\"Morphologie de la boucle T non calculable (fenêtre T introuvable).\")\n\n    dihedral = None\n    if qrs_morph.plane_normal is not None and t_morph.plane_normal is not None:\n        n1 = np.array(qrs_morph.plane_normal)\n        n2 = np.array(t_morph.plane_normal)\n        cos_a = abs(float(np.dot(n1, n2)))  # valeur absolue : un plan n'a pas de sens propre\n        cos_a = float(np.clip(cos_a, -1.0, 1.0))\n        dihedral = float(np.degrees(np.arccos(cos_a)))\n\n    return LoopMorphologyResult(qrs=qrs_morph, t=t_morph, dihedral_angle_deg=dihedral,\n                                 warnings=warnings)\n", "ecg_hcm/p_wave_features.py": "\"\"\"\np_wave_features.py\n===================\n\nIndices dérivés de l'onde P, pertinents pour l'atteinte auriculaire gauche\n(fréquente en CMH, notamment en amont ou en association avec la\nfibrillation atriale) et pour la conduction atrio-ventriculaire.\n\n- **PTFV1** (P-wave terminal force en V1, indice de Morris) : profondeur\n  (mm) x durée (ms) de la composante négative TERMINALE de l'onde P en V1\n  (biphasique : composante initiale positive = oreillette droite,\n  composante terminale négative = oreillette gauche). Anormal si\n  >= 40 mm.ms (= 0.04 mm.s, seuil classique — Morris et al., et repris\n  dans les méta-analyses récentes, cf. README).\n\n  Nécessite la délinéation de l'onde P (NeuroKit2/DWT) sur la dérivation\n  V1 — non disponible avec le repli tangente (qui ne délinée que l'onde\n  T), donc PTFV1 est `None` si NeuroKit2 n'est pas installé ou si la\n  délinéation de l'onde P échoue sur ce tracé.\n\n  Limite assumée : la position de l'électrode V1 influence fortement cette\n  mesure (une électrode placée trop haut peut créer une fausse composante\n  négative) — information non vérifiable depuis le PDF, à garder à\n  l'esprit en cas de valeur positive isolée sans contexte clinique\n  concordant.\n\n- **Intervalle PR remesuré** (`pr_ms_measured`) : début de l'onde P ->\n  début du QRS, par dérivation (`d.qrs_onset_s - d.p_onset_s`, même\n  convention temporelle relative au pic R que `delineation.py`). Depuis\n  0.11.7 (demande de Benjamin), la valeur retenue est celle de la\n  dérivation où l'onde P et le début du QRS sont les mieux visibles\n  (`pr_lead`, score `_pr_visibility_score`), choisie parmi les dérivations\n  concordantes (à <= `PR_CONSENSUS_MS` de la médiane). La médiane des\n  dérivations plausibles reste fournie comme contrôle (`pr_ms_median`). Même logique de garde-fou de plausibilité que le QT par\n  dérivation (`repolarization_features.py`) : une valeur bornée\n  physiologiquement (`MIN_PR_MS`-`MAX_PR_MS`) et, quand le PR de l'en-tête\n  PDF (`pr_ms`) est disponible, à moins de `MAX_REL_DEVIATION` de celui-ci\n  — sinon la dérivation est écartée (`pr_excluded_leads`) plutôt que\n  d'alimenter silencieusement un résultat aberrant.\n\n  Nécessite elle aussi la délinéation de l'onde P par NeuroKit2/DWT (le\n  repli tangente ne délinée pas l'onde P) : `pr_ms_measured` est `None` si\n  NeuroKit2 est indisponible, ou si moins de deux dérivations produisent\n  une mesure plausible (une seule dérivation n'est pas jugée suffisamment\n  fiable pour porter la valeur \"mesurée\" à elle seule).\n\n  Fiabilité (0.16.10, ECG scannés) : `pr_n_concordant` = nombre de\n  dérivations à <= `PR_CONSENSUS_MS` de la médiane, `pr_spread_ms` =\n  écart interquartile des PR retenus, `pr_reliability` = « bonne »,\n  « moyenne » ou « faible » selon la part des dérivations délinéées qui\n  concordent. Seul un PR « bonne » est rendu : en « moyenne » ou « faible »,\n  aucune valeur de PR n'est rendue\n  (`pr_ms_measured`, `pr_ms_median` et `pr_ms_by_lead` vides, demande de\n  Benjamin du 23/10/2026) plutôt qu'une valeur fausse reprise par erreur.\n  ECG scannés (0.16.11) : le PR mesuré n'est rendu que s'il est à\n  <= `SCAN_PR_MAX_DIFF_MS` du PR imprimé par l'appareil ; sans PR de\n  l'appareil, il n'est pas rendu ; si le JSON indique « \"pr_ms\": null »\n  (FA, rythme électro-entraîné ou indéterminé), ni PR ni PTFV1.\n  Quand l'onde P a été délinéée sur le tracé, le PR est aussi calculé sur\n  le battement médian de chaque dérivation, et le jeu de dérivations le\n  plus concordant est retenu : sur un scan bruité, la délinéation sur le\n  tracé peut placer le début de P trop tard dans la moitié des dérivations\n  (CORNIL, 23/10/2026 : 116 ms sur le tracé contre 192 ms concordants sur\n  11 dérivations en battement médian).\n\n  À ne pas confondre avec `pr_ms` (valeur imprimée par l'appareil, lue\n  dans l'en-tête du PDF) — cette dernière reste la référence à préférer en\n  général ; `pr_ms_measured` sert avant tout de contrôle qualité et de\n  secours quand l'en-tête n'a pas pu être lu.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field, replace\n\nimport numpy as np\n\nfrom .beat_detection import MedianBeat\nfrom .delineation import LeadDelineation, delineate_p_on_median\n\nPTFV1_THRESHOLD_MM_MS = 40.0  # = 0.04 mm.s (indice de Morris)\nMM_PER_MV = 10.0  # calibration standard\n\n# Garde-fous de plausibilité pour l'intervalle PR remesuré, même principe\n# que MAX_REL_DEVIATION dans repolarization_features.py.\nMIN_PR_MS = 80.0    # en-dessous : quasi certainement un artefact de délinéation\nMAX_PR_MS = 400.0   # au-dessus : au-delà même d'un BAV1 marqué, probablement un artefact\nMAX_REL_DEVIATION = 0.25  # 25% d'écart toléré vs. PR de l'en-tête avant exclusion\nMIN_VALID_LEADS_FOR_PR = 2  # nombre minimal de dérivations plausibles pour agréger\nPR_CONSENSUS_MS = 20.0  # dérivation candidate si son PR est à <= 20 ms de la médiane\n# Fiabilité : part des dérivations délinéées dont le PR concorde avec la médiane.\nPR_RELIABLE_FRACTION = 2 / 3  # et au moins PR_RELIABLE_MIN_LEADS dérivations -> « bonne »\nPR_RELIABLE_MIN_LEADS = 6\nPR_FAIR_FRACTION = 0.5  # et au moins 3 dérivations -> « moyenne » ; sinon « faible »\nPR_FAIR_MIN_LEADS = 3\n# ECG scannés : PR mesuré rendu seulement s'il est à <= 20 ms du PR imprimé\n# par l'appareil (sur 47 scans GE, 9 PR étaient trop courts de 30 à 86 ms\n# sans qu'aucun avertissement ne le signale).\nSCAN_PR_MAX_DIFF_MS = 20.0\n\n\n@dataclass\nclass PWaveFeatures:\n    ptfv1_mm_ms: float | None = None\n    ptfv1_positive: bool | None = None\n    ptfv1_terminal_depth_mv: float | None = None\n    ptfv1_terminal_duration_ms: float | None = None\n    pr_ms_measured: float | None = None\n    pr_ms_by_lead: dict[str, float] = field(default_factory=dict)\n    pr_excluded_leads: list[str] = field(default_factory=list)\n    pr_method: str | None = None  # \"signal\" (DWT sur le tracé) | \"battement médian\" | \"mixte\"\n    pr_lead: str | None = None  # dérivation retenue pour pr_ms_measured\n    pr_ms_median: float | None = None  # médiane des dérivations plausibles (contrôle)\n    pr_lead_scores: dict[str, float] = field(default_factory=dict)\n    pr_n_concordant: int | None = None  # dérivations à <= PR_CONSENSUS_MS de la médiane\n    pr_n_delineated: int | None = None  # dérivations où un PR a pu être calculé\n    pr_spread_ms: float | None = None  # écart interquartile des PR retenus\n    pr_reliability: str | None = None  # \"bonne\" | \"moyenne\" | \"faible\"\n    warnings: list[str] = field(default_factory=list)\n\n\ndef _terminal_negative_component(mb: MedianBeat, p_onset_s: float, p_offset_s: float\n                                  ) -> tuple[float, float] | None:\n    \"\"\"Repère la composante négative TERMINALE de l'onde P (celle qui se\n    termine à/près de `p_offset_s`), et retourne (profondeur_mV, durée_ms).\n    Retourne None si l'onde P ne se termine pas par une déflexion négative\n    (pas de composante terminale à mesurer).\"\"\"\n    t = mb.t_rel\n    win = (t >= p_onset_s) & (t <= p_offset_s)\n    idx = np.where(win)[0]\n    if len(idx) < 3:\n        return None\n    t_p = t[idx]\n    mv_p = mb.mv[idx]\n\n    if mv_p[-1] >= 0:\n        return None  # l'onde P ne se termine pas en négatif\n\n    neg = mv_p < 0\n    j = len(mv_p) - 1\n    while j > 0 and neg[j - 1]:\n        j -= 1\n    if j >= len(mv_p) - 1:\n        return None  # segment terminal négatif trop court pour être mesuré\n\n    terminal_mv = mv_p[j:]\n    terminal_t = t_p[j:]\n    depth_mv = float(terminal_mv.min())\n    duration_ms = float(terminal_t[-1] - terminal_t[0]) * 1000\n    if duration_ms <= 0:\n        return None\n    return depth_mv, duration_ms\n\n\ndef _compute_ptfv1(feats: PWaveFeatures, median_beats: dict[str, MedianBeat],\n                    per_lead_delineation: dict[str, LeadDelineation]) -> None:\n    d = per_lead_delineation.get(\"V1\")\n    mb = median_beats.get(\"V1\")\n    if d is None or mb is None or d.p_onset_s is None or d.p_offset_s is None:\n        return\n    if not (d.p_offset_s > d.p_onset_s):\n        return\n\n    result = _terminal_negative_component(mb, d.p_onset_s, d.p_offset_s)\n    if result is None:\n        # Pas de composante négative terminale détectée : PTFV1 non\n        # applicable (on ne rapporte pas 0, qui laisserait croire à une\n        # mesure \"normale\" alors qu'il n'y a simplement rien à mesurer).\n        return\n\n    depth_mv, duration_ms = result\n    feats.ptfv1_terminal_depth_mv = depth_mv\n    feats.ptfv1_terminal_duration_ms = duration_ms\n    feats.ptfv1_mm_ms = abs(depth_mv) * MM_PER_MV * duration_ms\n    feats.ptfv1_positive = feats.ptfv1_mm_ms >= PTFV1_THRESHOLD_MM_MS\n\n\ndef _fill_p_from_median_beats(median_beats: dict[str, MedianBeat],\n                              per_lead_delineation: dict[str, LeadDelineation],\n                              qrs_onset_s: float | None) -> set[str]:\n    \"\"\"Complète l'onde P des dérivations où la délinéation sur le tracé ne l'a\n    pas trouvée, par délinéation du battement médian répété\n    (`delineation.delineate_p_on_median`). Le début du QRS utilisé est alors\n    le début global du battement médian (`beat.qrs_onset_s`). Retourne les\n    dérivations ainsi complétées.\"\"\"\n    filled = set()\n    for lead, mb in median_beats.items():\n        d = per_lead_delineation.get(lead)\n        if d is None or d.p_onset_s is not None:\n            continue\n        p_on, p_pk, p_off = delineate_p_on_median(mb)\n        if p_on is None:\n            continue\n        d.p_onset_s, d.p_peak_s, d.p_offset_s = p_on, p_pk, p_off\n        if qrs_onset_s is not None:\n            d.qrs_onset_s = qrs_onset_s\n        filled.add(lead)\n    return filled\n\n\ndef _pr_visibility_score(mb: MedianBeat | None, d: LeadDelineation) -> float:\n    \"\"\"Lisibilité du PR dans une dérivation, comme on choisit la dérivation à\n    la main : amplitude de l'onde P rapportée au bruit du tracé, multipliée\n    par la netteté du début du QRS (pente des 20 ms suivant son début,\n    rapportée au même bruit). Le bruit est estimé sur les variations rapides\n    du segment avant le QRS, indépendamment de la position du début de P.\n    0 si non calculable.\"\"\"\n    if mb is None or d.p_onset_s is None or d.p_peak_s is None or d.qrs_onset_s is None:\n        return 0.0\n    t, v = mb.t_rel, mb.mv\n    if len(t) < 10:\n        return 0.0\n    dt = float(np.median(np.diff(t)))\n    pre = v[t < d.qrs_onset_s]\n    if dt <= 0 or len(pre) < 10:\n        return 0.0\n    dv = np.diff(pre)\n    noise = max(1.4826 * float(np.median(np.abs(dv - np.median(dv)))) / np.sqrt(2), 0.003)\n    p_amp = abs(float(np.interp(d.p_peak_s, t, v)) - float(np.interp(d.p_onset_s, t, v)))\n    q = (t >= d.qrs_onset_s) & (t <= d.qrs_onset_s + 0.02)\n    if q.sum() < 2:\n        return 0.0\n    qrs_rise = float(np.ptp(v[q]))\n    return (p_amp / noise) * (qrs_rise / noise) ** 0.5\n\n\ndef _compute_pr_interval(feats: PWaveFeatures,\n                          per_lead_delineation: dict[str, LeadDelineation],\n                          pr_header_ms: float | None,\n                          median_beats: dict[str, MedianBeat] | None = None) -> None:\n    \"\"\"Intervalle PR par dérivation (début P -> début QRS), valeur retenue\n    sur la dérivation la plus lisible — voir docstring du module. Sans PR\n    d'en-tête, la référence de plausibilité (+/- 25 %) est la médiane brute\n    des PR par dérivation (au moins 3), comme pour le QT.\"\"\"\n    median_beats = median_beats or {}\n    raw: dict[str, float] = {}\n    for lead, d in per_lead_delineation.items():\n        if d.p_onset_s is None or d.qrs_onset_s is None:\n            continue  # pas de délinéation P pour cette dérivation\n        pr_ms = (d.qrs_onset_s - d.p_onset_s) * 1000\n        if not (MIN_PR_MS <= pr_ms <= MAX_PR_MS):\n            feats.pr_excluded_leads.append(lead)\n            continue\n        raw[lead] = pr_ms\n    reference = pr_header_ms\n    if not reference and len(raw) >= 3:\n        reference = float(np.median(list(raw.values())))\n    for lead, pr_ms in raw.items():\n        if reference and abs(pr_ms - reference) / reference > MAX_REL_DEVIATION:\n            feats.pr_excluded_leads.append(lead)\n            continue\n        feats.pr_ms_by_lead[lead] = pr_ms\n\n    if len(feats.pr_ms_by_lead) >= MIN_VALID_LEADS_FOR_PR:\n        feats.pr_ms_median = float(np.median(list(feats.pr_ms_by_lead.values())))\n        # Candidates : dérivations concordantes avec la médiane (une\n        # délinéation isolée aberrante ne peut pas être retenue), puis la\n        # plus lisible d'entre elles.\n        feats.pr_lead_scores = {\n            ld: _pr_visibility_score(median_beats.get(ld), per_lead_delineation[ld])\n            for ld, pr in feats.pr_ms_by_lead.items()\n            if abs(pr - feats.pr_ms_median) <= PR_CONSENSUS_MS}\n        if not feats.pr_lead_scores:  # aucune dérivation concordante : on les prend toutes\n            feats.pr_lead_scores = {\n                ld: _pr_visibility_score(median_beats.get(ld), per_lead_delineation[ld])\n                for ld in feats.pr_ms_by_lead}\n        best = max(feats.pr_lead_scores, key=feats.pr_lead_scores.get)\n        if feats.pr_lead_scores[best] > 0:\n            feats.pr_lead = best\n            feats.pr_ms_measured = feats.pr_ms_by_lead[best]\n        else:\n            feats.pr_ms_measured = feats.pr_ms_median\n\n    _rate_pr(feats)\n    if feats.pr_excluded_leads:\n        feats.warnings.append(\n            \"PR écarté (jugé non plausible, hors [%.0f, %.0f] ms ou > %.0f%% de \"\n            \"différence avec le PR de référence) pour : %s.\"\n            % (MIN_PR_MS, MAX_PR_MS, MAX_REL_DEVIATION * 100,\n               \", \".join(feats.pr_excluded_leads))\n        )\n\n\n_PR_FIELDS = (\"pr_ms_measured\", \"pr_ms_by_lead\", \"pr_excluded_leads\", \"pr_lead\",\n              \"pr_ms_median\", \"pr_lead_scores\", \"pr_n_concordant\", \"pr_n_delineated\",\n              \"pr_spread_ms\", \"pr_reliability\")\n\n\ndef _fmt_ms(v: float | None) -> str:\n    return \"%.0f ms\" % v if v is not None else \"n.d.\"\n\n\ndef _rate_pr(feats: PWaveFeatures) -> None:\n    \"\"\"Fiabilité du PR d'après la concordance entre dérivations.\"\"\"\n    n_del = len(feats.pr_ms_by_lead) + len(set(feats.pr_excluded_leads))\n    feats.pr_n_delineated = n_del\n    if feats.pr_ms_median is None or not n_del:\n        feats.pr_n_concordant = 0 if n_del else None\n        feats.pr_reliability = \"faible\" if n_del else None\n        return\n    prs = np.array(list(feats.pr_ms_by_lead.values()))\n    n_conc = int(np.sum(np.abs(prs - feats.pr_ms_median) <= PR_CONSENSUS_MS))\n    feats.pr_n_concordant = n_conc\n    q1, q3 = np.percentile(prs, [25, 75])\n    feats.pr_spread_ms = float(q3 - q1)\n    frac = n_conc / n_del\n    if n_conc >= PR_RELIABLE_MIN_LEADS and frac >= PR_RELIABLE_FRACTION:\n        feats.pr_reliability = \"bonne\"\n    elif n_conc >= PR_FAIR_MIN_LEADS and frac >= PR_FAIR_FRACTION:\n        feats.pr_reliability = \"moyenne\"\n    else:\n        feats.pr_reliability = \"faible\"\n\n\ndef _pr_rank(feats: PWaveFeatures) -> tuple:\n    order = {\"bonne\": 2, \"moyenne\": 1, \"faible\": 0, None: -1}\n    return (order[feats.pr_reliability], feats.pr_n_concordant or 0,\n            -(feats.pr_spread_ms if feats.pr_spread_ms is not None else 1e9))\n\n\ndef _pr_on_median_beats(median_beats: dict[str, MedianBeat],\n                        per_lead_delineation: dict[str, LeadDelineation],\n                        qrs_onset_s: float | None, pr_header_ms: float | None\n                        ) -> tuple[PWaveFeatures, dict[str, LeadDelineation]]:\n    \"\"\"PR avec l'onde P délinéée sur le battement médian de toutes les\n    dérivations (au lieu du tracé), pour comparaison.\"\"\"\n    alt_delin: dict[str, LeadDelineation] = {}\n    for lead, d in per_lead_delineation.items():\n        mb = median_beats.get(lead)\n        if mb is None:\n            continue\n        p_on, p_pk, p_off = delineate_p_on_median(mb)\n        if p_on is None:\n            continue\n        alt_delin[lead] = replace(d, p_onset_s=p_on, p_peak_s=p_pk, p_offset_s=p_off,\n                                  qrs_onset_s=qrs_onset_s if qrs_onset_s is not None\n                                  else d.qrs_onset_s)\n    alt = PWaveFeatures()\n    _compute_pr_interval(alt, alt_delin, pr_header_ms, median_beats)\n    return alt, alt_delin\n\n\ndef _drop_pr(feats: PWaveFeatures, reason: str, p_wave_too: bool = False) -> None:\n    \"\"\"Retire toute valeur de PR (et, si demandé, les mesures de l'onde P).\"\"\"\n    feats.pr_ms_measured = None\n    feats.pr_lead = None\n    feats.pr_ms_median = None\n    feats.pr_spread_ms = None\n    feats.pr_ms_by_lead = {}\n    feats.pr_lead_scores = {}\n    feats.pr_method = None\n    if p_wave_too:\n        feats.ptfv1_mm_ms = None\n        feats.ptfv1_positive = None\n        feats.ptfv1_terminal_depth_mv = None\n        feats.ptfv1_terminal_duration_ms = None\n    feats.warnings.append(reason)\n\n\ndef compute(median_beats: dict[str, MedianBeat],\n            per_lead_delineation: dict[str, LeadDelineation],\n            pr_header_ms: float | None = None,\n            qrs_onset_s: float | None = None,\n            is_scan: bool = False,\n            pr_absent_on_device: bool = False,\n            device_rhythm: str | None = None) -> PWaveFeatures:\n    feats = _compute(median_beats, per_lead_delineation, pr_header_ms, qrs_onset_s)\n    if pr_absent_on_device:\n        _drop_pr(feats, \"PR et onde P non rendus : l'appareil n'indique pas de PR%s.\"\n                 % (\" (rythme : %s)\" % device_rhythm if device_rhythm else \"\"), p_wave_too=True)\n    elif is_scan and not pr_header_ms:\n        if feats.pr_ms_measured is not None:\n            _drop_pr(feats, \"PR mesuré non rendu : ECG scanné sans PR de l'appareil pour \"\n                            \"le contrôler — à mesurer sur le papier.\")\n    elif (is_scan and feats.pr_ms_measured is not None\n          and abs(feats.pr_ms_measured - pr_header_ms) > SCAN_PR_MAX_DIFF_MS):\n        _drop_pr(feats, \"PR mesuré non rendu : %.0f ms contre %.0f ms imprimés par l'appareil \"\n                        \"(écart > %.0f ms) — utiliser le PR de l'appareil.\"\n                 % (feats.pr_ms_measured, pr_header_ms, SCAN_PR_MAX_DIFF_MS))\n    return feats\n\n\ndef _compute(median_beats: dict[str, MedianBeat],\n             per_lead_delineation: dict[str, LeadDelineation],\n             pr_header_ms: float | None,\n             qrs_onset_s: float | None) -> PWaveFeatures:\n    feats = PWaveFeatures()\n    from_signal = {ld for ld, d in per_lead_delineation.items() if d.p_onset_s is not None}\n    from_median = _fill_p_from_median_beats(median_beats, per_lead_delineation, qrs_onset_s)\n    _compute_ptfv1(feats, median_beats, per_lead_delineation)\n    _compute_pr_interval(feats, per_lead_delineation, pr_header_ms, median_beats)\n    used = set(feats.pr_ms_by_lead)\n    if used & from_signal:\n        alt, alt_delin = _pr_on_median_beats(median_beats, per_lead_delineation,\n                                             qrs_onset_s, pr_header_ms)\n        if _pr_rank(alt) > _pr_rank(feats):\n            signal_summary = (\"%s, %d/%d dérivations concordantes\"\n                              % (_fmt_ms(feats.pr_ms_measured), feats.pr_n_concordant or 0,\n                                 feats.pr_n_delineated or 0))\n            for name in _PR_FIELDS:\n                setattr(feats, name, getattr(alt, name))\n            feats.warnings = [w for w in feats.warnings if not w.startswith(\"PR écarté\")]\n            feats.warnings += alt.warnings\n            feats.warnings.append(\n                \"PR mesuré sur le battement médian, plus concordant entre dérivations \"\n                \"que la mesure sur le tracé (%s).\" % signal_summary)\n            from_signal, from_median = set(), set()\n            feats.pr_method = \"battement médian\"\n            used = set()\n    if feats.pr_reliability != \"bonne\" and feats.pr_ms_by_lead:\n        # Aucune valeur de PR ne sort (ni médiane, ni PR par dérivation) : elle\n        # pourrait être reprise par erreur dans un export.\n        _drop_pr(feats,\n                 \"PR non rendu (fiabilité %s) : les dérivations ne concordent pas assez \"\n                 \"(%d/%d à ±%.0f ms de la médiane) — à mesurer sur le papier.\"\n                 % (feats.pr_reliability, feats.pr_n_concordant or 0,\n                    feats.pr_n_delineated or 0, PR_CONSENSUS_MS))\n        used = set()\n    if used:  # (vide si le battement médian a remplacé le tracé : méthode déjà fixée)\n        if used <= from_signal:\n            feats.pr_method = \"signal\"\n        elif used <= from_median:\n            feats.pr_method = \"battement médian\"\n        else:\n            feats.pr_method = \"mixte\"\n    if from_median:\n        feats.warnings.append(\n            \"Onde P délinéée sur le battement médian répété (la délinéation sur le \"\n            \"tracé a échoué) pour : %s — PR et PTFV1 approximatifs, PR > ~230 ms \"\n            \"non mesurable par cette voie.\" % \", \".join(sorted(from_median)))\n    return feats\n", "ecg_hcm/pdf_parser.py": "\"\"\"\npdf_parser.py\n=============\n\nExtraction bas-niveau d'un PDF ECG 12 dérivations \"vectoriel\" (tracé dessiné\nsous forme de chemins PDF, pas une image scannée) vers des structures Python\nexploitables : texte d'en-tête, courbes de signal brutes, impulsions\nd'étalonnage.\n\nLe format cible a été identifié à partir d'un exemple réel (export GE\nCardioSoft/MUSE, layout 6 lignes x 2 colonnes + bande rythme pleine largeur,\napparaissant comme \"PH100B\" dans l'en-tête). Le code essaie de rester\ngénérique (appariement des dérivations par leur libellé textuel plutôt que\npar un ordre codé en dur), mais n'a été validé que sur ce format. Un PDF\nd'un autre constructeur (Philips, Schiller, Mortara...) peut nécessiter des\najustements, en particulier si le tracé y est une image plutôt qu'un vrai\nchemin vectoriel.\n\nConvention de coordonnées\n--------------------------\nOn utilise le système \"top-down\" de pdfplumber (origine en haut à gauche,\ny croissant vers le bas), cohérent entre `chars`/`words` et `curves`\n(attributs `pts`, `top`, `bottom`). On n'utilise PAS x0/y0/x1/y1 des courbes\npour les points eux-mêmes (ils sont exprimés dans le repère PDF natif\norigine-en-bas et ne correspondent pas à `pts`) ; x0/x1 restent valables\npour les largeurs (abscisses).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nimport statistics\nfrom dataclasses import dataclass, field\n\nimport pdfplumber\n\nSTANDARD_LEADS = [\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\",\n                   \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\"]\n\n# Nombre minimal de points pour qu'une \"curve\" pdfplumber soit considérée\n# comme un tracé de signal plutôt qu'une impulsion d'étalonnage ou un\n# artefact graphique.\nMIN_SIGNAL_PTS = 100\n\n\ndef _curve_row_position(c) -> float:\n    \"\"\"Position verticale ROBUSTE d'une courbe, utilisée pour l'apparier à\n    la bonne ligne de la grille (donc au bon libellé de dérivation).\n\n    On utilise la MÉDIANE des ordonnées de tous les points du tracé, PAS\n    `c[\"top\"]` (le bord supérieur de sa boîte englobante). Constaté sur un\n    cas réel : certains tracés contiennent une poignée de points parasites\n    très excentrés verticalement (cause probable : un élément graphique du\n    PDF — p. ex. un repère — fusionné par erreur avec le chemin vectoriel\n    du signal), qui n'affectent quasiment pas la médiane (le tracé \"vit\"\n    à >95% autour de sa vraie ligne de base) mais déplacent fortement le\n    bord de la boîte englobante. Avec `c[\"top\"]` comme clé de tri, un seul\n    tracé ainsi affecté peut se retrouver trié AVANT des tracés qui lui\n    sont normalement supérieurs sur la page, décalant l'appariement\n    tracé<->libellé de un cran pour toutes les dérivations suivantes de la\n    colonne (observé : V1/V2/V3 permutées circulairement sur un cas réel,\n    alors que V4/V5/V6 restaient correctes). La médiane est insensible à\n    une minorité de points aberrants (jusqu'à ~50% du total), donc bien\n    plus fiable ici que le extrema de la boîte englobante.\"\"\"\n    ys = [pt[1] for pt in c[\"pts\"]]\n    return statistics.median(ys) if ys else 0.0\n\n\n@dataclass\nclass RawTrace:\n    \"\"\"Un tracé (chemin vectoriel) associé (ou non encore) à une dérivation.\"\"\"\n    lead: str | None\n    pts: list[tuple[float, float]]  # (x, y) en points PDF, repère top-down\n    x0: float\n    x1: float\n    top: float\n    bottom: float\n    is_full_width: bool = False\n    label_top: float = 0.0  # position verticale STABLE du libellé texte (I, V1...),\n                             # non déformée par l'amplitude du signal ; sert de\n                             # référence pour associer les impulsions d'étalonnage.\n    time_origin_x: float | None = None  # abscisse du temps 0 quand les colonnes de la\n                                         # grille sont successives dans le temps (ex.\n                                         # Cardionics 3x4) ; None = début du tracé.\n\n\n@dataclass\nclass CalibPulse:\n    lead: str | None\n    top: float\n    bottom: float\n    x0: float\n    x1: float\n    height_pt: float  # amplitude de l'impulsion en points PDF\n\n\n@dataclass\nclass ParsedECGPage:\n    header_text: str\n    metadata: dict = field(default_factory=dict)\n    traces: dict[str, RawTrace] = field(default_factory=dict)\n    calib_pulses: dict[str, CalibPulse] = field(default_factory=dict)\n    page_width: float = 0.0\n    page_height: float = 0.0\n    warnings: list[str] = field(default_factory=list)\n    # Nom, prénom, date de naissance, date de l'ECG, IPP (cf. identity.py) ;\n    # gardés à part des métadonnées pour ne jamais entrer dans les calculs.\n    identity: dict = field(default_factory=dict)\n\n\ndef _parse_header_metadata(text: str) -> dict:\n    \"\"\"Extrait les champs numériques/calibration de l'en-tête imprimé.\n\n    NB: on n'extrait délibérément PAS le nom du patient dans les métadonnées\n    retournées par défaut (voir `include_identity`), pour éviter de trimbaler\n    des données nominatives au-delà de ce qui est nécessaire au calcul.\n    \"\"\"\n    meta: dict = {}\n\n    def _num(pattern, cast=float):\n        m = re.search(pattern, text)\n        if m:\n            try:\n                return cast(m.group(1))\n            except ValueError:\n                return None\n        return None\n\n    meta[\"heart_rate_bpm\"] = _num(r\"\\bFC\\s+(\\d+)\")\n    meta[\"pr_ms\"] = _num(r\"\\bPR\\s+(\\d+)\")\n    meta[\"qrs_duration_ms\"] = _num(r\"\\bQRSd\\s+(\\d+)\")\n    meta[\"qt_ms\"] = _num(r\"\\bQT\\s+(\\d+)\\b\")\n    meta[\"qtc_ms\"] = _num(r\"\\bQTc\\s+(\\d+)\")\n    m = re.search(r\"--AXE--\\s*P\\s+(-?\\d+)\\s*QRS\\s+(-?\\d+)\\s*T\\s+(-?\\d+)\", text.replace(\"\\n\", \" \"))\n    if m:\n        meta[\"axis_p_deg\"] = int(m.group(1))\n        meta[\"axis_qrs_deg\"] = int(m.group(2))\n        meta[\"axis_t_deg\"] = int(m.group(3))\n\n    # Variante GE MUSE 12SL en français (« Fréq. vent. », « Durée QRS »,\n    # « QT/QTc 430/384 ms », « Axes P-R-T ») ; les accents sont parfois mal\n    # encodés dans le PDF (« DurØe », « FrØq. »), d'où les \\S{1,2}.\n    if meta[\"heart_rate_bpm\"] is None:\n        meta[\"heart_rate_bpm\"] = _num(r\"Fr\\S{1,2}q\\.\\s*vent\\.\\s*(\\d+)\\s*bpm\")\n    if meta[\"pr_ms\"] is None:\n        meta[\"pr_ms\"] = _num(r\"Intervalle\\s+PR\\s+(\\d+)\\s*ms\")\n    if meta[\"qrs_duration_ms\"] is None:\n        meta[\"qrs_duration_ms\"] = _num(r\"Dur\\S{1,2}e\\s+QRS\\s+(\\d+)\\s*ms\")\n    m = re.search(r\"QT/QTc\\s+(\\d+)\\s*/\\s*(\\d+)\\s*ms\", text)\n    if m and meta[\"qt_ms\"] is None:\n        meta[\"qt_ms\"], meta[\"qtc_ms\"] = float(m.group(1)), float(m.group(2))\n    m = re.search(r\"Axes\\s+P-R-T\\s+(-?\\d+)\\s+(-?\\d+)\\s+(-?\\d+)\", text)\n    if m and \"axis_qrs_deg\" not in meta:\n        meta[\"axis_p_deg\"] = int(m.group(1))\n        meta[\"axis_qrs_deg\"] = int(m.group(2))\n        meta[\"axis_t_deg\"] = int(m.group(3))\n\n    meta[\"paper_speed_mm_s\"] = _num(r\"Vit\\.?:?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/sec\")\n    if meta[\"paper_speed_mm_s\"] is None:\n        meta[\"paper_speed_mm_s\"] = _num(r\"\\b(\\d+(?:\\.\\d+)?)\\s*mm/s\\b\")\n    meta[\"gain_limb_mm_mV\"] = _num(r\"Mbre\\.?:?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/mV\")\n    meta[\"gain_chest_mm_mV\"] = _num(r\"Torse\\.?:?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/mV\")\n\n    m = re.search(r\"N[ée]\\(e\\)\\s*le:\\s*([\\d\\-A-Za-z]+)\\s+(\\d+)\\s*Ans\\s+(\\w+)\", text)\n    if m:\n        meta[\"age_years\"] = int(m.group(2))\n        meta[\"sex_raw\"] = m.group(3)\n    else:\n        m = re.search(r\"\\((\\d+)\\s*ans\\)\", text)\n        if m:\n            meta[\"age_years\"] = int(m.group(1))\n        m = re.search(r\"^(F\\S{1,2}minin|Masc)\", text, re.MULTILINE)\n        if m:\n            meta[\"sex_raw\"] = \"Masculin\" if m.group(1).startswith(\"Masc\") else \"Féminin\"\n    if meta.get(\"gain_limb_mm_mV\") is None:\n        g = _num(r\"\\b(\\d+(?:\\.\\d+)?)\\s*mm/mV\")\n        if g is not None:\n            meta[\"gain_limb_mm_mV\"] = meta[\"gain_chest_mm_mV\"] = g\n\n    m = re.search(r\"^(\\d{2}-\\w{3}-\\d{4}\\s+\\d{2}:\\d{2}:\\d{2})\", text, re.MULTILINE)\n    # date d'examen : on la garde car utile pour trier une cohorte (pas une\n    # donnée d'identité directe à elle seule)\n    m2 = re.search(r\"(\\d{2}-\\w{3}-\\d{4}\\s+\\d{2}:\\d{2}:\\d{2})\", text)\n    if m2:\n        meta[\"exam_datetime_raw\"] = m2.group(1)\n\n    m = re.search(r\"ID visite:\\s*(\\S+)\", text)\n    if m:\n        meta[\"visit_id\"] = m.group(1)\n\n    m = re.search(r\"12\\s*d[ée]rivations;\\s*(.+)\", text)\n    if m:\n        meta[\"lead_placement\"] = m.group(1).split(\"\\n\")[0].strip()\n\n    return meta\n\n\ndef parse_pdf(pdf_path: str) -> ParsedECGPage:\n    from .identity import extract_identity\n    from .vendor_formats import detect_vendor\n    with pdfplumber.open(pdf_path) as pdf:\n        page = pdf.pages[0]\n        text = page.extract_text() or \"\"\n        result = _parse_page(page, text)\n        result.identity = extract_identity(page, text, detect_vendor(text))\n    return result\n\n\ndef _parse_page(page, text: str) -> ParsedECGPage:\n    # Autres constructeurs (Cardionics, Dräger) : lecteurs dédiés.\n    from . import vendor_formats\n    vendor = vendor_formats.detect_vendor(text)\n    if vendor == \"cardionics\":\n        return vendor_formats.parse_cardionics(page, text)\n    if vendor == \"drager\":\n        return vendor_formats.parse_drager(page, text)\n\n    result = ParsedECGPage(\n        header_text=text,\n        metadata=_parse_header_metadata(text),\n        page_width=page.width,\n        page_height=page.height,\n    )\n\n    words = page.extract_words()\n    lead_words = [w for w in words if w[\"text\"] in STANDARD_LEADS or\n                  (w[\"text\"] in (\"II\", \"III\") and w[\"text\"] in STANDARD_LEADS)]\n    # Regrouper les libellés de dérivation par colonne (abscisse x0)\n    columns: dict[float, list] = {}\n    for w in words:\n        if w[\"text\"] in STANDARD_LEADS:\n            key = round(w[\"x0\"] / 10) * 10  # bucket grossier\n            columns.setdefault(key, []).append(w)\n\n    curves = page.curves\n    signal_curves = [c for c in curves if len(c[\"pts\"]) >= MIN_SIGNAL_PTS]\n    pulse_curves = [c for c in curves if 2 <= len(c[\"pts\"]) < MIN_SIGNAL_PTS]\n\n    if not signal_curves:\n        result.warnings.append(\n            \"Aucun tracé vectoriel détecté (>= %d points). Ce PDF n'est \"\n            \"peut-être pas au format vectoriel attendu (image scannée ?).\"\n            % MIN_SIGNAL_PTS\n        )\n        return result\n\n    # Largeur de page pleine (bande rythme) vs demi-page (grille 6x2).\n    # On compare chaque tracé à la largeur MÉDIANE des tracés plutôt qu'à\n    # un seuil fixe en % de la page, car les marges varient d'un export\n    # à l'autre : la bande rythme fait ~2x la largeur d'un tracé de\n    # grille, quel que soit le gabarit de page.\n    widths = sorted(c[\"x1\"] - c[\"x0\"] for c in signal_curves)\n    median_width = widths[len(widths) // 2]\n    full_width_threshold = 1.5 * median_width\n    for c in signal_curves:\n        width = c[\"x1\"] - c[\"x0\"]\n        c[\"_is_full_width\"] = width > full_width_threshold\n\n    # Colonnes de tracés : on regroupe par x0 arrondi\n    trace_columns: dict[float, list] = {}\n    for c in signal_curves:\n        key = round(c[\"x0\"] / 10) * 10\n        trace_columns.setdefault(key, []).append(c)\n\n    sorted_col_keys = sorted(trace_columns.keys())\n    sorted_word_col_keys = sorted(columns.keys())\n\n    layout_6x2 = len(sorted_col_keys) in (2, 3) and len(sorted_word_col_keys) == 2\n    layout_3x4 = len(sorted_col_keys) == 4 and len(sorted_word_col_keys) == 4\n    if not (layout_6x2 or layout_3x4):\n        result.warnings.append(\n            \"Disposition de page inattendue (%d colonne(s) de tracés, \"\n            \"%d colonne(s) de libellés) ; l'appariement dérivation<->\"\n            \"tracé peut être incorrect.\" % (len(sorted_col_keys), len(sorted_word_col_keys))\n        )\n\n    # Cas standard : 2 colonnes de libellés (gauche: I..aVF (+ rythme),\n    # droite: V1..V6), et les tracés pleine-largeur forment une colonne\n    # à part qu'on traite séparément.\n    full_width_curves = [c for c in signal_curves if c[\"_is_full_width\"]]\n    half_curves = [c for c in signal_curves if not c[\"_is_full_width\"]]\n\n    half_columns: dict[float, list] = {}\n    for c in half_curves:\n        key = round(c[\"x0\"] / 10) * 10\n        half_columns.setdefault(key, []).append(c)\n    half_col_keys = sorted(half_columns.keys())\n\n    # Association gauche/droite entre colonnes de mots et colonnes de\n    # tracés par proximité d'abscisse.\n    def _closest_word_col(x0_curve):\n        return min(sorted_word_col_keys, key=lambda k: abs(k - x0_curve))\n\n    for col_x in half_col_keys:\n        word_col_key = _closest_word_col(col_x)\n        word_list = sorted(columns[word_col_key], key=lambda w: w[\"top\"])\n        curve_list = sorted(half_columns[col_x], key=_curve_row_position)\n        n = min(len(word_list), len(curve_list))\n        surplus = len(word_list) - len(curve_list)\n        # surplus == 0 : correspondance parfaite. surplus == nombre de\n        # tracés pleine largeur : le(s) libellé(s) en trop est/sont\n        # celui/ceux de la bande rythme, traité(s) juste après — cas\n        # normal, pas une anomalie à signaler.\n        if surplus != 0 and surplus != len(full_width_curves):\n            result.warnings.append(\n                \"Colonne x=%.0f : %d libellé(s) pour %d tracé(s) — \"\n                \"appariement partiel (les %d premiers, ordre haut->bas).\"\n                % (col_x, len(word_list), len(curve_list), n)\n            )\n        for w, c in zip(word_list[:n], curve_list[:n]):\n            lead = w[\"text\"]\n            result.traces[lead] = RawTrace(\n                lead=lead,\n                pts=c[\"pts\"],\n                x0=c[\"x0\"], x1=c[\"x1\"],\n                top=c[\"top\"], bottom=c[\"bottom\"],\n                is_full_width=False,\n                label_top=(w[\"top\"] + w[\"bottom\"]) / 2,\n            )\n        # Le(s) libellé(s) en surplus après la grille correspond(ent) à\n        # la bande rythme.\n        # Appariement libellé <-> bande par proximité verticale (ligne de\n        # base du tracé), et non dans l'ordre de la liste : avec plusieurs\n        # bandes rythme (GE 3x4 + V1/II/V5), l'ordre des chemins dans le\n        # PDF ne suit pas forcément l'ordre de la page.\n        leftover_words = word_list[n:]\n        free_curves = [c for c in full_width_curves\n                       if not any(t.is_full_width and t.pts is c[\"pts\"]\n                                  for t in result.traces.values())]\n        pairs = []\n        for w in leftover_words:\n            if not free_curves:\n                break\n            w_mid = (w[\"top\"] + w[\"bottom\"]) / 2\n            c = min(free_curves, key=lambda cc: abs(_curve_row_position(cc) - w_mid))\n            free_curves.remove(c)\n            pairs.append((w, c))\n        for w, c in pairs:\n            lead = w[\"text\"] + \"_rhythm\"\n            result.traces[lead] = RawTrace(\n                lead=lead,\n                pts=c[\"pts\"],\n                x0=c[\"x0\"], x1=c[\"x1\"],\n                top=c[\"top\"], bottom=c[\"bottom\"],\n                is_full_width=True,\n                label_top=(w[\"top\"] + w[\"bottom\"]) / 2,\n            )\n\n    # Grille 3x4 (GE 12SL « 4 colonnes ») : chaque colonne couvre une\n    # tranche de 2,5 s différente, alignée en abscisse sur la ou les\n    # bandes rythme. Le temps 0 de toutes les dérivations est alors le\n    # début de la bande rythme, sinon chaque colonne repartirait de 0 s et\n    # les pics R détectés sur la bande tomberaient au mauvais endroit dans\n    # les colonnes 2 à 4 (battements médians faux, fenêtre QRS décalée).\n    # La grille 6x2 (2 colonnes simultanées) garde son origine propre.\n    if len(half_col_keys) >= 3:\n        starts = [c[\"x0\"] for c in full_width_curves] or [c[\"x0\"] for c in half_curves]\n        origin = min(starts)\n        for t in result.traces.values():\n            t.time_origin_x = origin\n\n    # Impulsions d'étalonnage : chaque impulsion est dessinée une fois\n    # par LIGNE de la grille (partagée par la dérivation de gauche et\n    # celle de droite de cette ligne). On les associe en utilisant\n    # `label_top`, la position du LIBELLÉ TEXTE de chaque dérivation\n    # (stable, non déformée par l'amplitude du signal) — contrairement\n    # à la boîte englobante du tracé, qui peut être faussée par une\n    # grande déflexion (QRS ample, etc.).\n    all_traces = list(result.traces.values())\n    pulses_info = []\n    for pc in pulse_curves:\n        ys = [pt[1] for pt in pc[\"pts\"]]\n        xs = [pt[0] for pt in pc[\"pts\"]]\n        if not ys:\n            continue\n        pulses_info.append({\n            \"top\": min(ys), \"bottom\": max(ys),\n            \"mid\": (min(ys) + max(ys)) / 2,\n            \"height_pt\": max(ys) - min(ys),\n            \"x0\": min(xs), \"x1\": max(xs),\n        })\n\n    row_tol = 15.0\n    unmatched = 0\n    for t in all_traces:\n        nearest = min(pulses_info,
