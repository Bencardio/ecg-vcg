n    if len(leads_used) < 3:\n        return TWaveComplexityResult(\n            warnings=[\"TMD/TWR non calculables (moins de 3 dérivations indépendantes disponibles).\"]\n        )\n\n    t_rel = median_beats[leads_used[0]].t_rel\n    win = (t_rel >= t_onset_s) & (t_rel <= t_offset_s)\n    if win.sum() < MIN_SAMPLES:\n        return TWaveComplexityResult(\n            warnings=[\"TMD/TWR non calculables (fenêtre T trop étroite).\"]\n        )\n\n    M = np.stack([median_beats[ld].mv[win] for ld in leads_used], axis=1)  # (n_samples, n_leads)\n    # Centrage temporel (par dérivation) avant SVD, cohérent avec l'approche\n    # \"morphologie\" (forme du segment T, indépendamment d'un éventuel\n    # décalage de ligne de base résiduel entre dérivations).\n    M = M - M.mean(axis=0, keepdims=True)\n\n    try:\n        _, s, vt = np.linalg.svd(M, full_matrices=False)\n    except np.linalg.LinAlgError:\n        return TWaveComplexityResult(\n            leads_used=leads_used, n_leads_used=len(leads_used),\n            warnings=[\"TMD/TWR : échec de la décomposition SVD.\"]\n        )\n\n    n_leads = len(leads_used)\n    k = min(2, len(s))\n    if k < 2 or s[0] < 1e-9:\n        return TWaveComplexityResult(\n            leads_used=leads_used, n_leads_used=n_leads,\n            warnings=[\"TMD/TWR non calculables (signal T insuffisant après centrage).\"]\n        )\n\n    # Coordonnées de chaque dérivation dans l'espace des 2 premières\n    # composantes principales : score_i = Vt[:2, i] * S[:2]\n    scores = (vt[:2, :] * s[:2, None]).T  # (n_leads, 2)\n\n    angles = []\n    for i in range(n_leads):\n        for j in range(i + 1, n_leads):\n            vi, vj = scores[i], scores[j]\n            ni, nj = np.linalg.norm(vi), np.linalg.norm(vj)\n            if ni < 1e-12 or nj < 1e-12:\n                continue\n            cos_a = float(np.clip(np.dot(vi, vj) / (ni * nj), -1.0, 1.0))\n            angles.append(np.degrees(np.arccos(cos_a)))\n\n    tmd = float(np.mean(angles)) if angles else None\n    if not angles:\n        warnings.append(\"TMD non calculable (dérivations dégénérées dans l'espace des 2 \"\n                         \"premières composantes).\")\n\n    total_energy = float(np.sum(s ** 2))\n    twr_abs = float(np.sum(s[3:] ** 2)) if len(s) > 3 else 0.0\n    twr_rel = (100.0 * twr_abs / total_energy) if total_energy > 1e-12 else None\n\n    return TWaveComplexityResult(\n        tmd_deg=tmd, twr_abs_mv2=twr_abs, twr_rel_pct=twr_rel,\n        n_leads_used=n_leads, leads_used=leads_used, warnings=warnings,\n    )\n", "ecg_hcm/validation.py": "\"\"\"\nvalidation.py\n=============\n\nConcordance entre les mesures de l'application et celles de BRAVEHEART\n(demande de Benjamin, 2026-10-20), paramètre par paramètre :\n\n- ICC(A,1) : coefficient de corrélation intra-classe, modèle à effets\n  aléatoires à deux facteurs, accord ABSOLU, mesure unique (McGraw & Wong\n  1996 ; ICC(2,1) de Shrout & Fleiss), avec son IC 95 %. Interprétation de\n  Koo & Li (2016) : < 0,5 faible, 0,5-0,75 modéré, 0,75-0,9 bon, > 0,9\n  excellent (sur la borne de l'IC, idéalement).\n- Bland-Altman : biais moyen (application - BRAVEHEART) et son IC 95 %,\n  limites d'accord à 95 % (biais +/- 1,96 ET), biais proportionnel (pente\n  de la différence en fonction de la moyenne).\n- CCC de Lin (1989), avec IC 95 % par transformation de Fisher.\n- Kappa de Cohen pour quelques critères binaires dérivés des deux valeurs\n  (seuils indiqués dans le tableau).\n\nSeuls les paramètres présents dans les deux fichiers ET fiables dans\nBRAVEHEART sont comparés : mesures faites sur le battement médian (VCG,\nintervalles, amplitudes). Les statistiques battement-à-battement de\nBRAVEHEART (HRV, min/max, qualité) sont exclues : l'export envoie un seul\nbattement médian répété, elles n'ont pas de sens.\n\nLimite à garder en tête : BRAVEHEART calcule à partir du battement médian\nproduit par l'application. La comparaison valide donc les calculs (repères,\nVCG), pas l'extraction du signal depuis le PDF.\n\nUnités : vérifiées dans le code source de BRAVEHEART v1.8.2\n(`GEH_calculations.m`, `VCG_Calc.m`) : SVG et SAI en mV·ms (application :\nmV·s), vitesse en mV/ms (application : mV/s). Par sécurité, un paramètre\ndont le rapport médian application/BRAVEHEART reste hors de [0,5 ; 2]\naprès conversion est signalé (« unités ou définitions à vérifier »).\n\"\"\"\nfrom __future__ import annotations\n\nimport io\nimport os\nimport re\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\nfrom scipy import stats\n\n_LEADS = (\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\", \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\")\n_BH_LEAD = {\"I\": \"L1\", \"II\": \"L2\", \"III\": \"L3\", \"aVR\": \"avR\", \"aVL\": \"avL\", \"aVF\": \"avF\"}\n\n\n@dataclass(frozen=True)\nclass Pair:\n    app: str          # colonne de l'export de l'application\n    bh: str           # colonne de l'export BRAVEHEART\n    label: str\n    unit: str         # unité commune après conversion\n    factor: float = 1.0   # valeur BRAVEHEART * factor -> unité de l'application\n    absolute: bool = False  # comparer les valeurs absolues (convention de signe)\n    family: str = \"VCG\"\n\n\nPAIRS: tuple[Pair, ...] = (\n    Pair(\"qrs_duration_ms_measured\", \"qrs_int\", \"Durée du QRS (battement médian)\", \"ms\", family=\"Intervalles\"),\n    Pair(\"qt_ms_measured\", \"qt_int\", \"QT (battement médian)\", \"ms\", family=\"Intervalles\"),\n    Pair(\"sokolow_lyon_mv\", \"sokolow_lvh_mv\", \"Sokolow-Lyon\", \"mV\", family=\"Voltage\"),\n    Pair(\"cornell_voltage_mv\", \"cornell_lvh_mv\", \"Cornell (voltage)\", \"mV\", family=\"Voltage\"),\n    Pair(\"spatial_qrst_angle_deg\", \"qrst_angle_peak\", \"Angle QRS-T spatial (pics)\", \"°\"),\n    Pair(\"qrst_angle_area_deg\", \"qrst_angle_area\", \"Angle QRS-T spatial (aires)\", \"°\"),\n    Pair(\"qrst_angle_peak_frontal_deg\", \"qrst_angle_peak_frontal\", \"Angle QRS-T frontal (pics)\", \"°\"),\n    Pair(\"qrst_angle_area_frontal_deg\", \"qrst_angle_area_frontal\", \"Angle QRS-T frontal (aires)\", \"°\"),\n    Pair(\"svg_magnitude_mV_s\", \"svg_area_mag\", \"SVG, magnitude (aires)\", \"mV·s\", factor=1e-3),\n    Pair(\"svg_peak_magnitude_mV\", \"svg_peak_mag\", \"SVG, magnitude (pics)\", \"mV\"),\n    Pair(\"svg_svg_angle_deg\", \"svg_svg_angle\", \"Angle SVG pic / SVG aire\", \"°\"),\n    Pair(\"qrs_peak_magnitude_mV\", \"q_peak_mag\", \"Vecteur QRS maximal, magnitude\", \"mV\"),\n    Pair(\"qrst_distance_peak_mV\", \"qrst_distance_peak\", \"Distance QRS-T (pics)\", \"mV\"),\n    Pair(\"qrst_distance_area_mV\", \"qrst_distance_area\", \"Distance QRS-T (aires)\", \"mV·s\", factor=1e-3),\n    Pair(\"sai_qrst_mV_s\", \"sai_qrst\", \"SAI QRST\", \"mV·s\", factor=1e-3),\n    Pair(\"sai_vm_mV_s\", \"sai_vm\", \"SAI VM\", \"mV·s\", factor=1e-3),\n    Pair(\"speed_qrst_max_mV_s\", \"speed_max\", \"Vitesse VCG maximale\", \"mV/s\", factor=1e3),\n    Pair(\"tcrt\", \"TCRT\", \"TCRT\", \"sans unité\"),\n    Pair(\"qrs_loop_roundness\", \"qrsloop_roundness\", \"Rondeur de la boucle QRS\", \"sans unité\"),\n    Pair(\"t_loop_roundness\", \"tloop_roundness\", \"Rondeur de la boucle T\", \"sans unité\"),\n    Pair(\"qrs_loop_planarity_residual_mV2\", \"qrsloop_residual\", \"Résidu de planéité, boucle QRS\", \"mV²\"),\n    Pair(\"t_loop_planarity_residual_mV2\", \"tloop_residual\", \"Résidu de planéité, boucle T\", \"mV²\"),\n    Pair(\"qrst_dihedral_angle_deg\", \"qrst_dihedral_ang\", \"Angle dièdre QRS/T\", \"°\"),\n    Pair(\"tmd_deg\", \"TMD\", \"TMD\", \"°\"),\n    Pair(\"twr_abs_mV2\", \"TWR_abs\", \"TWR absolu\", \"mV²\"),\n    Pair(\"twr_rel_pct\", \"TWR_rel\", \"TWR relatif\", \"fraction\"),\n) + tuple(\n    p for ld in _LEADS for p in (\n        Pair(\"R_%s_mV\" % ld, \"%s_r_wave\" % _BH_LEAD.get(ld, ld), \"Onde R en %s\" % ld, \"mV\", family=\"Amplitudes\"),\n        Pair(\"S_%s_mV\" % ld, \"%s_s_wave\" % _BH_LEAD.get(ld, ld),\n             \"Déflexion négative la plus profonde en %s (S ou Q, valeur absolue)\" % ld, \"mV\",\n             absolute=True, family=\"Amplitudes\"),\n        Pair(\"T_%s_mV\" % ld, \"%s_t_max\" % _BH_LEAD.get(ld, ld), \"Onde T en %s\" % ld, \"mV\", family=\"Amplitudes\"),\n    )\n)\n\n\n# Critères binaires (kappa) : (libellé, colonne app, colonne BH, fonction seuil)\ndef _cornell_positive(v, sex):\n    if v is None or pd.isna(v):\n        return np.nan\n    if sex in (\"F\", \"f\", \"Femme\", \"Féminin\", \"female\"):\n        return float(v > 2.0)\n    if sex in (\"M\", \"m\", \"Homme\", \"Masculin\", \"male\"):\n        return float(v > 2.8)\n    return np.nan\n\n\nBINARY = (\n    (\"Sokolow-Lyon >= 3,5 mV\", \"sokolow_lyon_mv\", lambda v, s: float(v >= 3.5)),\n    (\"Cornell > 2,8 mV (H) / 2,0 mV (F)\", \"cornell_voltage_mv\", _cornell_positive),\n    (\"QRS >= 120 ms\", \"qrs_duration_ms_measured\", lambda v, s: float(v >= 120)),\n    (\"Angle QRS-T spatial (pics) > 100°\", \"spatial_qrst_angle_deg\", lambda v, s: float(v > 100)),\n)\n\n\n# ---------------------------------------------------------------------------\n# Lecture et appariement\n# ---------------------------------------------------------------------------\ndef read_csv_any(data: bytes) -> pd.DataFrame:\n    \"\"\"CSV de BRAVEHEART (virgule, point décimal) ou CSV réenregistré par un\n    Excel français (point-virgule, virgule décimale), avec ou sans BOM.\"\"\"\n    head = data[:20000].decode(\"utf-8-sig\", errors=\"replace\").splitlines()\n    first = head[0] if head else \"\"\n    if first.count(\";\") > first.count(\",\"):\n        return pd.read_csv(io.BytesIO(data), sep=\";\", decimal=\",\", encoding=\"utf-8-sig\",\n                           encoding_errors=\"replace\")\n    if first.count(\"\\t\") > first.count(\",\"):\n        return pd.read_csv(io.BytesIO(data), sep=\"\\t\", encoding=\"utf-8-sig\",\n                           encoding_errors=\"replace\")\n    return pd.read_csv(io.BytesIO(data), encoding=\"utf-8-sig\", encoding_errors=\"replace\")\n\n\ndef read_table(data: bytes, name: str, sheet_hint: tuple[str, ...] = ()) -> pd.DataFrame:\n    \"\"\"Lit un .csv ou un .xlsx. Pour un classeur, fusionne les feuilles qui\n    contiennent `source_file` ou `filename` (l'export de l'application\n    répartit ses colonnes entre « Originales » et « Déjà dans BRAVEHEART »).\"\"\"\n    if name.lower().endswith(\".csv\"):\n        return read_csv_any(data)\n    sheets = pd.read_excel(io.BytesIO(data), sheet_name=None)\n    # feuilles à une ligne par ECG seulement (pas « Par dérivation » ni\n    # « Avertissements », qui répètent le nom de fichier et multiplieraient les lignes)\n    keys = [k for k in sheets\n            if any(c in sheets[k].columns and not sheets[k][c].dropna().duplicated().any()\n                   for c in (\"source_file\", \"filename\"))]\n    if sheet_hint:\n        keys = [k for k in keys if k in sheet_hint] or keys\n    if not keys:\n        return next(iter(sheets.values()))\n    out = sheets[keys[0]]\n    key = \"source_file\" if \"source_file\" in out.columns else \"filename\"\n    for k in keys[1:]:\n        extra = sheets[k]\n        if key in extra.columns:\n            cols = [key] + [c for c in extra.columns if c not in out.columns]\n            out = out.merge(extra[cols], on=key, how=\"outer\")\n    if key == \"source_file\":\n        sexes, conflicts = workbook_sexes(sheets)\n        if sexes:\n            k = out[\"source_file\"].map(match_key)\n            out[\"sex\"] = k.map(sexes).where(k.isin(sexes.keys()), out.get(\"sex\"))\n        out.attrs[\"sex_conflicts\"] = conflicts\n    return out\n\n\ndef normalize_sex(value) -> str | None:\n    \"\"\"« M », « H », « homme », « male » -> « M » ; « F », « femme » -> « F ».\"\"\"\n    if value is None or (isinstance(value, float) and pd.isna(value)):\n        return None\n    s = str(value).strip().lower()\n    if not s:\n        return None\n    if s[0] == \"f\":\n        return \"F\"\n    if s[0] in \"mh\":\n        return \"M\"\n    return None\n\n\ndef workbook_sexes(sheets: dict) -> tuple[dict, list[str]]:\n    \"\"\"Sexe par fichier, lu dans toutes les feuilles de l'Excel de l'application\n    (« Sexe » du Résumé, « sex » des autres feuilles), pour qu'une saisie\n    manuelle dans n'importe laquelle soit prise en compte. Priorité : Résumé,\n    puis Originales, puis les autres. Retourne aussi les fichiers dont les\n    feuilles se contredisent.\"\"\"\n    sources = []\n    for name, d in sheets.items():\n        if \"source_file\" in d.columns and \"sex\" in d.columns:\n            sources.append((0 if name == \"Originales\" else 1, d[\"source_file\"], d[\"sex\"]))\n        elif \"Fichier\" in d.columns and \"Sexe\" in d.columns:\n            sources.append((-1, d[\"Fichier\"], d[\"Sexe\"]))\n    sources.sort(key=lambda t: t[0])\n    chosen: dict[str, str] = {}\n    seen: dict[str, set] = {}\n    for _, files, sexes in sources:\n        for f, v in zip(files, sexes):\n            v = normalize_sex(v)\n            if v is None or pd.isna(f):\n                continue\n            k = match_key(f)\n            chosen.setdefault(k, v)\n            seen.setdefault(k, set()).add(v)\n    conflicts = sorted(k for k, vs in seen.items() if len(vs) > 1)\n    return chosen, conflicts\n\n\ndef match_key(name) -> str:\n    \"\"\"« dossier/NOM.pdf » et « C:\\\\...\\\\NOM_braveheart.csv » -> « nom ».\"\"\"\n    s = os.path.basename(str(name).replace(\"\\\\\", \"/\"))\n    s = re.sub(r\"\\.(pdf|csv|xlsx|txt)$\", \"\", s, flags=re.IGNORECASE)\n    s = re.sub(r\"_braveheart(_\\d+)?$\", \"\", s, flags=re.IGNORECASE)\n    return s.strip().lower()\n\n\ndef pair_tables(app: pd.DataFrame, bh: pd.DataFrame) -> tuple[pd.DataFrame, list[str], list[str]]:\n    \"\"\"Joint les deux tableaux sur le nom de fichier. Retourne (tableau\n    apparié, fichiers de l'application sans équivalent, fichiers BRAVEHEART\n    sans équivalent).\"\"\"\n    if \"source_file\" not in app.columns:\n        raise ValueError(\"Colonne « source_file » absente du fichier de l'application.\")\n    if \"filename\" not in bh.columns:\n        raise ValueError(\"Colonne « filename » absente du fichier BRAVEHEART.\")\n    a = app.copy()\n    b = bh.copy()\n    if \"status\" in a.columns:\n        a = a[a[\"status\"].astype(str) == \"ok\"]\n    a[\"_key\"] = a[\"source_file\"].map(match_key)\n    b[\"_key\"] = b[\"filename\"].map(match_key)\n    a = a.drop_duplicates(\"_key\")\n    b = b.drop_duplicates(\"_key\")\n    m = a.merge(b, on=\"_key\", how=\"inner\", suffixes=(\"\", \"__bh\"))\n    only_app = sorted(set(a[\"_key\"]) - set(b[\"_key\"]))\n    only_bh = sorted(set(b[\"_key\"]) - set(a[\"_key\"]))\n    return m, only_app, only_bh\n\n\ndef _bh_col(m: pd.DataFrame, col: str) -> str | None:\n    if col + \"__bh\" in m.columns:\n        return col + \"__bh\"\n    if col in m.columns:\n        return col\n    low = {c.lower(): c for c in m.columns}\n    return low.get(col.lower())\n\n\ndef paired_values(m: pd.DataFrame, p: Pair) -> tuple[np.ndarray, np.ndarray, pd.Series] | None:\n    if p.app not in m.columns:\n        return None\n    bc = _bh_col(m, p.bh)\n    if bc is None or bc == p.app:\n        return None\n    x = pd.to_numeric(m[p.app], errors=\"coerce\")\n    y = pd.to_numeric(m[bc], errors=\"coerce\") * p.factor\n    if p.absolute:\n        x, y = x.abs(), y.abs()\n    # BRAVEHEART (`rs_values.m`) appelle « s_wave » le point le plus négatif\n    # du QRS, qu'il précède ou suive R. L'application distingue Q (avant la\n    # première onde positive) et S : on compare donc la plus profonde des deux.\n    q_col = \"Q\" + p.app[1:] if p.app.startswith(\"S_\") else None\n    if q_col and q_col in m.columns:\n        x = np.maximum(x, pd.to_numeric(m[q_col], errors=\"coerce\").abs().fillna(0))\n    ok = x.notna() & y.notna() & np.isfinite(x) & np.isfinite(y)\n    return x[ok].to_numpy(float), y[ok].to_numpy(float), m.loc[ok, \"source_file\"]\n\n\n# ---------------------------------------------------------------------------\n# Statistiques\n# ---------------------------------------------------------------------------\ndef icc_a1(x: np.ndarray, y: np.ndarray, alpha: float = 0.05) -> tuple[float, float, float]:\n    \"\"\"ICC(A,1) de McGraw & Wong (= ICC(2,1) de Shrout & Fleiss), accord\n    absolu, 2 « juges » (application, BRAVEHEART), avec IC (1 - alpha).\"\"\"\n    data = np.column_stack([x, y])\n    n, k = data.shape\n    if n < 3:\n        return np.nan, np.nan, np.nan\n    gm = data.mean()\n    ssr = k * ((data.mean(axis=1) - gm) ** 2).sum()\n    ssc = n * ((data.mean(axis=0) - gm) ** 2).sum()\n    sst = ((data - gm) ** 2).sum()\n    sse = sst - ssr - ssc\n    msr = ssr / (n - 1)\n    msc = ssc / (k - 1)\n    mse = sse / ((n - 1) * (k - 1))\n    denom = msr + (k - 1) * mse + k * (msc - mse) / n\n    if denom <= 0:\n        return np.nan, np.nan, np.nan\n    icc = (msr - mse) / denom\n    # IC de McGraw & Wong (1996), cas A,1\n    a = k * icc / (n * (1 - icc)) if icc < 1 else np.inf\n    b = 1 + k * icc * (n - 1) / (n * (1 - icc)) if icc < 1 else np.inf\n    if not np.isfinite(a) or mse <= 0:\n        return float(icc), np.nan, np.nan\n    v = (a * msc + b * mse) ** 2 / ((a * msc) ** 2 / (k - 1) + (b * mse) ** 2 / ((n - 1) * (k - 1)))\n    fs = stats.f.ppf(1 - alpha / 2, n - 1, v)\n    fi = stats.f.ppf(1 - alpha / 2, v, n - 1)\n    lo = n * (msr - fs * mse) / (fs * (k * msc + (k * n - k - n) * mse) + n * msr)\n    hi = n * (fi * msr - mse) / (k * msc + (k * n - k - n) * mse + n * fi * msr)\n    return float(icc), float(lo), float(hi)\n\n\ndef lin_ccc(x: np.ndarray, y: np.ndarray, alpha: float = 0.05) -> tuple[float, float, float]:\n    \"\"\"CCC de Lin (1989) et IC par transformation z de Fisher.\"\"\"\n    n = len(x)\n    if n < 4:\n        return np.nan, np.nan, np.nan\n    mx, my = x.mean(), y.mean()\n    sx2, sy2 = x.var(), y.var()  # variances « population », comme Lin\n    sxy = ((x - mx) * (y - my)).mean()\n    denom = sx2 + sy2 + (mx - my) ** 2\n    if denom <= 0:\n        return np.nan, np.nan, np.nan\n    rc = 2 * sxy / denom\n    r = sxy / np.sqrt(sx2 * sy2) if sx2 > 0 and sy2 > 0 else np.nan\n    if not np.isfinite(r) or abs(rc) >= 1 or r == 0:\n        return float(rc), np.nan, np.nan\n    u = (mx - my) / (sx2 * sy2) ** 0.25\n    var_z = ((1 - r ** 2) * rc ** 2 / ((1 - rc ** 2) * r ** 2)\n             + 2 * rc ** 3 * (1 - rc) * u ** 2 / (r * (1 - rc ** 2) ** 2)\n             - rc ** 4 * u ** 4 / (2 * r ** 2 * (1 - rc ** 2) ** 2)) / (n - 2)\n    if var_z <= 0:\n        return float(rc), np.nan, np.nan\n    z = np.arctanh(rc)\n    q = stats.norm.ppf(1 - alpha / 2) * np.sqrt(var_z)\n    return float(rc), float(np.tanh(z - q)), float(np.tanh(z + q))\n\n\ndef bland_altman(x: np.ndarray, y: np.ndarray) -> dict:\n    d = x - y\n    mean = (x + y) / 2\n    n = len(d)\n    bias = d.mean()\n    sd = d.std(ddof=1) if n > 1 else np.nan\n    t = stats.t.ppf(0.975, n - 1) if n > 1 else np.nan\n    se = sd / np.sqrt(n) if n > 1 else np.nan\n    out = {\"biais\": bias, \"biais_ic_bas\": bias - t * se, \"biais_ic_haut\": bias + t * se,\n           \"et_diff\": sd, \"lim_bas\": bias - 1.96 * sd, \"lim_haut\": bias + 1.96 * sd,\n           \"pente_prop\": np.nan, \"p_prop\": np.nan}\n    if n >= 4 and np.ptp(mean) > 0:\n        lr = stats.linregress(mean, d)\n        out[\"pente_prop\"], out[\"p_prop\"] = lr.slope, lr.pvalue\n    return out\n\n\ndef koo_li(icc: float, lo: float) -> str:\n    v = lo if np.isfinite(lo) else icc\n    if not np.isfinite(v):\n        return \"\"\n    if v > 0.9:\n        return \"excellent\"\n    if v >= 0.75:\n        return \"bon\"\n    if v >= 0.5:\n        return \"modéré\"\n    return \"faible\"\n\n\ndef cohen_kappa(a: np.ndarray, b: np.ndarray) -> tuple[float, float, float, float]:\n    \"\"\"Kappa de Cohen (2 catégories), IC 95 % asymptotique, accord brut.\"\"\"\n    n = len(a)\n    if n < 2:\n        return np.nan, np.nan, np.nan, np.nan\n    po = float(np.mean(a == b))\n    pa, pb = a.mean(), b.mean()\n    pe = pa * pb + (1 - pa) * (1 - pb)\n    if pe >= 1:\n        return np.nan, np.nan, np.nan, po\n    k = (po - pe) / (1 - pe)\n    se = np.sqrt(po * (1 - po) / (n * (1 - pe) ** 2))\n    return float(k), float(max(-1.0, k - 1.96 * se)), float(min(1.0, k + 1.96 * se)), po\n\n\n# ---------------------------------------------------------------------------\n# Analyse complète\n# ---------------------------------------------------------------------------\n@dataclass\nclass ValidationResult:\n    summary: pd.DataFrame\n    kappa: pd.DataFrame\n    paired: pd.DataFrame\n    only_app: list[str]\n    only_bh: list[str]\n    n_matched: int\n\n\ndef compare(app: pd.DataFrame, bh: pd.DataFrame) -> ValidationResult:\n    m, only_app, only_bh = pair_tables(app, bh)\n    rows, long_rows = [], []\n    for p in PAIRS:\n        pv = paired_values(m, p)\n        if pv is None:\n            continue\n        x, y, files = pv\n        if len(x) < 3:\n            continue\n        icc, lo, hi = icc_a1(x, y)\n        ccc, clo, chi = lin_ccc(x, y)\n        ba = bland_altman(x, y)\n        r = stats.pearsonr(x, y)[0] if np.ptp(x) > 0 and np.ptp(y) > 0 else np.nan\n        with np.errstate(divide=\"ignore\", invalid=\"ignore\"):\n            ratio = np.nanmedian(np.where(np.abs(y) > 1e-12, x / y, np.nan))\n        rows.append({\n            \"Famille\": p.family, \"Paramètre\": p.label, \"Unité\": p.unit,\n            \"Colonne application\": p.app, \"Colonne BRAVEHEART\": p.bh, \"n\": len(x),\n            \"Moyenne application\": x.mean(), \"Moyenne BRAVEHEART\": y.mean(),\n            \"Biais (app - BH)\": ba[\"biais\"],\n            \"Biais IC95 bas\": ba[\"biais_ic_bas\"], \"Biais IC95 haut\": ba[\"biais_ic_haut\"],\n            \"Limite d'accord basse\": ba[\"lim_bas\"], \"Limite d'accord haute\": ba[\"lim_haut\"],\n            \"ICC(A,1)\": icc, \"ICC IC95 bas\": lo, \"ICC IC95 haut\": hi,\n            \"Accord (Koo & Li)\": koo_li(icc, lo),\n            \"CCC de Lin\": ccc, \"CCC IC95 bas\": clo, \"CCC IC95 haut\": chi,\n            \"r de Pearson\": r,\n            \"Biais proportionnel (pente)\": ba[\"pente_prop\"], \"Biais proportionnel (p)\": ba[\"p_prop\"],\n            \"Alerte\": (\"unités ou définitions à vérifier (rapport médian %.2f)\" % ratio\n                       if np.isfinite(ratio) and not (0.5 <= ratio <= 2) else \"\"),\n        })\n        for f, xi, yi in zip(files, x, y):\n            long_rows.append({\"source_file\": f, \"Paramètre\": p.label, \"Unité\": p.unit,\n                              \"Application\": xi, \"BRAVEHEART\": yi, \"Différence\": xi - yi})\n\n    krows = []\n    sex = m[\"sex\"] if \"sex\" in m.columns else pd.Series([None] * len(m), index=m.index)\n    for label, col, rule in BINARY:\n        p = next((q for q in PAIRS if q.app == col), None)\n        bc = _bh_col(m, p.bh) if p else None\n        if p is None or col not in m.columns or bc is None:\n            continue\n        a_vals, b_vals = [], []\n        for i in m.index:\n            xa = pd.to_numeric(m.at[i, col], errors=\"coerce\")\n            xb = pd.to_numeric(m.at[i, bc], errors=\"coerce\")\n            if pd.isna(xa) or pd.isna(xb):\n                continue\n            ra, rb = rule(xa, sex.at[i]), rule(xb * p.factor, sex.at[i])\n            if pd.isna(ra) or pd.isna(rb):\n                continue\n            a_vals.append(ra)\n            b_vals.append(rb)\n        if len(a_vals) < 3:\n            continue\n        a_arr, b_arr = np.array(a_vals), np.array(b_vals)\n        k, klo, khi, po = cohen_kappa(a_arr, b_arr)\n        krows.append({\"Critère\": label, \"n\": len(a_arr),\n                      \"Positifs application\": int(a_arr.sum()), \"Positifs BRAVEHEART\": int(b_arr.sum()),\n                      \"Accord brut\": po, \"Kappa de Cohen\": k, \"Kappa IC95 bas\": klo, \"Kappa IC95 haut\": khi})\n\n    return ValidationResult(pd.DataFrame(rows), pd.DataFrame(krows), pd.DataFrame(long_rows),\n                            only_app, only_bh, len(m))\n\n\ndef bland_altman_figure(res: ValidationResult, label: str):\n    import matplotlib\n    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n    d = res.paired[res.paired[\"Paramètre\"] == label]\n    row = res.summary[res.summary[\"Paramètre\"] == label].iloc[0]\n    x, y = d[\"Application\"].to_numpy(), d[\"BRAVEHEART\"].to_numpy()\n    fig, ax = plt.subplots(figsize=(6, 4))\n    ax.scatter((x + y) / 2, x - y, s=14, alpha=0.7, color=\"#2b6cb0\")\n    for v, ls in ((row[\"Biais (app - BH)\"], \"-\"), (row[\"Limite d'accord basse\"], \"--\"),\n                  (row[\"Limite d'accord haute\"], \"--\")):\n        ax.axhline(v, color=\"#c53030\" if ls == \"-\" else \"#718096\", ls=ls, lw=1)\n    ax.axhline(0, color=\"black\", lw=0.5)\n    ax.set_xlabel(\"Moyenne des deux méthodes (%s)\" % row[\"Unité\"])\n    ax.set_ylabel(\"Application - BRAVEHEART (%s)\" % row[\"Unité\"])\n    ax.set_title(\"%s (n = %d)\\nbiais %.3g, limites [%.3g ; %.3g], ICC %.2f\"\n                 % (label, row[\"n\"], row[\"Biais (app - BH)\"], row[\"Limite d'accord basse\"],\n                    row[\"Limite d'accord haute\"], row[\"ICC(A,1)\"]), fontsize=9)\n    fig.subplots_adjust(left=0.15, bottom=0.14, top=0.86, right=0.97)\n    return fig\n\n\ndef to_excel(res: ValidationResult, with_figures: bool = True) -> bytes:\n    import matplotlib.pyplot as plt\n    buf = io.BytesIO()\n    method = pd.DataFrame({\"Méthode\": [\n        \"ICC(A,1) : effets aléatoires à deux facteurs, accord absolu, mesure unique \"\n        \"(McGraw & Wong 1996 ; = ICC(2,1) de Shrout & Fleiss). Accord selon Koo & Li 2016, \"\n        \"appliqué à la borne basse de l'IC 95 %.\",\n        \"Bland-Altman : différence = application - BRAVEHEART ; limites d'accord = biais +/- 1,96 ET ; \"\n        \"biais proportionnel = régression de la différence sur la moyenne.\",\n        \"CCC de Lin (1989), IC 95 % par transformation de Fisher.\",\n        \"Kappa de Cohen sur des critères binaires dérivés des deux valeurs (seuils dans l'onglet Kappa).\",\n        \"Paramètres comparés : uniquement ceux présents dans les deux fichiers et mesurés par BRAVEHEART \"\n        \"sur le battement médian (VCG, intervalles, amplitudes). Statistiques battement-à-battement exclues.\",\n        \"Limite : BRAVEHEART calcule à partir du battement médian produit par l'application ; \"\n        \"cette comparaison valide les calculs, pas l'extraction du signal depuis le PDF.\",\n        \"ECG appariés : %d ; seulement dans l'application : %d ; seulement dans BRAVEHEART : %d.\"\n        % (res.n_matched, len(res.only_app), len(res.only_bh)),\n    ]})\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as xw:\n        res.summary.to_excel(xw, sheet_name=\"Synthèse\", index=False)\n        res.kappa.to_excel(xw, sheet_name=\"Kappa\", index=False)\n        res.paired.to_excel(xw, sheet_name=\"Données appariées\", index=False)\n        pd.DataFrame({\"Seulement dans l'application\": pd.Series(res.only_app, dtype=object),\n                      \"Seulement dans BRAVEHEART\": pd.Series(res.only_bh, dtype=object)}\n                     ).to_excel(xw, sheet_name=\"Non appariés\", index=False)\n        method.to_excel(xw, sheet_name=\"Méthode\", index=False)\n        if with_figures and not res.summary.empty:\n            # Graphiques pour les paramètres hors amplitudes par dérivation\n            # (36 de plus, qui alourdiraient le fichier sans grand intérêt).\n            from openpyxl.drawing.image import Image as XLImage\n            ws = xw.book.create_sheet(\"Bland-Altman\")\n            labels = res.summary.loc[res.summary[\"Famille\"] != \"Amplitudes\", \"Paramètre\"]\n            for i, label in enumerate(labels):\n                fig = bland_altman_figure(res, label)\n                png = io.BytesIO()\n                fig.savefig(png, format=\"png\", dpi=72)\n                plt.close(fig)\n                png.seek(0)\n                img = XLImage(png)\n                ws.add_image(img, \"%s%d\" % (\"A\" if i % 2 == 0 else \"J\", 1 + (i // 2) * 17))\n    return buf.getvalue()\n", "ecg_hcm/vcg.py": "\"\"\"\nvcg.py\n======\n\nDérivation d'un vectorcardiogramme (VCG) approximatif à partir du battement\nmédian des 12 dérivations standard, via la matrice de régression de Kors\n(Kors AJ, van Herpen G, Sittig AC, van Bemmel JH. \"Reconstruction of the\nFrank vectorcardiogram from standard electrocardiographic leads: diagnostic\ncomparison of different methods.\" Eur Heart J. 1990;11(12):1083-92).\n\nLa transformation de Kors n'utilise que 8 dérivations indépendantes\n(I, II, V1-V6) — les 4 autres dérivations des membres (III, aVR, aVL, aVF)\nsont des combinaisons linéaires de I et II (triangle d'Einthoven /\nrelations de Goldberger) et n'apportent pas d'information supplémentaire.\n\nIMPORTANT : ceci est une VCG *dérivée mathématiquement* d'un ECG 12\ndérivations, pas un enregistrement vectoriel réel (système de Frank à\nélectrodes dédiées). La matrice de Kors donne une bonne approximation en\nmoyenne sur une population, mais peut s'écarter de la vraie VCG chez un\npatient donné, en particulier en présence d'une cardiopathie structurelle\nmarquée (ce qui est précisément le cas en CMH) — cf. limites, README.\n\nFeatures avancées ajoutées à la version initiale :\n- Vecteur d'aire du QRS et de l'onde T (intégrale temporelle X,Y,Z), et\n  **gradient ventriculaire spatial** (SVG = somme des deux), qui reflète\n  principalement l'hétérogénéité de repolarisation indépendamment de la\n  séquence d'activation :\n  Wilson FN, MacLeod AG, Barker PS, Johnston FD. \"The determination and\n  the significance of the ventricular gradient in electrocardiography.\"\n  Am Heart J. 1934;10(1):46-61.\n  Waks JW, Tereshchenko LG. \"Global electrical heterogeneity: A review of\n  the spatial ventricular gradient.\" J Electrocardiol. 2016;49(6):824-830.\n- Aires de boucle QRS et T dans les 3 plans (frontal X-Y, transverse X-Z,\n  sagittal Y-Z).\n- Ratio d'amplitude QRS/T.\n- **Famille SVG/angle QRS-T étendue, SAI QRST, descripteurs cinétiques** —\n  ajoutés en s'inspirant de BRAVEHEART (Stabenau HF, Waks JW. \"BRAVEHEART:\n  Open-source software for automated electrocardiographic and\n  vectorcardiographic analysis.\" Comput Methods Programs Biomed.\n  2023;242:107798), logiciel MATLAB open-source (GPL-3.0,\n  github.com/BIVectors/BRAVEHEART) utilisé ici comme référence de formules\n  (code source lu directement), PAS comme dépendance ni comme donnée de\n  validation croisée numérique (aucune sortie BRAVEHEART n'a été exécutée\n  pour comparaison). Deux variantes sont maintenant calculées côte à côte\n  pour le SVG et l'angle QRS-T : \"aire\" (vecteurs déjà utilisés depuis\n  l'ajout du SVG, intégrale temporelle X,Y,Z) et \"pic\" (vecteurs au pic de\n  magnitude, déjà utilisés depuis la version initiale pour l'angle QRS-T\n  \"historique\" de cet outil) — voir README section 4 pour laquelle\n  correspond à quel champ existant.\n- **TCRT** (Total Cosine R-to-T) : moyenne des cosinus des angles entre le\n  vecteur T instantané au pic de la boucle T (référence fixe) et chaque\n  vecteur QRS instantané dont la magnitude dépasse 70% du pic QRS (portion\n  \"dominante\" de la boucle QRS). Lignée méthodologique Acar B, Yi G,\n  Hnatkova K, Malik M. \"Spatial, temporal and wavefront direction\n  characteristics of 12-lead T-wave morphology.\" Med Biol Eng Comput.\n  1999;37(5):574-584 — algorithme reconstitué à partir de sources\n  secondaires convergentes (le texte intégral de 1999 n'a pas pu être\n  vérifié directement, accès payant) : cf. README pour le détail et cette\n  réserve. Valeur unitaire dans [-1, 1] (+1 = concordance dépolarisation/\n  repolarisation parfaite, -1 = opposition totale) ; AUCUN seuil\n  pathologique universel n'est appliqué ici (les seuils publiés sont\n  spécifiques à chaque cohorte/étude, y compris quand ils sont exprimés en\n  degrés via arccos(TCRT), ce qui n'est alors pas directement comparable à\n  la valeur en cosinus).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom .beat_detection import BeatAnalysis, rr_interval_s\n\n# Coefficients de la matrice de régression de Kors (Kors et al. 1990),\n# reproduits tels que tabulés dans la revue de synthèse : Guldenring D. et\n# al., \"Review of Processing Pathological Vectorcardiographic Records for\n# the Detection of Heart Disease\", Front Physiol 2022;13:856590 (Table 2).\n# Lignes = dérivations d'entrée, colonnes = X, Y, Z.\nKORS_MATRIX = {\n    \"I\":  (0.38, -0.07, 0.11),\n    \"II\": (-0.07, 0.93, -0.23),\n    \"V1\": (-0.13, 0.06, -0.43),\n    \"V2\": (0.05, -0.02, -0.06),\n    \"V3\": (-0.01, -0.05, -0.14),\n    \"V4\": (0.14, 0.06, -0.20),\n    \"V5\": (0.06, -0.17, -0.11),\n    \"V6\": (0.54, 0.13, 0.31),\n}\n\nDEFAULT_T_SEARCH_START_S = 0.06\nDEFAULT_T_SEARCH_END_S = 0.40\nTCRT_QRS_MAGNITUDE_FRACTION = 0.70  # portion \"dominante\" de la boucle QRS (cf. docstring)\n\n\n@dataclass\nclass VCGResult:\n    t_rel: np.ndarray\n    x: np.ndarray\n    y: np.ndarray\n    z: np.ndarray\n    qrs_peak_vector: tuple[float, float, float]\n    qrs_peak_magnitude_mv: float\n    t_peak_vector: tuple[float, float, float]\n    t_peak_magnitude_mv: float\n    spatial_qrst_angle_deg: float | None\n    qrs_azimuth_deg: float\n    qrs_elevation_deg: float\n    qrs_loop_area_xy_mv2: float\n    qrs_loop_area_xz_mv2: float\n    qrs_loop_area_yz_mv2: float\n    t_loop_area_xy_mv2: float | None\n    t_loop_area_xz_mv2: float | None\n    t_loop_area_yz_mv2: float | None\n    qrs_t_amplitude_ratio: float | None\n    tcrt: float | None\n    tcrt_n_qrs_samples: int | None\n    t_window_source: str  # \"delineation\" | \"heuristique\"\n    t_onset_s: float  # fenêtre T effectivement utilisée (délinéation ou heuristique)\n    t_offset_s: float\n    svg_vector: tuple[float, float, float] | None  # SVG \"aire\" (intégrale QRS + intégrale T)\n    svg_magnitude_mv_s: float | None\n    svg_azimuth_deg: float | None\n    svg_elevation_deg: float | None\n    leads_used: list[str]\n    warnings: list[str] = field(default_factory=list)\n\n    # --- Vecteurs \"aire\" individuels (intégrale temporelle X,Y,Z), en plus\n    # des vecteurs \"pic\" déjà présents ci-dessus (qrs_peak_vector, t_peak_vector)\n    qrs_area_vector: tuple[float, float, float] | None = None\n    qrs_area_magnitude_mv_s: float | None = None\n    qrs_area_azimuth_deg: float | None = None\n    qrs_area_elevation_deg: float | None = None\n    t_area_vector: tuple[float, float, float] | None = None\n    t_area_magnitude_mv_s: float | None = None\n    t_area_azimuth_deg: float | None = None\n    t_area_elevation_deg: float | None = None\n    t_peak_azimuth_deg: float | None = None\n    t_peak_elevation_deg: float | None = None\n\n    # --- Angle QRS-T et distance vecteurs, variantes \"aire\" vs \"pic\" et\n    # projection frontale (plan X-Y uniquement). spatial_qrst_angle_deg\n    # ci-dessus est la variante \"pic\" (historique de cet outil).\n    qrst_angle_area_deg: float | None = None\n    qrst_angle_peak_frontal_deg: float | None = None\n    qrst_angle_area_frontal_deg: float | None = None\n    qrst_distance_peak_mv: float | None = None\n    qrst_distance_area_mv: float | None = None\n\n    # --- SVG \"pic\" (somme des vecteurs pic QRS+T, distinct du SVG \"aire\"\n    # historique ci-dessus) et angle entre les deux méthodes de SVG.\n    svg_peak_vector: tuple[float, float, float] | None = None\n    svg_peak_magnitude_mv: float | None = None\n    svg_peak_azimuth_deg: float | None = None\n    svg_peak_elevation_deg: float | None = None\n    svg_svg_angle_deg: float | None = None\n\n    # --- SAI QRST (Sum Absolute Integral, hétérogénéité électrique globale)\n    sai_x_mv_s: float | None = None\n    sai_y_mv_s: float | None = None\n    sai_z_mv_s: float | None = None\n    sai_vm_mv_s: float | None = None\n    sai_qrst_mv_s: float | None = None\n\n    # --- Descripteurs cinétiques de la trajectoire VCG (vitesse 3D instantanée)\n    speed_qrst_max_mv_s: float | None = None\n    speed_qrst_med_mv_s: float | None = None\n    sti_qrst_mv: float | None = None\n    speed_qrs_max_mv_s: float | None = None\n    speed_qrs_med_mv_s: float | None = None\n    sti_qrs_mv: float | None = None\n    speed_t_max_mv_s: float | None = None\n    speed_t_med_mv_s: float | None = None\n    sti_t_mv: float | None = None\n\n\ndef _azimuth_elevation(vec: tuple[float, float, float]) -> tuple[float, float]:\n    \"\"\"Azimut (plan X-Z) et élévation par rapport à ce plan. Convention :\n    azimut = atan2(X, -Z) (0° = vers l'avant), élévation = atan2(-Y,\n    horizontale) (positif = vers le haut, Y étant orienté tête->pieds dans\n    la convention de Kors). Convention documentée ici plutôt que garantie\n    conforme à un système clinique particulier — voir README.\"\"\"\n    mag = float(np.sqrt(sum(c ** 2 for c in vec)))\n    if mag <= 1e-9:\n        return 0.0, 0.0\n    az = float(np.degrees(np.arctan2(vec[0], -vec[2])))\n    horiz = float(np.sqrt(vec[0] ** 2 + vec[2] ** 2))\n    elev = float(np.degrees(np.arctan2(-vec[1], horiz)))\n    return az, elev\n\n\ndef _trapz(y: np.ndarray, x: np.ndarray) -> float:\n    \"\"\"np.trapezoid (NumPy >= 2.0) / np.trapz (NumPy < 2.0) — compat.\"\"\"\n    fn = getattr(np, \"trapezoid\", None) or np.trapz\n    return float(fn(y, x))\n\n\ndef _loop_area(a: np.ndarray, b: np.ndarray) -> float:\n    \"\"\"Aire signée d'une boucle fermée (formule du lacet / shoelace),\n    valeur absolue retournée.\"\"\"\n    if len(a) < 3:\n        return 0.0\n    return float(0.5 * abs(np.sum(a * np.roll(b, -1) - np.roll(a, -1) * b)))\n\n\ndef _area_vector(t: np.ndarray, x: np.ndarray, y: np.ndarray, z: np.ndarray,\n                  mask: np.ndarray) -> tuple[float, float, float] | None:\n    \"\"\"Intégrale temporelle (trapèzes) de (X,Y,Z) sur la fenêtre `mask` —\n    vecteur d'aire QRS ou T, unité mV.s.\"\"\"\n    if mask.sum() < 3:\n        return None\n    ti = t[mask]\n    return (_trapz(x[mask], ti), _trapz(y[mask], ti), _trapz(z[mask], ti))\n\n\ndef _vec_angle_deg(v1: tuple[float, float, float] | None,\n                    v2: tuple[float, float, float] | None) -> float | None:\n    \"\"\"Angle 3D entre deux vecteurs, formule numériquement stable\n    (atan2(norme du produit vectoriel, produit scalaire)) — même approche\n    que BRAVEHEART (`dihedral.m`/angle helpers), plus robuste près de 0°/180°\n    qu'un simple arccos(cosinus).\"\"\"\n    if v1 is None or v2 is None:\n        return None\n    a = np.array(v1, dtype=float)\n    b = np.array(v2, dtype=float)\n    if np.sqrt(a @ a) < 1e-9 or np.sqrt(b @ b) < 1e-9:\n        return None\n    cross_norm = float(np.linalg.norm(np.cross(a, b)))\n    dot = float(np.dot(a, b))\n    return float(np.degrees(np.arctan2(cross_norm, dot)))\n\n\ndef _frontal_angle_deg(v1: tuple[float, float, float] | None,\n                        v2: tuple[float, float, float] | None) -> float | None:\n    \"\"\"Angle entre deux vecteurs projetés dans le plan frontal (X-Y),\n    composante Z ignorée (et non recalculée via azimut/élévation) —\n    reproduit la méthode de projection de BRAVEHEART\n    (`qrst_angle_*_frontal`), distincte de l'angle QRS-T frontal calculé\n    ailleurs dans ce projet à partir des axes de l'en-tête PDF\n    (`pipeline.frontal_qrst_angle_deg`).\"\"\"\n    if v1 is None or v2 is None:\n        return None\n    x1, y1 = v1[0], v1[1]\n    x2, y2 = v2[0], v2[1]\n    n1, n2 = np.hypot(x1, y1), np.hypot(x2, y2)\n    if n1 < 1e-9 or n2 < 1e-9:\n        return None\n    cross_z = x1 * y2 - x2 * y1\n    dot = x1 * x2 + y1 * y2\n    return float(np.degrees(np.arctan2(abs(cross_z), dot)))\n\n\ndef _vec_distance(v1: tuple[float, float, float] | None,\n                   v2: tuple[float, float, float] | None) -> float | None:\n    if v1 is None or v2 is None:\n        return None\n    return float(np.sqrt(sum((a - b) ** 2 for a, b in zip(v1, v2))))\n\n\ndef _speed_stats(x: np.ndarray, y: np.ndarray, z: np.ndarray, t_rel: np.ndarray,\n                  mask: np.ndarray) -> tuple[float | None, float | None, float | None]:\n    \"\"\"Vitesse 3D instantanée (norme de d(X,Y,Z)/dt) sur la fenêtre `mask` :\n    retourne (max, médiane, intégrale vitesse-temps [STI]). Les échantillons\n    de vitesse (définis entre deux points consécutifs) sont retenus si leur\n    instant médian tombe dans `mask`.\"\"\"\n    if mask.sum() < 2:\n        return None, None, None\n    idx = np.where(mask)[0]\n    lo, hi = idx.min(), idx.max()\n    if hi <= lo:\n        return None, None, None\n    seg = slice(lo, hi + 1)\n    dt = np.diff(t_rel[seg])\n    valid = dt > 1e-9\n    if valid.sum() < 1:\n        return None, None, None\n    dx = np.diff(x[seg])[valid]\n    dy = np.diff(y[seg])[valid]\n    dz = np.diff(z[seg])[valid]\n    dt = dt[valid]\n    speed = np.sqrt(dx ** 2 + dy ** 2 + dz ** 2) / dt\n    t_mid = (t_rel[seg][:-1][valid] + t_rel[seg][1:][valid]) / 2\n    sti = _trapz(speed, t_mid) if len(speed) >= 2 else None\n    return float(np.max(speed)), float(np.median(speed)), sti\n\n\ndef derive_vcg(beat: BeatAnalysis, t_onset_s: float | None = None,\n                t_offset_s: float | None = None) -> VCGResult | None:\n    warnings: list[str] = []\n    leads_used = [ld for ld in KORS_MATRIX if ld in beat.median_beats]\n    missing = [ld for ld in KORS_MATRIX if ld not in beat.median_beats]\n    if missing:\n        warnings.append(\n            \"Dérivation(s) manquante(s) pour la transformation de Kors : %s \"\n            \"— VCG non calculée.\" % \", \".join(missing)\n        )\n    if len(leads_used) < 6:\n        return None\n    if len(leads_used) < 8:\n        warnings.append(\n            \"VCG calculée avec seulement %d/8 dérivations indépendantes \"\n            \"(%s) — à interpréter avec prudence.\" % (len(leads_used), \", \".join(leads_used))\n        )\n\n    t_rel = beat.median_beats[leads_used[0]].t_rel\n    stacked = np.stack([beat.median_beats[ld].mv for ld in leads_used], axis=1)  # (n, k)\n    coeffs = np.array([KORS_MATRIX[ld] for ld in leads_used])  # (k, 3)\n    xyz = stacked @ coeffs\n    x, y, z = xyz[:, 0], xyz[:, 1], xyz[:, 2]\n\n    return _finish(t_rel, x, y, z, beat, leads_used, warnings, t_onset_s, t_offset_s)\n\n\ndef _finish(t_rel, x, y, z, beat, leads_used, warnings,\n            t_onset_s: float | None, t_offset_s: float | None) -> VCGResult:\n    in_qrs = (t_rel >= beat.qrs_onset_s) & (t_rel <= beat.qrs_offset_s)\n    magnitude = np.sqrt(x ** 2 + y ** 2 + z ** 2)\n\n    if in_qrs.sum() < 2:\n        warnings.append(\"Fenêtre QRS trop étroite pour la VCG — résultats non fiables.\")\n        idx_qrs_peak = int(np.argmax(magnitude))\n    else:\n        idx_qrs_peak = int(np.where(in_qrs)[0][np.argmax(magnitude[in_qrs])])\n    qrs_vec = (float(x[idx_qrs_peak]), float(y[idx_qrs_peak]), float(z[idx_qrs_peak]))\n    qrs_mag = float(magnitude[idx_qrs_peak])\n\n    t_window_source = \"delineation\"\n    if t_onset_s is None and t_offset_s is not None:\n        # Délinéation par tangente : fin de T connue, début non fourni.\n        t_onset_s = beat.qrs_offset_s + DEFAULT_T_SEARCH_START_S\n    if t_onset_s is None or t_offset_s is None or not (t_offset_s > t_onset_s):\n        t_onset_s = beat.qrs_offset_s + DEFAULT_T_SEARCH_START_S\n        t_offset_s = beat.qrs_offset_s + DEFAULT_T_SEARCH_END_S\n        t_window_source = \"heuristique\"\n    # Jamais au-delà du début du QRS suivant (FC rapide).\n    rr = rr_interval_s(beat)\n    if rr:\n        t_offset_s = min(t_offset_s, rr + min(beat.qrs_onset_s, 0.0) - 0.02)\n\n    tcrt = None\n    tcrt_n = None\n    t_win = (t_rel >= t_onset_s) & (t_rel <= t_offset_s)\n    if t_win.sum() < 2:\n        warnings.append(\"Fenêtre de l'onde T introuvable — angle QRS-T, TCRT et gradient \"\n                         \"ventriculaire spatial non calculés.\")\n        t_vec = (0.0, 0.0, 0.0)\n        t_mag = 0.0\n        angle = None\n    else:\n        idx_t_peak = int(np.where(t_win)[0][np.argmax(magnitude[t_win])])\n        t_vec = (float(x[idx_t_peak]), float(y[idx_t_peak]), float(z[idx_t_peak]))\n        t_mag = float(magnitude[idx_t_peak])\n        if qrs_mag > 1e-6 and t_mag > 1e-6:\n            cos_angle = np.dot(qrs_vec, t_vec) / (qrs_mag * t_mag)\n            cos_angle = float(np.clip(cos_angle, -1.0, 1.0))\n            angle = float(np.degrees(np.arccos(cos_angle)))\n\n            # TCRT (cf. docstring du module) : vecteur T de référence fixe\n            # (au pic de la boucle T, ci-dessus) vs. échantillons QRS dont\n            # la magnitude dépasse 70% du pic QRS.\n            qrs_dominant = in_qrs & (magnitude >= TCRT_QRS_MAGNITUDE_FRACTION * qrs_mag)\n            n_dom = int(qrs_dominant.sum())\n            if n_dom >= 1:\n                qrs_vectors = np.stack([x[qrs_dominant], y[qrs_dominant], z[qrs_dominant]], axis=1)\n                qrs_mags = magnitude[qrs_dominant]\n                t_vec_arr = np.array(t_vec)\n                cos_vals = (qrs_vectors @ t_vec_arr) / (qrs_mags * t_mag)\n                cos_vals = np.clip(cos_vals, -1.0, 1.0)\n                tcrt = float(np.mean(cos_vals))\n                tcrt_n = n_dom\n        else:\n            angle = None\n\n    az, elev = _azimuth_elevation(qrs_vec)\n\n    qrs_area_xy = _loop_area(x[in_qrs], y[in_qrs]) if in_qrs.sum() >= 3 else 0.0\n    qrs_area_xz = _loop_area(x[in_qrs], z[in_qrs]) if in_qrs.sum() >= 3 else 0.0\n    qrs_area_yz = _loop_area(y[in_qrs], z[in_qrs]) if in_qrs.sum() >= 3 else 0.0\n\n    t_area_xy = t_area_xz = t_area_yz = None\n    if t_win.sum() >= 3:\n        t_area_xy = _loop_area(x[t_win], y[t_win])\n        t_area_xz = _loop_area(x[t_win], z[t_win])\n        t_area_yz = _loop_area(y[t_win], z[t_win])\n\n    qrs_t_ratio = (qrs_mag / t_mag) if t_mag > 1e-6 else None\n\n    svg_vec = svg_mag = svg_az = svg_elev = None\n    qrs_area_vec = _area_vector(t_rel, x, y, z, in_qrs)\n    t_area_vec = _area_vector(t_rel, x, y, z, t_win)\n    if qrs_area_vec is not None and t_area_vec is not None:\n        svg_vec = tuple(q + t for q, t in zip(qrs_area_vec, t_area_vec))\n        svg_mag = float(np.sqrt(sum(c ** 2 for c in svg_vec)))\n        svg_az, svg_elev = _azimuth_elevation(svg_vec)\n    else:\n        warnings.append(\"Gradient ventriculaire spatial non calculable (fenêtre QRS \"\n                         \"ou T insuffisante).\")\n\n    # --- Vecteurs \"aire\" individuels (az/el) + angle QRS-T \"aire\" et\n    # distances vecteur-à-vecteur (variantes aire/pic), cf. BRAVEHEART\n    # (docstring du module).\n    qrs_area_mag = qrs_area_az = qrs_area_elev = None\n    if qrs_area_vec is not None:\n        qrs_area_mag = float(np.sqrt(sum(c ** 2 for c in qrs_area_vec)))\n        qrs_area_az, qrs_area_elev = _azimuth_elevation(qrs_area_vec)\n    t_area_mag = t_area_az = t_area_elev = None\n    if t_area_vec is not None:\n        t_area_mag = float(np.sqrt(sum(c ** 2 for c in t_area_vec)))\n        t_area_az, t_area_elev = _azimuth_elevation(t_area_vec)\n    t_peak_az, t_peak_elev = _azimuth_elevation(t_vec) if t_mag > 1e-6 else (None, None)\n\n    qrst_angle_area = _vec_angle_deg(qrs_area_vec, t_area_vec)\n    qrst_angle_peak_frontal = _frontal_angle_deg(qrs_vec, t_vec) if t_mag > 1e-6 else None\n    qrst_angle_area_frontal = _frontal_angle_deg(qrs_area_vec, t_area_vec)\n    qrst_dist_peak = _vec_distance(qrs_vec, t_vec) if t_mag > 1e-6 else None\n    qrst_dist_area = _vec_distance(qrs_area_vec, t_area_vec)\n\n    # --- SVG \"pic\" (somme des vecteurs pic, distinct du SVG \"aire\" ci-dessus)\n    svg_peak_vec = svg_peak_mag = svg_peak_az = svg_peak_elev = None\n    svg_svg_angle = None\n    if t_mag > 1e-6:\n        svg_peak_vec = tuple(q + t for q, t in zip(qrs_vec, t_vec))\n        svg_peak_mag = float(np.sqrt(sum(c ** 2 for c in svg_peak_vec)))\n        svg_peak_az, svg_peak_elev = _azimuth_elevation(svg_peak_vec)\n        svg_svg_angle = _vec_angle_deg(svg_vec, svg_peak_vec)\n\n    # --- SAI QRST (Sum Absolute Integral) : aire sous |X|,|Y|,|Z| et sous la\n    # magnitude (lead \"VM\"), sur la fenêtre QRST complète (onset QRS ->\n    # offset T). Cf. Tereshchenko LG et al. (concept d'hétérogénéité\n    # électrique globale), implémentation inspirée de BRAVEHEART.\n    sai_x = sai_y = sai_z = sai_vm = sai_qrst = None\n    qrst_mask = (t_rel >= beat.qrs_onset_s) & (t_rel <= t_offset_s)\n    if qrst_mask.sum() >= 3:\n        ti = t_rel[qrst_mask]\n        sai_x = _trapz(np.abs(x[qrst_mask]), ti)\n        sai_y = _trapz(np.abs(y[qrst_mask]), ti)\n        sai_z = _trapz(np.abs(z[qrst_mask]), ti)\n        sai_vm = _trapz(magnitude[qrst_mask], ti)\n        sai_qrst = sai_x + sai_y + sai_z\n\n    # --- Descripteurs cinétiques (vitesse 3D instantanée de la trajectoire VCG)\n    speed_qrst_max, speed_qrst_med, sti_qrst = _speed_stats(x, y, z, t_rel, qrst_mask)\n    speed_qrs_max, speed_qrs_med, sti_qrs = _speed_stats(x, y, z, t_rel, in_qrs)\n    speed_t_max, speed_t_med, sti_t = _speed_stats(x, y, z, t_rel, t_win)\n\n    return VCGResult(\n        t_rel=t_rel, x=x, y=y, z=z,\n        qrs_peak_vector=qrs_vec, qrs_peak_magnitude_mv=qrs_mag,\n        t_peak_vector=t_vec, t_peak_magnitude_mv=t_mag,\n        spatial_qrst_angle_deg=angle,\n        qrs_azimuth_deg=az, qrs_elevation_deg=elev,\n        qrs_loop_area_xy_mv2=qrs_area_xy, qrs_loop_area_xz_mv2=qrs_area_xz,\n        qrs_loop_area_yz_mv2=qrs_area_yz,\n        t_loop_area_xy_mv2=t_area_xy, t_loop_area_xz_mv2=t_area_xz,\n        t_loop_area_yz_mv2=t_area_yz,\n        qrs_t_amplitude_ratio=qrs_t_ratio,\n        tcrt=tcrt, tcrt_n_qrs_samples=tcrt_n,\n        t_window_source=t_window_source,\n        t_onset_s=float(t_onset_s), t_offset_s=float(t_offset_s),\n        svg_vector=svg_vec, svg_magnitude_mv_s=svg_mag,\n        svg_azimuth_deg=svg_az, svg_elevation_deg=svg_elev,\n        leads_used=leads_used, warnings=warnings,\n        qrs_area_vector=qrs_area_vec, qrs_area_magnitude_mv_s=qrs_area_mag,\n        qrs_area_azimuth_deg=qrs_area_az, qrs_area_elevation_deg=qrs_area_elev,\n        t_area_vector=t_area_vec, t_area_magnitude_mv_s=t_area_mag,\n        t_area_azimuth_deg=t_area_az, t_area_elevation_deg=t_area_elev,\n        t_peak_azimuth_deg=t_peak_az, t_peak_elevation_deg=t_peak_elev,\n        qrst_angle_area_deg=qrst_angle_area,\n        qrst_angle_peak_frontal_deg=qrst_angle_peak_frontal,\n        qrst_angle_area_frontal_deg=qrst_angle_area_frontal,\n        qrst_distance_peak_mv=qrst_dist_peak, qrst_distance_area_mv=qrst_dist_area,\n        svg_peak_vector=svg_peak_vec, svg_peak_magnitude_mv=svg_peak_mag,\n        svg_peak_azimuth_deg=svg_peak_az, svg_peak_elevation_deg=svg_peak_elev,\n        svg_svg_angle_deg=svg_svg_angle,\n        sai_x_mv_s=sai_x, sai_y_mv_s=sai_y, sai_z_mv_s=sai_z,\n        sai_vm_mv_s=sai_vm, sai_qrst_mv_s=sai_qrst,\n        speed_qrst_max_mv_s=speed_qrst_max, speed_qrst_med_mv_s=speed_qrst_med,\n        sti_qrst_mv=sti_qrst,\n        speed_qrs_max_mv_s=speed_qrs_max, speed_qrs_med_mv_s=speed_qrs_med,\n        sti_qrs_mv=sti_qrs,\n        speed_t_max_mv_s=speed_t_max, speed_t_med_mv_s=speed_t_med,\n        sti_t_mv=sti_t,\n    )\n", "ecg_hcm/vendor_formats.py": "\"\"\"\nvendor_formats.py\n=================\n\nLecture de mises en page PDF autres que GE CardioSoft/MUSE (format d'origine\nde `pdf_parser`). Chaque lecteur produit le même `ParsedECGPage` que le\nparseur GE, de sorte que tout l'aval (signal_builder, beat_detection, VCG...)\nest inchangé.\n\nFormats pris en charge (identifiés sur des exports réels des Cliniques\nuniversitaires Saint-Luc) :\n\n- **Cardionics** (\"PDF Export V1.0.0\", \"Cardionics S.A. © 2002\") : grille\n  3 lignes x 4 colonnes (dI/aVR/V1/V4, dII/aVL/V2/V5, dIII/aVF/V3/V6) de\n  2,5 s chacune + bande rythme dII pleine largeur (10 s). Tracés = objets\n  `curve`. **Résolution faible** : un point tous les 0,85 pt (0,3 mm), soit\n  ~84 Hz à 25 mm/s — les durées (QRS, PR, QT) ont donc une granularité de\n  ~12 ms et les mesures fines (pente, notching, boucles VCG) sont moins\n  fiables qu'avec le format GE (500 Hz). Pas de mesures appareil dans\n  l'en-tête (FC, QTc...) : la validation croisée du smoke test est\n  impossible.\n- **Dräger** (\"Rapport ECG 12D\") : grille 6 lignes x 2 colonnes (I..aVF à\n  gauche, V1..V6 à droite) de ~5 s chacune, **sans bande rythme** — la\n  dérivation II de la grille sert de bande rythme pour la détection des\n  battements. Tracés = suites de segments `line` (1200 points, ~236 Hz).\n  En-tête avec FC, PR/QT/QTc, durée QRS et axes.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nimport statistics\n\nfrom .pdf_parser import CalibPulse, ParsedECGPage, RawTrace, STANDARD_LEADS\n\n_LEAD_ALIASES = {\"dI\": \"I\", \"dII\": \"II\", \"dIII\": \"III\"}\n\n\ndef _norm_lead(text: str) -> str | None:\n    t = _LEAD_ALIASES.get(text, text)\n    return t if t in STANDARD_LEADS else None\n\n\ndef _is_black(color) -> bool:\n    if color is None:\n        return True\n    try:\n        return all(float(v) < 0.05 for v in color)\n    except TypeError:\n        return False\n\n\ndef _median_y(pts) -> float:\n    return statistics.median(p[1] for p in pts)\n\n\ndef detect_vendor(text: str) -> str | None:\n    if \"Cardionics\" in text:\n        return \"cardionics\"\n    if \"Rapport ECG 12D\" in text or \"Dräger\" in text or \"Drager\" in text:\n        return \"drager\"\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Appariement générique tracés <-> libellés <-> impulsions\n# ---------------------------------------------------------------------------\n\ndef _assign(result: ParsedECGPage, polylines: list[list[tuple[float, float]]],\n            labels: list[dict], pulses: list[dict], full_width_threshold: float):\n    \"\"\"`labels` : dicts {lead, x0, mid}. Chaque tracé de grille est associé au\n    libellé de sa colonne (libellé juste à gauche du début du tracé, à 40 pt\n    près) le plus proche verticalement de sa ligne de base (médiane des y).\n    Les tracés pleine largeur deviennent la bande rythme, associée au\n    libellé restant le plus proche verticalement.\"\"\"\n    used = set()\n    grid, full = [], []\n    for pts in polylines:\n        xs = [p[0] for p in pts]\n        (full if (max(xs) - min(xs)) > full_width_threshold else grid).append(pts)\n\n    def _make(lead, pts, is_full, label_mid):\n        ys = [p[1] for p in pts]\n        xs = [p[0] for p in pts]\n        return RawTrace(lead=lead, pts=pts, x0=min(xs), x1=max(xs), top=min(ys),\n                        bottom=max(ys), is_full_width=is_full, label_top=label_mid)\n\n    for pts in grid:\n        x_start, y_med = pts[0][0], _median_y(pts)\n        cands = [i for i, lb in enumerate(labels)\n                 if i not in used and -40 <= x_start - lb[\"x0\"] <= 40]\n        if not cands:\n            result.warnings.append(\"Tracé à x=%.0f sans libellé de dérivation.\" % x_start)\n            continue\n        i = min(cands, key=lambda k: abs(labels[k][\"mid\"] - y_med))\n        used.add(i)\n        lb = labels[i]\n        if lb[\"lead\"] in result.traces:\n            result.warnings.append(\"Dérivation %s rencontrée deux fois.\" % lb[\"lead\"])\n            continue\n        result.traces[lb[\"lead\"]] = _make(lb[\"lead\"], pts, False, lb[\"mid\"])\n\n    for pts in full:\n        y_med = _median_y(pts)\n        cands = [i for i in range(len(labels)) if i not in used]\n        if not cands:\n            continue\n        i = min(cands, key=lambda k: abs(labels[k][\"mid\"] - y_med))\n        used.add(i)\n        lead = labels[i][\"lead\"] + \"_rhythm\"\n        result.traces[lead] = _make(lead, pts, True, labels[i][\"mid\"])\n\n    # Impulsions : celle dont la ligne de base (bas du créneau) est la plus\n    # proche de la ligne de base du tracé (même ligne de la grille).\n    for key, tr in result.traces.items():\n        if not pulses:\n            break\n        y_med = _median_y(tr.pts)\n        p = min(pulses, key=lambda q: abs(q[\"bottom\"] - y_med))\n        if abs(p[\"bottom\"] - y_med) < 20:\n            result.calib_pulses[key] = CalibPulse(\n                lead=key, top=p[\"top\"], bottom=p[\"bottom\"], x0=p[\"x0\"], x1=p[\"x1\"],\n                height_pt=p[\"bottom\"] - p[\"top\"])\n\n\ndef _labels_from_words(words, min_top: float, max_top: float) -> list[dict]:\n    out = []\n    for w in words:\n        lead = _norm_lead(w[\"text\"])\n        if lead and min_top <= w[\"top\"] <= max_top:\n            out.append({\"lead\": lead, \"x0\": w[\"x0\"], \"mid\": (w[\"top\"] + w[\"bottom\"]) / 2})\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Cardionics\n# ---------------------------------------------------------------------------\n\ndef _cardionics_meta(text: str) -> dict:\n    meta: dict = {}\n    m = re.search(r\"(\\d+(?:\\.\\d+)?)\\s*mm/sec\", text)\n    if m:\n        meta[\"paper_speed_mm_s\"] = float(m.group(1))\n    m = re.search(r\"(\\d+(?:\\.\\d+)?)\\s*mm/mV\", text)\n    if m:\n        meta[\"gain_limb_mm_mV\"] = meta[\"gain_chest_mm_mV\"] = float(m.group(1))\n    m = re.search(r\"Age:\\s*(\\d+)\\s*\\n?\\s*([MFmf])\\b\", text)\n    if m:\n        meta[\"age_years\"] = int(m.group(1))\n        meta[\"sex_raw\"] = m.group(2)\n    else:\n        m = re.search(r\"Age:\\s*(\\d+)\", text)\n        if m:\n            meta[\"age_years\"] = int(m.group(1))\n    m = re.search(r\"ECG from (\\d{2}/\\d{2}/\\d{4}) at (\\d{2}:\\d{2}:\\d{2})\", text)\n    if m:\n        meta[\"exam_datetime_raw\"] = \"%s %s\" % (m.group(1), m.group(2))\n    meta[\"device_format\"] = \"Cardionics\"\n    return meta\n\n\ndef parse_cardionics(page, text: str) -> ParsedECGPage:\n    result = ParsedECGPage(header_text=text, metadata=_cardionics_meta(text),\n                           page_width=page.width, page_height=page.height)\n    words = page.extract_words()\n    labels = _labels_from_words(words, 150, page.height - 60)\n\n    polylines = [list(c[\"pts\"]) for c in page.curves\n                 if len(c[\"pts\"]) >= 100 and _is_black(c.get(\"stroking_color\"))]\n\n    # Impulsion d'étalonnage = créneau en segments noirs : deux verticales\n    # (montée/descente) de même hauteur. On garde une verticale par créneau.\n    pulses, seen = [], set()\n    for ln in page.lines:\n        if not _is_black(ln.get(\"stroking_color\")):\n            continue\n        h = ln[\"bottom\"] - ln[\"top\"]\n        if abs(ln[\"x1\"] - ln[\"x0\"]) < 0.5 and h > 5:\n            key = round(ln[\"bottom\"])\n            if key in seen:\n                continue\n            seen.add(key)\n            pulses.append({\"top\": ln[\"top\"], \"bottom\": ln[\"bottom\"],\n                           \"x0\": ln[\"x0\"], \"x1\": ln[\"x0\"]})\n\n    if polylines:\n        widths = sorted(max(p[0] for p in pts) - min(p[0] for p in pts) for pts in polylines)\n        _assign(result, polylines, labels, pulses, 1.5 * widths[len(widths) // 2])\n        # Grille 3x4 : chaque colonne couvre une tranche de 2,5 s différente,\n        # alignée en abscisse sur la bande rythme (même échelle de temps).\n        # Le temps 0 de toutes les dérivations est donc le début de la bande\n        # rythme, pour que les instants R détectés sur celle-ci tombent au bon\n        # endroit dans chaque dérivation.\n        rhythm = [t for t in result.traces.values() if t.is_full_width]\n        origin = rhythm[0].x0 if rhythm else min(t.x0 for t in result.traces.values())\n        for t in result.traces.values():\n            t.time_origin_x = origin\n    result.warnings.append(\n        \"Format Cardionics : tracé échantillonné à ~84 Hz seulement (1 point / \"\n        \"0,3 mm) — granularité ~12 ms sur les durées, mesures fines à \"\n        \"interpréter avec prudence ; aucune mesure appareil dans l'en-tête \"\n        \"pour la validation croisée.\")\n    return result\n\n\n# ---------------------------------------------------------------------------\n# Dräger\n# ---------------------------------------------------------------------------\n\ndef _drager_meta(text: str) -> dict:\n    meta: dict = {}\n    flat = text.replace(\"\\n\", \" \")\n    m = re.search(r\"FC\\s*:\\s*(\\d+)\", flat)\n    if m:\n        meta[\"heart_rate_bpm\"] = float(m.group(1))\n    m = re.search(r\"Axes QRS/P/T\\s+(-?\\d+)\\s*/\\s*(-?\\d+)\\s*/\\s*(-?\\d+)\", flat)\n    if m:\n        meta[\"axis_qrs_deg\"], meta[\"axis_p_deg\"], meta[\"axis_t_deg\"] = (int(g) for g in m.groups())\n    m = re.search(r\"PR/QT/QTC\\(ms\\)\\s+(\\d+)\\s*/\\s*(\\d+)\\s*/\\s*(\\d+)\", flat)\n    if m:\n        meta[\"pr_ms\"], meta[\"qt_ms\"], meta[\"qtc_ms\"] = (float(g) for g in m.groups())\n    m = re.search(r\"Dur[ée]e QRS/P\\(ms\\)\\s+(\\d+)\\s*/\\s*(\\d+)\", flat)\n    if m:\n        meta[\"qrs_duration_ms\"] = float(m.group(1))\n    m = re.search(r\"sexe\\s*:\\s*(\\w+)\", flat)\n    if m:\n        meta[\"sex_raw\"] = m.group(1)\n    m = re.search(r\"Date d'examen\\s*:\\s*(\\d{2}/\\d{2}/\\d{4}\\s+\\d{2}:\\d{2}:\\d{2})\", flat)\n    if m:\n        meta[\"exam_datetime_raw\"] = m.group(1)\n    m = re.search(r\"(\\d+(?:\\.\\d+)?)\\s*mm/mV\", flat)\n    if m:\n        meta[\"gain_limb_mm_mV\"] = meta[\"gain_chest_mm_mV\"] = float(m.group(1))\n    m = re.search(r\"(\\d+(?:\\.\\d+)?)\\s*mm/s\\b\", flat)\n    if m:\n        meta[\"paper_speed_mm_s\"] = float(m.group(1))\n    meta[\"device_format\"] = \"Dräger\"\n    return meta\n\n\ndef _chain_segments(lines) -> list[list[tuple[float, float]]]:\n    \"\"\"Recolle les segments consécutifs (fin du précédent = début du suivant)\n    en polylignes, dans l'ordre de dessin du PDF.\"\"\"\n    chains: list[list[tuple[float, float]]] = []\n    prev_end = None\n    for ln in lines:\n        a, b = tuple(ln[\"pts\"][0]), tuple(ln[\"pts\"][-1])\n        if prev_end is not None and abs(a[0] - prev_end[0]) < 0.01 and abs(a[1] - prev_end[1]) < 0.01:\n            chains[-1].append(b)\n        else:\n            chains.append([a, b])\n        prev_end = b\n    return chains\n\n\ndef parse_drager(page, text: str) -> ParsedECGPage:\n    result = ParsedECGPage(header_text=text, metadata=_drager_meta(text),\n                           page_width=page.width, page_height=page.height)\n    words = page.extract_words()\n    labels = _labels_from_words(words, 120, page.height - 60)\n\n    black = [ln for ln in page.lines if _is_black(ln.get(\"stroking_color\"))]\n    polylines = [c for c in _chain_segments(black) if len(c) >= 100]\n\n    pulses = []\n    for c in page.curves:\n        ys = [p[1] for p in c[\"pts\"]]\n        xs = [p[0] for p in c[\"pts\"]]\n        if 4 <= len(ys) < 100 and max(ys) - min(ys) > 5:\n            pulses.append({\"top\": min(ys), \"bottom\": max(ys), \"x0\": min(xs), \"x1\": max(xs)})\n\n    _assign(result, polylines, labels, pulses, float(\"inf\"))\n\n    if \"II\" in result.traces:\n        tr = result.traces[\"II\"]\n        result.traces[\"II_rhythm\"] = RawTrace(\n            lead=\"II_rhythm\", pts=tr.pts, x0=tr.x0, x1=tr.x1, top=tr.top,\n            bottom=tr.bottom, is_full_width=True, label_top=tr.label_top)\n        if \"II\" in result.calib_pulses:\n            result.calib_pulses[\"II_rhythm\"] = result.calib_pulses[\"II\"]\n        result.warnings.append(\n            \"Format Dräger : pas de bande rythme sur ce rapport — la dérivation \"\n            \"II de la grille (~5 s) sert à la détection des battements.\")\n    return result\n", "pdfplumber/__init__.py": "__all__ = [\n    \"__version__\",\n    \"utils\",\n    \"pdfminer\",\n    \"open\",\n    \"repair\",\n    \"set_debug\",\n]\n\nimport pdfminer\nimport pdfminer.pdftypes\n\nfrom . import utils\nfrom ._version import __version__\nfrom .pdf import PDF\nfrom .repair import repair\n\nopen = PDF.open\n", "pdfplumber/_typing.py": "from typing import Any, Dict, Iterable, List, Literal, Sequence, Tuple, Union\n\nT_seq = Sequence\nT_num = Union[int, float]\nT_point = Tuple[T_num, T_num]\nT_bbox = Tuple[T_num, T_num, T_num, T_num]\nT_obj = Dict[str, Any]\nT_obj_list = List[T_obj]\nT_obj_iter = Iterable[T_obj]\nT_dir = Union[Literal[\"ltr\"], Literal[\"rtl\"], Literal[\"ttb\"], Literal[\"btt\"]]\n", "pdfplumber/_version.py": "version_info = (0, 11, 10)\n__version__ = \".\".join(map(str, version_info))\n", "pdfplumber/cli.py": "#!/usr/bin/env python\nimport argparse\nimport json\nimport sys\nfrom collections import defaultdict, deque\nfrom itertools import chain\nfrom typing import Any, DefaultDict, Dict, List\n\nfrom .pdf import PDF\n\nif len(sys.argv) == 1:\n    sys.argv.append(\"--help\")\n\n\ndef parse_page_spec(p_str: str) -> List[int]:\n    if \"-\" in p_str:\n        start, end = map(int, p_str.split(\"-\"))\n        return list(range(start, end + 1))\n    else:\n        return [int(p_str)]\n\n\ndef parse_args(args_raw: List[str]) -> argparse.Namespace:\n    parser = argparse.ArgumentParser(\"pdfplumber\")\n\n    parser.add_argument(\"infile\", nargs=\"?\", type=argparse.FileType(\"rb\"))\n    group = parser.add_mutually_exclusive_group()\n    group.add_argument(\n        \"--structure\",\n        help=\"Write the structure tree as JSON.  \"\n        \"All other arguments except --pages, --laparams, and --indent will be ignored\",\n        action=\"store_true\",\n    )\n    group.add_argument(\n        \"--structure-text\",\n        help=\"Write the structure tree as JSON including text contents.  \"\n        \"All other arguments except --pages, --laparams, and --indent will be ignored\",\n        action=\"store_true\",\n    )\n\n    parser.add_argument(\"--format\", choices=[\"csv\", \"json\", \"text\"], default=\"csv\")\n\n    parser.add_argument(\"--types\", nargs=\"+\")\n\n    parser.add_argument(\n        \"--include-attrs\",\n        nargs=\"+\",\n        help=\"Include *only* these object attributes in output.\",\n    )\n\n    parser.add_argument(\n        \"--exclude-attrs\",\n        nargs=\"+\",\n        help=\"Exclude these object attributes from output.\",\n    )\n\n    parser.add_argument(\"--laparams\", type=json.loads)\n\n    parser.add_argument(\"--precision\", type=int)\n\n    parser.add_argument(\"--pages\", nargs=\"+\", type=parse_page_spec)\n\n    parser.add_argument(\n        \"--indent\", type=int, help=\"Indent level for JSON pretty-printing.\"\n    )\n\n    args = parser.parse_args(args_raw)\n    if args.pages is not None:\n        args.pages = list(chain(*args.pages))\n    return args\n\n\ndef add_text_to_mcids(pdf: PDF, data: List[Dict[str, Any]]) -> None:\n    page_contents: DefaultDict[int, Any] = defaultdict(lambda: defaultdict(str))\n    for page in pdf.pages:\n        text_contents = page_contents[page.page_number]\n        for c in page.chars:\n            mcid = c.get(\"mcid\")\n            if mcid is None:\n                continue\n            text_contents[mcid] += c[\"text\"]\n    d = deque(data)\n    while d:\n        el = d.popleft()\n        if \"children\" in el:\n            d.extend(el[\"children\"])\n        pageno = el.get(\"page_number\")\n        if pageno is None:\n            continue\n        text_contents = page_contents[pageno]\n        if \"mcids\" in el:\n            el[\"text\"] = [text_contents[mcid] for mcid in el[\"mcids\"]]\n\n\ndef main(args_raw: List[str] = sys.argv[1:]) -> None:\n    args = parse_args(args_raw)\n\n    with PDF.open(args.infile, pages=args.pages, laparams=args.laparams) as pdf:\n        if args.structure:\n            print(json.dumps(pdf.structure_tree, indent=args.indent))\n        elif args.structure_text:\n            tree = pdf.structure_tree\n            add_text_to_mcids(pdf, tree)\n            print(json.dumps(tree, indent=args.indent, ensure_ascii=False))\n        elif args.format == \"csv\":\n            pdf.to_csv(\n                sys.stdout,\n                args.types,\n                precision=args.precision,\n                include_attrs=args.include_attrs,\n                exclude_attrs=args.exclude_attrs,\n            )\n        elif args.format == \"text\":\n            for page in pdf.pages:\n                print(page.extract_text(layout=True))\n        else:\n            pdf.to_json(\n                sys.stdout,\n                args.types,\n                precision=args.precision,\n                include_attrs=args.include_attrs,\n                exclude_attrs=args.exclude_attrs,\n                indent=args.indent,\n            )\n\n\nif __name__ == \"__main__\":\n    main()\n", "pdfplumber/container.py": "import csv\nimport json\nfrom io import StringIO\nfrom itertools import chain\nfrom typing import Any, Dict, List, Optional, Set, TextIO\n\nfrom . import utils\nfrom ._typing import T_obj, T_obj_list\nfrom .convert import CSV_COLS_REQUIRED, CSV_COLS_TO_PREPEND, Serializer\n\n\nclass Container(object):\n    cached_properties = [\"_rect_edges\", \"_curve_edges\", \"_edges\", \"_objects\"]\n\n    @property\n    def pages(self) -> Optional[List[Any]]:  # pragma: nocover\n        raise NotImplementedError\n\n    @property\n    def objects(self) -> Dict[str, T_obj_list]:  # pragma: nocover\n        raise NotImplementedError\n\n    def to_dict(\n        self, object_types: Optional[List[str]] = None\n    ) -> Dict[str, Any]:  # pragma: nocover\n        raise NotImplementedError\n\n    def flush_cache(self, properties: Optional[List[str]] = None) -> None:\n        props = self.cached_properties if properties is None else properties\n        for p in props:\n            if hasattr(self, p):\n                delattr(self, p)\n\n    @property\n    def rects(self) -> T_obj_list:\n        return self.objects.get(\"rect\", [])\n\n    @property\n    def lines(self) -> T_obj_list:\n        return self.objects.get(\"line\", [])\n\n    @property\n    def curves(self) -> T_obj_list:\n        return self.objects.get(\"curve\", [])\n\n    @property\n    def images(self) -> T_obj_list:\n        return self.objects.get(\"image\", [])\n\n    @property\n    def chars(self) -> T_obj_list:\n        return self.objects.get(\"char\", [])\n\n    @property\n    def textboxverticals(self) -> T_obj_list:\n        return self.objects.get(\"textboxvertical\", [])\n\n    @property\n    def textboxhorizontals(self) -> T_obj_list:\n        return self.objects.get(\"textboxhorizontal\", [])\n\n    @property\n    def textlineverticals(self) -> T_obj_list:\n        return self.objects.get(\"textlinevertical\", [])\n\n    @property\n    def textlinehorizontals(self) -> T_obj_list:\n        return self.objects.get(\"textlinehorizontal\", [])\n\n    @property\n    def rect_edges(self) -> T_obj_list:\n        if hasattr(self, \"_rect_edges\"):\n            return self._rect_edges\n        rect_edges_gen = (utils.rect_to_edges(r) for r in self.rects)\n        self._rect_edges: T_obj_list = list(chain(*rect_edges_gen))\n        return self._rect_edges\n\n    @property\n    def curve_edges(self) -> T_obj_list:\n        if hasattr(self, \"_curve_edges\"):\n            return self._curve_edges\n        curve_edges_gen = (utils.curve_to_edges(r) for r in self.curves)\n        self._curve_edges: T_obj_list = list(chain(*curve_edges_gen))\n        return self._curve_edges\n\n    @property\n    def edges(self) -> T_obj_list:\n        if hasattr(self, \"_edges\"):\n            return self._edges\n        line_edges = list(map(utils.line_to_edge, self.lines))\n        self._edges: T_obj_list = line_edges + self.rect_edges + self.curve_edges\n        return self._edges\n\n    @property\n    def horizontal_edges(self) -> T_obj_list:\n        def test(x: T_obj) -> bool:\n            return bool(x[\"orientation\"] == \"h\")\n\n        return list(filter(test, self.edges))\n\n    @property\n    def vertical_edges(self) -> T_obj_list:\n        def test(x: T_obj) -> bool:\n            return bool(x[\"orientation\"] == \"v\")\n\n        return list(filter(test, self.edges))\n\n    def to_json(\n        self,\n        stream: Optional[TextIO] = None,\n        object_types: Optional[List[str]] = None,\n        include_attrs: Optional[List[str]] = None,\n        exclude_attrs: Optional[List[str]] = None,\n        precision: Optional[int] = None,\n        indent: Optional[int] = None,\n    ) -> Optional[str]:\n\n        data = self.to_dict(object_types)\n\n        serialized = Serializer(\n            precision=precision,\n            include_attrs=include_attrs,\n            exclude_attrs=exclude_attrs,\n        ).serialize(data)\n\n        if stream is None:\n            return json.dumps(serialized, indent=indent)\n        else:\n            json.dump(serialized, stream, indent=indent)\n            return None\n\n    def to_csv(\n        self,\n        stream: Optional[TextIO] = None,\n        object_types: Optional[List[str]] = None,\n        precision: Optional[int] = None,\n        include_attrs: Optional[List[str]] = None,\n        exclude_attrs: Optional[List[str]] = None,\n    ) -> Optional[str]:\n        if stream is None:\n            stream = StringIO()\n            to_string = True\n        else:\n            to_string = False\n\n        if object_types is None:\n            object_types = list(self.objects.keys()) + [\"annot\"]\n\n        serialized = []\n        fields: Set[str] = set()\n\n        pages = [self] if self.pages is None else self.pages\n\n        serializer = Serializer(\n            precision=precision,\n            include_attrs=include_attrs,\n            exclude_attrs=exclude_attrs,\n        )\n        for page in pages:\n            for t in object_types:\n                objs = getattr(page, t + \"s\")\n                if len(objs):\n                    serialized += serializer.serialize(objs)\n                    new_keys = [k for k, v in objs[0].items() if type(v) is not dict]\n                    fields = fields.union(set(new_keys))\n\n        non_req_cols = CSV_COLS_TO_PREPEND + list(\n            sorted(set(fields) - set(CSV_COLS_REQUIRED + CSV_COLS_TO_PREPEND))\n        )\n\n        cols = CSV_COLS_REQUIRED + list(filter(serializer.attr_filter, non_req_cols))\n\n        w = csv.DictWriter(\n            stream,\n            fieldnames=cols,\n            extrasaction=\"ignore\",\n            quoting=csv.QUOTE_MINIMAL,\n            escapechar=\"\\\\\",\n        )\n        w.writeheader()\n        w.writerows(serialized)\n\n        if to_string:\n            stream.seek(0)\n            return stream.read()\n        else:\n            return None\n", "pdfplumber/convert.py": "import base64\nfrom typing import Any, Callable, Dict, List, Optional, Tuple\n\nfrom pdfminer.psparser import PSLiteral\n\nfrom .utils import decode_text\n\nENCODINGS_TO_TRY = [\n    \"utf-8\",\n    \"latin-1\",\n    \"utf-16\",\n    \"utf-16le\",\n]\n\nCSV_COLS_REQUIRED = [\n    \"object_type\",\n]\n\nCSV_COLS_TO_PREPEND = [\n    \"page_number\",\n    \"x0\",\n    \"x1\",\n    \"y0\",\n    \"y1\",\n    \"doctop\",\n    \"top\",\n    \"bottom\",\n    \"width\",\n    \"height\",\n]\n\n\ndef get_attr_filter(\n    include_attrs: Optional[List[str]] = None, exclude_attrs: Optional[List[str]] = None\n) -> Callable[[str], bool]:\n    if include_attrs is not None and exclude_attrs is not None:\n        raise ValueError(\n            \"Cannot specify `include_attrs` and `exclude_attrs` at the same time.\"\n        )\n\n    elif include_attrs is not None:\n        incl = set(CSV_COLS_REQUIRED + include_attrs)\n        return lambda attr: attr in incl\n\n    elif exclude_attrs is not None:\n        nonexcludable = set(exclude_attrs).intersection(set(CSV_COLS_REQUIRED))\n        if len(nonexcludable):\n            raise ValueError(\n                f\"Cannot exclude these required properties: {list(nonexcludable)}\"\n            )\n        excl = set(exclude_attrs)\n        return lambda attr: attr not in excl\n\n    else:\n        return lambda attr: True\n\n\ndef to_b64(data: bytes) -> str:\n    return base64.b64encode(data).decode(\"ascii\")\n\n\nclass Serializer:\n    def __init__(\n        self,\n        precision: Optional[int] = None,\n        include_attrs: Optional[List[str]] = None,\n        exclude_attrs: Optional[List[str]] = None,\n    ):\n\n        self.precision = precision\n        self.attr_filter = get_attr_filter(\n            include_attrs=include_attrs, exclude_attrs=exclude_attrs\n        )\n\n    def serialize(self, obj: Any) -> Any:\n        if obj is None:\n            return None\n\n        t = type(obj)\n\n        # Basic types don't need to be converted\n        if t in (int, str):\n            return obj\n\n        # Use one of the custom converters, if possible\n        fn = getattr(self, f\"do_{t.__name__}\", None)\n        if fn is not None:\n            return fn(obj)\n\n        # Otherwise, just use the string-representation\n        else:\n            return str(obj)\n\n    def do_float(self, x: float) -> float:\n        return x if self.precision is None else round(x, self.precision)\n\n    def do_bool(self, x: bool) -> int:\n        return int(x)\n\n    def do_list(self, obj: List[Any]) -> List[Any]:\n        return list(self.serialize(x) for x in obj)\n\n    def do_tuple(self, obj: Tuple[Any, ...]) -> Tuple[Any, ...]:\n        return tuple(self.serialize(x) for x in obj)\n\n    def do_dict(self, obj: Dict[str, Any]) -> Dict[str, Any]:\n        if \"object_type\" in obj.keys():\n            return {k: self.serialize(v) for k, v in obj.items() if self.attr_filter(k)}\n        else:\n            return {k: self.serialize(v) for k, v in obj.items()}\n\n    def do_PDFStream(self, obj: Any) -> Dict[str, Optional[str]]:\n        return {\"rawdata\": to_b64(obj.rawdata) if obj.rawdata else None}\n\n    def do_PSLiteral(self, obj: PSLiteral) -> str:\n        return decode_text(obj.name)\n\n    def do_bytes(self, obj: bytes) -> Optional[str]:\n        for e in ENCODINGS_TO_TRY:\n            try:\n                return obj.decode(e)\n            except UnicodeDecodeError:  # pragma: no cover\n                return None\n        # If none of the decodings work, raise whatever error\n        # decoding with utf-8 causes\n        obj.decode(ENCODINGS_TO_TRY[0])  # pragma: no cover\n        return None  # pragma: no cover\n", "pdfplumber/ctm.py": "import math\nfrom typing import NamedTuple\n\n# For more details, see the PDF Reference, 6th Ed., Section 4.2.2 (\"Common\n# Transformations\")\n\n\nclass CTM(NamedTuple):\n    a: float\n    b: float\n    c: float\n    d: float\n    e: float\n    f: float\n\n    @property\n    def scale_x(self) -> float:\n        return math.sqrt(pow(self.a, 2) + pow(self.b, 2))\n\n    @property\n    def scale_y(self) -> float:\n        return math.sqrt(pow(self.c, 2) + pow(self.d, 2))\n\n    @property\n    def skew_x(self) -> float:\n        return (math.atan2(self.d, self.c) * 180 / math.pi) - 90\n\n    @property\n    def skew_y(self) -> float:\n        return math.atan2(self.b, self.a) * 180 / math.pi\n\n    @property\n    def translation_x(self) -> float:\n        return self.e\n\n    @property\n    def translation_y(self) -> float:\n        return self.f\n", "pdfplumber/display.py": "import pathlib\nfrom io import BufferedReader, BytesIO\nfrom typing import TYPE_CHECKING, Any, List, Optional, Tuple, Union\n\nimport PIL.Image\nimport PIL.ImageDraw\nimport pypdfium2  # type: ignore\n\nfrom . import utils\nfrom ._typing import T_bbox, T_num, T_obj, T_obj_list, T_point, T_seq\nfrom .table import T_table_settings, Table, TableFinder, TableSettings\nfrom .utils.exceptions import MalformedPDFException\n\nif TYPE_CHECKING:  # pragma: nocover\n    import pandas as pd\n\n    from .page import Page\n\n\nclass COLORS:\n    RED = (255, 0, 0)\n    GREEN = (0, 255, 0)\n    BLUE = (0, 0, 255)\n    TRANSPARENT = (0, 0, 0, 0)\n\n\nDEFAULT_FILL = COLORS.BLUE + (50,)\nDEFAULT_STROKE = COLORS.RED + (200,)\nDEFAULT_STROKE_WIDTH = 1\nDEFAULT_RESOLUTION = 72\n\nT_color = Union[Tuple[int, int, int], Tuple[int, int, int, int], str]\nT_contains_points = Union[Tuple[T_point, ...], L
