 key=lambda pinfo: abs(pinfo[\"mid\"] - t.label_top),\n                      default=None)\n        if nearest is not None and abs(nearest[\"mid\"] - t.label_top) < row_tol:\n            result.calib_pulses[t.lead] = CalibPulse(\n                lead=t.lead, top=nearest[\"top\"], bottom=nearest[\"bottom\"],\n                x0=nearest[\"x0\"], x1=nearest[\"x1\"], height_pt=nearest[\"height_pt\"],\n            )\n        else:\n            unmatched += 1\n\n    if unmatched:\n        result.warnings.append(\n            \"%d dérivation(s) sans impulsion d'étalonnage appariée — \"\n            \"repli sur les valeurs mm/mV de l'en-tête pour celles-ci.\"\n            % unmatched\n        )\n\n    return result\n", "ecg_hcm/pipeline.py": "\"\"\"\npipeline.py\n===========\n\nOrchestration bout-en-bout : PDF -> résultat structuré unique.\n\nIMPORTANT (vie privée) : le texte brut de l'en-tête PDF (`header_text`,\nqui contient le nom du patient) N'EST JAMAIS inclus dans le résultat\nretourné par `process_pdf`. Seuls les champs numériques/démographiques\nutiles à la recherche (âge, sexe, identifiants d'examen non-nominatifs)\nsont conservés. Ne pas modifier ce module pour propager `header_text` ou\nle texte brut vers la sortie tabulaire (`batch.py`) sans y réfléchir à\ndeux fois.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom . import conventional_features as cf\nfrom . import loop_morphology as lm\nfrom . import p_wave_features as pwf\nfrom . import repolarization_features as rf\nfrom . import romhilt_estes as re_score\nfrom . import signal_quality as sq\nfrom . import t_wave_complexity as twc\nfrom . import vcg as vcgmod\nfrom .beat_detection import BeatAnalysis, analyze as analyze_beats\nfrom .identity import fill_from_filename, normalize_datetime\nfrom .pdf_parser import ParsedECGPage, parse_pdf\nfrom .signal_builder import ECGRecording, build_recording\n\n\n@dataclass\nclass PatientECGResult:\n    source_file: str\n    status: str  # \"ok\" | \"error\"\n    error_message: str | None = None\n    metadata: dict = field(default_factory=dict)  # sans nom/date de naissance\n    heart_rate_bpm_measured: float | None = None\n    n_beats_detected: int = 0\n    qrs_duration_ms_measured: float | None = None\n    qtc_bazett_ms_measured: float | None = None\n    qt_ms_measured: float | None = None  # médiane des QT par dérivation retenus\n    qtc_fridericia_ms_measured: float | None = None\n    qt_source_for_qtc: str | None = None  # \"en-tête\" | \"mesuré\"\n    pr_ms_measured: float | None = None\n    iceb: float | None = None   # QT / QRS (header quand disponible)\n    icebc: float | None = None  # QTc / QRS (index of cardiac electrophysiological balance, corrigé)\n    frontal_qrst_angle_deg: float | None = None  # |axe QRS - axe T| (en-tête), replié dans [0,180]\n    signal_quality_score: float | None = None  # 0-1, cf. signal_quality.py ; None si NeuroKit2 absent\n    conventional: cf.ConventionalFeatures | None = None\n    repolarization: rf.RepolarizationFeatures | None = None\n    p_wave: pwf.PWaveFeatures | None = None\n    romhilt_estes: re_score.RomhiltEstesResult | None = None\n    # Score de Perugia (Verdecchia et al., J Am Coll Cardiol 1998;31:383) :\n    # HVG si au moins un critère parmi Cornell à seuils Perugia, strain\n    # typique, Romhilt-Estes >= 5 points.\n    perugia_positive: bool | None = None\n    perugia_criteria: list[str] = field(default_factory=list)\n    vcg: vcgmod.VCGResult | None = None\n    loop_morphology: lm.LoopMorphologyResult | None = None\n    t_wave_complexity: twc.TWaveComplexityResult | None = None\n    recording: ECGRecording | None = None\n    beat: BeatAnalysis | None = None\n    warnings: list[str] = field(default_factory=list)\n    identity: dict = field(default_factory=dict)  # nominatif, cf. identity.py\n\n\ndef _global_t_window(repol: rf.RepolarizationFeatures, leads_of_interest: list[str]\n                      ) -> tuple[float | None, float | None]:\n    \"\"\"Fenêtre T globale (médiane) à partir des délinéations par\n    dérivation disponibles, restreinte aux dérivations utilisées par la\n    transformation de Kors — sert à affiner la fenêtre T de la VCG.\n\n    N'utilise que les dérivations dont le T-end a passé le garde-fou de\n    plausibilité de `repolarization_features.py` (écart < 25% vs. QT de\n    l'en-tête, cf. `qt_ms_by_lead`). Sans ce filtre, une délinéation par\n    ondelettes défaillante sur plusieurs dérivations (déjà écartée à juste\n    titre du calcul de dispersion du QT) contaminait quand même la fenêtre\n    T de la VCG, avec pour conséquence un angle QRS-T spatial et un\n    gradient ventriculaire spatial faussés (fenêtre T aberrante, parfois\n    quasi confondue avec le QRS -> angle proche de 0°).\"\"\"\n    onsets, offsets = [], []\n    for ld in leads_of_interest:\n        if ld not in repol.qt_ms_by_lead:\n            continue  # T-end jugé non plausible pour cette dérivation -> écarté\n        d = repol.per_lead_delineation.get(ld)\n        if d is None:\n            continue\n        if d.t_onset_s is not None:\n            onsets.append(d.t_onset_s)\n        if d.t_offset_s is not None:\n            offsets.append(d.t_offset_s)\n    onset = float(np.median(onsets)) if len(onsets) >= 2 else None\n    offset = float(np.median(offsets)) if len(offsets) >= 2 else None\n    return onset, offset\n\n\n_IDENTITY_KEYS_TO_DROP = {\"sex_raw\"}  # sex_raw redondant avec 'sex' normalisé plus bas\n\n\ndef _sanitize_metadata(meta: dict) -> dict:\n    \"\"\"Ne conserve que les champs non-nominatifs utiles à la recherche.\"\"\"\n    keep_keys = {\n        \"heart_rate_bpm\", \"pr_ms\", \"qrs_duration_ms\", \"qt_ms\", \"qtc_ms\",\n        \"axis_p_deg\", \"axis_qrs_deg\", \"axis_t_deg\", \"paper_speed_mm_s\",\n        \"gain_limb_mm_mV\", \"gain_chest_mm_mV\", \"age_years\",\n        \"exam_datetime_raw\", \"visit_id\", \"lead_placement\", \"device_format\",\n        \"scan_amplitude_factor\", \"device_rhythm\",\n    }\n    out = {k: v for k, v in meta.items() if k in keep_keys}\n    if out.get(\"exam_datetime_raw\"):\n        # Format unique JJ/MM/AAAA hh:mm:ss (GE imprime « 14-déc-2022 »).\n        out[\"exam_datetime_raw\"] = normalize_datetime(out[\"exam_datetime_raw\"])\n    sex_raw = meta.get(\"sex_raw\")\n    if sex_raw:\n        out[\"sex\"] = \"F\" if str(sex_raw).strip().lower().startswith(\"f\") else \"M\"\n    return out\n\n\ndef process_pdf(pdf_path: str) -> PatientECGResult:\n    import os\n    fname = os.path.basename(pdf_path)\n    try:\n        parsed = parse_pdf(pdf_path)\n    except Exception as exc:  # noqa: BLE001 - on veut capturer et reporter, pas planter le lot\n        return PatientECGResult(source_file=fname, status=\"error\",\n                                 error_message=\"Échec de lecture du PDF : %s\" % exc,\n                                 identity=fill_from_filename({}, fname))\n\n    if not parsed.traces:\n        return PatientECGResult(\n            source_file=fname, status=\"error\",\n            error_message=\"Aucun tracé vectoriel exploitable détecté dans ce PDF \"\n                           \"(image scannée, ou mise en page non reconnue).\",\n            metadata=_sanitize_metadata(parsed.metadata),\n            warnings=parsed.warnings,\n            identity=fill_from_filename(parsed.identity, fname),\n        )\n\n    return _process_parsed(parsed, fname)\n\n\ndef process_signal_csv(csv_path: str, json_path: str | None = None,\n                       amplitude_factor: float | None = None) -> PatientECGResult:\n    \"\"\"ECG déjà numérisé (scan -> Open-ECG-Digitizer -> CSV), cf. signal_csv.py.\n    amplitude_factor : None = correction par défaut (SCAN_AMPLITUDE_FACTOR),\n    1.0 = aucune correction.\"\"\"\n    import os\n    from .signal_csv import SCAN_AMPLITUDE_FACTOR, read_sidecar, read_signal_csv\n    if amplitude_factor is None:\n        amplitude_factor = SCAN_AMPLITUDE_FACTOR\n    fname = os.path.basename(csv_path)\n    try:\n        with open(csv_path, \"rb\") as f:\n            data = f.read()\n        sidecar = {}\n        if json_path and os.path.exists(json_path):\n            with open(json_path, \"rb\") as f:\n                sidecar = read_sidecar(f.read())\n        rec = read_signal_csv(data, sidecar, amplitude_factor)\n    except Exception as exc:  # noqa: BLE001\n        return PatientECGResult(source_file=fname, status=\"error\",\n                                 error_message=\"Échec de lecture du CSV : %s\" % exc,\n                                 identity=fill_from_filename({}, fname))\n    parsed = ParsedECGPage(header_text=\"\", metadata=dict(rec.metadata), warnings=[])\n    return _process_parsed(parsed, fname, rec)\n\n\ndef _process_parsed(parsed: ParsedECGPage, fname: str,\n                    rec: ECGRecording | None = None) -> PatientECGResult:\n    try:\n        rec = rec if rec is not None else build_recording(parsed)\n        beat = analyze_beats(rec)\n        feats = cf.compute(beat, rec.metadata.get(\"sex_raw\"), rec.metadata.get(\"qrs_duration_ms\"))\n        repol = rf.compute(rec, beat, rec.metadata.get(\"qt_ms\"))\n        t_onset, t_offset = _global_t_window(repol, list(vcgmod.KORS_MATRIX.keys()))\n        vcg_result = vcgmod.derive_vcg(beat, t_onset_s=t_onset, t_offset_s=t_offset)\n        p_wave = pwf.compute(beat.median_beats, repol.per_lead_delineation,\n                              pr_header_ms=rec.metadata.get(\"pr_ms\"),\n                              qrs_onset_s=beat.qrs_onset_s,\n                              is_scan=str(rec.metadata.get(\"device_format\", \"\")).startswith(\"scan\"),\n                              pr_absent_on_device=bool(rec.metadata.get(\"pr_absent_on_device\")),\n                              device_rhythm=rec.metadata.get(\"device_rhythm\"))\n        quality_score = sq.compute(rec, beat)\n\n        loop_morph = None\n        twave_complexity = None\n        if vcg_result is not None:\n            in_qrs_mask = ((vcg_result.t_rel >= beat.qrs_onset_s)\n                            & (vcg_result.t_rel <= beat.qrs_offset_s))\n            t_win_mask = ((vcg_result.t_rel >= vcg_result.t_onset_s)\n                          & (vcg_result.t_rel <= vcg_result.t_offset_s))\n            loop_morph = lm.compute(vcg_result.x, vcg_result.y, vcg_result.z,\n                                     in_qrs_mask, t_win_mask)\n            twave_complexity = twc.compute(beat.median_beats, vcg_result.t_onset_s,\n                                            vcg_result.t_offset_s)\n    except Exception as exc:  # noqa: BLE001\n        return PatientECGResult(\n            source_file=fname, status=\"error\",\n            error_message=\"Échec du traitement du signal : %s\" % exc,\n            metadata=_sanitize_metadata(parsed.metadata),\n            warnings=parsed.warnings + (rec.warnings if rec is not None else []),\n            identity=fill_from_filename(parsed.identity, fname),\n        )\n\n    # QT servant au QTc et à l'iCEB : celui de l'en-tête s'il existe (mesure\n    # appareil), sinon le QT remesuré (médiane des QT par dérivation\n    # retenus) — formats sans mesures imprimées, ex. Cardionics. QTc par\n    # Bazett ET Fridericia (certains appareils, ex. Dräger, impriment un QTc\n    # Fridericia : comparer la bonne formule).\n    qtc_bazett = qtc_fridericia = None\n    qt_header = rec.metadata.get(\"qt_ms\")\n    qt_for_qtc = qt_header or repol.qt_ms_measured\n    qt_source = (\"en-tête\" if qt_header else \"mesuré\") if qt_for_qtc else None\n    if qt_for_qtc and len(beat.r_peak_times_s) >= 2:\n        rr_s = float(np.median(np.diff(beat.r_peak_times_s)))\n        if rr_s > 0:\n            qtc_bazett = qt_for_qtc / np.sqrt(rr_s)\n            qtc_fridericia = qt_for_qtc / np.cbrt(rr_s)\n\n    # iCEB = QT/QRS, iCEBc = QTc/QRS (index of cardiac electrophysiological\n    # balance — Lu et al. 2016 ; QTc via Bazett, cf. ci-dessus). QT et QRS\n    # de l'en-tête préférés à la mesure automatique quand disponibles, même\n    # logique que pour Cornell product (conventional_features.compute).\n    qrsd = rec.metadata.get(\"qrs_duration_ms\") or beat.qrs_duration_ms\n    iceb = icebc = None\n    if qt_for_qtc and qrsd:\n        iceb = qt_for_qtc / qrsd\n    if qtc_bazett and qrsd:\n        icebc = qtc_bazett / qrsd\n\n    # Angle QRS-T frontal (plan frontal uniquement, à partir des axes de\n    # l'en-tête — approche différente de l'angle QRS-T SPATIAL de vcg.py,\n    # qui lui est dérivé de la VCG 3D). Repli dans [0°, 180°] : un écart\n    # brut peut dépasser 180° selon le sens de rotation des deux axes.\n    # Seuils usuels (repères, non imposés par cet outil) : normal < 45°,\n    # limite 45-90°, anormal > 90°.\n    frontal_qrst_angle = None\n    axis_qrs = rec.metadata.get(\"axis_qrs_deg\")\n    axis_t = rec.metadata.get(\"axis_t_deg\")\n    if axis_qrs is not None and axis_t is not None:\n        diff = abs(axis_qrs - axis_t)\n        frontal_qrst_angle = 360 - diff if diff > 180 else diff\n\n    # Score de Romhilt-Estes (voir romhilt_estes.py pour les limites\n    # assumées — critère \"strain\" approximé, digitalique jamais prise en\n    # compte : score exploratoire, pas un diagnostic).\n    romhilt = re_score.compute(\n        feats, axis_qrs_deg=axis_qrs, qrs_duration_ms=qrsd,\n        ptfv1_terminal_depth_mv=p_wave.ptfv1_terminal_depth_mv,\n        ptfv1_terminal_duration_ms=p_wave.ptfv1_terminal_duration_ms,\n    )\n\n    perugia_criteria = []\n    if feats.perugia_cornell_positive:\n        perugia_criteria.append(\"SV3+RaVL\")\n    if romhilt.strain_points > 0:\n        perugia_criteria.append(\"strain\")\n    if romhilt.total_points >= 5:\n        perugia_criteria.append(\"Romhilt-Estes>=5\")\n    perugia_positive = (bool(perugia_criteria)\n                        if feats.perugia_cornell_positive is not None else None)\n\n    all_warnings = list(dict.fromkeys(\n        parsed.warnings + rec.warnings + beat.warnings + repol.warnings +\n        p_wave.warnings +\n        (vcg_result.warnings if vcg_result else []) +\n        (loop_morph.warnings if loop_morph else []) +\n        (twave_complexity.warnings if twave_complexity else [])\n    ))\n    if romhilt.strain_approximated:\n        all_warnings.append(\n            \"Score de Romhilt-Estes : critère 'strain' rempli par approximation \"\n            \"(T négative + sous-décalage ST, pas la morphologie caractéristique) \"\n            \"et digitalique supposée absente (non vérifiable depuis le PDF) — \"\n            \"score exploratoire, cf. romhilt_estes.py.\"\n        )\n\n    return PatientECGResult(\n        source_file=fname, status=\"ok\",\n        identity=fill_from_filename(parsed.identity, fname),\n        metadata=_sanitize_metadata(rec.metadata),\n        heart_rate_bpm_measured=beat.heart_rate_bpm,\n        n_beats_detected=len(beat.r_peak_times_s),\n        qrs_duration_ms_measured=beat.qrs_duration_ms,\n        qtc_bazett_ms_measured=qtc_bazett,\n        qtc_fridericia_ms_measured=qtc_fridericia,\n        qt_ms_measured=repol.qt_ms_measured,\n        qt_source_for_qtc=qt_source,\n        pr_ms_measured=p_wave.pr_ms_measured,\n        iceb=iceb, icebc=icebc,\n        frontal_qrst_angle_deg=frontal_qrst_angle,\n        signal_quality_score=quality_score,\n        conventional=feats,\n        repolarization=repol,\n        p_wave=p_wave,\n        romhilt_estes=romhilt,\n        perugia_positive=perugia_positive,\n        perugia_criteria=perugia_criteria,\n        vcg=vcg_result,\n        loop_morphology=loop_morph,\n        t_wave_complexity=twave_complexity,\n        recording=rec,\n        beat=beat,\n        warnings=all_warnings,\n    )\n", "ecg_hcm/repolarization_features.py": "\"\"\"\nrepolarization_features.py\n===========================\n\nQT par dérivation, dispersion du QT, Tpeak-Tend (global et par dérivation),\ndispersion du Tpeak-Tend — construits sur `delineation.py` (NeuroKit2/DWT\nsi disponible, sinon repli méthode tangente).\n\nGarde-fou de plausibilité\n--------------------------\nLa délinéation automatique du T-end par dérivation est un problème connu\npour son instabilité (cf. littérature citée dans le README sur la\ndispersion du QT) : une petite onde T, plate ou biphasique, produit\nfacilement une estimation aberrante. Comme la valeur de QT globale\nimprimée par l'appareil (`qt_ms` de l'en-tête) est déjà validée par\nailleurs (voir `pipeline.py`, écart typiquement < 1 % sur nos tests), elle\nsert de référence de plausibilité : tout QT par dérivation qui s'en écarte\nde plus de `MAX_REL_DEVIATION` est écarté (et compte dans\n`excluded_leads`) plutôt que d'alimenter silencieusement une \"dispersion\"\nqui ne refléterait qu'un artefact de mesure.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom .beat_detection import BeatAnalysis, t_search_end_s\nfrom .delineation import LeadDelineation, delineate_lead\nfrom .signal_builder import ECGRecording\n\nMAX_REL_DEVIATION = 0.25  # 25% d'écart toléré vs. QT header avant exclusion\nREFERENCE_TPTE_LEAD = \"V2\"  # cf. Europace 2018 (tangente en V2 recommandée)\n# Fraction du seuil de plausibilité au-delà de laquelle une dérivation\n# extrême (min ou max) de la dispersion du QT est jugée \"proche de la\n# limite\" -> avertissement, cf. compute().\nNEAR_BOUNDARY_FRACTION = 0.8\n\n\n@dataclass\nclass RepolarizationFeatures:\n    per_lead_delineation: dict[str, LeadDelineation] = field(default_factory=dict)\n    qt_ms_by_lead: dict[str, float] = field(default_factory=dict)\n    qt_excluded_leads: list[str] = field(default_factory=list)\n    qt_dispersion_ms: float | None = None\n    tpeak_tend_ms_by_lead: dict[str, float] = field(default_factory=dict)\n    tpeak_tend_dispersion_ms: float | None = None\n    tpeak_tend_v2_ms: float | None = None\n    tpeak_tend_v2_bazett: float | None = None\n    delineation_method_summary: str = \"\"\n    # QT global remesuré = médiane des QT par dérivation retenus. Référence\n    # de plausibilité : QT de l'en-tête si disponible, sinon médiane brute\n    # des QT par dérivation (formats sans mesures appareil, ex. Cardionics).\n    qt_ms_measured: float | None = None\n    qt_reference_source: str | None = None  # \"en-tête\" | \"médiane des dérivations\"\n    # Depuis 0.12.2, qt_ms_measured est le QT GLOBAL (cf. global_qt_ms) ;\n    # l'ancienne médiane des QT par dérivation reste fournie en contrôle.\n    qt_ms_median_leads: float | None = None\n    qt_method: str | None = None  # \"global (trapèze de Zhang)\" | \"médiane des dérivations\"\n    warnings: list[str] = field(default_factory=list)\n\n# ---------------------------------------------------------------------------\n# QT global, aligné sur la définition des appareils (GE 12SL) et de\n# BRAVEHEART : du début du QRS (le plus précoce, global) au retour de l'onde\n# T à la ligne de base. Fin de T par dérivation : méthode du trapèze de Zhang\n# (Zhang et al., IEEE TBME 2006) sur le battement médian, puis 75e percentile\n# des dérivations dont l'onde T est assez ample (les dernières dérivations à\n# revenir à la ligne de base, sans dépendre d'une seule valeur extrême).\n# Sur 10 ECG GE MUSE : écart moyen -0,5 ms, écart absolu moyen 6 ms, max\n# 20 ms par rapport au QT imprimé par GE ; l'ancienne médiane des QT par\n# dérivation (fin de pente DWT) était plus courte de 35 ms en moyenne, et de\n# 46 ms par rapport à BRAVEHEART sur 186 ECG (validation 2026-10-20).\n# ---------------------------------------------------------------------------\nMIN_T_AMPLITUDE_MV = 0.08\nZHANG_WINDOW_S = 0.20\nGLOBAL_QT_PERCENTILE = 75\n\n\ndef _zhang_tend(t: np.ndarray, x: np.ndarray, qrs_offset_s: float,\n                t_search_end_s: float | None = None,\n                t_hard_end_s: float | None = None) -> float | None:\n    \"\"\"Fin de T d'une dérivation (battement médian, temps relatif au pic R).\n    `t_search_end_s` borne la recherche du pic T, pour ne pas prendre l'onde\n    P du battement suivant quand la FC est rapide. `t_hard_end_s` borne la\n    recherche de la fin de T elle-même (début du QRS suivant) : sans elle, à\n    FC rapide, la pente maximale pouvait être celle du QRS suivant.\"\"\"\n    if t_hard_end_s is not None and t_hard_end_s < t[-1]:\n        keep = t <= t_hard_end_s\n        t, x = t[keep], x[keep]\n    end = t[-1] if t_search_end_s is None else min(t[-1], t_search_end_s)\n    s = np.where((t > qrs_offset_s + 0.08) & (t <= end))[0]\n    if len(s) < 5:\n        return None\n    ipk = s[np.argmax(np.abs(x[s]))]\n    if abs(x[ipk]) < MIN_T_AMPLITUDE_MV:\n        return None\n    y = x * np.sign(x[ipk])\n    seg = np.arange(ipk, len(t))\n    if len(seg) < 3:\n        return None\n    dy = np.gradient(y, t)\n    im = seg[np.argmin(dy[seg])]  # pente descendante maximale\n    tr = min(t[-1], t[im] + ZHANG_WINDOW_S)\n    cand = np.arange(im, len(t))\n    cand = cand[t[cand] <= tr]\n    if len(cand) < 2:\n        return None\n    area = 0.5 * (y[im] - y[cand]) * (2 * tr - t[cand] - t[im])\n    return float(t[cand[np.argmax(area)]])\n\n\ndef global_qt_ms(beat: BeatAnalysis) -> tuple[float | None, bool]:\n    \"\"\"(QT global en ms, fin de T proche du bord du battement médian).\"\"\"\n    tends = []\n    n_edge = 0\n    rr = float(np.median(np.diff(beat.r_peak_times_s))) if len(beat.r_peak_times_s) >= 2 else None\n    t_peak_end = 0.6 * rr if rr else None  # pic T avant 60 % du RR\n    for mb in beat.median_beats.values():\n        t, v = mb.t_rel, mb.mv\n        pr = (t >= beat.qrs_onset_s - 0.05) & (t < beat.qrs_onset_s - 0.01)\n        if pr.sum() < 2:\n            continue\n        hard_end = t_search_end_s(t, v, beat.qrs_onset_s, beat.qrs_offset_s, rr)\n        te = _zhang_tend(t, v - float(np.median(v[pr])), beat.qrs_offset_s, t_peak_end,\n                         hard_end)\n        if te is None:\n            continue\n        if te > hard_end - 0.02:  # fin de T non vue dans la fenêtre : non fiable\n            n_edge += 1\n            continue\n        tends.append(te)\n    near_edge = n_edge >= 3\n    if len(tends) < 3:\n        return None, near_edge\n    tend = float(np.percentile(tends, GLOBAL_QT_PERCENTILE))\n    return (tend - beat.qrs_onset_s) * 1000, near_edge\n\n\ndef compute(rec: ECGRecording, beat: BeatAnalysis, qt_header_ms: float | None) -> RepolarizationFeatures:\n    feats = RepolarizationFeatures()\n    rr_s = float(np.median(np.diff(beat.r_peak_times_s))) if len(beat.r_peak_times_s) >= 2 else None\n\n    methods_used = set()\n    raw_qt: dict[str, float] = {}\n    for lead, mb in beat.median_beats.items():\n        sig = rec.leads.get(lead)\n        if sig is None:\n            continue\n        d = delineate_lead(sig, mb, beat.r_peak_times_s, beat.qrs_onset_s, beat.qrs_offset_s)\n        feats.per_lead_delineation[lead] = d\n        methods_used.add(d.method)\n\n        if d.t_offset_s is not None:\n            raw_qt[lead] = (d.t_offset_s - d.qrs_onset_s) * 1000\n        # Tpeak-Tend par dérivation (ce bloc était par erreur indenté sous le\n        # choix du QT, après la boucle : il ne voyait que la dernière\n        # dérivation et Tpeak-Tend V2 restait presque toujours vide).\n        if d.t_peak_s is not None and d.t_offset_s is not None:\n            tpte_ms = (d.t_offset_s - d.t_peak_s) * 1000\n            if 15 <= tpte_ms <= 220:  # bornes de plausibilité large, cf. littérature\n                feats.tpeak_tend_ms_by_lead[lead] = tpte_ms\n\n    # Référence de plausibilité : QT de l'en-tête, ou à défaut médiane brute\n    # des QT par dérivation (au moins 3) — sans elle, un T-end aberrant\n    # (onde T plate, biphasique...) passait sans contrôle sur les formats\n    # qui n'impriment pas de QT.\n    qt_reference = qt_header_ms\n    if qt_reference:\n        feats.qt_reference_source = \"en-tête\"\n    elif len(raw_qt) >= 3:\n        qt_reference = float(np.median(list(raw_qt.values())))\n        feats.qt_reference_source = \"médiane des dérivations\"\n    for lead, qt_ms in raw_qt.items():\n        if qt_reference and abs(qt_ms - qt_reference) / qt_reference > MAX_REL_DEVIATION:\n            feats.qt_excluded_leads.append(lead)\n        else:\n            feats.qt_ms_by_lead[lead] = qt_ms\n    if len(feats.qt_ms_by_lead) >= 2:\n        feats.qt_ms_median_leads = float(np.median(list(feats.qt_ms_by_lead.values())))\n    qt_global, near_edge = global_qt_ms(beat)\n    if (qt_global is not None and feats.qt_ms_median_leads is not None\n            and not (-30 <= qt_global - feats.qt_ms_median_leads <= 100)):\n        # Sur les ECG GE, le QT global dépasse la médiane par dérivation de\n        # 20 à 60 ms. Un écart hors de [-30 ; +100] ms signale des ondes T\n        # trop plates ou une onde P suivante prise pour T : QT non rendu.\n        feats.warnings.append(\n            \"QT remesuré non rendu : fin de l'onde T incertaine (QT global %.0f ms \"\n            \"contre %.0f ms en médiane des dérivations ; ondes T plates ?).\"\n            % (qt_global, feats.qt_ms_median_leads))\n        feats.qt_method = \"incertain\"\n    elif qt_global is not None and 200 <= qt_global <= 700:\n        feats.qt_ms_measured = qt_global\n        feats.qt_method = \"global (trapèze de Zhang)\"\n        if near_edge:\n            feats.warnings.append(\n                \"Fin de l'onde T proche du bord du battement médian : QT mesuré \"\n                \"possiblement sous-estimé (QT très long ou FC lente).\")\n    elif feats.qt_ms_median_leads is not None:\n        feats.qt_ms_measured = feats.qt_ms_median_leads\n        feats.qt_method = \"médiane des dérivations\"\n\n\n    if len(feats.qt_ms_by_lead) >= 2:\n        vals = list(feats.qt_ms_by_lead.values())\n        feats.qt_dispersion_ms = max(vals) - min(vals)\n        if qt_reference:\n            # Le garde-fou de plausibilité (MAX_REL_DEVIATION) sert à écarter\n            # les valeurs grossièrement fausses, pas à valider une dispersion :\n            # une tolérance large (25%) autour d'un QT de ~400-450 ms laisse\n            # passer jusqu'à ~200 ms d'écart entre deux dérivations sans que\n            # ni l'une ni l'autre ne soit individuellement jugée\n            # invraisemblable. Si la dérivation min ou max de la dispersion\n            # est proche de cette limite, la dispersion mesurée peut donc\n            # refléter surtout du bruit de mesure plutôt qu'une vraie\n            # hétérogénéité de repolarisation -> avertissement explicite.\n            max_lead = max(feats.qt_ms_by_lead, key=feats.qt_ms_by_lead.get)\n            min_lead = min(feats.qt_ms_by_lead, key=feats.qt_ms_by_lead.get)\n            max_val = feats.qt_ms_by_lead[max_lead]\n            min_val = feats.qt_ms_by_lead[min_lead]\n            max_frac = (max_val - qt_reference) / qt_reference / MAX_REL_DEVIATION\n            min_frac = (qt_reference - min_val) / qt_reference / MAX_REL_DEVIATION\n            near = []\n            if max_frac >= NEAR_BOUNDARY_FRACTION:\n                near.append(\"%s (QT=%.0f ms)\" % (max_lead, max_val))\n            if min_frac >= NEAR_BOUNDARY_FRACTION:\n                near.append(\"%s (QT=%.0f ms)\" % (min_lead, min_val))\n            if near:\n                feats.warnings.append(\n                    \"Dispersion du QT (%.0f ms) potentiellement surestimée : %s \"\n                    \"proche(nt) de la limite de plausibilité (+/-%.0f%% du QT de \"\n                    \"référence, ~%.0f ms) -> peut refléter en partie une incertitude \"\n                    \"de mesure plutôt qu'une vraie hétérogénéité de repolarisation.\"\n                    % (feats.qt_dispersion_ms, \" et \".join(near),\n                       MAX_REL_DEVIATION * 100, qt_reference)\n                )\n    if len(feats.tpeak_tend_ms_by_lead) >= 2:\n        vals = list(feats.tpeak_tend_ms_by_lead.values())\n        feats.tpeak_tend_dispersion_ms = max(vals) - min(vals)\n\n    if REFERENCE_TPTE_LEAD in feats.tpeak_tend_ms_by_lead:\n        feats.tpeak_tend_v2_ms = feats.tpeak_tend_ms_by_lead[REFERENCE_TPTE_LEAD]\n        if rr_s and rr_s > 0:\n            feats.tpeak_tend_v2_bazett = feats.tpeak_tend_v2_ms / np.sqrt(rr_s)\n\n    feats.delineation_method_summary = \", \".join(sorted(methods_used)) if methods_used else \"aucune\"\n    if feats.qt_excluded_leads:\n        feats.warnings.append(\n            \"QT écarté (jugé non plausible, > %.0f%% de différence avec le QT de \"\n            \"référence : %s) pour : %s.\" % (MAX_REL_DEVIATION * 100, feats.qt_reference_source,\n                                            \", \".join(feats.qt_excluded_leads))\n        )\n    if \"dwt\" not in methods_used and methods_used:\n        feats.warnings.append(\n            \"NeuroKit2 non disponible (ou délinéation DWT indisponible sur ces \"\n            \"dérivations) — repli sur la méthode tangente (moins validée) pour \"\n            \"toutes les dérivations. `pip install neurokit2` pour la méthode \"\n            \"recommandée.\"\n        )\n\n    return feats\n", "ecg_hcm/results_reference.py": "\"\"\"\nresults_reference.py\n=====================\n\nRéférentiel des colonnes du tableau produit par `ecg_vcg_hcm` LUI-MÊME\n(le fichier `ecg_hcm_resultats*.xlsx`/`.csv` téléchargé depuis `app.py`,\nou produit par `ecg_hcm.batch.row_from_result`) — pas le fichier destiné à\nBRAVEHEART, ni celui que BRAVEHEART exporte (voir `braveheart_reference.py`\npour ces deux-là).\n\nContrairement à l'export BRAVEHEART obtenu via un battement médian répété\n(`braveheart_export.py`), **aucune colonne de ce tableau n'est un\nartefact** : chaque valeur est mesurée directement sur le vrai battement\nmédian extrait du PDF. La sélection \"prioritaire\" ci-dessous ne retire\ndonc rien pour cause d'invalidité — uniquement pour resserrer le fichier\nsur les colonnes les plus directement utiles aux études CMH / amylose\ncardiaque, le détail complet restant disponible dans le fichier d'origine\net documenté au README (sections 1 à 8).\n\nÉtabli à partir du code source du projet (`conventional_features.py`,\n`vcg.py`, `loop_morphology.py`, `t_wave_complexity.py`, `romhilt_estes.py`,\n`p_wave_features.py`, `pipeline.py`) et du README (sections 3 à 8).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass ColumnInfo:\n    column: str\n    label_fr: str\n    unit: str\n    category: str\n    note: str = \"\"\n\n\nAXIS_CONTEXT = \"0. Contexte, en-tête appareil et contrôle qualité\"\nAXIS_VOLTAGE = \"1. Voltage / LVH (discordance voltage-masse)\"\nAXIS_PSEUDO_INFARCT = \"2. Pseudo-infarctus et repolarisation focale (CMH apicale)\"\nAXIS_DISPERSION = \"3. Dispersion de repolarisation / hétérogénéité (exploratoire)\"\nAXIS_MAGNITUDE = \"4. Amplitude électrique globale (VCG/GEH)\"\nAXIS_P_WAVE = \"5. Onde P / atteinte auriculaire gauche\"\n\nPRIORITY_COLUMNS: tuple[ColumnInfo, ...] = (\n    # --- Contexte / en-tête appareil / QC ---\n    ColumnInfo(\"source_file\", \"Nom du fichier source\", \"texte\", AXIS_CONTEXT),\n    ColumnInfo(\"nom\", \"Nom du patient (imprimé sur l'ECG)\", \"texte\", AXIS_CONTEXT,\n               \"Nominatif, présent seulement si l'option « Inclure l'identité » est cochée.\"),\n    ColumnInfo(\"prenom\", \"Prénom(s) du patient\", \"texte\", AXIS_CONTEXT,\n               \"Nominatif. Cardionics : séparé du nom par le grand blanc imprimé.\"),\n    ColumnInfo(\"prenom_source\", \"Origine du prénom\", \"ECG / nom du fichier\", AXIS_CONTEXT,\n               \"« nom du fichier » quand le prénom n'est pas imprimé sur l'ECG.\"),\n    ColumnInfo(\"date_naissance\", \"Date de naissance\", \"JJ/MM/AAAA\", AXIS_CONTEXT,\n               \"Nominatif. Convertie en JJ/MM/AAAA quel que soit le format imprimé.\"),\n    ColumnInfo(\"date_ecg\", \"Date de réalisation de l'ECG\", \"JJ/MM/AAAA\", AXIS_CONTEXT),\n    ColumnInfo(\"heure_ecg\", \"Heure de réalisation de l'ECG\", \"hh:mm:ss\", AXIS_CONTEXT),\n    ColumnInfo(\"ipp\", \"Identifiant patient imprimé (IPP)\", \"texte\", AXIS_CONTEXT,\n               \"GE « ID : », Cardionics 1re ligne, Dräger « ID Patient : ».\"),\n    ColumnInfo(\"age_years\", \"Âge\", \"années\", AXIS_CONTEXT),\n    ColumnInfo(\"sex\", \"Sexe\", \"M/F\", AXIS_CONTEXT),\n    ColumnInfo(\"heart_rate_bpm\", \"Fréquence cardiaque (en-tête appareil)\", \"bpm\", AXIS_CONTEXT,\n               \"Valeur imprimée par l'appareil (GE CardioSoft/MUSE), lue dans l'en-tête du PDF.\"),\n    ColumnInfo(\"heart_rate_bpm_measured\", \"Fréquence cardiaque (remesurée par ecg_vcg_hcm)\", \"bpm\", AXIS_CONTEXT,\n               \"Recalculée sur le vrai tracé (bande rythme) -- comparer aux deux : un grand écart signale un problème de détection des pics R.\"),\n    ColumnInfo(\"qrs_duration_ms\", \"Durée du QRS (en-tête appareil)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qrs_duration_ms_measured\", \"Durée du QRS (remesurée)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qtc_ms\", \"QTc (en-tête appareil, méthode de l'appareil)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qt_ms_measured\", \"QT remesuré, global : début du QRS -> retour de T à la ligne de base (trapèze de Zhang, 75e percentile des dérivations ; aligné sur GE et BRAVEHEART)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qt_ms_median_leads\", \"QT : médiane des QT par dérivation (ancienne méthode, contrôle)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qt_method\", \"Méthode du QT remesuré\", \"texte\", AXIS_CONTEXT),\n    ColumnInfo(\"qtc_bazett_ms_measured\", \"QTc Bazett (QT de l'en-tête, sinon QT remesuré ; RR mesuré)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"qtc_fridericia_ms_measured\", \"QTc Fridericia (même QT, RR mesuré)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_ms\", \"Intervalle PR (en-tête appareil)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_ms_measured\", \"Intervalle PR remesuré par l'outil, sur la dérivation la plus lisible\", \"ms\", AXIS_CONTEXT,\n               \"Début P -> début QRS mesuré sur la dérivation où l'onde P et le début du QRS sont les mieux visibles (colonne pr_lead), parmi les dérivations concordantes (à 20 ms ou moins de la médiane). Nécessite NeuroKit2. Les appareils (GE, Dräger) mesurent eux du début de P le plus précoce au début de QRS le plus précoce, toutes dérivations confondues (pr_ms).\"),\n    ColumnInfo(\"pr_lead\", \"Dérivation utilisée pour pr_ms_measured\", \"texte\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_ms_median_leads\", \"Intervalle PR : médiane des dérivations plausibles (contrôle)\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_reliability\", \"Fiabilité du PR remesuré (bonne, moyenne, faible)\", \"texte\", AXIS_CONTEXT,\n               \"D'après la part des dérivations délinéées dont le PR est à 20 ms ou moins de la médiane : bonne si au moins 6 et 2/3, moyenne si au moins 3 et la moitié, sinon faible. Seul un PR « bonne » est rendu : en moyenne ou faible, aucune valeur de PR n'est rendue (ni pr_ms_measured, ni médiane, ni PR par dérivation) : à mesurer sur le papier.\"),\n    ColumnInfo(\"pr_n_concordant_leads\", \"PR : nombre de dérivations concordantes (à 20 ms ou moins de la médiane)\", \"entier\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_n_delineated_leads\", \"PR : nombre de dérivations où un PR a pu être calculé\", \"entier\", AXIS_CONTEXT),\n    ColumnInfo(\"pr_spread_iqr_ms\", \"PR : écart interquartile entre dérivations retenues\", \"ms\", AXIS_CONTEXT),\n    ColumnInfo(\"axis_qrs_deg\", \"Axe QRS frontal (en-tête appareil)\", \"degrés\", AXIS_CONTEXT,\n               \"Valeur de référence à préférer (voir COMPARAISON_BRAVEHEART.md) -- BRAVEHEART en recalcule une variante géométrique (qrs_frontal_axis) utilisable en contrôle qualité.\"),\n    ColumnInfo(\"n_beats_detected\", \"Nombre de battements détectés sur la bande rythme\", \"entier\", AXIS_CONTEXT),\n    ColumnInfo(\"signal_quality_score\", \"Score de qualité du signal (NeuroKit2, methode averageQRS)\", \"0-1\", AXIS_CONTEXT,\n               \"Indicateur de confiance a consulter avant d'inclure un examen dans une cohorte -- pas une garantie de justesse (README section 6).\"),\n    ColumnInfo(\"delineation_method\", \"Méthode de délinéation de l'onde T utilisée\", \"texte (dwt/tangent_fallback)\", AXIS_CONTEXT,\n               \"'dwt' = NeuroKit2 (fiable) ; 'tangent_fallback' = méthode de repli, moins fiable (README section 5).\"),\n\n    # --- Axe 1 : voltage / LVH ---\n    ColumnInfo(\"sokolow_lyon_mv\", \"Voltage de Sokolow-Lyon\", \"mV\", AXIS_VOLTAGE, \"Commun avec BRAVEHEART (sokolow_lvh_mv).\"),\n    ColumnInfo(\"sokolow_lyon_lvh\", \"Sokolow-Lyon positif (>= 3.5 mV)\", \"bool\", AXIS_VOLTAGE),\n    ColumnInfo(\"cornell_voltage_mv\", \"Voltage de Cornell\", \"mV\", AXIS_VOLTAGE, \"Commun avec BRAVEHEART (cornell_lvh_mv).\"),\n    ColumnInfo(\"cornell_voltage_lvh\", \"Cornell voltage positif\", \"bool\", AXIS_VOLTAGE),\n    ColumnInfo(\"cornell_product_mm_ms\", \"Cornell product (voltage x durée QRS)\", \"mm·ms\", AXIS_VOLTAGE, \"Spécifique à ecg_vcg_hcm -- absent de BRAVEHEART.\"),\n    ColumnInfo(\"cornell_product_lvh\", \"Cornell product positif (> 2440 mm·ms)\", \"bool\", AXIS_VOLTAGE),\n    ColumnInfo(\"peguero_lopresti_mv\", \"Peguero-Lo Presti (S le plus profond + S(V4))\", \"mV\", AXIS_VOLTAGE,\n               \"Validé spécifiquement en CMH (PMID 39077703) -- spécifique à ecg_vcg_hcm.\"),\n    ColumnInfo(\"peguero_lopresti_lvh\", \"Peguero-Lo Presti positif\", \"bool\", AXIS_VOLTAGE),\n    ColumnInfo(\"gubner_ungerleider_mv\", \"Gubner-Ungerleider : R(I) + S(III)\", \"mV\", AXIS_VOLTAGE,\n               \"Gubner & Ungerleider 1943 -- spécifique à ecg_vcg_hcm.\"),\n    ColumnInfo(\"gubner_ungerleider_lvh\", \"Gubner-Ungerleider positif (>= 2.5 mV)\", \"bool\", AXIS_VOLTAGE),\n    ColumnInfo(\"perugia_cornell_mv\", \"S(V3) + R(aVL) (composante voltage du score de Perugia)\", \"mV\", AXIS_VOLTAGE),\n    ColumnInfo(\"perugia_lvh\", \"Score de Perugia positif\", \"bool\", AXIS_VOLTAGE,\n               \"Verdecchia et al. JACC 1998 : SV3+RaVL > 2.4 mV (H) / > 2.0 mV (F), \"\n               \"ou strain typique (approximé), ou Romhilt-Estes >= 5.\"),\n    ColumnInfo(\"perugia_criteria\", \"Critère(s) de Perugia remplis\", \"texte\", AXIS_VOLTAGE),\n    ColumnInfo(\"romhilt_estes_total_points\", \"Score de Romhilt-Estes (total)\", \"points (0-13)\", AXIS_VOLTAGE,\n               \"Exploratoire -- critère 'strain' approximé et digitalique jamais pris en compte (README section 7).\"),\n    ColumnInfo(\"romhilt_estes_category\", \"Catégorie Romhilt-Estes\", \"texte (certaine/probable/non évocateur)\", AXIS_VOLTAGE),\n\n    # --- Axe 2 : pseudo-infarctus / repolarisation focale ---\n    ColumnInfo(\"giant_negative_t_leads\", \"Dérivation(s) avec onde T négative géante (<= -1.0 mV)\", \"liste de dérivations\", AXIS_PSEUDO_INFARCT,\n               \"Évocateur de CMH apicale (syndrome de Yamaguchi) -- voir README section 3 pour les références.\"),\n    ColumnInfo(\"pathological_q_leads\", \"Dérivation(s) avec onde Q pathologique\", \"liste de dérivations\", AXIS_PSEUDO_INFARCT,\n               \"Pseudo-infarctus fréquent en CMH (hypertrophie septale) -- à interpréter dans le contexte clinique. Inclut les complexes QS de profondeur >= 0.1 mV (voir qs_leads).\"),\n    ColumnInfo(\"qs_leads\", \"Dérivation(s) avec complexe QS (pas d'onde R visible, R < 0.05 mV)\", \"liste de dérivations\", AXIS_PSEUDO_INFARCT,\n               \"Toutes dérivations, aVR comprise. Un QS hors aVR/III/V1 et profond d'au moins 0.1 mV est aussi compté dans pathological_q_leads.\"),\n    ColumnInfo(\"t_inversion_leads\", \"Dérivation(s) avec onde T inversée\", \"liste de dérivations\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"fragmented_qrs_leads\", \"Dérivation(s) avec QRS fragmenté\", \"liste de dérivations\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"n_t_inversion_leads\", \"Nombre de dérivations avec onde T inversée (aVR exclue)\", \"nombre\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"n_giant_negative_t_leads\", \"Nombre de dérivations avec onde T négative géante (aVR exclue)\", \"nombre\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"n_pathological_q_leads\", \"Nombre de dérivations avec onde Q pathologique (aVR, III, V1 exclues)\", \"nombre\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"n_fragmented_qrs_leads\", \"Nombre de dérivations avec QRS fragmenté (aVR exclue)\", \"nombre\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"poor_r_wave_progression\", \"Mauvaise progression de l'onde R (R(V3) <= 0.3 mV)\", \"bool\", AXIS_PSEUDO_INFARCT),\n    ColumnInfo(\"frontal_qrst_angle_deg\", \"Angle QRS-T frontal (a partir des axes de l'en-tête)\", \"degrés\", AXIS_PSEUDO_INFARCT,\n               \"= |axe QRS - axe T|, repères usuels : normal < 45°, limite 45-90°, anormal > 90° (README section 6). A ne pas confondre avec l'angle QRS-T spatial (axe 3 ci-dessous).\"),\n\n    # --- Axe 3 : dispersion de repolarisation / hétérogénéité ---\n    ColumnInfo(\"qt_dispersion_ms\", \"Dispersion du QT inter-dérivations\", \"ms\", AXIS_DISPERSION,\n               \"Marqueur ancien et débattu, instabilité de mesure documentée -- exploratoire (README section 5).\"),\n    ColumnInfo(\"tpeak_tend_dispersion_ms\", \"Dispersion de Tpeak-Tend inter-dérivations\", \"ms\", AXIS_DISPERSION),\n    ColumnInfo(\"tpeak_tend_v2_ms\", \"Tpeak-Tend, dérivation V2\", \"ms\", AXIS_DISPERSION),\n    ColumnInfo(\"tpeak_tend_v2_bazett\", \"Tpeak-Tend V2 corrigé (Bazett)\", \"ms\", AXIS_DISPERSION),\n    ColumnInfo(\"iceb\", \"index of Cardiac Electrophysiological Balance (QT/QRS)\", \"sans unité\", AXIS_DISPERSION,\n               \"Étudié en CMH pour la stratification du risque de mort subite (AUC 0.79 rapporté, PMC13177175).\"),\n    ColumnInfo(\"icebc\", \"iCEB corrigé par la fréquence (QTc Bazett/QRS)\", \"sans unité\", AXIS_DISPERSION),\n    ColumnInfo(\"spatial_qrst_angle_deg\", \"Angle QRS-T spatial (VCG, méthode pic-à-pic)\", \"degrés\", AXIS_DISPERSION,\n               \"Fortement associé à la CMH dans la littérature (PMID 27839835) ; rapporté associé à la fibrose myocardique en CMH pédiatrique/jeune adulte (voir README section 4).\"),\n    ColumnInfo(\"qrst_angle_area_deg\", \"Angle QRS-T spatial, variante aire\", \"degrés\", AXIS_DISPERSION),\n    ColumnInfo(\"qrst_angle_peak_frontal_deg\", \"Angle QRS-T, projection frontale, variante pic\", \"degrés\", AXIS_DISPERSION),\n    ColumnInfo(\"qrst_angle_area_frontal_deg\", \"Angle QRS-T, projection frontale, variante aire\", \"degrés\", AXIS_DISPERSION),\n    ColumnInfo(\"tcrt\", \"Total Cosine R-to-T\", \"sans unité (-1 à 1)\", AXIS_DISPERSION,\n               \"Rapporté en cosinus natif (pas en degrés) -- pas de seuil universel, variable exploratoire de cohorte (README section 4).\"),\n    ColumnInfo(\"tmd_deg\", \"T-wave Morphology Dispersion\", \"degrés\", AXIS_DISPERSION),\n    ColumnInfo(\"twr_abs_mV2\", \"T-wave Residuum absolu\", \"mV²\", AXIS_DISPERSION),\n    ColumnInfo(\"twr_rel_pct\", \"T-wave Residuum relatif\", \"fraction (0-1)\", AXIS_DISPERSION),\n    ColumnInfo(\"qrst_dihedral_angle_deg\", \"Angle dièdre entre plans des boucles QRS et T\", \"degrés (0-90°)\", AXIS_DISPERSION),\n    ColumnInfo(\"qrs_loop_roundness\", \"Rondeur de la boucle QRS (1 = circulaire)\", \"sans unité\", AXIS_DISPERSION),\n    ColumnInfo(\"t_loop_roundness\", \"Rondeur de la boucle T (1 = circulaire)\", \"sans unité\", AXIS_DISPERSION),\n\n    # --- Axe 4 : amplitude électrique globale (VCG/GEH) ---\n    ColumnInfo(\"svg_magnitude_mV_s\", \"Magnitude du Gradient Ventriculaire Spatial (SVG), variante aire\", \"mV·s\", AXIS_MAGNITUDE,\n               \"Commun avec BRAVEHEART (svg_area_mag, en mV·ms -- attention au facteur 1000 entre les deux conventions d'unité).\"),\n    ColumnInfo(\"svg_peak_magnitude_mV\", \"Magnitude du SVG, variante pic\", \"mV\", AXIS_MAGNITUDE),\n    ColumnInfo(\"sai_qrst_mV_s\", \"Sum Absolute QRST Integral\", \"mV·s\", AXIS_MAGNITUDE,\n               \"Indice GEH le plus cité de la littérature -- commun avec BRAVEHEART (sai_qrst, en mV·ms).\"),\n    ColumnInfo(\"sai_vm_mV_s\", \"SAI QRST, dérivation VM\", \"mV·s\", AXIS_MAGNITUDE),\n    ColumnInfo(\"qrs_peak_magnitude_mV\", \"Magnitude du vecteur QRS au pic\", \"mV\", AXIS_MAGNITUDE),\n    ColumnInfo(\"qrs_t_amplitude_ratio\", \"Ratio d'amplitude QRS/T (magnitude spatiale au pic)\", \"sans unité\", AXIS_MAGNITUDE),\n    ColumnInfo(\"speed_qrst_max_mV_s\", \"Vitesse maximale de la trajectoire VCG (QRST)\", \"mV/s\", AXIS_MAGNITUDE),\n    ColumnInfo(\"sti_qrst_mV\", \"Intégrale vitesse-temps (Speed-Time Integral), QRST\", \"mV\", AXIS_MAGNITUDE),\n\n    # --- Axe 5 : onde P / atteinte auriculaire gauche ---\n    ColumnInfo(\"ptfv1_mm_ms\", \"P-wave terminal force en V1 (indice de Morris)\", \"mm·ms\", AXIS_P_WAVE,\n               \"Anormal si >= 40 mm·ms -- pertinent en CMH (dilatation/fibrose auriculaire gauche fréquente). Nécessite NeuroKit2 : souvent absent (NaN) si la délinéation de l'onde P échoue -- voir README section 6.\"),\n    ColumnInfo(\"ptfv1_positive\", \"PTFV1 positif\", \"bool\", AXIS_P_WAVE),\n)\n\n\ndef priority_column_names() -> list[str]:\n    return [c.column for c in PRIORITY_COLUMNS]\n\n\ndef build_filtered_workbook(df):\n    \"\"\"Construit un classeur Excel (bytes) à partir du tableau de résultats\n    produit par ecg_vcg_hcm lui-même (une ligne par examen).\n\n    Contrairement à `braveheart_reference.build_filtered_workbook`, il n'y a\n    pas de feuille \"artefacts\" : toutes les colonnes du fichier d'origine\n    sont des mesures valides, la sélection ne fait que resserrer sur les\n    plus pertinentes pour les études CMH / amylose cardiaque.\n    \"\"\"\n    import io as _io\n\n    import pandas as pd\n\n    present_priority = [c.column for c in PRIORITY_COLUMNS if c.column in df.columns]\n    missing_priority = [c.column for c in PRIORITY_COLUMNS if c.column not in df.columns]\n\n    filtered_df = df[present_priority].copy() if present_priority else pd.DataFrame()\n\n    legend_rows = [\n        {\n            \"Colonne\": c.column,\n            \"Signification\": c.label_fr,\n            \"Unité\": c.unit,\n            \"Axe de recherche\": c.category,\n            \"Note\": c.note,\n        }\n        for c in PRIORITY_COLUMNS\n        if c.column in df.columns\n    ]\n    legend_df = pd.DataFrame(legend_rows)\n\n    buf = _io.BytesIO()\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as writer:\n        filtered_df.to_excel(writer, sheet_name=\"Colonnes prioritaires\", index=False)\n        legend_df.to_excel(writer, sheet_name=\"Légende\", index=False)\n        if missing_priority:\n            pd.DataFrame({\"Colonne prioritaire absente du fichier fourni\": missing_priority}).to_excel(\n                writer, sheet_name=\"Colonnes prioritaires manquantes\", index=False\n            )\n    return buf.getvalue(), missing_priority\n", "ecg_hcm/romhilt_estes.py": "\"\"\"\nromhilt_estes.py\n=================\n\nScore de Romhilt-Estes (score composite par points pour le diagnostic ECG\nde l'hypertrophie ventriculaire gauche) :\n\n> Romhilt DW, Estes EH Jr. \"A point-score system for the ECG diagnosis of\n> left ventricular hypertrophy.\" Am Heart J. 1968;75(6):752-758.\n\nTable de points reproduite telle que confirmée par deux sources\nindépendantes (voir README) :\n\n- Voltage (R ou S dans une dérivation des membres >= 20 mm/2.0 mV, OU S en\n  V1/V2 >= 30 mm/3.0 mV, OU R en V5/V6 >= 30 mm/3.0 mV) : 3 points\n- ST-T \"en tension\" (strain), opposé au QRS : 3 points SANS digitalique,\n  1 point SOUS digitalique\n- Onde P, composante terminale négative en V1 (profondeur >= 1 mm ET\n  durée >= 40 ms) : 3 points\n- Déviation axiale gauche (axe QRS <= -30°) : 2 points\n- Durée QRS >= 90 ms : 1 point\n- Déflexion intrinsécoïde (onset QRS -> pic R) en V5 ou V6 >= 50 ms :\n  1 point\n\nTotal >= 5 points : LVH \"certaine\" (definite). = 4 : \"probable\". < 4 : non\névocateur.\n\nLIMITES ASSUMÉES — À LIRE AVANT TOUTE UTILISATION EN RECHERCHE\n----------------------------------------------------------------\n1. **Critère \"strain\"** : ce module ne reconnaît pas la morphologie\n   caractéristique du strain (asymétrie, pente descendante lente puis\n   remontée rapide de l'onde T). Il est APPROXIMÉ par la co-occurrence,\n   dans au moins une dérivation à R dominant (V5, V6, I, aVL), d'une onde\n   T négative (< -0.1 mV, même seuil que `t_inversion_leads`) ET d'un\n   sous-décalage ST au point J+60ms (<= -0.05 mV). Cette approximation\n   peut sur-estimer le critère (une T négative isolée sans vraie\n   morphologie de strain) ou le sous-estimer (strain atypique). Le champ\n   `strain_approximated` du résultat indique quand ce critère a été rempli\n   par cette approximation.\n2. **Digitalique** : information non disponible depuis un PDF ECG -> le\n   patient est TOUJOURS supposé non digitalisé. Le critère \"strain\",\n   quand rempli, rapporte donc systématiquement 3 points (jamais 1). Si\n   une partie de votre cohorte est sous digoxine, le score de ces\n   patients peut être surestimé de jusqu'à 2 points.\n\nEn conséquence, ce score est fourni à titre EXPLORATOIRE — à confronter à\nune relecture manuelle avant toute conclusion, en particulier pour les\nexamens dont le score est proche du seuil diagnostique (4-5 points) et où\nle critère \"strain\" contribue.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nfrom .conventional_features import ConventionalFeatures\n\nSTRAIN_LEADS = (\"V5\", \"V6\", \"I\", \"aVL\")\nLIMB_LEADS = (\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\")\nVOLTAGE_LIMB_MV = 2.0\nVOLTAGE_V1V2_S_MV = 3.0\nVOLTAGE_V5V6_R_MV = 3.0\nSTRAIN_T_MV = -0.1\nSTRAIN_ST_MV = -0.05\nLAA_DEPTH_MV = 0.1\nLAA_DURATION_MS = 40.0\nLAD_AXIS_DEG = -30.0\nQRS_DURATION_MS = 90.0\nINTRINSICOID_MS = 50.0\n\n\n@dataclass\nclass RomhiltEstesResult:\n    total_points: int = 0\n    voltage_points: int = 0\n    strain_points: int = 0\n    laa_points: int = 0\n    lad_points: int = 0\n    qrs_duration_points: int = 0\n    intrinsicoid_points: int = 0\n    category: str = \"\"  # \"définite\" | \"probable\" | \"non évocatrice\"\n    strain_approximated: bool = False\n\n\ndef compute(feats: ConventionalFeatures, axis_qrs_deg: float | None,\n            qrs_duration_ms: float | None,\n            ptfv1_terminal_depth_mv: float | None,\n            ptfv1_terminal_duration_ms: float | None) -> RomhiltEstesResult:\n    r = RomhiltEstesResult()\n    pl = feats.per_lead\n\n    # --- Voltage (3 pts)\n    limb_vals = [max(abs(m.r_amplitude_mv), abs(m.s_amplitude_mv))\n                 for ld, m in pl.items() if ld in LIMB_LEADS]\n    limb_max = max(limb_vals) if limb_vals else 0.0\n    sv1v2_vals = [abs(pl[ld].s_amplitude_mv) for ld in (\"V1\", \"V2\") if ld in pl]\n    sv1v2_max = max(sv1v2_vals) if sv1v2_vals else 0.0\n    rv5v6_vals = [pl[ld].r_amplitude_mv for ld in (\"V5\", \"V6\") if ld in pl]\n    rv5v6_max = max(rv5v6_vals) if rv5v6_vals else 0.0\n    if limb_max >= VOLTAGE_LIMB_MV or sv1v2_max >= VOLTAGE_V1V2_S_MV or rv5v6_max >= VOLTAGE_V5V6_R_MV:\n        r.voltage_points = 3\n\n    # --- ST-T \"strain\" (3 pts, approximé — cf. docstring)\n    strain_present = any(\n        ld in pl and pl[ld].t_amplitude_mv < STRAIN_T_MV and pl[ld].st_level_j60_mv <= STRAIN_ST_MV\n        for ld in STRAIN_LEADS\n    )\n    if strain_present:\n        r.strain_points = 3\n        r.strain_approximated = True\n\n    # --- Onde P / anomalie auriculaire gauche (3 pts)\n    if (ptfv1_terminal_depth_mv is not None and ptfv1_terminal_duration_ms is not None\n            and abs(ptfv1_terminal_depth_mv) >= LAA_DEPTH_MV\n            and ptfv1_terminal_duration_ms >= LAA_DURATION_MS):\n        r.laa_points = 3\n\n    # --- Déviation axiale gauche (2 pts)\n    if axis_qrs_deg is not None and axis_qrs_deg <= LAD_AXIS_DEG:\n        r.lad_points = 2\n\n    # --- Durée QRS (1 pt)\n    if qrs_duration_ms is not None and qrs_duration_ms >= QRS_DURATION_MS:\n        r.qrs_duration_points = 1\n\n    # --- Déflexion intrinsécoïde V5/V6 (1 pt)\n    intrinsicoid_vals = [\n        pl[ld].r_peak_time_ms for ld in (\"V5\", \"V6\")\n        if ld in pl and pl[ld].r_peak_time_ms is not None\n    ]\n    if intrinsicoid_vals and max(intrinsicoid_vals) >= INTRINSICOID_MS:\n        r.intrinsicoid_points = 1\n\n    r.total_points = (r.voltage_points + r.strain_points + r.laa_points +\n                       r.lad_points + r.qrs_duration_points + r.intrinsicoid_points)\n    r.category = (\"définite\" if r.total_points >= 5\n                  else \"probable\" if r.total_points == 4\n                  else \"non évocatrice\")\n    return r\n", "ecg_hcm/signal_builder.py": "\"\"\"\nsignal_builder.py\n==================\n\nConvertit les tracés bruts (`RawTrace`, en points PDF) extraits par\n`pdf_parser` en signaux calibrés temps/tension (secondes, millivolts),\nrééchantillonnés sur une grille temporelle uniforme.\n\nCalibration\n-----------\n- Échelle temporelle : \"Vit.: XX mm/sec\" de l'en-tête.\n- Échelle d'amplitude : gain mm/mV de l'en-tête (\"Mbre\" = membres,\n  \"Torse\" = précordiales), avec vérification croisée par la hauteur\n  mesurée de l'impulsion d'étalonnage (1 mV standard) quand elle est\n  disponible ; en cas d'écart > 15 %, l'impulsion mesurée prime (log\n  dans `warnings`).\n- Ligne de base : niveau bas de l'impulsion d'étalonnage (le pas du\n  signal avant/après le créneau), sinon repli sur le mode des valeurs y\n  du tracé lui-même.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom .pdf_parser import ParsedECGPage, RawTrace\n\nPT_PER_MM = 72.0 / 25.4  # points PDF (1/72 pouce) par mm\nDEFAULT_CALIB_PULSE_MV = 1.0\nTARGET_FS_HZ = 500.0  # fréquence d'échantillonnage cible après ré-échantillonnage\n\nLIMB_LEADS = {\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\"}\nPRECORDIAL_LEADS = {\"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\"}\n\n\n@dataclass\nclass SignalTrace:\n    lead: str\n    t: np.ndarray  # secondes, grille uniforme\n    mv: np.ndarray  # millivolts\n    fs_hz: float\n    gain_mm_per_mv: float\n    gain_source: str  # \"header\" | \"pulse\"\n\n\n@dataclass\nclass ECGRecording:\n    leads: dict[str, SignalTrace] = field(default_factory=dict)  # 12 dérivations, fenêtre courte (grille)\n    rhythm: SignalTrace | None = None\n    rhythm_lead_name: str | None = None\n    metadata: dict = field(default_factory=dict)\n    warnings: list[str] = field(default_factory=list)\n\n\ndef _estimate_baseline(pts_y: np.ndarray) -> float:\n    \"\"\"Repli si aucune impulsion d'étalonnage n'est appariée : mode des\n    valeurs y arrondies (le tracé passe la majeure partie du temps sur la\n    ligne isoélectrique pour un ECG de repos).\"\"\"\n    rounded = np.round(pts_y * 2) / 2  # bucket de 0.5 pt\n    values, counts = np.unique(rounded, return_counts=True)\n    return float(values[np.argmax(counts)])\n\n\ndef _remove_baseline_wander(mv: np.ndarray, fs: float) -> np.ndarray:\n    \"\"\"Double filtre médian (200 puis 600 ms, de Chazal et al. 2004). N'est\n    plus qu'un repli de `remove_baseline_pr_knots` (dérivation sans aucun\n    battement repérable) : le filtre de 600 ms suit tout ST-T qui dure plus\n    de ~300 ms et l'efface en partie (cf. remove_baseline_pr_knots).\"\"\"\n    from scipy.ndimage import median_filter\n    k1 = int(0.2 * fs) | 1\n    k2 = int(0.6 * fs) | 1\n    base = median_filter(median_filter(mv, size=k1, mode=\"nearest\"), size=k2, mode=\"nearest\")\n    return mv - base\n\n\ndef _pr_knot_baseline(mv: np.ndarray, fs: float, rr_s: float | None,\n                      qrs_onset_s: float) -> tuple[np.ndarray, int]:\n    \"\"\"Ligne de base passant par le segment PR de chaque battement (médiane\n    de -50 à -10 ms avant le début du QRS), interpolée linéairement entre\n    battements et constante aux bords. Retourne (signal corrigé, nb de\n    noeuds) ; 0 noeud = aucun battement repéré dans le tracé.\"\"\"\n    from scipy.signal import find_peaks\n    w = max(1, int(0.03 * fs))\n    slope = np.abs(np.gradient(mv)) * fs\n    env = np.convolve(slope, np.ones(w) / w, mode=\"same\")\n    if len(mv) < 3 or env.max() <= 0:\n        return mv, 0\n    dist = int(0.7 * rr_s * fs) if rr_s else int(0.30 * fs)\n    peaks, _ = find_peaks(env, height=0.35 * env.max(), distance=max(1, dist))\n    med = float(np.median(mv))\n    h = int(0.06 * fs)\n    kt, kv = [], []\n    for p in peaks:\n        lo, hi = max(0, p - h), min(len(mv), p + h)\n        r = lo + int(np.argmax(np.abs(mv[lo:hi] - med)))  # pic R (ou S/QS)\n        a = r + int((qrs_onset_s - 0.05) * fs)\n        b = r + int((qrs_onset_s - 0.01) * fs)\n        if a < 0 or b <= a:\n            continue\n        kt.append((a + b) / 2.0)\n        kv.append(float(np.median(mv[a:b])))\n    if not kt:\n        return mv, 0\n    return mv - np.interp(np.arange(len(mv)), kt, kv), len(kt)\n\n\ndef remove_baseline_pr_knots(rec: ECGRecording) -> None:\n    \"\"\"Retire la dérive de ligne de base (formats autres que GE et scans)\n    par des noeuds placés sur le segment PR de chaque battement.\n\n    Remplace le double filtre médian 200/600 ms : vérifié le 2026-10-22 en\n    l'appliquant à 10 PDF GE (ligne de base fiable, non filtrée = référence),\n    le filtre médian réduisait les ondes T > 0,5 mV de 9 % en médiane (jusqu'à\n    31 %) et faussait le ST à J+60 de 0,05 mV en moyenne (jusqu'à 0,23 mV) ;\n    avec les noeuds PR, T à 100 % (P5 99 %) et ST à 0,003 mV près. Sur 22\n    Cardionics, un sous-décalage ST de 0,5 mV avec T à -1,2 mV en V5 (strain\n    franc) ressortait à -0,02 et -0,70 mV avec l'ancien filtre.\"\"\"\n    from .beat_detection import analyze  # import local : dépendance circulaire\n    rr_s, onset = None, -0.05\n    try:\n        beat = analyze(rec)\n        if beat.heart_rate_bpm and 20.0 <= beat.heart_rate_bpm <= 300.0:\n            rr_s = 60.0 / beat.heart_rate_bpm\n        if -0.20 <= beat.qrs_onset_s < 0:\n            onset = beat.qrs_onset_s\n    except Exception:  # noqa: BLE001 - pas de bande rythme, etc. : valeurs par défaut\n        pass\n    sigs = {id(s): s for s in [rec.rhythm, *rec.leads.values()] if s is not None}\n    fallback = []\n    for sig in sigs.values():\n        mv, n = _pr_knot_baseline(sig.mv, sig.fs_hz, rr_s, onset)\n        if n == 0:\n            mv = _remove_baseline_wander(sig.mv, sig.fs_hz)\n            fallback.append(sig.lead)\n        sig.mv = mv\n    if fallback:\n        rec.warnings.append(\n            \"Ligne de base : aucun battement repéré pour %s, filtre médian utilisé \"\n            \"(peut atténuer ST et onde T).\" % \", \".join(sorted(set(fallback))))\n\n\ndef _build_one(trace: RawTrace, mm_per_sec: float, header_gain_mm_mv: float | None,\n                calib_pulse, warnings: list[str], baseline_correction: bool = False) -> SignalTrace:\n    pts = np.asarray(trace.pts, dtype=float)\n    x = pts[:, 0]\n    y = pts[:, 1]\n\n    # --- Calibration d'amplitude ---\n    gain = header_gain_mm_mv\n    gain_source = \"header\"\n    if calib_pulse is not None and calib_pulse.height_pt > 1:\n        pulse_gain = calib_pulse.height_pt / (PT_PER_MM * DEFAULT_CALIB_PULSE_MV)\n        if header_gain_mm_mv is None:\n            gain = pulse_gain\n            gain_source = \"pulse\"\n        else:\n            rel_diff = abs(pulse_gain - header_gain_mm_mv) / header_gain_mm_mv\n            if rel_diff > 0.15:\n                warnings.append(\n                    \"%s : gain mesuré via impulsion (%.1f mm/mV) diffère de \"\n                    \"l'en-tête (%.1f mm/mV) de %.0f%% — valeur mesurée \"\n                    \"retenue.\" % (trace.lead, pulse_gain, header_gain_mm_mv, rel_diff * 100)\n                )\n                gain = pulse_gain\n                gain_source = \"pulse\"\n    if gain is None:\n        gain = 10.0  # valeur standard par défaut si tout échoue\n        gain_source = \"défaut (10 mm/mV)\"\n        warnings.append(\"%s : aucune calibration d'amplitude trouvée, valeur \"\n                         \"par défaut 10 mm/mV utilisée.\" % trace.lead)\n\n    # --- Ligne de base ---\n    if calib_pulse is not None:\n        baseline_y = calib_pulse.bottom  # niveau bas du créneau = ligne de base\n    else:\n        baseline_y = _estimate_baseline(y)\n\n    # --- Conversion ---\n    x_origin = trace.time_origin_x if trace.time_origin_x is not None else x[0]\n    t = (x - x_origin) / PT_PER_MM / mm_per_sec\n    mv = (baseline_y - y) / PT_PER_MM / gain\n\n    # --- Rééchantillonnage sur grille uniforme ---\n    duration = t[-1] - t[0]\n    n_samples = int(round(duration * TARGET_FS_HZ)) + 1\n    t_uniform = np.linspace(t[0], t[-1], n_samples)\n    mv_uniform = np.interp(t_uniform, t, mv)\n    if baseline_correction:\n        mv_uniform = _remove_baseline_wander(mv_uniform, TARGET_FS_HZ)\n\n    return SignalTrace(lead=trace.lead, t=t_uniform, mv=mv_uniform,\n                        fs_hz=TARGET_FS_HZ, gain_mm_per_mv=gain, gain_source=gain_source)\n\n\ndef build_recording(parsed: ParsedECGPage) -> ECGRecording:\n    rec = ECGRecording(metadata=dict(parsed.metadata), warnings=list(parsed.warnings))\n\n    mm_per_sec = parsed.metadata.get(\"paper_speed_mm_s\") or 25.0\n    if not parsed.metadata.get(\"paper_speed_mm_s\"):\n        rec.warnings.append(\"Vitesse de défilement absente de l'en-tête, 25 mm/sec supposée.\")\n\n    gain_limb = parsed.metadata.get(\"gain_limb_mm_mV\")\n    gain_chest = parsed.metadata.get(\"gain_chest_mm_mV\")\n\n    for lead_key, trace in parsed.traces.items():\n        base_lead = lead_key.replace(\"_rhythm\", \"\")\n        header_gain = gain_limb if base_lead in LIMB_LEADS else gain_chest\n        calib = parsed.calib_pulses.get(lead_key)\n        sig = _build_one(trace, mm_per_sec, header_gain, calib, rec.warnings)\n\n        if trace.is_full_width:\n            # Plusieurs bandes rythme (ex. GE V1/II/V5) : on garde II de\n            # préférence, sinon la première rencontrée.\n            if rec.rhythm is None or (base_lead == \"II\" and rec.rhythm_lead_name != \"II\"):\n                rec.rhythm = sig\n                rec.rhythm_lead_name = base_lead\n        else:\n            rec.leads[base_lead] = sig\n\n    # Formats autres que GE : ligne de base de chaque tranche courte non\n    # garantie par l'appareil -> correction par noeuds PR.\n    if parsed.metadata.get(\"device_format\"):\n        remove_baseline_pr_knots(rec)\n\n    missing = [ld for ld in (LIMB_LEADS | PRECORDIAL_LEADS) if ld not in rec.leads]\n    if missing:\n        rec.warnings.append(\"Dérivation(s) manquante(s) : %s\" % \", \".join(sorted(missing)))\n\n    return rec\n", "ecg_hcm/signal_csv.py": "\"\"\"\nsignal_csv.py\n=============\n\nLecture d'un ECG déjà numérisé (CSV de signal), typiquement produit à partir\nd'un ECG papier scanné par Open-ECG-Digitizer (Stenhede et al., npj Digit Med\n2026) et un script de conversion. Le CSV remplace l'étape « PDF vectoriel ->\ntracés » ; la suite de l'analyse (battements médians, VCG, critères, export\nBRAVEHEART) est la même que pour un PDF.\n\nFormat attendu (un fichier par ECG) :\n\n- une ligne d'en-tête ; colonnes I, II, III, aVR, aVL, aVF, V1 à V6, et\n  bandes rythme éventuelles nommées rhythm_II, rhythm_V1, rhythm_V5 ;\n- colonne t_s (secondes, temps 0 = début du tracé) facultative : sans elle,\n  la fréquence vient du JSON (fs_hz) ou, à défaut, la durée est supposée de\n  10 s (sortie « canonique » d'Open-ECG-Digitizer : 3000 points) ;\n- valeurs en mV ou en µV (détecté : amplitudes > 50 -> µV) ;\n- NaN là où une dérivation n'est pas imprimée (ex. 3x4 : I de 0 à 2,5 s\n  seulement) ou illisible. Seule la plus longue portion continue de chaque\n  dérivation est gardée (trous de moins de 40 ms comblés) ; une dérivation\n  à moins de 1,5 s exploitable est écartée.\n\nUn JSON facultatif du même nom (ECG.csv + ECG.json) peut préciser : layout,\npaper_speed_mm_s, gain_limb_mm_mV, gain_chest_mm_mV, dpi, unit (\"mV\"/\"uV\"),\nfs_hz, duration_s, et les champs d'en-tête lus sur le papier (age_years,\nsex_raw, heart_rate_bpm, pr_ms, qrs_duration_ms, qt_ms, qtc_ms,\naxis_p_deg, axis_qrs_deg, axis_t_deg). « \"pr_ms\": null » signifie que\nl'appareil n'imprime pas de PR (FA, rythme électro-entraîné ou\nindéterminé, précisé dans rythme_appareil) : aucun PR n'est alors rendu.\n\nBande rythme : rhythm_II, sinon rhythm_V1, sinon rhythm_V5, sinon la\ndérivation de la grille la plus longue si elle couvre au moins 8 s (12x1).\nSur une bande V1 (QRS souvent rS), la détection des R prend le plus grand\nécart à la ligne de base, positif ou négatif (beat_detection.py).\n\nLes valeurs issues d'un scan sont moins précises qu'un PDF vectoriel\n(épaisseur du trait, grille) : la colonne device_format les marque\n« scan (...) ».\n\nCorrection d'amplitude (SCAN_AMPLITUDE_FACTOR) : sur 13 ECG GE de Saint-Luc\nanalysés à la fois en scan (Open-ECG-Digitizer, 300 dpi) et en PDF vectoriel\n(21/10/2026), les amplitudes du scan sont plus basses d'environ 10 % (rapport\nmédian R, S, T = 0,905), alors que le créneau imprimé mesure bien 10 mm.\nValidation croisée 7/6 sur les 1716 répartitions : facteur 0,89-0,92, biais\nrésiduel des indices de voltage, SVG et SAI dans ±4 %. Le signal est donc\nmultiplié par 1/0,905 = 1,105 (désactivable). Valable pour cet appareil et\nce scanner ; à revérifier ailleurs.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport json\n\nimport numpy as np\nimport pandas as pd\n\nfrom .signal_builder import (LIMB_LEADS, PRECORDIAL_LEADS, TARGET_FS_HZ, ECGRecording,\n                             SignalTrace, remove_baseline_pr_knots)\n\nLEADS = (\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\", \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\")\nRHYTHM_PREFERENCE = (\"II\", \"V1\", \"V5\")\nMAX_GAP_S = 0.04\nMIN_LEAD_S = 1.5\nSCAN_AMPLITUDE_FACTOR = 1.105\nHEADER_KEYS = (\"age_years\", \"sex_raw\", \"heart_rate_bpm\", \"pr_ms\", \"qrs_duration_ms\",\n               \"qt_ms\", \"qtc_ms\", \"axis_p_deg\", \"axis_qrs_deg\", \"axis_t_deg\",\n               \"paper_speed_mm_s\", \"gain_limb_mm_mV\", \"gain_chest_mm_mV\")\n\n\ndef looks_like_signal_csv(data: bytes) -> bool:\n    \"\"\"Vrai si la première ligne contient au moins 6 noms de dérivations.\"\"\"\n    head = data[:2000].decode(\"utf-8-sig\", errors=\"replace\").splitlines()\n    if not head:\n        return False\n    cols = {c.strip().strip('\"') for c in head[0].replace(\";\", \",\").replace(\"\\t\", \",\").split(\",\")}\n    return len(cols & set(LEADS)) >= 6\n\n\ndef _norm_col(c: str) -> str:\n    c = str(c).strip().strip('\"')\n    low = c.lower().replace(\"-\", \"_\").replace(\" \", \"_\")\n    for ld in LEADS:\n        if low == ld.lower():\n            return ld\n        if low in (\"rhythm_\" + ld.lower(), \"rythme_\" + ld.lower(), ld.lower() + \"_rhythm\"):\n            return \"rhythm_\" + ld\n    if low in (\"t\", \"t_s\", \"time\", \"time_s\", \"temps\", \"temps_s\"):\n        return \"t_s\"\n    return c\n\n\ndef _longest_run(t: np.ndarray, v: np.ndarray, fs: float):\n    \"\"\"Plus longue portion finie, après comblement des trous < MAX_GAP_S.\"\"\"\n    ok = np.isfinite(v)\n    if ok.sum() < 2:\n        return None\n    idx = np.flatnonzero(ok)\n    v = v.copy()\n    # comble les petits trous internes par interpolation linéaire\n    gaps = np.flatnonzero(np.diff(idx) > 1)\n    for g in gaps:\n        a, b = idx[g], idx[g + 1]\n        if (b - a) / fs <= MAX_GAP_S:\n            v[a:b + 1] = np.interp(np.arange(a, b + 1), [a, b], [v[a], v[b]])\n    ok = np.isfinite(v)\n    edges = np.diff(np.concatenate([[0], ok.astype(int), [0]]))\n    starts, ends = np.flatnonzero(edges == 1), np.flatnonzero(edges == -1)\n    k = int(np.argmax(ends - starts))\n    s, e = starts[k], ends[k]\n    return t[s:e], v[s:e]\n\n\ndef _resample(t: np.ndarray, v: np.ndarray) -> tuple[np.ndarray, np.ndarray]:\n    n = int(round((t[-1] - t[0]) * TARGET_FS_HZ)) + 1\n    tu = np.linspace(t[0], t[0] + (n - 1) / TARGET_FS_HZ, n)\n    return tu, np.interp(tu, t, v)\n\n\ndef read_signal_csv(data: bytes, sidecar: dict | None = None,\n                    amplitude_factor: float = 1.0) -> ECGRecording:\n    meta_in = dict(sidecar or {})\n    text = data.decode(\"utf-8-sig\", errors=\"replace\")\n    first = text.splitlines()[0] if text else \"\"\n    sep = \";\" if first.count(\";\") > first.count(\",\") else (\"\\t\" if \"\\t\" in first else \",\")\n    df = pd.read_csv(io.StringIO(text), sep=sep, decimal=\",\" if sep == \";\" else \".\")\n    df.columns = [_norm_col(c) for c in df.columns]\n    df = df.apply(pd.to_numeric, errors=\"coerce\")\n\n    warnings: list[str] = []\n    n = len(df)\n    t = df[\"t_s\"].to_numpy(dtype=float) if \"t_s\" in df.columns else None\n    step = float(np.nanmedian(np.diff(t))) if t is not None and np.isfinite(t).sum() >= 2 else 0.0\n    if step > 0:\n        fs = 1.0 / step\n    else:\n        fs = meta_in.get(\"fs_hz\")\n        if not fs:\n            duration = float(meta_in.get(\"duration_s\") or 10.0)\n            fs = (n - 1) / duration if n > 1 else TARGET_FS_HZ\n            if not meta_in.get(\"duration_s\"):\n                warnings.append(\"CSV sans colonne t_s ni fs_hz : durée de 10 s supposée \"\n                                \"(%.0f Hz).\" % fs)\n        t = np.arange(n) / float(fs)\n\n    lead_cols = [c for c in df.columns if c in LEADS or c.startswith(\"rhythm_\")]\n    unit = str(meta_in.get(\"unit\", \"\")).lower().replace(\"µ\", \"u\")\n    if unit not in (\"mv\", \"uv\"):\n        peak = float(np.nanmax(np.abs(df[lead_cols].to_numpy(dtype=float)))) if lead_cols else 0\n        unit = \"uv\" if peak > 50 else \"mv\"\n    scale = (1e-3 if unit == \"uv\" else 1.0) * amplitude_factor\n\n    sex = meta_in.get(\"sex_raw\", meta_in.get(\"sex\"))\n    metadata = {k: meta_in[k] for k in HEADER_KEYS if meta_in.get(k) is not None}\n    if sex is not None:\n        metadata[\"sex_raw\"] = sex\n    if \"pr_ms\" in meta_in and meta_in[\"pr_ms\"] is None:\n        # « pr_ms\": null » : l'appareil n'imprime pas de PR (FA, rythme\n        # électro-entraîné ou indéterminé) -> aucun PR ni mesure de l'onde P.\n        metadata[\"pr_absent_on_device\"] = True\n        if meta_in.get(\"rythme_appareil\"):\n            metadata[\"device_rhythm\"] = str(meta_in[\"rythme_appareil\"])\n    layout = meta_in.get(\"layout\")\n    metadata[\"device_format\"] = \"scan (%s)\" % layout if layout else \"scan\"\n    metadata[\"scan_amplitude_factor\"] = float(amplitude_factor)\n    rec = ECGRecording(metadata=metadata, warnings=warnings)\n\n    for col in lead_cols:\n        run = _longest_run(t, df[col].to_numpy(dtype=float) * scale, fs)\n        if run is None or run[0][-1] - run[0][0] < MIN_LEAD_S:\n            if not col.startswith(\"rhythm_\"):\n                warnings.append(\"%s : moins de %.1f s exploitable dans le CSV, \"\n                                \"dérivation écartée.\" % (col, MIN_LEAD_S))\n            continue\n        tu, vu = _resample(*run)\n        base = col.replace(\"rhythm_\", \"\")\n        gain = meta_in.get(\"gain_limb_mm_mV\" if base in LIMB_LEADS else \"gain_chest_mm_mV\") or 10.0\n        sig = SignalTrace(lead=base, t=tu, mv=vu, fs_hz=TARGET_FS_HZ,\n                          gain_mm_per_mv=float(gain), gain_source=\"scan\")\n        if col.startswith(\"rhythm_\"):\n            rank = RHYTHM_PREFERENCE.index(base) if base in RHYTHM_PREFERENCE else 9\n            cur = (RHYTHM_PREFERENCE.index(rec.rhythm_lead_name)\n                   if rec.rhythm_lead_name in RHYTHM_PREFERENCE else 9)\n            if rec.rhythm is None or rank < cur:\n                rec.rhythm, rec.rhythm_lead_name = sig, base\n        else:\n            rec.leads[base] = sig\n\n    if rec.rhythm is None and rec.leads:\n        best = max(rec.leads.values(), key=lambda s: s.t[-1] - s.t[0])\n        if best.t[-1] - best.t[0] >= 8.0:\n            rec.rhythm, rec.rhythm_lead_name = best, best.lead\n    if rec.rhythm is None:\n        warnings.append(\"Aucune bande rythme (rhythm_II, rhythm_V1 ou rhythm_V5) ni \"\n                        \"dérivation de 8 s ou plus dans le CSV.\")\n    remove_baseline_pr_knots(rec)\n    missing = [ld for ld in (LIMB_LEADS | PRECORDIAL_LEADS) if ld not in rec.leads]\n    if missing:\n        warnings.append(\"Dérivation(s) manquante(s) : %s\" % \", \".join(sorted(missing)))\n    warnings.append(\"ECG numérisé à partir d'un scan : amplitudes et intervalles moins \"\n                    \"précis qu'un PDF vectoriel (épaisseur du trait, grille).\")\n    if amplitude_factor != 1.0:\n        warnings.append(\"Amplitudes du scan multipliées par %.3f (sous-estimation d'environ \"\n                        \"10 %% mesurée contre les PDF vectoriels GE).\" % amplitude_factor)\n    return rec\n\n\ndef read_sidecar(data: bytes | None) -> dict:\n    if not data:\n        return {}\n    try:\n        out = json.loads(data.decode(\"utf-8-sig\"))\n    except ValueError:\n        return {}\n    return out if isinstance(out, dict) else {}\n", "ecg_hcm/signal_quality.py": "\"\"\"\nsignal_quality.py\n==================\n\nScore de qualité globale du signal (bande rythme), via NeuroKit2\n(`ecg_quality`, méthode \"averageQRS\" par défaut : distance de chaque\ncomplexe QRS au QRS moyen du tracé — 0 = très différent du gabarit moyen,\n1 = identique). Sert d'indicateur de confiance automatique à consulter\navant de faire confiance aux mesures d'un examen sur une cohorte.\n\nCe n'est PAS une garantie de justesse des mesures en soi : un tracé propre\nmais mal calé (cf. `delineation.py`) peut avoir un bon score de qualité\ntout en donnant des mesures fausses, et l'inverse (bruit ponctuel sur un\nbattement, tracé par ailleurs correctement analysé) peut aussi arriver —\nà utiliser comme signal d'alerte complémentaire, pas comme validation\nunique.\n\nDépendance optionnelle (même NeuroKit2 que `delineation.py`) : `None` si\nla bibliothèque n'est pas installée, ou en cas d'échec du calcul.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom .beat_detection import BeatAnalysis\nfrom .signal_builder import ECGRecording\n\ntry:\n    import neurokit2 as nk\n    _HAS_NEUROKIT2 = True\nexcept ImportError:\n    _HAS_NEUROKIT2 = False\n\n\ndef neurokit2_available() -> bool:\n    return _HAS_NEUROKIT2\n\n\ndef compute(rec: ECGRecording, beat: BeatAnalysis) -> float | None:\n    \"\"\"Score médian de qualité (0-1) sur la bande rythme. `None` si\n    NeuroKit2 est indisponible, si la bande rythme est absente, ou si le\n    calcul échoue.\"\"\"\n    if not _HAS_NEUROKIT2 or rec.rhythm is None:\n        return None\n\n    # r_idx dérivés directement de rec.rhythm (même source que\n    # beat.r_peak_times_s, cf. beat_detection.detect_r_peaks) : pas de\n    # risque de décalage d'origine temporelle entre dérivations ici,\n    # contrairement à delineation.delineate_lead_nk2.\n    r_idx = np.searchsorted(rec.rhythm.t, beat.r_peak_times_s)\n    r_idx = r_idx[(r_idx > 0) & (r_idx < len(rec.rhythm.t))]\n    if len(r_idx) < 2:\n        return None\n\n    try:\n        quality = nk.ecg_quality(\n            rec.rhythm.mv, rpeaks=r_idx, sampling_rate=rec.rhythm.fs_hz,\n            method=\"averageQRS\",\n        )\n    except Exception:\n        return None\n\n    quality = np.asarray(quality, dtype=float)\n    quality = quality[~np.isnan(quality)]\n    if len(quality) == 0:\n        return None\n    return float(np.median(quality))\n", "ecg_hcm/t_wave_complexity.py": "\"\"\"\nt_wave_complexity.py\n=====================\n\nDispersion/complexité de la morphologie de l'onde T entre dérivations —\n**TMD** (T-wave Morphology Dispersion) et **TWR** (T-wave Residuum),\ncalculés par décomposition en valeurs singulières (SVD) du signal\nmulti-dérivations sur la fenêtre T, plutôt qu'à partir de la VCG dérivée\npar Kors (`vcg.py`). Contrairement au reste de ce module, ces deux indices\nutilisent directement les dérivations ECG (pas X/Y/Z), méthode d'origine :\n\n> Acar B, Savelieva I, Hnatkova K, Malik M. \"Automatic ECG processing for\n> non-invasive risk stratification.\" IEEE (voir README pour les\n> références précises des articles fondateurs, l'accès PubMed/PMC ayant\n> été bloqué par reCAPTCHA lors de la vérification).\n\nInspiré de BRAVEHEART (Stabenau HF, Waks JW. Comput Methods Programs\nBiomed. 2023;242:107798 ; github.com/BIVectors/BRAVEHEART, GPL-3.0),\nutilisé comme référence de formules, pas comme dépendance.\n\n**RÉSERVE BIBLIOGRAPHIQUE IMPORTANTE (à lire avant toute utilisation en\nrecherche)** : le jeu exact de dérivations utilisé par BRAVEHEART pour ces\ndeux indices n'a pas pu être confirmé sans ambiguïté à partir des sources\nsecondaires consultées (une décrit \"8 dérivations en excluant V1\", ce qui\nest contradictoire — 8 moins 1 fait 7 — et l'autre mentionne un compte de\n21 angles pairés pour le TMD, qui correspond mathématiquement à 7\ndérivations [C(7,2)=21] et non 8 [C(8,2)=28]). Faute d'accès direct au\ncode source pour trancher, **ce module utilise ici les 8 dérivations\nindépendantes standard (I, II, V1-V6)**, déjà utilisées par ailleurs dans\ncet outil pour la transformation de Kors (cohérence interne), SANS exclure\nV1. Le nombre de paires pour le TMD est donc de 28, pas 21. Si vous\nutilisez ces indices en publication, une vérification directe du code\nsource de BRAVEHEART (ou de l'article méthodologique d'Acar et al.\nd'origine) est recommandée avant de vous appuyer sur le choix fait ici.\n\nAlgorithme implémenté :\n1. Signal de chaque dérivation indépendante, restreint à la fenêtre T\n   globale (`t_onset_s`/`t_offset_s`, la même que celle utilisée pour la\n   VCG — cf. `pipeline._global_t_window`).\n2. Matrice M (temps x dérivations) empilant ces segments.\n3. SVD de M -> valeurs singulières S (une par dérivation, triées\n   décroissantes) et coefficients de chaque dérivation dans l'espace des 2\n   premières composantes principales (`score_i = Vt[:2, i] * S[:2]`,\n   vecteur 2D par dérivation).\n4. **TMD** = moyenne des angles entre chaque paire de dérivations\n   (représentées par leur `score_i` 2D) — reflète l'hétérogénéité de\n   morphologie de l'onde T entre dérivations (repolarisation non\n   uniforme), en degrés.\n5. **TWR** = somme des valeurs singulières au carré (énergie) au-delà des\n   3 premières composantes, rapportée à l'énergie totale (`TWR_rel`, en\n   %) et en valeur absolue (`TWR_abs`, mV²) — quantifie la part de\n   variance de l'onde T qui n'est PAS expliquée par un modèle dipolaire\n   simple (3 composantes principales) : plus élevé = repolarisation plus\n   \"complexe\"/non-dipolaire.\n\nLes deux indices sont **exploratoires** : non validés spécifiquement en\nCMH, ni dans la littérature originale d'Acar et al. ni dans celle de\nBRAVEHEART (cohortes post-infarctus/ischémie/générales). Aucun seuil\npathologique n'est appliqué ici.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nfrom .beat_detection import BeatAnalysis\n\nTMD_LEADS = [\"I\", \"II\", \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\"]  # cf. réserve ci-dessus\nMIN_SAMPLES = 4\n\n\n@dataclass\nclass TWaveComplexityResult:\n    tmd_deg: float | None = None\n    twr_abs_mv2: float | None = None\n    twr_rel_pct: float | None = None\n    n_leads_used: int | None = None\n    leads_used: list[str] | None = None\n    warnings: list[str] = None  # type: ignore[assignment]\n\n    def __post_init__(self):\n        if self.warnings is None:\n            self.warnings = []\n\n\ndef compute(median_beats: dict, t_onset_s: float | None, t_offset_s: float | None\n            ) -> TWaveComplexityResult:\n    warnings: list[str] = []\n    if t_onset_s is None or t_offset_s is None or not (t_offset_s > t_onset_s):\n        return TWaveComplexityResult(\n            warnings=[\"TMD/TWR non calculables (fenêtre T globale introuvable).\"]\n        )\n\n    leads_used = [ld for ld in TMD_LEADS if ld in median_beats]\
