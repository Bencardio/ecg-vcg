<div id="chargement">
  <p><strong>Analyse ECG-VCG v0.16.11</strong> se charge dans votre navigateur
  (30 s à 1 min la première fois, plus rapide ensuite).</p>
  <p>Les PDF que vous déposez sont analysés sur cet ordinateur ; ils ne sont envoyés à aucun serveur.</p>

<div id="root"></div>
<script id="fichiers" type="application/json">{"app.py": "\"\"\"\napp.py\n======\n\nApplication Streamlit interactive : analyse automatisée vectorielle d'ECG\n12 dérivations (PDF), pour les études de recherche (CMH, rétrécissement\naortique, etc.).\n\nLancement :\n    streamlit run app.py\n\nCeci est un OUTIL DE RECHERCHE, pas un dispositif médical certifié. Toute\nmesure doit être relue par un cardiologue avant utilisation clinique.\n\"\"\"\n\nimport io\nimport os\nimport tempfile\nimport zipfile\n\nimport matplotlib.pyplot as plt\nimport pandas as pd\nimport streamlit as st\n\nfrom ecg_hcm.batch import row_from_result, to_csv_zip_bytes, to_excel_bytes\nfrom ecg_hcm.braveheart_export import export_generic_csv\nfrom ecg_hcm.braveheart_reference import build_filtered_workbook\nfrom ecg_hcm.pipeline import PatientECGResult, process_pdf, process_signal_csv\nfrom ecg_hcm.signal_csv import SCAN_AMPLITUDE_FACTOR, looks_like_signal_csv\nfrom ecg_hcm.results_reference import build_filtered_workbook as build_own_filtered_workbook\nfrom ecg_hcm import validation\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _convert_braveheart(bh_bytes, bh_name, app_bytes, app_name, session_df):\n    \"\"\"Lecture + classeur Excel, mis en cache : le calcul (plusieurs dizaines de\n    secondes dans le navigateur pour ~200 ECG) n'est pas refait à chaque clic.\"\"\"\n    bh_df = validation.read_table(bh_bytes, bh_name)\n    app_df = validation.read_table(app_bytes, app_name) if app_bytes is not None else session_df\n    data, missing = build_filtered_workbook(bh_df, app_df)\n    return bh_df, app_df, data, missing\n\nclass _FichierZip:\n    \"\"\"Fichier extrait d'un .zip déposé, avec la même interface qu'un fichier\n    de st.file_uploader (name, getvalue).\"\"\"\n\n    def __init__(self, name, data):\n        self.name, self._data = name, data\n\n    def getvalue(self):\n        return self._data\n\n\ndef _deplier_zips(fichiers):\n    \"\"\"Remplace chaque .zip (ex. ecg_numerises.zip de l'outil de numérisation)\n    par les PDF, CSV et JSON qu'il contient.\"\"\"\n    out = []\n    for f in fichiers:\n        if not f.name.lower().endswith(\".zip\"):\n            out.append(f)\n            continue\n        try:\n            with zipfile.ZipFile(io.BytesIO(f.getvalue())) as z:\n                for info in z.infolist():\n                    if not info.is_dir() and info.filename.lower().endswith((\".pdf\", \".csv\", \".json\")):\n                        out.append(_FichierZip(os.path.basename(info.filename), z.read(info)))\n        except zipfile.BadZipFile:\n            out.append(f)\n    return out\n\n\nst.set_page_config(page_title=\"Analyse ECG vectoriel\", layout=\"wide\")\n\nGRID_LAYOUT = [\n    (\"I\", \"V1\"), (\"II\", \"V2\"), (\"III\", \"V3\"),\n    (\"aVR\", \"V4\"), (\"aVL\", \"V5\"), (\"aVF\", \"V6\"),\n]\n\nst.title(\"Analyse automatisée vectorielle d'ECG\")\nst.caption(\n    \"Outil de recherche à partir de PDF ECG 12 dérivations vectoriels. \"\n    \"Ne constitue pas un dispositif médical certifié — toute mesure doit \"\n    \"être relue par un cardiologue avant utilisation clinique ou \"\n    \"publication. Les tracés PDF ne sont traités qu'en mémoire pour cette \"\n    \"session ; aucune donnée n'est envoyée à un serveur externe.\"\n)\n\nwith st.expander(\"Convertir le fichier de résultats BRAVEHEART en Excel\"):\n    st.caption(\n        \"Déposez le fichier que BRAVEHEART écrit dans le dossier traité après \"\n        \"le batch (processed_ecgs_<date>.csv, ~438 colonnes). Vous obtenez un \"\n        \"classeur Excel avec : les critères d'HVG oui/non (Sokolow, Cornell \"\n        \"voltage et produit, Peguero, Gubner, Lewis, Perugia, Romhilt-Estes \"\n        \"sans onde P), bas voltages, ondes T et QTc recalculés à partir des \"\n        \"amplitudes BRAVEHEART ; les colonnes prioritaires pour les études CMH / \"\n        \"amylose, en clair avec leur unité ; toutes les colonnes de \"\n        \"BRAVEHEART ; une légende ; et la liste des colonnes retirées car \"\n        \"artificielles sur un battement médian répété (variabilité entre \"\n        \"battements, voir README section 9). La colonne « ECG » reprend le nom \"\n        \"du PDF d'origine.\"\n    )\n    bh_result_file = st.file_uploader(\n        \"Fichier de résultats BRAVEHEART (.csv ou .xlsx)\",\n        type=[\"csv\", \"xlsx\"], key=\"bh_result_upload\",\n    )\n    bh_app_file = st.file_uploader(\n        \"Excel de l'application (ecg_resultats.xlsx) : apporte le sexe, la FC et \"\n        \"le groupe 0 (variables propres à l'application). Sinon, le lot analysé \"\n        \"dans cette session est utilisé.\",\n        type=[\"xlsx\", \"csv\"], key=\"bh_result_app_upload\",\n    )\n    if bh_result_file is not None:\n        try:\n            if bh_app_file is not None:\n                app_bytes, app_name, session_df = bh_app_file.getvalue(), bh_app_file.name, None\n            else:\n                app_bytes, app_name = None, None\n                session_df = (st.session_state.get(\"export_cache\") or {}).get(\"df\")\n            with st.spinner(\"Conversion en cours (jusqu'à une minute pour plusieurs \"\n                            \"centaines d'ECG)…\"):\n                bh_result_df, bh_app_df, bh_filtered_bytes, bh_missing_cols = _convert_braveheart(\n                    bh_result_file.getvalue(), bh_result_file.name, app_bytes, app_name, session_df)\n            if bh_app_df is None:\n                st.caption(\"Sans Excel de l'application, le sexe est inconnu : les critères \"\n                           \"à seuil sexué ne sont tranchés que si les deux seuils concordent, \"\n                           \"le Cornell produit et le QTc restent vides, et le groupe 0 \"\n                           \"(variables propres à l'application) est absent.\")\n            st.success(\n                \"%d ligne(s), %d colonne(s) lues dans le fichier fourni.\"\n                % bh_result_df.shape\n            )\n            if bh_app_df is not None and \"filename\" in bh_result_df.columns:\n                bh_keys = bh_result_df[\"filename\"].map(validation.match_key)\n                app_keys = bh_app_df[\"source_file\"].map(validation.match_key)\n                sexes = dict(zip(app_keys, bh_app_df.get(\"sex\", pd.Series(index=bh_app_df.index, dtype=object))\n                                 .map(validation.normalize_sex)))\n                st.caption(\n                    \"%d/%d ECG BRAVEHEART retrouvés dans l'Excel de l'application ; \"\n                    \"sexe connu pour %d (une saisie manuelle dans la colonne Sexe du \"\n                    \"Résumé ou sex des Originales est prise en compte).\"\n                    % (bh_keys.isin(set(app_keys)).sum(), len(bh_keys),\n                       sum(sexes.get(k) is not None for k in bh_keys)))\n                conflicts = bh_app_df.attrs.get(\"sex_conflicts\") or []\n                if conflicts:\n                    st.warning(\n                        \"Sexe différent selon les feuilles de l'Excel pour %d ECG (%s). \"\n                        \"La valeur du Résumé a été retenue ; corrigez la même valeur \"\n                        \"dans toutes les feuilles pour lever le doute.\"\n                        % (len(conflicts), \", \".join(conflicts[:5])\n                           + (\", …\" if len(conflicts) > 5 else \"\")))\n            st.download_button(\n                \"Télécharger en Excel (.xlsx)\",\n                bh_filtered_bytes, type=\"primary\", on_click=\"ignore\",\n                file_name=os.path.splitext(bh_result_file.name)[0] + \".xlsx\",\n                mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n            )\n            if bh_missing_cols:\n                st.caption(\n                    \"%d colonne(s) prioritaire(s) absente(s) de ce fichier \"\n                    \"(probablement une version de BRAVEHEART différente de \"\n                    \"la v1.8.2 utilisée pour établir cette sélection) : %s\"\n                    % (len(bh_missing_cols), \", \".join(bh_missing_cols))\n                )\n        except Exception as exc:  # fichier illisible/format inattendu\n            st.error(\"Impossible de lire ce fichier : %s\" % exc)\n\nwith st.sidebar:\n    st.header(\"Fichiers\")\n    mode_depot = st.radio(\n        \"Charger\", [\"Fichiers\", \"Dossier\"], horizontal=True,\n        help=\"« Dossier » prend tous les PDF (et CSV de signal numérisé) du dossier \"\n             \"choisi, sous-dossiers compris.\",\n    )\n    if mode_depot == \"Dossier\":\n        uploaded = st.file_uploader(\n            \"Choisir un dossier contenant des PDF ECG 12 dérivations ou des ECG \"\n            \"numérisés (CSV + JSON, ou le .zip de l'outil de numérisation)\",\n            accept_multiple_files=\"directory\",\n            key=\"depot_dossier_%d\" % st.session_state.get(\"upload_gen\", 0),\n        )\n        # Pas de filtre `type` ici : un dossier contient souvent d'autres\n        # fichiers, qu'on ignore sans afficher d'erreur.\n    else:\n        uploaded = st.file_uploader(\n            \"Déposer un ou plusieurs PDF ECG 12 dérivations, ou des ECG scannés \"\n            \"déjà numérisés (CSV de signal + JSON facultatif du même nom)\",\n            type=[\"pdf\", \"csv\", \"json\", \"zip\"], accept_multiple_files=True,\n            key=\"depot_fichiers_%d\" % st.session_state.get(\"upload_gen\", 0),\n        )\n    tous = _deplier_zips(list(uploaded or []))\n    sidecars = {os.path.splitext(os.path.basename(f.name.replace(\"\\\\\", \"/\")))[0]: f.getvalue()\n                for f in tous if f.name.lower().endswith(\".json\")}\n    uploaded = [f for f in tous if f.name.lower().endswith(\".pdf\")\n                or (f.name.lower().endswith(\".csv\") and looks_like_signal_csv(f.getvalue()))]\n    # ECG retirés par l'utilisateur (section « Retirer des ECG ») : on ne les\n    # réanalyse pas s'ils sont encore dans la zone de dépôt.\n    retires = st.session_state.setdefault(\"retires\", set())\n    n_avant = len(uploaded)\n    uploaded = [f for f in uploaded\n                if os.path.basename(f.name.replace(\"\\\\\", \"/\")) not in retires]\n    if tous:\n        n_csv = sum(f.name.lower().endswith(\".csv\") for f in uploaded)\n        ignores = len(tous) - n_avant - len(sidecars)\n        st.caption(\"%d fichier(s) prêt(s) à analyser%s%s%s.\" % (\n            len(uploaded),\n            \" dont %d CSV numérisé(s)\" % n_csv if n_csv else \"\",\n            \" (%d autre(s) fichier(s) ignoré(s))\" % ignores if ignores else \"\",\n            \" ; %d retiré(s) non réanalysé(s)\" % (n_avant - len(uploaded))\n            if n_avant > len(uploaded) else \"\"))\n    if tous and not uploaded and not n_avant:\n        ext = sorted({os.path.splitext(f.name)[1].lower() or \"(sans extension)\" for f in tous})\n        st.warning(\"Aucun PDF ni CSV de signal reconnu parmi les %d fichier(s) déposé(s) \"\n                   \"(extensions : %s). Un CSV doit avoir une 1re ligne avec les noms \"\n                   \"des dérivations (I, II, ... V6).\" % (len(tous), \", \".join(ext)))\n    run = st.button(\"Analyser\", type=\"primary\", disabled=not uploaded)\n    gestion_lot = st.container()  # rempli plus bas, une fois les résultats connus\n    include_identity = st.checkbox(\n        \"Inclure l'identité dans le tableau et l'export (nom, prénom, date de \"\n        \"naissance, date de l'ECG, IPP)\", value=True,\n        help=\"Données nominatives : un fichier exporté avec l'identité ne doit \"\n             \"pas quitter le poste sans l'accord de l'hôpital (RGPD).\")\n    corriger_scans = st.checkbox(\n        \"Corriger les amplitudes des ECG scannés (x%.3f)\" % SCAN_AMPLITUDE_FACTOR, value=True,\n        help=\"Les scans numérisés sous-estiment les amplitudes d'environ 10 % par \"\n             \"rapport au PDF vectoriel du même ECG (13 ECG GE, validation croisée). \"\n             \"Sans effet sur les PDF. Relancer « Analyser » après un changement. \"\n             \"Le facteur appliqué figure dans la colonne scan_amplitude_factor.\")\n    st.divider()\n    st.caption(\n        \"Formats testés : GE CardioSoft/MUSE (6x2 + rythme, 3x4 + 3 \"\n        \"bandes rythme), Cardionics, Dräger, et CSV de signal d'un ECG scanné numérisé \"\n        \"(Open-ECG-Digitizer, marqué « scan », moins précis). Un PDF d'un autre \"\n        \"constructeur, ou un PDF scanné non numérisé, \"\n        \"peut échouer ou donner des résultats erronés — vérifier les \"\n        \"avertissements par patient.\"\n    )\n\nif \"results\" not in st.session_state:\n    st.session_state[\"results\"] = []  # list[PatientECGResult]\n\n\ndef _oublier_calculs():\n    \"\"\"Après un changement de la liste des résultats : figures, exports et\n    validation sont à refaire.\"\"\"\n    st.session_state[\"batch_token\"] = st.session_state.get(\"batch_token\", 0) + 1\n    for k in (\"figure_cache\", \"export_cache\", \"bh_zip_bytes\", \"bh_export_warnings\",\n              \"validation_cache\", \"patient_idx\", \"patient_pick\"):\n        st.session_state.pop(k, None)\n\n\ndef _retirer(noms):\n    noms = set(noms)\n    st.session_state[\"results\"] = [r for r in st.session_state[\"results\"]\n                                   if r.source_file not in noms]\n    st.session_state.setdefault(\"retires\", set()).update(noms)\n    st.session_state[\"a_retirer\"] = []\n    _oublier_calculs()\n\n\ndef _tout_effacer():\n    st.session_state[\"results\"] = []\n    st.session_state[\"retires\"] = set()\n    st.session_state[\"a_retirer\"] = []\n    # nouvelle clé = zone de dépôt vidée\n    st.session_state[\"upload_gen\"] = st.session_state.get(\"upload_gen\", 0) + 1\n    _oublier_calculs()\n\n\ndef _section_validation(app_df):\n    \"\"\"Concordance application / BRAVEHEART (ICC, Bland-Altman, CCC, kappa).\n    `app_df` : tableau complet du lot analysé, ou None (on demande alors\n    l'Excel exporté par l'application).\"\"\"\n    st.subheader(\"Validation contre BRAVEHEART\")\n    st.caption(\n        \"Compare, ECG par ECG (appariés par nom de fichier), les paramètres \"\n        \"présents dans les deux outils et fiables dans BRAVEHEART : VCG, \"\n        \"intervalles et amplitudes du battement médian. Les statistiques \"\n        \"battement-à-battement de BRAVEHEART sont exclues. Pour chaque \"\n        \"paramètre : ICC(A,1) en accord absolu avec IC 95 %, Bland-Altman \"\n        \"(biais et limites d'accord), CCC de Lin ; kappa de Cohen pour \"\n        \"quelques critères oui/non. Limite : BRAVEHEART part du battement \"\n        \"médian de l'application, donc ceci valide les calculs, pas \"\n        \"l'extraction du signal depuis le PDF.\"\n    )\n    bh_file = st.file_uploader(\n        \"Fichier de résultats BRAVEHEART (processed_ecgs….csv ou .xlsx)\",\n        type=[\"csv\", \"xlsx\"], key=\"val_bh_file\")\n    app_file = st.file_uploader(\n        \"Excel de l'application (ecg_resultats.xlsx)\" if app_df is None else\n        \"Facultatif : un autre Excel de l'application (sinon, le lot analysé ci-dessus)\",\n        type=[\"xlsx\", \"csv\"], key=\"val_app_file\")\n    if bh_file is None or (app_df is None and app_file is None):\n        return\n    key = (bh_file.name, bh_file.size, app_file.name if app_file else None,\n           app_file.size if app_file else None, st.session_state.get(\"batch_token\"))\n    cache = st.session_state.get(\"validation_cache\")\n    if not cache or cache[\"key\"] != key:\n        if not st.button(\"Comparer\", type=\"primary\", key=\"val_run\"):\n            return\n        with st.spinner(\"Calcul des concordances et des graphiques...\"):\n            try:\n                bh_df = validation.read_table(bh_file.getvalue(), bh_file.name)\n                a_df = (validation.read_table(app_file.getvalue(), app_file.name)\n                        if app_file is not None else app_df)\n                res = validation.compare(a_df, bh_df)\n                xlsx = validation.to_excel(res)\n            except Exception as exc:  # fichier inattendu\n                st.error(\"Comparaison impossible : %s\" % exc)\n                return\n        cache = {\"key\": key, \"res\": res, \"xlsx\": xlsx}\n        st.session_state[\"validation_cache\"] = cache\n    res = cache[\"res\"]\n    st.write(\"**%d ECG appariés** ; %d seulement dans l'application, %d seulement \"\n             \"dans BRAVEHEART.\" % (res.n_matched, len(res.only_app), len(res.only_bh)))\n    if res.only_app or res.only_bh:\n        with st.expander(\"ECG non appariés\"):\n            if res.only_app:\n                st.write(\"Seulement dans l'application : \" + \", \".join(res.only_app))\n            if res.only_bh:\n                st.write(\"Seulement dans BRAVEHEART : \" + \", \".join(res.only_bh))\n    if res.summary.empty:\n        st.warning(\"Aucun paramètre commun n'a pu être comparé (colonnes introuvables ou \"\n                   \"moins de 3 ECG appariés).\")\n        return\n    st.download_button(\"Télécharger la validation (Excel)\", cache[\"xlsx\"],\n                       file_name=\"validation_application_vs_braveheart.xlsx\",\n                       type=\"primary\", on_click=\"ignore\",\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n    show = res.summary[[\"Famille\", \"Paramètre\", \"Unité\", \"n\", \"Biais (app - BH)\",\n                        \"Limite d'accord basse\", \"Limite d'accord haute\", \"ICC(A,1)\",\n                        \"ICC IC95 bas\", \"ICC IC95 haut\", \"Accord (Koo & Li)\", \"CCC de Lin\",\n                        \"Alerte\"]]\n    st.dataframe(show.round(3), use_container_width=True, hide_index=True)\n    if not res.kappa.empty:\n        st.markdown(\"**Critères oui/non (kappa de Cohen)**\")\n        st.dataframe(res.kappa.round(3), use_container_width=True, hide_index=True)\n    # Boutons plutôt qu'une liste déroulante : sur certains navigateurs, le\n    # choix dans la liste déroulante n'était pas pris en compte.\n    params = list(res.summary[\"Paramètre\"])\n    label = st.pills(\"Graphique de Bland-Altman (cliquez sur un paramètre)\", params,\n                     selection_mode=\"single\", default=params[0], key=\"val_ba_param\")\n    if label not in params:\n        label = params[0]\n    fig = validation.bland_altman_figure(res, label)\n    st.pyplot(fig, use_container_width=False)\n    plt.close(fig)\n\n\ndef _plot_grid(res: PatientECGResult):\n    fig, axes = plt.subplots(6, 2, figsize=(11, 12), sharex=True)\n    for row, (left_lead, right_lead) in enumerate(GRID_LAYOUT):\n        for col, lead in enumerate((left_lead, right_lead)):\n            ax = axes[row][col]\n            mb = res.beat.median_beats.get(lead)\n            if mb is None:\n                ax.axis(\"off\")\n                continue\n            ax.axvspan(res.beat.qrs_onset_s * 1000, res.beat.qrs_offset_s * 1000,\n                       color=\"#ffe0e0\", zorder=0)\n            ax.plot(mb.t_rel * 1000, mb.mv, color=\"black\", linewidth=1.1)\n            ax.axhline(0, color=\"#d0d0d0\", linewidth=0.6, zorder=0)\n            ax.set_ylabel(lead, rotation=0, labelpad=18, fontsize=10, fontweight=\"bold\")\n            ax.tick_params(labelsize=7)\n            ax.grid(True, color=\"#f3c6c6\", linewidth=0.5)\n    for col in range(2):\n        axes[-1][col].set_xlabel(\"ms depuis le pic R\")\n    fig.suptitle(\"Battement médian reconstruit — %s\" % res.source_file)\n    # subplots_adjust plutôt que tight_layout : même rendu ici, nettement\n    # plus rapide (tight_layout recalcule 12 sous-graphes).\n    fig.subplots_adjust(left=0.07, right=0.99, top=0.95, bottom=0.05, hspace=0.15, wspace=0.12)\n    return fig\n\n\ndef _plot_vcg(res: PatientECGResult):\n    v = res.vcg\n    if v is None:\n        return None\n    onset, offset = res.beat.qrs_onset_s, res.beat.qrs_offset_s\n    mask = (v.t_rel >= onset) & (v.t_rel <= offset)\n    fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(9, 4.5))\n\n    ax1.plot(v.x[mask], v.y[mask], color=\"steelblue\")\n    ax1.scatter([v.qrs_peak_vector[0]], [v.qrs_peak_vector[1]], color=\"red\", zorder=3, label=\"pic QRS\")\n    ax1.scatter([v.t_peak_vector[0]], [v.t_peak_vector[1]], color=\"green\", zorder=3, label=\"pic T\")\n    ax1.set_xlabel(\"X (mV)\")\n    ax1.set_ylabel(\"Y (mV)\")\n    ax1.set_title(\"Boucle QRS — plan frontal (X-Y)\")\n    ax1.axhline(0, color=\"#ddd\", linewidth=0.6)\n    ax1.axvline(0, color=\"#ddd\", linewidth=0.6)\n    ax1.legend(fontsize=8)\n    ax1.set_aspect(\"equal\", adjustable=\"datalim\")\n\n    ax2.plot(v.x[mask], v.z[mask], color=\"steelblue\")\n    ax2.scatter([v.qrs_peak_vector[0]], [v.qrs_peak_vector[2]], color=\"red\", zorder=3, label=\"pic QRS\")\n    ax2.scatter([v.t_peak_vector[0]], [v.t_peak_vector[2]], color=\"green\", zorder=3, label=\"pic T\")\n    ax2.set_xlabel(\"X (mV)\")\n    ax2.set_ylabel(\"Z (mV)\")\n    ax2.set_title(\"Boucle QRS — plan transverse (X-Z)\")\n    ax2.axhline(0, color=\"#ddd\", linewidth=0.6)\n    ax2.axvline(0, color=\"#ddd\", linewidth=0.6)\n    ax2.legend(fontsize=8)\n    ax2.set_aspect(\"equal\", adjustable=\"datalim\")\n\n    fig.suptitle(\"VCG dérivée (transformation de Kors) — %s\" % res.source_file)\n    fig.tight_layout()\n    return fig\n\n\ndef _figure_png(res: PatientECGResult, kind: str, make) -> bytes:\n    \"\"\"Figure rendue une seule fois par examen puis gardée en mémoire : revenir\n    sur un patient déjà vu est immédiat (surtout dans la version navigateur,\n    où matplotlib est lent).\"\"\"\n    cache = st.session_state.setdefault(\"figure_cache\", {})\n    key = (st.session_state.get(\"batch_token\"), res.source_file, kind)\n    if key not in cache:\n        fig = make(res)\n        buf = io.BytesIO()\n        fig.savefig(buf, format=\"png\", dpi=100)\n        plt.close(fig)\n        cache[key] = buf.getvalue()\n    return cache[key]\n\n\nif run and uploaded:\n    with tempfile.TemporaryDirectory() as tmpdir:\n        paths = []\n        for f in uploaded:\n            # Dans un dossier, f.name peut contenir un sous-dossier, et deux\n            # sous-dossiers peuvent contenir un fichier du même nom.\n            nom = os.path.basename(f.name.replace(\"\\\\\", \"/\"))\n            p = os.path.join(tmpdir, nom)\n            n = 2\n            while os.path.exists(p):\n                base, ext = os.path.splitext(nom)\n                p = os.path.join(tmpdir, \"%s (%d)%s\" % (base, n, ext))\n                n += 1\n            with open(p, \"wb\") as out:\n                out.write(f.getvalue())\n            side = sidecars.get(os.path.splitext(nom)[0])\n            if p.lower().endswith(\".csv\") and side is not None:\n                with open(os.path.splitext(p)[0] + \".json\", \"wb\") as out:\n                    out.write(side)\n            paths.append(p)\n        progress = st.progress(0.0, text=\"Analyse en cours...\")\n        results = []\n        for i, p in enumerate(paths, start=1):\n            progress.progress((i - 1) / len(paths),\n                              text=\"Analyse %d/%d : %s\" % (i, len(paths), os.path.basename(p)))\n            pass  # <laisser-la-main-au-navigateur> (cf. web/app_web.py)\n            if p.lower().endswith(\".csv\"):\n                results.append(process_signal_csv(p, os.path.splitext(p)[0] + \".json\",\n                                                  SCAN_AMPLITUDE_FACTOR if corriger_scans else 1.0))\n            else:\n                results.append(process_pdf(p))\n        progress.progress(1.0, text=\"Analyse terminée : %d fichier(s).\" % len(paths))\n        st.session_state[\"results\"] = results\n        st.session_state[\"batch_token\"] = st.session_state.get(\"batch_token\", 0) + 1\n        st.session_state.pop(\"figure_cache\", None)\n        st.session_state.pop(\"export_cache\", None)\n        # Un nouveau lot de fichiers rend l'éventuel export BRAVEHEART groupé\n        # précédent obsolète (il porterait sur d'anciens résultats).\n        st.session_state.pop(\"bh_zip_bytes\", None)\n        st.session_state.pop(\"bh_export_warnings\", None)\n\nresults = st.session_state[\"results\"]\n\nif not results:\n    st.info(\"Déposez un ou plusieurs PDF dans la barre latérale, puis cliquez sur \"\n            \"« Analyser ».\")\n    with st.expander(\"Validation contre BRAVEHEART, à partir d'un Excel déjà exporté\"):\n        _section_validation(None)\n    st.stop()\n\ndf = pd.DataFrame([{\n    \"Fichier\": r.source_file,\n    **({\"Nom\": r.identity.get(\"nom\"), \"Prénom\": r.identity.get(\"prenom\"),\n        \"Naissance\": r.identity.get(\"date_naissance\"),\n        \"Date ECG\": r.identity.get(\"date_ecg\"), \"IPP\": r.identity.get(\"ipp\")}\n       if include_identity else {}),\n    \"Statut\": r.status,\n    \"Âge\": r.metadata.get(\"age_years\"),\n    \"Sexe\": r.metadata.get(\"sex\"),\n    \"FC mesurée\": round(r.heart_rate_bpm_measured, 0) if r.heart_rate_bpm_measured else None,\n    \"QRSd header (ms)\": r.metadata.get(\"qrs_duration_ms\"),\n    \"QTc header (ms)\": r.metadata.get(\"qtc_ms\"),\n    \"PR header (ms)\": r.metadata.get(\"pr_ms\"),\n    \"PR mesuré (ms)\": round(r.pr_ms_measured, 0) if r.pr_ms_measured else None,\n    \"PR : dérivation\": r.p_wave.pr_lead if r.p_wave else None,\n    \"PR : fiabilité\": ((\"%s (%d/%d dériv.)\" % (r.p_wave.pr_reliability, r.p_wave.pr_n_concordant,\n                                                 r.p_wave.pr_n_delineated))\n                        if r.p_wave and r.p_wave.pr_reliability else None),\n    \"Sokolow-Lyon (mV)\": round(r.conventional.sokolow_lyon_mv, 2) if r.conventional and r.conventional.sokolow_lyon_mv else None,\n    \"LVH Sokolow-Lyon\": r.conventional.sokolow_lyon_positive if r.conventional else None,\n    \"LVH Cornell\": r.conventional.cornell_voltage_positive if r.conventional else None,\n    \"LVH Peguero-Lo Presti\": r.conventional.peguero_lopresti_positive if r.conventional else None,\n    \"LVH Gubner-Ungerleider\": r.conventional.gubner_ungerleider_positive if r.conventional else None,\n    \"LVH Perugia\": r.perugia_positive,\n    \"Ondes Q patho.\": \",\".join(r.conventional.pathological_q_leads) if r.conventional else None,\n    \"T inversées\": \",\".join(r.conventional.t_inversion_leads) if r.conventional else None,\n    \"T négatives géantes (>=10mm)\": \",\".join(r.conventional.giant_negative_t_leads) if r.conventional else None,\n    \"QRS fragmenté\": \",\".join(r.conventional.fragmented_qrs_leads) if r.conventional else None,\n    \"Nb dériv. Q patho.\": sum(1 for ld in r.conventional.pathological_q_leads if ld != \"aVR\") if r.conventional else None,\n    \"Nb dériv. T inversées\": sum(1 for ld in r.conventional.t_inversion_leads if ld != \"aVR\") if r.conventional else None,\n    \"Prog. onde R\": (\n        \"mauvaise\" if r.conventional and r.conventional.poor_r_wave_progression\n        else \"normale\" if r.conventional and r.conventional.poor_r_wave_progression is not None\n        else None\n    ),\n    \"Angle QRS-T spatial (°)\": round(r.vcg.spatial_qrst_angle_deg, 1) if r.vcg and r.vcg.spatial_qrst_angle_deg else None,\n    \"TCRT\": round(r.vcg.tcrt, 2) if r.vcg and r.vcg.tcrt is not None else None,\n    \"SAI QRST (mV.s)\": round(r.vcg.sai_qrst_mv_s, 2) if r.vcg and r.vcg.sai_qrst_mv_s is not None else None,\n    \"Rondeur boucle QRS\": round(r.loop_morphology.qrs.roundness, 1) if r.loop_morphology and r.loop_morphology.qrs.roundness else None,\n    \"Angle dièdre QRS-T (°)\": round(r.loop_morphology.dihedral_angle_deg, 0) if r.loop_morphology and r.loop_morphology.dihedral_angle_deg is not None else None,\n    \"TMD (°)\": round(r.t_wave_complexity.tmd_deg, 0) if r.t_wave_complexity and r.t_wave_complexity.tmd_deg is not None else None,\n    \"TWR (%)\": round(r.t_wave_complexity.twr_rel_pct, 1) if r.t_wave_complexity and r.t_wave_complexity.twr_rel_pct is not None else None,\n    \"iCEB\": round(r.iceb, 2) if r.iceb else None,\n    \"iCEBc\": round(r.icebc, 2) if r.icebc else None,\n    \"Angle QRS-T frontal (°)\": round(r.frontal_qrst_angle_deg, 0) if r.frontal_qrst_angle_deg is not None else None,\n    \"Score Romhilt-Estes\": r.romhilt_estes.total_points if r.romhilt_estes else None,\n    \"Romhilt-Estes (cat.)\": r.romhilt_estes.category if r.romhilt_estes else None,\n    \"PTFV1 (mm.ms)\": round(r.p_wave.ptfv1_mm_ms, 0) if r.p_wave and r.p_wave.ptfv1_mm_ms else None,\n    \"Qualité signal\": round(r.signal_quality_score, 2) if r.signal_quality_score is not None else None,\n    \"Avertissements\": len(r.warnings),\n} for r in results])\n\nst.subheader(\"Résultats du lot (%d fichier(s))\" % len(results))\nst.dataframe(df, use_container_width=True, hide_index=True)\n# Dans la barre latérale, sous « Analyser » (un expander de la page se\n# refermait à chaque choix dans la liste).\nwith gestion_lot:\n    st.divider()\n    st.subheader(\"ECG traités (%d)\" % len(results))\n    a_retirer = st.multiselect(\"Retirer du lot (tableau, figures et exports)\",\n                               [r.source_file for r in results], key=\"a_retirer\",\n                               placeholder=\"Choisir un ou plusieurs ECG\")\n    st.button(\"Retirer la sélection (%d)\" % len(a_retirer), on_click=_retirer,\n              args=(list(a_retirer),), disabled=not a_retirer, use_container_width=True)\n    st.button(\"Tout effacer (résultats et fichiers déposés)\", on_click=_tout_effacer,\n              use_container_width=True)\n\n# Les fichiers d'export ne sont construits qu'une fois par lot (et par choix\n# d'identité) puis gardés en mémoire : sans cela, chaque clic dans la page\n# (choix d'un patient...) les reconstruisait, ce qui prenait plusieurs\n# secondes dans la version navigateur.\n_export_key = (st.session_state.get(\"batch_token\"), include_identity)\n_export = st.session_state.get(\"export_cache\")\nif not _export or _export[\"key\"] != _export_key:\n    _full = pd.DataFrame([row_from_result(r, include_identity) for r in results])\n    _export = {\n        \"key\": _export_key, \"df\": _full,\n        \"xlsx\": to_excel_bytes(_full, summary=df, results=results,\n                               include_identity=include_identity),\n        \"csv\": to_csv_zip_bytes(_full),\n        \"filtered\": build_own_filtered_workbook(_full),\n    }\n    st.session_state[\"export_cache\"] = _export\nexport_df_full = _export[\"df\"]\n\ncol1, col2 = st.columns(2)\ncol1.download_button(\"Tout télécharger (Excel)\", _export[\"xlsx\"],\n                      file_name=\"ecg_resultats.xlsx\", type=\"primary\", on_click=\"ignore\",\n                      mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\ncol2.download_button(\"Tableau complet en CSV (2 fichiers, .zip)\", _export[\"csv\"],\n                      file_name=\"ecg_resultats_csv.zip\", mime=\"application/zip\",\n                      on_click=\"ignore\")\nst.caption(\n    \"Les variables sont séparées en deux : « Originales » (non fournies par \"\n    \"BRAVEHEART) et « Déjà dans BRAVEHEART » (à utiliser seulement pour \"\n    \"comparaison). Les colonnes d'identification (fichier, identité si \"\n    \"cochée, statut, erreur) sont \"\n    \"dans les deux. L'Excel contient aussi le résumé affiché ci-dessus, la \"\n    \"correspondance avec les noms de colonnes BRAVEHEART, les mesures par \"\n    \"dérivation (amplitudes, Q, QS, ST, T, QT, Tpeak-Tend) de tout le lot et \"\n    \"les avertissements ; le CSV est un .zip de deux fichiers.\"\n)\n\nwith st.expander(\n    \"Le tableau complet est dense (%d colonnes) — télécharger une sélection \"\n    \"réduite pour les études CMH / amylose cardiaque\" % export_df_full.shape[1]\n):\n    st.caption(\n        \"Aucune colonne du tableau complet n'est invalide (contrairement à \"\n        \"l'export BRAVEHEART, ici chaque valeur vient directement du vrai \"\n        \"battement extrait du PDF) — cette sélection ne fait que resserrer \"\n        \"sur les colonnes les plus directement utiles à ces études, avec \"\n        \"leur signification et leur unité en français. Détail complet des \"\n        \"colonnes écartées : voir GUIDE_LECTURE_RESULTATS_ECG_HCM.md.\"\n    )\n    own_filtered_bytes, own_missing_cols = _export[\"filtered\"]\n    st.download_button(\n        \"Télécharger la sélection prioritaire (Excel)\",\n        own_filtered_bytes, on_click=\"ignore\",\n        file_name=\"ecg_resultats_prioritaires.xlsx\",\n        mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n    )\n    if own_missing_cols:\n        st.caption(\"%d colonne(s) prioritaire(s) absente(s) de ce lot : %s\"\n                   % (len(own_missing_cols), \", \".join(own_missing_cols)))\n\nst.divider()\nst.subheader(\"Export BRAVEHEART pour tout le lot\")\nst.caption(\n    \"Génère, pour chaque examen analysé avec succès, le fichier .csv \"\n    \"'Generic .csv' décrit dans la section « Exporter ce battement médian \"\n    \"pour BRAVEHEART » ci-dessous (battement médian répété — voir README \"\n    \"section 9 pour la limite sur les statistiques battement-à-battement \"\n    \"de BRAVEHEART), puis les regroupe dans une seule archive .zip. Calcul \"\n    \"lancé uniquement au clic (pas à chaque interaction), pour rester \"\n    \"utilisable sur plusieurs centaines de fichiers. Préparation : quelques \"\n    \"secondes par examen.\"\n)\nst.info(\n    \"Dans BRAVEHEART : décompresser le .zip, choisir le format « Generic .csv », \"\n    \"**décocher les cases « Auto » à côté de « Remove PVCs » et « Remove \"\n    \"Outliers »**, puis lancer le traitement en lot sur le dossier. Ignorer \"\n    \"ensuite les statistiques battement-à-battement (HRV, min/max, qualité).\"\n)\nif st.button(\"Préparer l'export BRAVEHEART pour tout le lot (.zip)\"):\n    # Les figures en cache ne servent pas ici : on libère la mémoire avant de\n    # construire l'archive (la mémoire de la version navigateur est limitée).\n    st.session_state.pop(\"figure_cache\", None)\n    progress = st.progress(0.0, text=\"Export BRAVEHEART en cours...\")\n    bh_zip_buf = io.BytesIO()\n    bh_export_warnings = []\n    # Les CSV sont petits : sans compression, l'archive se construit plus vite\n    # dans le navigateur.\n    with zipfile.ZipFile(bh_zip_buf, \"w\", zipfile.ZIP_STORED) as zf:\n        used_names = set()\n        for i, r in enumerate(results, start=1):\n            progress.progress((i - 1) / len(results),\n                              text=\"Export BRAVEHEART %d/%d : %s\" % (i, len(results), r.source_file))\n            pass  # <laisser-la-main-au-navigateur> (cf. web/app_web.py)\n            if r.beat is None:\n                bh_export_warnings.append(\n                    \"%s : ignoré (analyse échouée, pas de battement médian).\" % r.source_file\n                )\n                continue\n            with tempfile.NamedTemporaryFile(suffix=\".csv\", delete=False) as tmpf:\n                tmp_path = tmpf.name\n            try:\n                warns = export_generic_csv(r.beat, tmp_path)\n                # Le fichier temporaire existe toujours : seul un fichier non\n                # vide signifie que l'export a réussi.\n                if os.path.getsize(tmp_path) > 0:\n                    arcname = os.path.splitext(r.source_file)[0] + \"_braveheart.csv\"\n                    if arcname in used_names:  # deux fichiers sources au même nom\n                        stem, ext = os.path.splitext(arcname)\n                        arcname = \"%s_%d%s\" % (stem, len(used_names), ext)\n                    used_names.add(arcname)\n                    zf.write(tmp_path, arcname=arcname)\n                else:\n                    bh_export_warnings.append(\n                        \"%s : %s\" % (r.source_file, warns[0] if warns else \"échec d'export inconnu.\")\n                    )\n            finally:\n                if os.path.exists(tmp_path):\n                    os.remove(tmp_path)\n        progress.progress(1.0, text=\"Export BRAVEHEART terminé : %d fichier(s).\" % len(used_names))\n    st.session_state[\"bh_zip_bytes\"] = bh_zip_buf.getvalue()\n    st.session_state[\"bh_export_warnings\"] = bh_export_warnings\n    st.session_state[\"bh_zip_n_files\"] = len(used_names)\n\nif \"bh_zip_bytes\" in st.session_state:\n    st.download_button(\n        \"Télécharger l'archive BRAVEHEART (.zip, %d fichier(s))\"\n        % st.session_state.get(\"bh_zip_n_files\", 0),\n        st.session_state[\"bh_zip_bytes\"],\n        file_name=\"ecg_hcm_braveheart_exports.zip\", on_click=\"ignore\",\n        mime=\"application/zip\",\n    )\n    bh_warns = st.session_state.get(\"bh_export_warnings\") or []\n    if bh_warns:\n        with st.expander(\"⚠️ %d fichier(s) non inclus dans l'archive\" % len(bh_warns)):\n            for w in bh_warns:\n                st.write(\"- \" + w)\n\nst.divider()\n_section_validation(export_df_full)\n\nst.divider()\nst.subheader(\"Détail par patient\")\nok_results = [r for r in results if r.status == \"ok\"]\nif not ok_results:\n    st.warning(\"Aucun fichier n'a pu être traité avec succès.\")\n    st.stop()\n\n\n# Section en « fragment » : choisir un autre examen ne relance que cette\n# partie de la page, pas tout le script (analyse, tableaux, exports).\n@st.fragment\ndef _detail_par_patient(ok_results):\n    names = [r.source_file for r in ok_results]\n    idx = st.session_state.get(\"patient_idx\", 0)\n    if not 0 <= idx < len(names):\n        idx = 0\n    st.session_state[\"patient_idx\"] = idx\n\n    def _go(step):\n        st.session_state[\"patient_idx\"] = (st.session_state[\"patient_idx\"] + step) % len(names)\n\n    def _pick():\n        st.session_state[\"patient_idx\"] = names.index(st.session_state[\"patient_pick\"])\n\n    # Le menu suit l'index courant ; les boutons Précédent / Suivant évitent\n    # de dépendre de la liste déroulante (non prise en compte sur certains\n    # navigateurs).\n    st.session_state[\"patient_pick\"] = names[idx]\n    c_prev, c_sel, c_next = st.columns([1, 6, 1], vertical_alignment=\"bottom\")\n    c_prev.button(\"◀ Précédent\", on_click=_go, args=(-1,), use_container_width=True)\n    c_sel.selectbox(\"Choisir un examen (%d/%d)\" % (idx + 1, len(names)), names,\n                    key=\"patient_pick\", on_change=_pick)\n    c_next.button(\"Suivant ▶\", on_click=_go, args=(1,), use_container_width=True)\n    res = ok_results[idx]\n\n    if res.warnings:\n        with st.expander(\"⚠️ Avertissements (%d)\" % len(res.warnings)):\n            for w in res.warnings:\n                st.write(\"- \" + w)\n\n    if res.beat is not None:\n        with st.expander(\"Exporter ce battement médian pour BRAVEHEART (.csv)\"):\n            st.caption(\n                \"BRAVEHEART (Stabenau & Waks, 2023 — github.com/BIVectors/BRAVEHEART) \"\n                \"n'accepte pas les PDF : ce fichier .csv, au format 'Generic .csv' \"\n                \"de BRAVEHEART avec ses réglages PAR DÉFAUT (rien à configurer côté \"\n                \"BRAVEHEART), reprend le battement médian déjà calculé ici pour les \"\n                \"12 dérivations, **répété plusieurs fois bout à bout** (nécessaire \"\n                \"pour que le bouton \\\"Calculate\\\" de BRAVEHEART puisse détecter des \"\n                \"complexes QRS et calculer une fréquence cardiaque — avec un seul \"\n                \"battement isolé, sa détection échoue silencieusement). Les mesures \"\n                \"VCG/GEH de BRAVEHEART (SVG, angles, TCRT, morphologie des boucles, \"\n                \"TMD/TWR...) restent pertinentes, mais **toute statistique \"\n                \"battement-à-battement/HRV/qualité** que BRAVEHEART afficherait \"\n                \"pour ce fichier est artificielle et doit être ignorée. **Dans \"\n                \"BRAVEHEART, avant de cliquer sur \\\"Calculate\\\" : décocher les \"\n                \"cases \\\"Auto\\\" à côté des boutons \\\"Remove Outliers\\\" et \"\n                \"\\\"Remove PVCs\\\"** (et ne pas cliquer sur ces boutons) — sinon \\\"Calculate\\\" ne \"\n                \"produit rien (battement moyen et statistiques vides, sans \"\n                \"message d'erreur) ; voir README section 9.\"\n            )\n            bh_tmp_path = os.path.join(tempfile.gettempdir(), \"braveheart_export_tmp.csv\")\n            bh_warnings = export_generic_csv(res.beat, bh_tmp_path)\n            if os.path.exists(bh_tmp_path):\n                with open(bh_tmp_path, \"rb\") as bf:\n                    st.download_button(\n                        \"Télécharger pour BRAVEHEART (.csv)\", bf.read(),\n                        file_name=os.path.splitext(res.source_file)[0] + \"_braveheart.csv\",\n                        mime=\"text/csv\", on_click=\"ignore\",\n                    )\n                os.remove(bh_tmp_path)\n            for w in bh_warnings:\n                st.caption((\"⚠️ \" if \"impossible\" in w else \"ℹ️ \") + w)\n\n    meta_cols = st.columns(4) + st.columns(4)  # 2 lignes : valeurs lisibles en entier\n    meta_cols[0].metric(\"Âge\", res.metadata.get(\"age_years\", \"—\"))\n    meta_cols[1].metric(\"Sexe\", res.metadata.get(\"sex\", \"—\"))\n    meta_cols[2].metric(\"FC mesurée\", \"%.0f bpm\" % res.heart_rate_bpm_measured if res.heart_rate_bpm_measured else \"—\")\n    meta_cols[3].metric(\"QRSd (header)\", \"%s ms\" % res.metadata.get(\"qrs_duration_ms\", \"—\"))\n    meta_cols[4].metric(\"QTc (header)\", \"%s ms\" % res.metadata.get(\"qtc_ms\", \"—\"))\n    meta_cols[5].metric(\n        \"PR (header)\", \"%s ms\" % res.metadata.get(\"pr_ms\", \"—\"),\n        delta=((\"%.0f ms mesuré\" % res.pr_ms_measured\n                + (\" en %s\" % res.p_wave.pr_lead if res.p_wave and res.p_wave.pr_lead else \"\"))\n               if res.pr_ms_measured else None),\n        delta_color=\"off\",\n        help=\"PR remesuré (début P -> début QRS) sur la dérivation où l'onde P et \"\n             \"le début du QRS sont les mieux visibles, parmi les dérivations \"\n             \"concordantes. L'appareil mesure, lui, du début de P le plus précoce \"\n             \"au début de QRS le plus précoce, toutes dérivations confondues.\",\n    )\n    meta_cols[6].metric(\"Axe QRS (header)\", \"%s°\" % res.metadata.get(\"axis_qrs_deg\", \"—\"))\n    meta_cols[7].metric(\"Qualité signal\",\n                         \"%.2f\" % res.signal_quality_score if res.signal_quality_score is not None else \"—\")\n\n    tab1, tab2, tab3, tab4 = st.tabs([\n        \"Tracés reconstruits (12D)\", \"VCG dérivée (Kors)\",\n        \"Mesures par dérivation\", \"Repolarisation avancée\",\n    ])\n\n    with tab1:\n        if res.beat and res.beat.median_beats:\n            st.image(_figure_png(res, \"grille\", _plot_grid), use_container_width=True)\n        else:\n            st.info(\"Battements insuffisants pour reconstruire un tracé médian.\")\n\n    with tab2:\n        if res.vcg:\n            v = res.vcg\n            st.image(_figure_png(res, \"vcg\", _plot_vcg), use_container_width=True)\n\n            st.markdown(\"**Angle QRS-T et vecteurs**\")\n            c1, c2, c3, c4 = st.columns(4)\n            c1.metric(\"Angle QRS-T spatial\",\n                       \"%.0f°\" % v.spatial_qrst_angle_deg if v.spatial_qrst_angle_deg is not None else \"—\")\n            c2.metric(\"Azimut QRS\", \"%.0f°\" % v.qrs_azimuth_deg)\n            c3.metric(\"Élévation QRS\", \"%.0f°\" % v.qrs_elevation_deg)\n            c4.metric(\"TCRT\", \"%.2f\" % v.tcrt if v.tcrt is not None else \"—\")\n            st.caption(\n                \"TCRT (Total Cosine R-to-T, lignée Acar et al. 1999) : moyenne des \"\n                \"cosinus entre le vecteur T au pic de sa boucle et les vecteurs QRS \"\n                \"de la portion dominante (>= 70% du pic QRS). Valeur dans [-1, 1] : \"\n                \"proche de +1 = concordance dépolarisation/repolarisation, proche de \"\n                \"-1 = opposition. Aucun seuil pathologique universel n'est appliqué \"\n                \"ici (seuils publiés spécifiques à chaque cohorte/étude) — voir \"\n                \"README pour le détail et les réserves bibliographiques.\"\n            )\n\n            st.markdown(\"**Gradient ventriculaire spatial (SVG)**\")\n            st.caption(\n                \"SVG = somme du vecteur d'aire du QRS et du vecteur d'aire de \"\n                \"l'onde T — reflète l'hétérogénéité de repolarisation \"\n                \"indépendamment de la séquence d'activation (Wilson 1934 ; \"\n                \"Waks & Tereshchenko, J Electrocardiol 2016).\"\n            )\n            c1, c2, c3, c4 = st.columns(4)\n            c1.metric(\"Magnitude SVG\", \"%.2f mV·s\" % v.svg_magnitude_mv_s if v.svg_magnitude_mv_s else \"—\")\n            c2.metric(\"Azimut SVG\", \"%.0f°\" % v.svg_azimuth_deg if v.svg_azimuth_deg is not None else \"—\")\n            c3.metric(\"Élévation SVG\", \"%.0f°\" % v.svg_elevation_deg if v.svg_elevation_deg is not None else \"—\")\n            c4.metric(\"Ratio amplitude QRS/T\", \"%.1f\" % v.qrs_t_amplitude_ratio if v.qrs_t_amplitude_ratio else \"—\")\n\n            st.markdown(\"**Aires de boucle (3 plans)**\")\n            area_df = pd.DataFrame([\n                {\"Boucle\": \"QRS\", \"Frontal X-Y (mV²)\": round(v.qrs_loop_area_xy_mv2, 3),\n                 \"Transverse X-Z (mV²)\": round(v.qrs_loop_area_xz_mv2, 3),\n                 \"Sagittal Y-Z (mV²)\": round(v.qrs_loop_area_yz_mv2, 3)},\n                {\"Boucle\": \"T\", \"Frontal X-Y (mV²)\": round(v.t_loop_area_xy_mv2, 3) if v.t_loop_area_xy_mv2 is not None else None,\n                 \"Transverse X-Z (mV²)\": round(v.t_loop_area_xz_mv2, 3) if v.t_loop_area_xz_mv2 is not None else None,\n                 \"Sagittal Y-Z (mV²)\": round(v.t_loop_area_yz_mv2, 3) if v.t_loop_area_yz_mv2 is not None else None},\n            ])\n            st.dataframe(area_df, use_container_width=True, hide_index=True)\n\n            with st.expander(\"Indices étendus (inspirés de BRAVEHEART — voir README section 4)\"):\n                st.caption(\n                    \"Deux méthodes de calcul du SVG et de l'angle QRS-T coexistent dans \"\n                    \"cet outil : **'pic'** (vecteurs au pic de magnitude — méthode \"\n                    \"historique de cet outil, colonnes ci-dessus) et **'aire'** \"\n                    \"(vecteurs intégrale temporelle X,Y,Z — méthode ci-dessous). Les \"\n                    \"deux sont rapportées côte à côte plutôt qu'une seule choisie \"\n                    \"arbitrairement, à la suite de BRAVEHEART (Stabenau & Waks, \"\n                    \"Comput Methods Programs Biomed 2023) qui calcule aussi les deux.\"\n                )\n                c1, c2, c3, c4 = st.columns(4)\n                c1.metric(\"Angle QRS-T (aire)\",\n                          \"%.0f°\" % v.qrst_angle_area_deg if v.qrst_angle_area_deg is not None else \"—\")\n                c2.metric(\"Angle QRS-T frontal (pic)\",\n                          \"%.0f°\" % v.qrst_angle_peak_frontal_deg if v.qrst_angle_peak_frontal_deg is not None else \"—\")\n                c3.metric(\"SVG 'pic'\",\n                          \"%.2f mV\" % v.svg_peak_magnitude_mv if v.svg_peak_magnitude_mv is not None else \"—\")\n                c4.metric(\"Angle SVG(aire)-SVG(pic)\",\n                          \"%.0f°\" % v.svg_svg_angle_deg if v.svg_svg_angle_deg is not None else \"—\")\n\n                st.markdown(\"**SAI QRST** (hétérogénéité électrique globale, groupe Tereshchenko)\")\n                c1, c2 = st.columns(2)\n                c1.metric(\"SAI QRST\", \"%.2f mV·s\" % v.sai_qrst_mv_s if v.sai_qrst_mv_s is not None else \"—\")\n                c2.metric(\"SAI VM\", \"%.2f mV·s\" % v.sai_vm_mv_s if v.sai_vm_mv_s is not None else \"—\")\n\n                st.markdown(\"**Vitesse de la trajectoire VCG**\")\n                c1, c2 = st.columns(2)\n                c1.metric(\"Vitesse max (QRST)\",\n                          \"%.0f mV/s\" % v.speed_qrst_max_mv_s if v.speed_qrst_max_mv_s is not None else \"—\")\n                c2.metric(\"Intégrale vitesse-temps (QRST)\",\n                          \"%.2f mV\" % v.sti_qrst_mv if v.sti_qrst_mv is not None else \"—\")\n\n                lmr = res.loop_morphology\n                if lmr is not None and (lmr.qrs.roundness is not None or lmr.t.roundness is not None):\n                    st.markdown(\"**Morphologie des boucles (SVD/PCA)**\")\n                    st.caption(\n                        \"Rondeur = 1 si circulaire, plus grand = allongée. Planéité \"\n                        \"(résidu) proche de 0 = boucle plane. Sens de rotation : \"\n                        \"convention géométrique interne, pas garantie correspondre à \"\n                        \"'horaire'/'antihoraire' au sens clinique — voir \"\n                        \"`loop_morphology.py`.\"\n                    )\n                    loop_df = pd.DataFrame([\n                        {\"Boucle\": \"QRS\", \"Rondeur\": round(lmr.qrs.roundness, 1) if lmr.qrs.roundness else None,\n                         \"Planéité (résidu, mV²)\": round(lmr.qrs.planarity_residual_mv2, 4) if lmr.qrs.planarity_residual_mv2 is not None else None,\n                         \"Aire propre (mV²)\": round(lmr.qrs.loop_area_mv2, 3) if lmr.qrs.loop_area_mv2 is not None else None,\n                         \"Rotation\": lmr.qrs.rotation_direction},\n                        {\"Boucle\": \"T\", \"Rondeur\": round(lmr.t.roundness, 1) if lmr.t.roundness else None,\n                         \"Planéité (résidu, mV²)\": round(lmr.t.planarity_residual_mv2, 4) if lmr.t.planarity_residual_mv2 is not None else None,\n                         \"Aire propre (mV²)\": round(lmr.t.loop_area_mv2, 3) if lmr.t.loop_area_mv2 is not None else None,\n                         \"Rotation\": lmr.t.rotation_direction},\n                    ])\n                    st.dataframe(loop_df, use_container_width=True, hide_index=True)\n                    if lmr.dihedral_angle_deg is not None:\n                        st.metric(\"Angle dièdre (plan QRS vs. plan T)\", \"%.0f°\" % lmr.dihedral_angle_deg)\n\n                twv = res.t_wave_complexity\n                if twv is not None and twv.tmd_deg is not None:\n                    st.markdown(\"**Dispersion/complexité de l'onde T (TMD, TWR)**\")\n                    st.caption(\n                        \"Calculés directement à partir des dérivations (pas de la VCG \"\n                        \"Kors) par SVD sur %d dérivations indépendantes — méthode \"\n                        \"Acar et al. Réserve bibliographique sur le jeu exact de \"\n                        \"dérivations utilisé par BRAVEHEART : voir \"\n                        \"`t_wave_complexity.py`/README.\" % (twv.n_leads_used or 0)\n                    )\n                    c1, c2 = st.columns(2)\n                    c1.metric(\"TMD\", \"%.0f°\" % twv.tmd_deg)\n                    c2.metric(\"TWR (résiduum, %)\",\n                              \"%.1f %%\" % twv.twr_rel_pct if twv.twr_rel_pct is not None else \"—\")\n\n            st.caption(\n                \"VCG dérivée mathématiquement des 12 dérivations par la matrice \"\n                \"de régression de Kors (voir README) — pas un enregistrement \"\n                \"vectoriel direct. Fenêtre de l'onde T : %s.\"\n                % (\"issue de la délinéation par dérivation\" if v.t_window_source == \"delineation\"\n                   else \"heuristique (délinéation par dérivation indisponible — voir onglet \"\n                        \"Repolarisation avancée)\")\n            )\n            if v.warnings:\n                for w in v.warnings:\n                    st.caption(\"⚠️ \" + w)\n        else:\n            st.info(\"VCG non calculable pour cet examen (dérivations manquantes).\")\n\n    with tab3:\n        if res.conventional:\n            rows = []\n            for lead, m in res.conventional.per_lead.items():\n                rows.append({\n                    \"Dérivation\": lead, \"R (mV)\": round(m.r_amplitude_mv, 2),\n                    \"S (mV)\": round(m.s_amplitude_mv, 2), \"Q (mV)\": round(m.q_amplitude_mv, 2),\n                    \"Durée Q (ms)\": round(m.q_duration_ms, 0), \"T (mV)\": round(m.t_amplitude_mv, 2),\n                    \"ST à J+60ms (mV)\": round(m.st_level_j60_mv, 2),\n                    \"Complexe QS\": m.qs_complex,\n                    \"Onde Q patho.\": m.pathological_q, \"QRS fragmenté\": m.fragmented,\n                    \"Onde T géante (>=10mm)\": m.t_amplitude_mv <= -1.0,\n                })\n            st.dataframe(pd.DataFrame(rows), use_container_width=True, hide_index=True)\n\n            st.markdown(\"**Indices de voltage (LVH)**\")\n            idx_cols = st.columns(5)\n            c = res.conventional\n            idx_cols[0].metric(\"Sokolow-Lyon\", \"%.1f mV\" % c.sokolow_lyon_mv if c.sokolow_lyon_mv else \"—\",\n                                \"LVH+\" if c.sokolow_lyon_positive else \"négatif\")\n            idx_cols[1].metric(\"Cornell voltage\", \"%.1f mV\" % c.cornell_voltage_mv if c.cornell_voltage_mv else \"—\",\n                                \"LVH+\" if c.cornell_voltage_positive else \"négatif\")\n            idx_cols[2].metric(\"Peguero-Lo Presti\", \"%.1f mV\" % c.peguero_lopresti_mv if c.peguero_lopresti_mv else \"—\",\n                                \"LVH+\" if c.peguero_lopresti_positive else \"négatif\")\n            idx_cols[3].metric(\"Gubner-Ungerleider\", \"%.1f mV\" % c.gubner_ungerleider_mv if c.gubner_ungerleider_mv else \"—\",\n                                \"LVH+\" if c.gubner_ungerleider_positive else \"négatif\",\n                                help=\"R(I) + S(III) >= 2.5 mV.\")\n            idx_cols[4].metric(\"Perugia\", \"positif\" if res.perugia_positive else \"négatif\",\n                                \", \".join(res.perugia_criteria) or None, delta_color=\"off\",\n                                help=\"SV3+RaVL > 2.4 mV (H) / 2.0 mV (F), ou strain typique \"\n                                     \"(approximé), ou Romhilt-Estes >= 5 (Verdecchia 1998).\")\n\n            if c.giant_negative_t_leads:\n                st.markdown(\"**Ondes T négatives géantes (évocateur de CMH apicale)**\")\n                st.caption(\n                    \"Amplitude <= -10 mm (-1.0 mV) : %s. Seuil issu de la littérature \"\n                    \"sur la CMH apicale (Eriksson et al., J Am Coll Cardiol 2002 ; \"\n                    \"voir README pour le détail et les réserves bibliographiques sur \"\n                    \"la source exacte du seuil chiffré).\"\n                    % \", \".join(c.giant_negative_t_leads)\n                )\n\n            st.markdown(\"**Autres indices**\")\n            st.caption(\n                \"iCEB/iCEBc = QT/QRS et QTc/QRS (Lu et al. 2016), étudiés en CMH pour \"\n                \"le risque de mort subite en zone grise. PTFV1 = profondeur x durée de \"\n                \"la composante négative terminale de l'onde P en V1 (marqueur \"\n                \"d'atteinte auriculaire gauche), nécessite NeuroKit2. Progression de \"\n                \"l'onde R : mauvaise si R(V3) <= 3 mm. Aucun seuil n'est présenté comme \"\n                \"diagnostique — voir README pour les références et limites.\"\n            )\n            other_cols = st.columns(5)\n            other_cols[0].metric(\"iCEB (QT/QRS)\", \"%.2f\" % res.iceb if res.iceb else \"—\")\n            other_cols[1].metric(\"iCEBc (QTc/QRS)\", \"%.2f\" % res.icebc if res.icebc else \"—\")\n            ptfv1 = res.p_wave.ptfv1_mm_ms if res.p_wave else None\n            other_cols[2].metric(\n                \"PTFV1 (V1)\", \"%.0f mm·ms\" % ptfv1 if ptfv1 is not None else \"—\",\n                (\"anormal\" if res.p_wave.ptfv1_positive else \"normal\") if ptfv1 is not None else None,\n            )\n            prwp = c.poor_r_wave_progression\n            other_cols[3].metric(\"Progression onde R\",\n                                  \"mauvaise\" if prwp else \"normale\" if prwp is not None else \"—\")\n            fa = res.frontal_qrst_angle_deg\n            other_cols[4].metric(\n                \"Angle QRS-T frontal\", \"%.0f°\" % fa if fa is not None else \"—\",\n                (\"normal\" if fa < 45 else \"limite\" if fa <= 90 else \"anormal\") if fa is not None else None,\n            )\n\n            if res.romhilt_estes is not None:\n                re_ = res.romhilt_estes\n                st.markdown(\"**Score de Romhilt-Estes**\")\n                st.caption(\n                    \"Score composite de LVH par points (Romhilt & Estes, 1968). \"\n                    \"**Exploratoire** : le critère 'strain' est approximé (T négative \"\n                    \"+ sous-décalage ST, pas la morphologie caractéristique) et la \"\n                    \"prise de digitalique n'est jamais prise en compte (toujours \"\n                    \"supposée absente) — voir README, section 6, pour le détail des \"\n                    \"limites avant toute utilisation en recherche.\"\n                )\n                re_cols = st.columns(7)\n                re_cols[0].metric(\"Total\", \"%d pts\" % re_.total_points, re_.category)\n                re_cols[1].metric(\"Voltage\", re_.voltage_points)\n                re_cols[2].metric(\"Strain*\", re_.strain_points)\n                re_cols[3].metric(\"Onde P\", re_.laa_points)\n                re_cols[4].metric(\"Axe\", re_.lad_points)\n                re_cols[5].metric(\"Durée QRS\", re_.qrs_duration_points)\n                re_cols[6].metric(\"Intrinsécoïde\", re_.intrinsicoid_points)\n                if re_.strain_approximated:\n                    st.caption(\"* critère 'strain' rempli par approximation sur cet examen.\")\n\n    with tab4:\n        r = res.repolarization\n        if r is None:\n            st.info(\"Repolarisation avancée non calculée pour cet examen.\")\n        else:\n            if \"dwt\" not in r.delineation_method_summary:\n                st.warning(\n                    \"NeuroKit2 n'est pas installé (ou la délinéation par ondelettes a \"\n                    \"échoué) : les valeurs ci-dessous utilisent la méthode de repli \"\n                    \"(tangente), moins validée. `pip install neurokit2` pour la méthode \"\n                    \"recommandée (Martinez et al. 2004), puis relancez l'analyse.\"\n                )\n\n            st.markdown(\"**QT par dérivation et dispersion**\")\n            c1, c2 = st.columns(2)\n            c1.metric(\"Dispersion du QT\",\n                       \"%.0f ms\" % r.qt_dispersion_ms if r.qt_dispersion_ms is not None else \"—\")\n            c2.metric(\"Dérivations exclues (non plausibles)\",\n                       \", \".join(r.qt_excluded_leads) if r.qt_excluded_leads else \"aucune\")\n            if r.qt_ms_by_lead:\n                qt_df = pd.DataFrame(\n                    [{\"Dérivation\": ld, \"QT (ms)\": round(v, 0)} for ld, v in r.qt_ms_by_lead.items()]\n                )\n                st.dataframe(qt_df, use_container_width=True, hide_index=True)\n\n            st.markdown(\"**Tpeak-Tend (hétérogénéité de repolarisation)**\")\n            st.caption(\n                \"Méthode tangente en V2 recommandée en mesure manuelle de référence \"\n                \"(Andršová et al., Europace 2018) ; dispersion inter-dérivations \"\n                \"donnée à titre exploratoire.\"\n            )\n            c1, c2, c3 = st.columns(3)\n            c1.metric(\"Tpeak-Tend (V2)\",\n                       \"%.0f ms\" % r.tpeak_tend_v2_ms if r.tpeak_tend_v2_ms is not None else \"—\")\n            c2.metric(\"Tpeak-Tend (V2), corrigé Bazett\",\n                       \"%.0f ms\" % r.tpeak_tend_v2_bazett if r.tpeak_tend_v2_bazett is not None else \"—\")\n            c3.metric(\"Dispersion Tpeak-Tend\",\n                       \"%.0f ms\" % r.tpeak_tend_dispersion_ms if r.tpeak_tend_dispersion_ms is not None else \"—\")\n            if r.tpeak_tend_ms_by_lead:\n                tpte_df = pd.DataFrame(\n                    [{\"Dérivation\": ld, \"Tpeak-Tend (ms)\": round(v, 0)}\n                     for ld, v in r.tpeak_tend_ms_by_lead.items()]\n                )\n                st.dataframe(tpte_df, use_container_width=True, hide_index=True)\n\n            st.caption(\"Méthode de délinéation utilisée : %s.\" % r.delineation_method_summary)\n\n\n_detail_par_patient(ok_results)\n", "app_web.py": "# Point d'entrée de la version navigateur (stlite / Pyodide, GitHub Pages).\n# Installe NeuroKit2 (optionnel) au premier passage, puis exécute app.py tel\n# quel. L'await de premier niveau n'est permis que dans ce fichier, exécuté\n# par stlite ; app.py reste identique à la version installée.\nimport builtins\nimport logging\n\n# Dans le navigateur, le niveau de journalisation par défaut est DEBUG :\n# pdfminer y écrit alors une ligne par opération de dessin du PDF (plus de\n# 100 000 pour un ECG), ce qui sature et fait planter l'onglet pendant\n# l'analyse. On ne garde que les avertissements.\nfor _name in (\"pdfminer\", \"pdfplumber\", \"matplotlib\", \"PIL\", \"fontTools\", \"numba\"):\n    logging.getLogger(_name).setLevel(logging.WARNING)\n\nif not getattr(builtins, \"_ecg_neurokit_tried\", False):\n    builtins._ecg_neurokit_tried = True\n    try:\n        import micropip\n        await micropip.install(\"neurokit2\")  # noqa: F704 - top-level await (stlite)\n    except Exception as exc:  # l'outil fonctionne sans (méthode tangente)\n        print(\"NeuroKit2 non installé :\", exc)\n\n# Dans le navigateur, Python et l'affichage partagent le même fil : sans\n# pause, la barre de progression ne bouge qu'à la fin de l'analyse. On\n# remplace donc le repère de app.py par une courte pause asynchrone avant\n# chaque fichier, ce qui laisse la page se mettre à jour.\nimport ast\nimport asyncio  # noqa: F401 - utilisé par le code injecté\n\nwith open(\"app.py\", encoding=\"utf-8\") as _f:\n    _src = _f.read()\n_src = _src.replace(\"pass  # <laisser-la-main-au-navigateur>\",\n                    \"await __import__('asyncio').sleep(0.05)  #\")\n_code = compile(_src, \"app.py\", \"exec\", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)\n_ret = eval(_code, {\"__name__\": \"__main__\"})\nif asyncio.iscoroutine(_ret):\n    await _ret  # noqa: F704\n", "ecg_hcm/__init__.py": "\"\"\"\necg_hcm - Analyse automatisée vectorielle d'ECG 12 dérivations (PDF) pour la\ncardiomyopathie hypertrophique.\n\nOutil de RECHERCHE, pas un dispositif médical certifié. Toute mesure produite\ndoit être relue par un cardiologue avant utilisation clinique ou publication.\n\"\"\"\n\n__version__ = \"0.16.11\"\n", "ecg_hcm/batch.py": "\"\"\"\nbatch.py\n========\n\nTraitement d'un dossier (ou d'une liste) de PDF ECG -> un DataFrame, une\nligne par patient/examen, exportable en CSV/Excel.\n\nUne erreur sur un fichier n'interrompt pas le traitement du lot : elle est\nconsignée dans les colonnes `status`/`error_message` de sa ligne.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport glob\nimport os\n\nimport pandas as pd\n\nfrom .identity import IDENTITY_COLUMNS\nfrom .pipeline import PatientECGResult, process_pdf\n\n\ndef _row_from_result(res: PatientECGResult, include_identity: bool = True) -> dict:\n    row = {\"source_file\": res.source_file}\n    if include_identity:\n        # Données nominatives (nom, prénom, date de naissance, date de l'ECG,\n        # IPP) : à ne pas faire sortir du poste sans accord (RGPD).\n        row.update({k: (res.identity or {}).get(k) for k in IDENTITY_COLUMNS})\n    row.update({\n        \"status\": res.status,\n        \"error_message\": res.error_message,\n    })\n    row.update(res.metadata)\n    row[\"heart_rate_bpm_measured\"] = res.heart_rate_bpm_measured\n    row[\"n_beats_detected\"] = res.n_beats_detected\n    row[\"qrs_duration_ms_measured\"] = res.qrs_duration_ms_measured\n    row[\"qt_ms_measured\"] = res.qt_ms_measured\n    row[\"qtc_bazett_ms_measured\"] = res.qtc_bazett_ms_measured\n    row[\"qtc_fridericia_ms_measured\"] = res.qtc_fridericia_ms_measured\n    row[\"qt_source_for_qtc\"] = res.qt_source_for_qtc\n    row[\"pr_ms_measured\"] = res.pr_ms_measured\n    row[\"iceb\"] = res.iceb\n    row[\"icebc\"] = res.icebc\n    row[\"frontal_qrst_angle_deg\"] = res.frontal_qrst_angle_deg\n    row[\"signal_quality_score\"] = res.signal_quality_score\n\n    if res.conventional is not None:\n        c = res.conventional\n        row[\"sokolow_lyon_mv\"] = c.sokolow_lyon_mv\n        row[\"sokolow_lyon_lvh\"] = c.sokolow_lyon_positive\n        row[\"cornell_voltage_mv\"] = c.cornell_voltage_mv\n        row[\"cornell_voltage_lvh\"] = c.cornell_voltage_positive\n        row[\"cornell_product_mm_ms\"] = c.cornell_product_mm_ms\n        row[\"cornell_product_lvh\"] = c.cornell_product_positive\n        row[\"peguero_lopresti_mv\"] = c.peguero_lopresti_mv\n        row[\"peguero_lopresti_lvh\"] = c.peguero_lopresti_positive\n        row[\"gubner_ungerleider_mv\"] = c.gubner_ungerleider_mv\n        row[\"gubner_ungerleider_lvh\"] = c.gubner_ungerleider_positive\n        row[\"perugia_cornell_mv\"] = c.perugia_cornell_mv\n        row[\"perugia_lvh\"] = res.perugia_positive\n        row[\"perugia_criteria\"] = \",\".join(res.perugia_criteria)\n        row[\"t_inversion_leads\"] = \",\".join(c.t_inversion_leads)\n        row[\"giant_negative_t_leads\"] = \",\".join(c.giant_negative_t_leads)\n        row[\"pathological_q_leads\"] = \",\".join(c.pathological_q_leads)\n        row[\"qs_leads\"] = \",\".join(c.qs_leads)\n        row[\"fragmented_qrs_leads\"] = \",\".join(c.fragmented_qrs_leads)\n        # Nombre de dérivations atteintes par chaque anomalie, aVR exclue\n        # (une onde T négative, une onde Q ou un QRS crocheté y sont\n        # habituels). Les listes T et Q excluent déjà aVR ; le QRS\n        # fragmenté non, d'où le filtre explicite.\n        for name, leads in ((\"t_inversion\", c.t_inversion_leads),\n                            (\"giant_negative_t\", c.giant_negative_t_leads),\n                            (\"pathological_q\", c.pathological_q_leads),\n                            (\"fragmented_qrs\", c.fragmented_qrs_leads)):\n            row[f\"n_{name}_leads\"] = sum(1 for ld in leads if ld != \"aVR\")\n        row[\"poor_r_wave_progression\"] = c.poor_r_wave_progression\n        for lead, m in c.per_lead.items():\n            row[f\"R_{lead}_mV\"] = round(m.r_amplitude_mv, 4)\n            row[f\"S_{lead}_mV\"] = round(m.s_amplitude_mv, 4)\n            row[f\"Q_{lead}_mV\"] = round(m.q_amplitude_mv, 4)\n            row[f\"T_{lead}_mV\"] = round(m.t_amplitude_mv, 4)\n\n    if res.repolarization is not None:\n        r = res.repolarization\n        row[\"qt_dispersion_ms\"] = r.qt_dispersion_ms\n        row[\"qt_excluded_leads\"] = \",\".join(r.qt_excluded_leads)\n        row[\"qt_reference_source\"] = r.qt_reference_source\n        row[\"tpeak_tend_dispersion_ms\"] = r.tpeak_tend_dispersion_ms\n        row[\"tpeak_tend_v2_ms\"] = r.tpeak_tend_v2_ms\n        row[\"tpeak_tend_v2_bazett\"] = r.tpeak_tend_v2_bazett\n        row[\"delineation_method\"] = r.delineation_method_summary\n        for lead, qt in r.qt_ms_by_lead.items():\n            row[f\"QT_{lead}_ms\"] = round(qt, 1)\n        for lead, tpte in r.tpeak_tend_ms_by_lead.items():\n            row[f\"TpTe_{lead}_ms\"] = round(tpte, 1)\n\n    if res.p_wave is not None:\n        p = res.p_wave\n        row[\"ptfv1_mm_ms\"] = p.ptfv1_mm_ms\n        row[\"ptfv1_positive\"] = p.ptfv1_positive\n        row[\"pr_excluded_leads\"] = \",\".join(p.pr_excluded_leads)\n        row[\"pr_method\"] = p.pr_method\n        row[\"qt_ms_median_leads\"] = (round(res.repolarization.qt_ms_median_leads, 1)\n                                     if res.repolarization and res.repolarization.qt_ms_median_leads else None)\n        row[\"qt_method\"] = res.repolarization.qt_method if res.repolarization else None\n        row[\"pr_lead\"] = p.pr_lead\n        row[\"pr_ms_median_leads\"] = round(p.pr_ms_median, 1) if p.pr_ms_median else None\n        row[\"pr_reliability\"] = p.pr_reliability\n        row[\"pr_n_concordant_leads\"] = p.pr_n_concordant\n        row[\"pr_n_delineated_leads\"] = p.pr_n_delineated\n        row[\"pr_spread_iqr_ms\"] = round(p.pr_spread_ms, 1) if p.pr_spread_ms is not None else None\n        for lead, pr in p.pr_ms_by_lead.items():\n            row[f\"PR_{lead}_ms\"] = round(pr, 1)\n\n    if res.romhilt_estes is not None:\n        re_ = res.romhilt_estes\n        row[\"romhilt_estes_total_points\"] = re_.total_points\n        row[\"romhilt_estes_category\"] = re_.category\n        row[\"romhilt_estes_strain_approximated\"] = re_.strain_approximated\n\n    if res.vcg is not None:\n        v = res.vcg\n        row[\"spatial_qrst_angle_deg\"] = v.spatial_qrst_angle_deg\n        row[\"qrs_azimuth_deg\"] = v.qrs_azimuth_deg\n        row[\"qrs_elevation_deg\"] = v.qrs_elevation_deg\n        row[\"qrs_loop_area_xy_mV2\"] = v.qrs_loop_area_xy_mv2\n        row[\"qrs_loop_area_xz_mV2\"] = v.qrs_loop_area_xz_mv2\n        row[\"qrs_loop_area_yz_mV2\"] = v.qrs_loop_area_yz_mv2\n        row[\"t_loop_area_xy_mV2\"] = v.t_loop_area_xy_mv2\n        row[\"t_loop_area_xz_mV2\"] = v.t_loop_area_xz_mv2\n        row[\"t_loop_area_yz_mV2\"] = v.t_loop_area_yz_mv2\n        row[\"qrs_peak_magnitude_mV\"] = v.qrs_peak_magnitude_mv\n        row[\"qrs_t_amplitude_ratio\"] = v.qrs_t_amplitude_ratio\n        row[\"tcrt\"] = v.tcrt\n        row[\"tcrt_n_qrs_samples\"] = v.tcrt_n_qrs_samples\n        row[\"t_window_source\"] = v.t_window_source\n        row[\"svg_magnitude_mV_s\"] = v.svg_magnitude_mv_s\n        row[\"svg_azimuth_deg\"] = v.svg_azimuth_deg\n        row[\"svg_elevation_deg\"] = v.svg_elevation_deg\n        # --- Variantes \"aire\"/\"pic\" étendues (BRAVEHEART), cf. vcg.py\n        row[\"qrst_angle_area_deg\"] = v.qrst_angle_area_deg\n        row[\"qrst_angle_peak_frontal_deg\"] = v.qrst_angle_peak_frontal_deg\n        row[\"qrst_angle_area_frontal_deg\"] = v.qrst_angle_area_frontal_deg\n        row[\"qrst_distance_peak_mV\"] = v.qrst_distance_peak_mv\n        row[\"qrst_distance_area_mV\"] = v.qrst_distance_area_mv\n        row[\"svg_peak_magnitude_mV\"] = v.svg_peak_magnitude_mv\n        row[\"svg_svg_angle_deg\"] = v.svg_svg_angle_deg\n        row[\"sai_qrst_mV_s\"] = v.sai_qrst_mv_s\n        row[\"sai_vm_mV_s\"] = v.sai_vm_mv_s\n        row[\"speed_qrst_max_mV_s\"] = v.speed_qrst_max_mv_s\n        row[\"sti_qrst_mV\"] = v.sti_qrst_mv\n\n    if res.loop_morphology is not None:\n        lmr = res.loop_morphology\n        row[\"qrs_loop_roundness\"] = lmr.qrs.roundness\n        row[\"qrs_loop_planarity_residual_mV2\"] = lmr.qrs.planarity_residual_mv2\n        row[\"qrs_loop_rotation_direction\"] = lmr.qrs.rotation_direction\n        row[\"t_loop_roundness\"] = lmr.t.roundness\n        row[\"t_loop_planarity_residual_mV2\"] = lmr.t.planarity_residual_mv2\n        row[\"t_loop_rotation_direction\"] = lmr.t.rotation_direction\n        row[\"qrst_dihedral_angle_deg\"] = lmr.dihedral_angle_deg\n\n    if res.t_wave_complexity is not None:\n        twc_ = res.t_wave_complexity\n        row[\"tmd_deg\"] = twc_.tmd_deg\n        row[\"twr_abs_mV2\"] = twc_.twr_abs_mv2\n        row[\"twr_rel_pct\"] = twc_.twr_rel_pct\n\n    row[\"warnings\"] = \" | \".join(res.warnings)\n    return row\n\n\ndef row_from_result(res: PatientECGResult, include_identity: bool = True) -> dict:\n    \"\"\"API publique : construit la ligne tabulaire pour un résultat déjà\n    calculé (utile pour l'appli interactive, qui a déjà les résultats en\n    mémoire et ne veut pas les recalculer).\"\"\"\n    return _row_from_result(res, include_identity)\n\n\ndef process_folder(folder: str, pattern: str = \"*.pdf\",\n                   include_identity: bool = True) -> pd.DataFrame:\n    paths = sorted(glob.glob(os.path.join(folder, pattern)))\n    return process_files(paths, include_identity)\n\n\ndef process_files(paths: list[str], include_identity: bool = True) -> pd.DataFrame:\n    rows = []\n    for p in paths:\n        res = process_pdf(p)\n        rows.append(_row_from_result(res, include_identity))\n    return pd.DataFrame(rows)\n\n\n# ---------------------------------------------------------------------------\n# Séparation de l'export : variables originales / variables déjà fournies par\n# BRAVEHEART (à garder seulement pour comparaison). Correspondance établie à\n# partir du code de BRAVEHEART v1.8.2 (voir COMPARAISON_BRAVEHEART.md et la\n# colonne « Dans BRAVEHEART ? » du glossaire). Les colonnes qui n'ont qu'un\n# équivalent partiel (axes P/T, aires de boucle par plan, sens de rotation)\n# restent du côté « originales ».\n# ---------------------------------------------------------------------------\n\n#: Colonnes d'identification répétées dans chaque feuille pour pouvoir\n#: rapprocher les lignes.\nID_COLUMNS: tuple[str, ...] = (\"source_file\",) + IDENTITY_COLUMNS + (\"status\", \"error_message\")\n\n_LEADS = (\"I\", \"II\", \"III\", \"aVR\", \"aVL\", \"aVF\", \"V1\", \"V2\", \"V3\", \"V4\", \"V5\", \"V6\")\n_BH_LEAD = {\"I\": \"L1\", \"II\": \"L2\", \"III\": \"L3\", \"aVR\": \"avR\", \"aVL\": \"avL\", \"aVF\": \"avF\"}\n\n#: colonne ecg_vcg_hcm -> colonne(s) équivalente(s) dans l'export BRAVEHEART\nBRAVEHEART_EQUIVALENTS: dict[str, str] = {\n    \"qrs_duration_ms_measured\": \"qrs_int\",\n    \"qt_ms_measured\": \"qt_int\",\n    \"sokolow_lyon_mv\": \"sokolow_lvh_mv\",\n    \"cornell_voltage_mv\": \"cornell_lvh_mv\",\n    \"spatial_qrst_angle_deg\": \"qrst_angle_peak\",\n    \"qrst_angle_area_deg\": \"qrst_angle_area\",\n    \"qrst_angle_peak_frontal_deg\": \"qrst_angle_peak_frontal\",\n    \"qrst_angle_area_frontal_deg\": \"qrst_angle_area_frontal\",\n    \"qrs_azimuth_deg\": \"q_peak_az (autre convention d'angle)\",\n    \"qrs_elevation_deg\": \"q_peak_el\",\n    \"qrs_peak_magnitude_mV\": \"q_peak_mag\",\n    \"qrst_distance_peak_mV\": \"qrst_distance_peak\",\n    \"qrst_distance_area_mV\": \"qrst_distance_area\",\n    \"svg_magnitude_mV_s\": \"svg_area_mag (en mV·ms)\",\n    \"svg_azimuth_deg\": \"direction de svg_x, svg_y, svg_z\",\n    \"svg_elevation_deg\": \"direction de svg_x, svg_y, svg_z\",\n    \"svg_peak_magnitude_mV\": \"svg_peak_mag\",\n    \"svg_svg_angle_deg\": \"svg_svg_angle\",\n    \"tcrt\": \"TCRT\",\n    \"sai_qrst_mV_s\": \"sai_qrst (en mV·ms)\",\n    \"sai_vm_mV_s\": \"sai_vm (en mV·ms)\",\n    \"speed_qrst_max_mV_s\": \"speed_max\",\n    \"sti_qrst_mV\": \"sti_qrst\",\n    \"qrs_loop_roundness\": \"qrsloop_roundness\",\n    \"t_loop_roundness\": \"tloop_roundness\",\n    \"qrs_loop_planarity_residual_mV2\": \"qrsloop_residual\",\n    \"t_loop_planarity_residual_mV2\": \"tloop_residual\",\n    \"qrst_dihedral_angle_deg\": \"qrst_dihedral_ang\",\n    \"tmd_deg\": \"TMD\",\n    \"twr_abs_mV2\": \"TWR_abs\",\n    \"twr_rel_pct\": \"TWR_rel (fraction, pas %)\",\n}\nfor _ld in _LEADS:\n    _bh = _BH_LEAD.get(_ld, _ld)\n    BRAVEHEART_EQUIVALENTS[\"R_%s_mV\" % _ld] = \"%s_r_wave\" % _bh\n    BRAVEHEART_EQUIVALENTS[\"S_%s_mV\" % _ld] = \"%s_s_wave\" % _bh\n    BRAVEHEART_EQUIVALENTS[\"T_%s_mV\" % _ld] = \"%s_t_max\" % _bh\n\nSHEET_ORIGINAL = \"Originales\"\nSHEET_BRAVEHEART = \"Déjà dans BRAVEHEART\"\nSHEET_MAPPING = \"Correspondance BRAVEHEART\"\n\n\ndef split_columns(df: pd.DataFrame) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"Sépare le tableau en (variables originales, variables déjà fournies\n    par BRAVEHEART). Les colonnes d'identification sont dans les deux.\"\"\"\n    ids = [c for c in ID_COLUMNS if c in df.columns]\n    bh = [c for c in df.columns if c in BRAVEHEART_EQUIVALENTS]\n    orig = [c for c in df.columns if c not in BRAVEHEART_EQUIVALENTS and c not in ids]\n    return df[ids + orig], df[ids + bh]\n\n\ndef mapping_table(df: pd.DataFrame) -> pd.DataFrame:\n    return pd.DataFrame(\n        [{\"colonne ecg_vcg_hcm\": c, \"équivalent BRAVEHEART\": BRAVEHEART_EQUIVALENTS[c]}\n         for c in df.columns if c in BRAVEHEART_EQUIVALENTS]\n    )\n\n\nSHEET_SUMMARY = \"Résumé\"\nSHEET_PER_LEAD = \"Par dérivation\"\nSHEET_WARNINGS = \"Avertissements\"\n\n\ndef per_lead_table(results: list[PatientECGResult], include_identity: bool = True) -> pd.DataFrame:\n    \"\"\"Une ligne par examen et par dérivation : amplitudes, onde Q, QS, QRS\n    fragmenté, ST, T, QT et Tpeak-Tend (les tableaux « Mesures par\n    dérivation » et « Repolarisation avancée » de l'appli, pour tout le lot).\"\"\"\n    rows = []\n    for res in results:\n        if res.status != \"ok\" or res.conventional is None:\n            continue\n        ids = {\"source_file\": res.source_file}\n        if include_identity:\n            ids.update({k: (res.identity or {}).get(k) for k in IDENTITY_COLUMNS})\n        repol = res.repolarization\n        for lead, m in res.conventional.per_lead.items():\n            rows.append({\n                **ids, \"derivation\": lead,\n                \"R_mV\": m.r_amplitude_mv, \"S_mV\": m.s_amplitude_mv,\n                \"Q_mV\": m.q_amplitude_mv, \"Q_duree_ms\": m.q_duration_ms,\n                \"T_mV\": m.t_amplitude_mv, \"ST_J60_mV\": m.st_level_j60_mv,\n                \"complexe_QS\": m.qs_complex, \"onde_Q_pathologique\": m.pathological_q,\n                \"QRS_fragmente\": m.fragmented,\n                \"onde_T_geante\": m.t_amplitude_mv <= -1.0,\n                \"QT_ms\": repol.qt_ms_by_lead.get(lead) if repol else None,\n                \"Tpeak_Tend_ms\": repol.tpeak_tend_ms_by_lead.get(lead) if repol else None,\n            })\n    return pd.DataFrame(rows)\n\n\ndef warnings_table(results: list[PatientECGResult]) -> pd.DataFrame:\n    return pd.DataFrame([{\"source_file\": r.source_file, \"avertissement\": w}\n                         for r in results for w in r.warnings])\n\n\ndef to_excel_bytes(df: pd.DataFrame, summary: pd.DataFrame | None = None,\n                   results: list[PatientECGR
